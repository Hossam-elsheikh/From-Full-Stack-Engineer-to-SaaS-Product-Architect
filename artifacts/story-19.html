/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);

.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);

.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;

  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}

<script>
const D={"ch": "19", "book": "Chapter 19 · Choosing the Appropriate Architecture Style", "pages": "pp. 359–370", "title": "It Depends, With a Method", "gist": "The chapter that refuses to answer the question — and then gives you the seven things to know first, the three decisions to make in order, and two worked designs that show what the answer looks like.", "read": "4 min · 35 sec to re-scan", "acc": {"l": "#806418", "d": "#D6BC5F"}, "minute": ["Architecture fashion shifts for reasons: **observations from past pain**, ecosystem change, new capabilities, acceleration, domain change, technology change, and external factors like licence cost.", "Seven things to know before choosing: the **domain**, the **architecture characteristics**, the **data architecture**, **cloud deployment**, **organisational factors**, **process/teams/operations**, and **domain-architecture isomorphism**.", "The star charts throughout Part II rate **characteristics, not domains** — because almost any generic style can implement almost any domain, and the real difference is how well each supports which characteristics.", "Three decisions, in order: **monolith or distributed** → **where does data live** → **synchronous or asynchronous**.", "**Default to synchronous; go asynchronous only when necessary.** It presents fewer design, implementation and debugging challenges."], "sections": [{"t": "What you need to know first", "art": "criteria", "wide": true, "alt": "Seven decision criteria for choosing an architecture style", "cap": "Not a checklist to complete — a set of gaps to close before the decision is meaningful.", "items": ["**The domain** — not as a subject-matter expert, but well enough to see what affects operational characteristics. Business analysts fill the gaps.", "**Architecture characteristics** — the actual differentiator between styles, which is why every scorecard in Part II is about characteristics rather than domains.", "**Data architecture** — a specialisation in its own right, and it matters most when the new system must live alongside an older data design.", "**Cloud deployment** — how much data will be stored, and how much has to move (which costs real money). The cloud is also the clearest example of a sophisticated capability becoming a commodity: elasticity used to take esoteric skills and is now a configuration parameter.", "**Organisational factors** — a vendor's price can veto the right design. Planned mergers push you toward open solutions and integration architectures.", "**Process, teams, operations** — if the organisation lacks maturity in Agile engineering practices, styles that depend on them (microservices) will be painful."]}, {"t": "Isomorphism: does the shape fit the problem?", "art": "isomorphism", "wide": true, "alt": "Layered against modular monolith shapes, and monolithic against distributed shapes", "cap": "Figs. 19-1 and 19-2 · *isos* equal, *morph* shape — a map that preserves relations among elements.", "p": "Some domains match a topology directly. **Microkernel** suits anything needing customisation, because customisations become plug-ins. **Space-based** suits genome analysis, which is a large number of discrete operations. And some domains fit a style badly on purpose: a multipage insurance form where each page depends on the previous one is a **highly semantically coupled problem**, and modelling it in a highly decoupled architecture fights the domain. Service-based — an intentionally coupled architecture — suits it better."}, {"k": "decision", "t": "Three questions, in this order", "art": "three-questions", "wide": true, "alt": "Three sequential questions: monolith or distributed, where data lives, synchronous or asynchronous", "sit": "You have done the characteristics analysis and the component design. Now the style has to be chosen — and these three questions, taken in order, do most of the choosing.", "opts": [["Monolith or distributed?", "One set of characteristics suffices → monolithic. Different parts need different sets → distributed. **The architecture quantum from Chapter 7 is the tool** for making this call."], ["Where does data live?", "In a monolith, usually one relational database. In a distributed architecture you must decide which services persist what — and that means thinking about how data flows through the workflows, not just where it sits."], ["Synchronous or asynchronous?", "Synchronous is more convenient and trades away scalability and reliability. Asynchronous buys performance and scale and hands you data synchronisation, deadlocks, race conditions and debugging."]], "verdict": "**Default to synchronous, and use asynchronous when necessary.** And note what the output of this process actually is: not just a topology, but the topology *plus* the **ADRs** covering the decisions that took the most effort, *plus* the **fitness functions** protecting the principles and operational characteristics you have just committed to."}, {"t": "Two worked answers", "art": "ggg-quanta", "wide": true, "alt": "The Going, Going, Gone microservices design resolved into five quantum boundaries", "cap": "Fig. 19-6 · GGG resolves to five quanta: Payment, Auctioneer, Bidder, Bidder Streams, Bid Tracker.", "items": ["**Silicon Sandwiches — modular monolith.** One relational database, one web UI designed carefully for mobile, each domain as a component. The style doesn't handle customisation, so that becomes domain design: an **Override endpoint** every domain component references — and a fitness function to check that they do.", "**Silicon Sandwiches — microkernel.** Domains and a database in the core; common customisations in one plug-in set, local ones each with their own data. It also uses **Backends for Frontends**: the API layer becomes a thin microkernel adapter, and each BFF (iOS, Android, web) reshapes generic backend output — format, pagination, latency — for its device.", "**GGG — microservices.** Both event-driven and microservices matched the characteristics; microservices won because it **supports variation in operational characteristics between services**, where pure EDA separates pieces by communication style rather than by characteristics.", "The asynchronous choices in GGG exist for a specific reason: Payment processes one payment every 500 ms. If many auctions end at once, synchronous calls become timeouts. **Message queues add reliability to a critical but fragile part of the architecture.**"], "p": "In both cases the separation of tables in the monolith designs is deliberate: partitioning the database along the same lines as the domain components is what makes a later migration to a distributed architecture possible rather than theoretical."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 19: Choosing the Appropriate Architecture Style, pp. 359–370.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"criteria": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"30\" width=\"196\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"212\" y=\"30\" width=\"196\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"418\" y=\"30\" width=\"196\" height=\"52\"/>\n    <rect x=\"6\" y=\"94\" width=\"196\" height=\"52\"/><rect x=\"212\" y=\"94\" width=\"196\" height=\"52\"/>\n    <rect x=\"418\" y=\"94\" width=\"196\" height=\"52\"/>\n    <rect x=\"110\" y=\"158\" width=\"400\" height=\"46\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"6\" y=\"20\" text-anchor=\"start\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">KNOW ALL SEVEN BEFORE YOU CHOOSE A STYLE</text>\n    <g font-size=\"9.4\" fill=\"var(--ink)\">\n      <text x=\"104\" y=\"50\" fill=\"var(--acc)\">the domain</text>\n      <text x=\"310\" y=\"50\" fill=\"var(--acc)\">architecture characteristics</text>\n      <text x=\"516\" y=\"50\">data architecture</text>\n      <text x=\"104\" y=\"114\">cloud deployment</text>\n      <text x=\"310\" y=\"114\">organisational factors</text>\n      <text x=\"516\" y=\"114\">process, teams, operations</text>\n      <text x=\"310\" y=\"178\" fill=\"var(--acc)\">domain / architecture isomorphism</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"104\" y=\"68\">not expert — but the parts that</text>\n      <text x=\"310\" y=\"68\">the real difference between styles</text>\n      <text x=\"516\" y=\"68\">especially if an older one already exists</text>\n      <text x=\"104\" y=\"132\">on-prem and cloud are different trade-offs</text>\n      <text x=\"310\" y=\"132\">a vendor's price can veto the right design</text>\n      <text x=\"516\" y=\"132\">no Agile maturity, no microservices</text>\n      <text x=\"310\" y=\"194\">does the shape of the style match the shape of the problem?</text>\n    </g>\n  </g>\n</svg>", "isomorphism": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"20\" y=\"36\" width=\"120\" height=\"14\"/><rect x=\"20\" y=\"56\" width=\"120\" height=\"14\"/>\n    <rect x=\"20\" y=\"76\" width=\"120\" height=\"14\"/><rect x=\"20\" y=\"96\" width=\"120\" height=\"14\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\">\n      <rect x=\"182\" y=\"36\" width=\"26\" height=\"74\"/><rect x=\"214\" y=\"36\" width=\"26\" height=\"74\"/>\n      <rect x=\"246\" y=\"36\" width=\"26\" height=\"74\"/><rect x=\"278\" y=\"36\" width=\"26\" height=\"74\"/>\n    </g>\n    <rect x=\"356\" y=\"36\" width=\"106\" height=\"74\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\">\n      <rect x=\"498\" y=\"36\" width=\"46\" height=\"30\"/><rect x=\"556\" y=\"36\" width=\"46\" height=\"30\"/>\n      <rect x=\"498\" y=\"80\" width=\"46\" height=\"30\"/><rect x=\"556\" y=\"80\" width=\"46\" height=\"30\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.2\">\n    <text x=\"80\" y=\"26\" fill=\"var(--ink)\">LAYERED</text>\n    <text x=\"243\" y=\"26\" fill=\"var(--acc)\">MODULAR MONOLITH</text>\n    <text x=\"409\" y=\"26\" fill=\"var(--ink)\">MONOLITHIC</text>\n    <text x=\"550\" y=\"26\" fill=\"var(--acc)\">DISTRIBUTED</text>\n    <text x=\"80\" y=\"128\" font-size=\"7.8\" fill=\"var(--ink2)\">separated by layer</text>\n    <text x=\"243\" y=\"128\" font-size=\"7.8\" fill=\"var(--ink2)\">separated by domain</text>\n    <text x=\"409\" y=\"128\" font-size=\"7.8\" fill=\"var(--ink2)\">one deployment</text>\n    <text x=\"550\" y=\"128\" font-size=\"7.8\" fill=\"var(--ink2)\">many</text>\n    <text x=\"310\" y=\"164\" font-size=\"9\" fill=\"var(--ink)\">Isomorphism: the generic shape of an architecture — how its components depend on each other.</text>\n    <text x=\"310\" y=\"184\" font-size=\"8.6\" fill=\"var(--acc)\">Microkernel fits customisation. Space-based fits genome analysis — lots of discrete operations.</text>\n    <text x=\"310\" y=\"204\" font-size=\"8.6\" fill=\"var(--ink2)\">A multipage insurance form where every page depends on the last is a *highly coupled problem*.</text>\n    <text x=\"310\" y=\"218\" font-size=\"8.6\" fill=\"var(--ink2)\">Modelling it in microservices fights the domain. Service-based suits it better.</text>\n  </g>\n</svg>", "three-questions": "<svg viewBox=\"0 0 620 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"46\" width=\"170\" height=\"54\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"226\" y=\"46\" width=\"170\" height=\"54\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"438\" y=\"46\" width=\"170\" height=\"54\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.3\">\n      <path d=\"M184 73 H226 M396 73 H438\"/>\n      <path d=\"M218 69 l8 4 l-8 4 M430 69 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <g font-size=\"9.4\" fill=\"var(--acc)\">\n      <text x=\"99\" y=\"70\">monolith or distributed?</text>\n      <text x=\"311\" y=\"70\">where does data live?</text>\n      <text x=\"523\" y=\"70\">sync or async?</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"99\" y=\"86\">one set of characteristics,</text><text x=\"99\" y=\"96\">or several?</text>\n      <text x=\"311\" y=\"86\">which services persist —</text><text x=\"311\" y=\"96\">and how does data flow?</text>\n      <text x=\"523\" y=\"86\">convenience against</text><text x=\"523\" y=\"96\">scale and reliability</text>\n    </g>\n    <text x=\"310\" y=\"140\" font-size=\"9.4\" fill=\"var(--ink)\">Default to synchronous. Go asynchronous only when you must.</text>\n    <text x=\"310\" y=\"164\" font-size=\"8.6\" fill=\"var(--ink2)\">The output is not just a topology: it is the topology, the ADRs for the decisions that took the most work,</text>\n    <text x=\"310\" y=\"178\" font-size=\"8.6\" fill=\"var(--ink2)\">and the fitness functions that protect the principles you just committed to.</text>\n  </g>\n</svg>", "ggg-quanta": "<svg viewBox=\"0 0 620 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\" stroke-dasharray=\"6 4\">\n      <rect x=\"8\" y=\"30\" width=\"120\" height=\"80\" fill=\"var(--accBg)\"/>\n      <rect x=\"146\" y=\"30\" width=\"150\" height=\"80\" fill=\"var(--accBg)\"/>\n      <rect x=\"314\" y=\"30\" width=\"126\" height=\"80\" fill=\"var(--accBg)\"/>\n      <rect x=\"8\" y=\"130\" width=\"266\" height=\"72\" fill=\"var(--accBg)\"/>\n      <rect x=\"292\" y=\"130\" width=\"148\" height=\"72\" fill=\"var(--accBg)\"/>\n      <rect x=\"458\" y=\"30\" width=\"150\" height=\"172\" fill=\"var(--accBg)\"/>\n    </g>\n    <g stroke-width=\"1.3\">\n      <rect x=\"22\" y=\"50\" width=\"92\" height=\"26\"/>\n      <rect x=\"160\" y=\"50\" width=\"56\" height=\"26\"/><rect x=\"226\" y=\"50\" width=\"56\" height=\"26\"/>\n      <rect x=\"328\" y=\"50\" width=\"98\" height=\"26\"/>\n      <rect x=\"22\" y=\"150\" width=\"110\" height=\"26\"/><rect x=\"148\" y=\"150\" width=\"112\" height=\"26\"/>\n      <rect x=\"306\" y=\"150\" width=\"120\" height=\"26\"/>\n      <rect x=\"474\" y=\"50\" width=\"118\" height=\"26\"/><rect x=\"474\" y=\"100\" width=\"118\" height=\"26\"/>\n      <rect x=\"474\" y=\"150\" width=\"118\" height=\"26\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"7.4\">\n    <text x=\"8\" y=\"20\" text-anchor=\"start\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">GOING, GOING, GONE — FIVE QUANTA</text>\n    <text x=\"68\" y=\"67\" fill=\"var(--ink2)\">Bid Capture</text>\n    <text x=\"188\" y=\"67\" fill=\"var(--ink2)\">Video Capture</text><text x=\"254\" y=\"67\" fill=\"var(--ink2)\">Video Stream</text>\n    <text x=\"377\" y=\"67\" fill=\"var(--ink2)\">Auctioneer Capture</text>\n    <text x=\"77\" y=\"167\" fill=\"var(--ink2)\">Bid Tracker</text><text x=\"204\" y=\"167\" fill=\"var(--ink2)\">Bid Streamer</text>\n    <text x=\"366\" y=\"167\" fill=\"var(--ink2)\">Auction Session</text>\n    <text x=\"533\" y=\"67\" fill=\"var(--ink2)\">Payment</text>\n    <text x=\"533\" y=\"117\" fill=\"var(--ink2)\">— one every 500 ms</text>\n    <text x=\"533\" y=\"167\" fill=\"var(--ink2)\">third party</text>\n    <text x=\"310\" y=\"224\" font-size=\"8.6\" fill=\"var(--ink)\">Async between Auction Session and Payment: a thousand auctions closing at once against one payment every 500 ms.</text>\n    <text x=\"310\" y=\"236\" font-size=\"8.4\" fill=\"var(--acc)\">Not the correct design. Not the only one. The one with the least worst trade-offs.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
