/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

<script>
const D={"ch": "18", "book": "Chapter 18 · Microservices Architecture", "pages": "pp. 329–357", "title": "Duplication Over Coupling", "gist": "Domain partitioning taken to its physical limit: one bounded context per service, its own database inside it, and duplication preferred to reuse. The style that earns the most five-star ratings in the book, and charges for every one.", "read": "7 min · 50 sec to re-scan", "acc": {"l": "#2F6350", "d": "#82BFA8"}, "minute": ["Built on **bounded context**. Everything a subdomain needs lives inside the service — code, schema, database. Nothing couples across the boundary, which is why it is called a *share nothing* architecture.", "**Reuse is implemented via coupling**, so this style deliberately chooses **duplication over reuse**. A shared `Address` class is a coupling point, and it gets copied instead.", "The one thing it *does* share is operational: the **Sidecar** pattern plus a **service mesh** gives every service the same monitoring, logging and circuit breakers without domain coupling.", "**“Micro” is a label, not a description.** Too-fine services (the *Grains of Sand* antipattern) force communication back in and produce a big ball of distributed mud. Find boundaries by purpose, transactions and choreography cost.", "**Database-per-service** is not optional here — a shared database breaks the bounded context outright. And the advice on distributed transactions is blunt: **don't. Fix the granularity instead.**"], "sections": [{"t": "Topology: a service is a bounded context", "art": "ms-topology", "wide": true, "alt": "An API layer above five services, each inside a dashed bounded context with its own database", "cap": "Fig. 18-1 · each service runs in its own process, in a VM or container, with everything it needs inside.", "p": "Named unusually early — Martin Fowler and James Lewis's 2014 post defined it rather than describing something already common. It is heavily inspired by domain-driven design, and it **physically embodies** DDD's logical bounded context.", "items": ["**The API layer** (usually a gateway) sits between consumers and services and handles **routing and cross-cutting concerns only** — security, monitoring, logging, naming. Putting orchestration or business logic in it violates the philosophy: mediators belong to technically partitioned architectures, and this one is firmly domain partitioned.", "**Frontends**: the original vision put the UI inside the bounded context. Web partitioning makes that hard, so in practice you see either a **monolithic frontend** calling through the API layer, or **micro-frontends** — UI components matched one-to-one with backend services.", "**Performance is the standing cost.** Network calls dwarf method calls, and a security check at every endpoint adds more. Which puts granularity at the centre of everything."]}, {"t": "Granularity, and how to find it", "art": "choreo-orch", "wide": true, "alt": "A choreographed front-controller service beside an orchestrated mediator", "cap": "Three questions for where the boundary goes.", "items": ["**Purpose** — each service should be functionally cohesive, contributing one significant behaviour to the application. The domain is the first source of boundaries.", "**Transactions** — entities that must cooperate in a transaction suggest a boundary. Designing to *avoid* distributed transactions tends to produce better designs anyway.", "**Choreography** — a set of services with beautiful domain isolation that has to talk constantly is a candidate for being bundled back into one coarser service."], "quotes": [["The term microservice is a label, not a description.", "Martin Fowler", "It was named to contrast with the dominant style of 2007, service-oriented architecture — which could equally have been called “gigantic services”. Many developers read the prefix as a commandment."]], "p": "**Iteration is the only way to get this right.** Nobody discovers the right granularity, data dependencies and communication style on the first pass."}, {"t": "The one thing it shares: operations", "art": "sidecar-mesh", "wide": true, "alt": "Five services each with a sidecar, all wired into a service plane forming a mesh", "cap": "Figs. 18-2 to 18-4 · domain concerns duplicated, operational concerns shared deliberately.", "p": "Traditional SOA reused everything, domain and operational alike. Microservices splits them: circuit breaker, logging and monitoring live in a **sidecar** owned by a shared infrastructure team, and the sidecars wire into a **service plane** (Istio and similar) to form a **service mesh**. Upgrading the monitoring tool is then one team's change rather than forty teams' backlog items — and **service discovery** usually rides in the same place, giving elasticity somewhere consistent to live.", "items": ["**Protocol-aware heterogeneous interoperability** is the communication model. *Protocol-aware*: with no integration hub, each service must know or discover how to call the others. *Heterogeneous*: full polyglot support, since each service can be a different stack. *Interoperability*: services do call each other over the network.", "One architect took this to its logical end: **mandating that every team use a different technology stack**, so that sharing a class accidentally became impossible. The opposite of most enterprise standardisation, and the point stands — not every service needs an industrial-strength relational database."]}, {"k": "decision", "t": "Choreography, or orchestration?", "art": "choreo-orch", "wide": true, "alt": "A choreographed front-controller service beside an orchestrated mediator", "sit": "A business process spans six services. There is no global mediator in this style — so either the services call each other as needed, or you build a service whose only job is coordination.", "opts": [["Choreography — services call each other directly.", "Preserves the decoupling that the whole style exists for, and performs better: less coupling, faster communication, fewer bottlenecks. For a simple case — wish list calling demographics for a missing field — it is obviously right."], ["Orchestration — build a local mediator service.", "Coupling concentrates in one place and the other services stay simple. You have created coupling deliberately, in a spot you chose."]], "verdict": "Neither is right; watch for the failure mode. In a complex workflow, choreography quietly produces the **Front Controller pattern** — the first service called becomes a mediator *in addition to* its own domain responsibilities, and carries both complexities. **Domain workflows are often inherently coupled**; the architect's job is choosing where to represent that coupling, not pretending it isn't there."}, {"k": "decision", "t": "This transaction spans three services", "art": "saga", "alt": "A mediator coordinating four services where one fails and the successful ones must be undone", "sit": "Two services need to update together atomically. In a monolith this was one commit. Here they are separate services with separate databases.", "opts": [["Wire a distributed transaction across them.", "This violates the core decoupling principle *and* creates **Connascence of Values** across services — the worst dynamic form in the vocabulary from Chapter 3."], ["Fix the granularity: put them in one service.", "The book's actual advice, stated plainly. Needing transactions to hold your microservices together is a sign the design is **too granular**.", 1], ["Use a Saga, if the boundaries genuinely must differ.", "The legitimate exception — two services needing genuinely different architecture characteristics. A mediator calls each part, records success or failure, and on failure sends **compensating transactions** to undo the parts that succeeded, usually with requests held pending until overall success."]], "verdict": "Compensating transactions generate substantial network coordination traffic, and juggling asynchronous requests gets hard fast when new requests depend on pending transactional state. The line worth remembering: **a few transactions crossing services is sometimes necessary; if it is the dominant feature of the architecture, microservices is the wrong choice.** *Software Architecture: The Hard Parts* catalogues eight Saga patterns for the cases where you do need one."}, {"k": "decision", "t": "Two services need the same table", "art": "ms-data", "wide": true, "alt": "Sixty services on one database, database-per-service, and a wider bounded context of three services sharing one database", "sit": "You have split payment processing into credit card, gift card, PayPal and rewards points. All four write to and read the same data. Database-per-service says four databases.", "opts": [["One database for everything.", "With sixty services sharing a database, renaming a column means coordinating sixty deployments with a schema release. Worse, the bounded context has stopped existing — and databases rarely scale with the service instances around them."], ["Strict database-per-service, four databases.", "Correct by the rule and wrong for this case: they genuinely need the same data, so you have created four services that must synchronise constantly."], ["Let those services share a database, inside a wider bounded context.", "A bounded context does not have to contain exactly one service. Draw it around the payment types — or the shipping methods — and let them share. **No more than five or six**, or the change-control, scalability and fault-tolerance problems return.", 1]], "verdict": "**Database-per-service is the standard topology here and the one that preserves the bounded context**: other services request data through a contract, so they are decoupled from the internal structure, and you can swap a relational database for a document database without telling anyone. The trade-off of a wider context is exactly the one you re-accept: a schema change now coordinates several deployments."}, {"t": "Characteristics, risks, and when to reach for it", "wide": true, "alt": "Architecture characteristics ratings for microservices", "cap": "Fig. 18-16 · the most distinct quanta of any modern architecture. In many ways it is what the quantum measure was invented to describe.", "items": ["**Grains of Sand** — services made too fine because *micro* was read as a size instruction. The fix is combining them into coarser services.", "**Too much interservice communication** — usually the same root cause, and the same fix.", "**Too much data sharing** — costs exactly the change control, scalability, fault tolerance and agility that this style is chosen for.", "**Shared code.** Reuse through a common JAR or DLL spreads one bounded context across several, so a change to shared code can break services elsewhere. Versioning helps and does not remove the complication.", "**Governance**: watch static coupling (shared libraries, contracts) with a software bill of materials and dependency tooling; watch dynamic coupling by having every service log its outbound calls consistently, or by having services register their interservice calls to a configuration server like ZooKeeper, then querying it for a map of the whole ecosystem."], "p": "On **serverless**: the authors do not treat it as an architecture style but as a **deployment model of microservices** — a single-purpose, separately deployed unit that does one thing is the definition of both. Microservices deploys equally well as containers under Kubernetes. The worked example is a patient vital-signs monitor: one service per vital sign, each with its own store, sharing only *Alert Staff* and *Display Vital Signs* — and if the blood-pressure service crashes, every other vital sign keeps being watched.", "art": "_gen6"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 18: Microservices Architecture, pp. 329–357.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"ms-topology": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"222\" y=\"18\" width=\"176\" height=\"26\"/>\n    <rect x=\"120\" y=\"58\" width=\"380\" height=\"24\" stroke=\"var(--ink3)\"/>\n    <path d=\"M310 44 V58\" stroke=\"var(--ink3)\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\">\n      <rect x=\"14\" y=\"106\" width=\"108\" height=\"98\" fill=\"var(--accBg)\" stroke-dasharray=\"6 4\"/>\n      <rect x=\"140\" y=\"106\" width=\"108\" height=\"98\" fill=\"var(--accBg)\" stroke-dasharray=\"6 4\"/>\n      <rect x=\"266\" y=\"106\" width=\"108\" height=\"98\" fill=\"var(--accBg)\" stroke-dasharray=\"6 4\"/>\n      <rect x=\"392\" y=\"106\" width=\"108\" height=\"98\" fill=\"var(--accBg)\" stroke-dasharray=\"6 4\"/>\n      <rect x=\"512\" y=\"106\" width=\"96\" height=\"98\" fill=\"var(--accBg)\" stroke-dasharray=\"6 4\"/>\n    </g>\n    <g stroke=\"var(--ink)\" stroke-width=\"1.3\">\n      <rect x=\"28\" y=\"120\" width=\"80\" height=\"30\"/><rect x=\"154\" y=\"120\" width=\"80\" height=\"30\"/>\n      <rect x=\"280\" y=\"120\" width=\"80\" height=\"30\"/><rect x=\"406\" y=\"120\" width=\"80\" height=\"30\"/>\n      <rect x=\"524\" y=\"120\" width=\"72\" height=\"30\"/>\n      <ellipse cx=\"68\" cy=\"172\" rx=\"28\" ry=\"7\"/><path d=\"M40 172 v12 a28 7 0 0 0 56 0 v-12\"/>\n      <ellipse cx=\"194\" cy=\"172\" rx=\"28\" ry=\"7\"/><path d=\"M166 172 v12 a28 7 0 0 0 56 0 v-12\"/>\n      <ellipse cx=\"320\" cy=\"172\" rx=\"28\" ry=\"7\"/><path d=\"M292 172 v12 a28 7 0 0 0 56 0 v-12\"/>\n      <ellipse cx=\"446\" cy=\"172\" rx=\"28\" ry=\"7\"/><path d=\"M418 172 v12 a28 7 0 0 0 56 0 v-12\"/>\n      <ellipse cx=\"560\" cy=\"172\" rx=\"26\" ry=\"7\"/><path d=\"M534 172 v12 a26 7 0 0 0 52 0 v-12\"/>\n      <path d=\"M68 150 V165 M194 150 V165 M320 150 V165 M446 150 V165 M560 150 V165\" stroke=\"var(--ink3)\"/>\n    </g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M180 82 L68 106 M250 82 L194 106 M310 82 V106 M370 82 L446 106 M440 82 L560 106\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"310\" y=\"35\" fill=\"var(--ink2)\">user interface</text>\n    <text x=\"310\" y=\"74\" fill=\"var(--ink2)\">API layer — routing and cross-cutting concerns only</text>\n    <text x=\"68\" y=\"139\" font-size=\"7.6\" fill=\"var(--ink2)\">service</text>\n    <text x=\"310\" y=\"220\" font-size=\"8.6\" fill=\"var(--acc)\">each dashed box is a bounded context: the service, its schema, its database, everything it needs.</text>\n    <text x=\"310\" y=\"234\" font-size=\"8.4\" fill=\"var(--ink2)\">No orchestration in the API layer. Business logic belongs inside a bounded context.</text>\n  </g>\n</svg>", "choreo-orch": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"90\" width=\"80\" height=\"30\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"150\" y=\"30\" width=\"80\" height=\"26\"/><rect x=\"150\" y=\"76\" width=\"80\" height=\"26\"/>\n    <rect x=\"150\" y=\"122\" width=\"80\" height=\"26\"/><rect x=\"150\" y=\"168\" width=\"80\" height=\"26\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.1\">\n      <path d=\"M94 100 L150 43 M94 103 L150 89 M94 110 L150 135 M94 116 L150 181\"/>\n    </g>\n    <path d=\"M290 20 V216\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <rect x=\"322\" y=\"90\" width=\"76\" height=\"30\"/>\n    <rect x=\"440\" y=\"90\" width=\"90\" height=\"30\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"546\" y=\"30\" width=\"62\" height=\"26\"/><rect x=\"546\" y=\"76\" width=\"62\" height=\"26\"/>\n    <rect x=\"546\" y=\"122\" width=\"62\" height=\"26\"/><rect x=\"546\" y=\"168\" width=\"62\" height=\"26\"/>\n    <path d=\"M398 105 H440\" stroke=\"var(--ink3)\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.2\">\n      <path d=\"M530 100 L546 43 M530 103 L546 89 M530 110 L546 135 M530 116 L546 181\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"7.6\">\n    <text x=\"14\" y=\"18\" text-anchor=\"start\" font-size=\"9\" fill=\"var(--acc)\">CHOREOGRAPHY · FRONT CONTROLLER</text>\n    <text x=\"322\" y=\"18\" text-anchor=\"start\" font-size=\"9\" fill=\"var(--ink)\">ORCHESTRATION</text>\n    <text x=\"54\" y=\"109\" fill=\"var(--acc)\">first service</text>\n    <text x=\"360\" y=\"109\" fill=\"var(--ink2)\">caller</text>\n    <text x=\"485\" y=\"109\" fill=\"var(--acc)\">mediator</text>\n    <text x=\"150\" y=\"216\" font-size=\"8.4\" fill=\"var(--ink2)\">the first service quietly becomes a mediator</text>\n    <text x=\"150\" y=\"228\" font-size=\"8.4\" fill=\"var(--ink2)\">*and* keeps its domain job. complexity doubles.</text>\n    <text x=\"465\" y=\"216\" font-size=\"8.4\" fill=\"var(--acc)\">coupling concentrates in one service,</text>\n    <text x=\"465\" y=\"228\" font-size=\"8.4\" fill=\"var(--acc)\">and the others stay simple.</text>\n  </g>\n</svg>", "sidecar-mesh": "<svg viewBox=\"0 0 620 214\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <g stroke-width=\"1.4\">\n      <rect x=\"20\" y=\"40\" width=\"90\" height=\"52\"/><rect x=\"150\" y=\"40\" width=\"90\" height=\"52\"/>\n      <rect x=\"280\" y=\"40\" width=\"90\" height=\"52\"/><rect x=\"410\" y=\"40\" width=\"90\" height=\"52\"/>\n      <rect x=\"530\" y=\"40\" width=\"76\" height=\"52\"/>\n    </g>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\" fill=\"var(--accBg)\">\n      <rect x=\"20\" y=\"98\" width=\"90\" height=\"24\"/><rect x=\"150\" y=\"98\" width=\"90\" height=\"24\"/>\n      <rect x=\"280\" y=\"98\" width=\"90\" height=\"24\"/><rect x=\"410\" y=\"98\" width=\"90\" height=\"24\"/>\n      <rect x=\"530\" y=\"98\" width=\"76\" height=\"24\"/>\n    </g>\n    <rect x=\"20\" y=\"146\" width=\"586\" height=\"30\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.2\"><path d=\"M65 122 V146 M195 122 V146 M325 122 V146 M455 122 V146 M568 122 V146\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"20\" y=\"30\" text-anchor=\"start\" font-size=\"8.6\" fill=\"var(--ink3)\">DOMAIN LOGIC — duplicated rather than shared</text>\n    <g fill=\"var(--ink2)\" font-size=\"7.6\">\n      <text x=\"65\" y=\"70\">service</text><text x=\"195\" y=\"70\">service</text><text x=\"325\" y=\"70\">service</text>\n      <text x=\"455\" y=\"70\">service</text><text x=\"568\" y=\"70\">service</text>\n    </g>\n    <g fill=\"var(--acc)\" font-size=\"7.6\">\n      <text x=\"65\" y=\"114\">sidecar</text><text x=\"195\" y=\"114\">sidecar</text><text x=\"325\" y=\"114\">sidecar</text>\n      <text x=\"455\" y=\"114\">sidecar</text><text x=\"568\" y=\"114\">sidecar</text>\n    </g>\n    <text x=\"313\" y=\"165\" font-size=\"9.4\" fill=\"var(--acc)\">SERVICE PLANE — the mesh (Istio and friends)</text>\n    <text x=\"310\" y=\"196\" font-size=\"8.6\" fill=\"var(--ink)\">Operational concerns are the one thing microservices does share: circuit breakers, logging, monitoring, discovery.</text>\n    <text x=\"310\" y=\"210\" font-size=\"8.4\" fill=\"var(--ink2)\">Upgrading the monitoring tool becomes one team's change to the sidecar, not forty teams' backlog item.</text>\n  </g>\n</svg>", "saga": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"248\" y=\"24\" width=\"124\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"30\" y=\"112\" width=\"110\" height=\"32\"/><rect x=\"200\" y=\"112\" width=\"110\" height=\"32\"/>\n    <rect x=\"370\" y=\"112\" width=\"110\" height=\"32\"/><rect x=\"510\" y=\"112\" width=\"96\" height=\"32\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <path d=\"M270 58 L96 112 M290 58 L250 112 M330 58 L418 112 M352 58 L546 112\"/>\n    </g>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.8\">\n      <path d=\"M96 112 L272 62\"/><path d=\"M418 112 L346 62\"/>\n      <path d=\"M240 118 l16 16 M256 118 l-16 16\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"310\" y=\"45\" font-size=\"9.4\" fill=\"var(--acc)\">mediator</text>\n    <text x=\"85\" y=\"132\" fill=\"var(--ink2)\">ok</text>\n    <text x=\"255\" y=\"150\" fill=\"var(--acc)\">failed</text>\n    <text x=\"425\" y=\"132\" fill=\"var(--ink2)\">ok</text>\n    <text x=\"558\" y=\"132\" fill=\"var(--ink2)\">pending</text>\n    <text x=\"310\" y=\"180\" font-size=\"8.6\" fill=\"var(--ink)\">One part fails, so the mediator tells every successful part to undo — a compensating transaction.</text>\n    <text x=\"310\" y=\"196\" font-size=\"8.4\" fill=\"var(--acc)\">Requests sit in a pending state until the mediator confirms overall success.</text>\n    <text x=\"310\" y=\"210\" font-size=\"8.2\" fill=\"var(--ink2)\">Connascence of Values across services — the worst dynamic form there is. Fix the granularity instead.</text>\n  </g>\n</svg>", "ms-data": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\" stroke-linejoin=\"round\">\n    <g stroke=\"var(--ink3)\">\n      <rect x=\"14\" y=\"34\" width=\"22\" height=\"16\"/><rect x=\"42\" y=\"34\" width=\"22\" height=\"16\"/>\n      <rect x=\"70\" y=\"34\" width=\"22\" height=\"16\"/><rect x=\"98\" y=\"34\" width=\"22\" height=\"16\"/>\n      <rect x=\"126\" y=\"34\" width=\"22\" height=\"16\"/><rect x=\"154\" y=\"34\" width=\"22\" height=\"16\"/>\n      <rect x=\"14\" y=\"58\" width=\"22\" height=\"16\"/><rect x=\"42\" y=\"58\" width=\"22\" height=\"16\"/>\n      <rect x=\"70\" y=\"58\" width=\"22\" height=\"16\"/><rect x=\"98\" y=\"58\" width=\"22\" height=\"16\"/>\n      <rect x=\"126\" y=\"58\" width=\"22\" height=\"16\"/><rect x=\"154\" y=\"58\" width=\"22\" height=\"16\"/>\n    </g>\n    <ellipse cx=\"95\" cy=\"126\" rx=\"62\" ry=\"10\"/><path d=\"M33 126 v16 a62 10 0 0 0 124 0 v-16\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\".8\"><path d=\"M25 74 L70 116 M53 74 L80 116 M81 74 L92 116 M109 74 L104 116 M137 74 L118 116 M165 74 L130 116\"/></g>\n    <path d=\"M62 156 l66 30 M128 156 l-66 30\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n\n    <g stroke=\"var(--acc)\" stroke-width=\"1.6\">\n      <rect x=\"238\" y=\"34\" width=\"66\" height=\"112\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n      <rect x=\"316\" y=\"34\" width=\"66\" height=\"112\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    </g>\n    <rect x=\"250\" y=\"46\" width=\"42\" height=\"24\"/><rect x=\"328\" y=\"46\" width=\"42\" height=\"24\"/>\n    <ellipse cx=\"271\" cy=\"104\" rx=\"20\" ry=\"7\"/><path d=\"M251 104 v12 a20 7 0 0 0 40 0 v-12\"/>\n    <ellipse cx=\"349\" cy=\"104\" rx=\"20\" ry=\"7\"/><path d=\"M329 104 v12 a20 7 0 0 0 40 0 v-12\"/>\n    <path d=\"M271 70 V97 M349 70 V97\" stroke=\"var(--ink3)\"/>\n\n    <rect x=\"432\" y=\"34\" width=\"176\" height=\"112\" stroke=\"var(--acc)\" stroke-width=\"1.6\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"446\" y=\"46\" width=\"46\" height=\"24\"/><rect x=\"500\" y=\"46\" width=\"46\" height=\"24\"/><rect x=\"554\" y=\"46\" width=\"42\" height=\"24\"/>\n    <ellipse cx=\"520\" cy=\"104\" rx=\"42\" ry=\"8\"/><path d=\"M478 104 v14 a42 8 0 0 0 84 0 v-14\"/>\n    <g stroke=\"var(--ink3)\"><path d=\"M469 70 L500 96 M523 70 V96 M575 70 L542 96\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"95\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">SIXTY SERVICES, ONE DATABASE</text>\n    <text x=\"310\" y=\"24\" font-size=\"9\" fill=\"var(--acc)\">DATABASE PER SERVICE</text>\n    <text x=\"520\" y=\"24\" font-size=\"9\" fill=\"var(--acc)\">A WIDER BOUNDED CONTEXT</text>\n    <g fill=\"var(--ink2)\" font-size=\"7.8\">\n      <text x=\"95\" y=\"182\">rename a column, coordinate</text><text x=\"95\" y=\"193\">sixty deployments</text>\n      <text x=\"95\" y=\"207\">and the bounded context</text><text x=\"95\" y=\"218\">no longer exists</text>\n      <text x=\"310\" y=\"182\">the standard topology.</text><text x=\"310\" y=\"193\">change the database type</text>\n      <text x=\"310\" y=\"204\">without telling anyone.</text>\n      <text x=\"520\" y=\"182\">five or six services sharing one</text><text x=\"520\" y=\"193\">database, deliberately — the</text>\n      <text x=\"520\" y=\"204\">payment types, the shipping methods.</text>\n      <text x=\"520\" y=\"218\">past six, the problems come back.</text>\n    </g>\n  </g>\n</svg>", "_gen6": "<svg viewBox=\"0 0 620 278\" xmlns=\"http://www.w3.org/2000/svg\">\n<g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"0\" y=\"13\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">MICROSERVICES — DOMAIN PARTITIONED · MANY QUANTA</text>\n<text x=\"620\" y=\"13\" font-size=\"8.6\" text-anchor=\"end\" fill=\"var(--ink2)\">1 = weak   5 = strong</text>\n</g>\n<text x=\"178\" y=\"38\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">scalability</text>\n<rect x=\"190\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"26\" width=\"21\" height=\"13\ const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
