/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;

.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

@media(max-width:820px){.dec .in{grid-template-columns:1fr}}

.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}

.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;

.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}

<script>
const D={"ch": "25", "book": "Chapter 25 · Negotiation and Leadership Skills", "pages": "pp. 453–472", "title": "Almost Every Decision Gets Challenged", "gist": "Roughly half of being an effective architect is people skills. Three negotiations — with stakeholders, with other architects, with developers — and the language changes that decide whether anyone collaborates with you.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#8A4A32", "d": "#DB9878"}, "minute": ["**Read the buzzwords.** “I needed it yesterday” means time to market. “Lightning fast” means performance. “Zero downtime” means availability. They're not literal; they're the real concern.", "**Gather information before negotiating**, then move the conversation off jargon and onto numbers. Five nines is 5 min 35 sec a year — about a second a day.", "**Demonstration defeats discussion.** Don't argue REST versus messaging; build both in a production-like environment and show the result.", "**Give the justification before the demand.** People stop listening the moment they hear something they disagree with, so the reason has to arrive first.", "**Turn requests into favours** and use people's names. Humans dislike being told what to do and generally want to help."], "sections": [{"k": "decision", "t": "“The trading system must have five nines”", "art": "nines", "wide": true, "alt": "A table of availability percentages against downtime per year and per day, with three nines highlighted", "sit": "Parker, the SVP sponsoring the project, insists on 99.999% availability. You know that with two hours a day between global markets when no trading happens, **99.9% would meet the requirement**. Parker isn't technical, thinks they are, and does not take correction well.", "opts": [["Explain that they're wrong about five nines.", "Correct and useless. Parker doesn't respond well to correction, especially if it reads as condescending, and you have made an adversary out of the project's sponsor."], ["Validate the concern, then move from jargon to numbers.", "*“I understand availability is very important for this system.”* Then leave the nines vernacular behind: three nines is **86 seconds of unplanned downtime a day** — a number Parker can evaluate for a global trading system.", 1], ["Divide and conquer: does the *whole* system need five nines?", "Sun Tzu, applied to requirements: *if his forces are united, separate them.* Narrow it to the specific areas that genuinely need it, and both the requirement and the negotiation shrink."]], "verdict": "Hold **cost and time in reserve**. Opening with *“that's going to cost a lot”* or *“we don't have time”* starts the negotiation on the wrong foot — try every other justification first, and bring money up only once you've agreed on the substance. And note where the useful information came from: the phrase *five nines* told you the concern was availability before any requirement document did."}, {"k": "decision", "t": "Addison insists REST is always faster than messaging", "art": "four-cs", "alt": "The four Cs: communicate, collaborate, clear, concise", "sit": "You're the senior of two architects. You want asynchronous messaging between a group of services for performance and scalability. Addison strongly disagrees, citing a Google search and the output of a generative-AI prompt. This isn't your first heated debate with them.", "opts": [["Pull rank. Your opinion carries.", "It intensifies the animosity, and an unhealthy relationship between the two architects on a project lands squarely on the development team."], ["Build both in a production-like environment and show the numbers.", "**Demonstration defeats discussion.** Every environment differs, which is exactly why Googling it rarely yields the right answer — and why a measurement ends the argument without an argument.", 1]], "verdict": "When a negotiation turns personal or heated, **stop it and re-engage later**, once both parties have calmed down. Architects argue; the ones who stay calm and project leadership generally find the other person backs down. This is also why the chapter treats politics as a technical skill rather than an unfortunate distraction."}, {"k": "decision", "t": "A developer wants the framework you rejected", "art": "language", "wide": true, "alt": "Three commanding phrasings beside three collaborative rewrites", "sit": "You chose Framework X because Framework Y doesn't satisfy the system's security requirements. A developer strongly disagrees and wants Y.", "opts": [["Explain your analysis and move on.", "You may be right, and you have spent credibility rather than earned it — and the developer still doesn't believe you."], ["Tell them: show me how Y addresses the security concerns and we'll use it.", "**Either outcome is a win.** If they fail, they understand first-hand why Y is out, and because they reached it themselves, you have their buy-in automatically. If they succeed, you missed something and now you have a better solution — and they still feel part of the decision.", 1]], "verdict": "This is the same principle as the phrasing changes. *“You must go through the Business layer”* invites disagreement; *“since change control is most important to us we closed the layers, which means all database calls come from Business”* puts the justification first and turns a demand into a statement of fact — and the developer's reply changes from *“I disagree”* to *“OK, but how do I handle performance on simple queries?”* Same constraint, completely different conversation."}, {"t": "Pragmatic, yet visionary", "art": "pragmatic", "alt": "A beam balanced between pragmatic and visionary", "cap": "Both ends are failures. The balance is what earns respect from stakeholders and developers at once.", "p": "A **visionary** plans the future with imagination and wisdom, which is what keeps an architecture vital for years — and left alone, produces solutions too theoretical to implement or understand. A **pragmatist** deals with things sensibly: budget, time, the team's actual skill level, the trade-offs of each decision, the technical limits of the design.", "items": ["Faced with unexplained load spikes, the visionary answer is a data mesh — distributed domain-partitioned databases separating analytical from transactional concerns. Possible in theory. Has the company ever run one? What are its trade-offs? Would it even solve this?", "The pragmatic first move is to **find the bottleneck**. Is the database the constraint for some of the services? Could caching reduce the calls? That is not a lesser answer; it is the answer that ships.", "**Accidental complexity** is the failure mode to watch in yourself: complexity added to prove worth when something looks too simple, to stay in the loop on decisions, or for job security. *Developers are drawn to complexity like moths to a flame — frequently with the same result.*"]}, {"t": "Leading by example", "art": "language", "wide": true, "alt": "Three commanding phrasings beside three collaborative rewrites", "cap": "“No matter what the problem is, it's a people problem.” — Gerald Weinberg", "items": ["**One sentence can close a team.** A developer suggests something, the architect says *“well, that's a dumb idea”* — and now nobody in the room offers anything again.", "**“What you need to do is” → “Have you considered”.** The first is communicating without collaborating. The second returns control to the developer and starts a conversation.", "**Turn a request into a favour, and use the person's name.** *“Sridhar, I'm in a real bind and I waited too long — any way you could squeeze this in?”* works where *“I'm going to need you to…”* got a flat refusal. Learn names, learn correct pronunciation, repeat it back and ask if you got it right.", "**Facilitate collaboration between others, not just with yourself.** If you hear a team member using demanding or condescending language, take them aside and coach them on it.", "**Become the go-to person.** Step in when someone is stuck, technically or otherwise; run periodic brown-bag sessions, which double as practice at mentoring and public speaking."], "p": "On meetings: they arrive in two kinds — imposed on you, and imposed by you. For the first, **ask why you're needed**, and ask for the agenda; if the point is keeping you in the loop, that is what meeting notes are for. Ask whether you're needed for the whole thing or one agenda item. And when a developer or tech lead is invited, **consider going in their place** — it costs you time and it buys the team focus, and their respect. On conduct: a firm handshake with eye contact, two or three seconds, aware that greetings are cultural. Never hugs — in a professional setting they make people uncomfortable and can become harassment."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 25: Negotiation and Leadership Skills, pp. 453–472. The chapter recommends Tanya Reilly's The Staff Engineer's Path and Fisher, Ury & Patton's Getting to Yes.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"nines": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\">\n    <path d=\"M8 44 H612\" stroke=\"var(--rule)\"/>\n    <path d=\"M8 72 H612 M8 100 H612 M8 128 H612 M8 156 H612\" stroke=\"var(--rule2)\"/>\n    <rect x=\"8\" y=\"104\" width=\"604\" height=\"28\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <path d=\"M230 24 V180 M420 24 V180\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\">\n    <g font-size=\"8.4\" fill=\"var(--ink3)\" letter-spacing=\"1.2\">\n      <text x=\"8\" y=\"36\">AVAILABILITY</text><text x=\"240\" y=\"36\">DOWNTIME PER YEAR</text><text x=\"430\" y=\"36\">PER DAY</text>\n    </g>\n    <g fill=\"var(--ink2)\">\n      <text x=\"8\" y=\"64\">90.0%   one nine</text><text x=\"240\" y=\"64\">36 days 12 hrs</text><text x=\"430\" y=\"64\">2.4 hrs</text>\n      <text x=\"8\" y=\"92\">99.0%   two nines</text><text x=\"240\" y=\"92\">87 hrs 46 min</text><text x=\"430\" y=\"92\">14 min</text>\n      <text x=\"8\" y=\"148\">99.99%  four nines</text><text x=\"240\" y=\"148\">52 min 33 sec</text><text x=\"430\" y=\"148\">7 sec</text>\n      <text x=\"8\" y=\"176\">99.9999% six nines</text><text x=\"240\" y=\"176\">31.5 sec</text><text x=\"430\" y=\"176\">86 ms</text>\n    </g>\n    <g fill=\"var(--acc)\" font-size=\"9.4\">\n      <text x=\"8\" y=\"122\">99.9%   three nines</text><text x=\"240\" y=\"122\">8 hrs 46 min</text><text x=\"430\" y=\"122\">86 sec</text>\n    </g>\n    <text x=\"8\" y=\"200\" font-size=\"8.6\" fill=\"var(--ink)\">Five nines is 5 min 35 sec a year — about one second of unplanned downtime a day.</text>\n    <text x=\"8\" y=\"212\" font-size=\"8.6\" fill=\"var(--acc)\">Get out of the “nines” vernacular and into hours and seconds. Then the conversation has numbers in it.</text>\n  </g>\n</svg>", "four-cs": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"26\" y=\"30\" width=\"112\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"160\" y=\"30\" width=\"112\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"26\" y=\"98\" width=\"112\" height=\"52\"/><rect x=\"160\" y=\"98\" width=\"112\" height=\"52\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <g font-size=\"10.5\">\n      <text x=\"82\" y=\"54\" fill=\"var(--acc)\">COMMUNICATE</text><text x=\"216\" y=\"54\" fill=\"var(--acc)\">COLLABORATE</text>\n      <text x=\"82\" y=\"122\" fill=\"var(--ink)\">CLEAR</text><text x=\"216\" y=\"122\" fill=\"var(--ink)\">CONCISE</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"82\" y=\"70\">with everyone</text><text x=\"216\" y=\"70\">with everyone</text>\n      <text x=\"82\" y=\"138\">no ambiguity</text><text x=\"216\" y=\"138\">no padding</text>\n    </g>\n    <text x=\"150\" y=\"178\" font-size=\"9\" fill=\"var(--ink)\">Essential complexity: we have a hard problem.</text>\n    <text x=\"150\" y=\"194\" font-size=\"9\" fill=\"var(--acc)\">Accidental complexity: we have made a problem hard.</text>\n    <text x=\"150\" y=\"210\" font-size=\"8.2\" fill=\"var(--ink2)\">Complexity added to look valuable, or to stay in the loop, is how an architect loses respect.</text>\n  </g>\n</svg>", "language": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"8\" y=\"34\" width=\"272\" height=\"52\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <rect x=\"8\" y=\"100\" width=\"272\" height=\"52\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <rect x=\"8\" y=\"166\" width=\"272\" height=\"52\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <rect x=\"340\" y=\"34\" width=\"272\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"340\" y=\"100\" width=\"272\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"340\" y=\"166\" width=\"272\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.3\">\n      <path d=\"M290 60 H332 M290 126 H332 M290 192 H332\"/>\n      <path d=\"M324 56 l8 4 l-8 4 M324 122 l8 4 l-8 4 M324 188 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\">\n    <text x=\"8\" y=\"24\" font-size=\"8.4\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">SHUTS COLLABORATION DOWN</text>\n    <text x=\"340\" y=\"24\" font-size=\"8.4\" letter-spacing=\"1.4\" fill=\"var(--acc)\">OPENS IT</text>\n    <g fill=\"var(--ink2)\">\n      <text x=\"20\" y=\"56\">“You must go through</text><text x=\"20\" y=\"70\">the Business layer.”</text>\n      <text x=\"20\" y=\"122\">“What you need to do</text><text x=\"20\" y=\"136\">is use a cache.”</text>\n      <text x=\"20\" y=\"188\">“I'm going to need you to</text><text x=\"20\" y=\"202\">split the payment service.”</text>\n    </g>\n    <g fill=\"var(--acc)\">\n      <text x=\"352\" y=\"52\">“Since change control matters most,</text>\n      <text x=\"352\" y=\"64\">we closed the layers. This means all</text>\n      <text x=\"352\" y=\"76\">database calls come from Business.”</text>\n      <text x=\"352\" y=\"126\">“Have you considered a cache?</text><text x=\"352\" y=\"140\">That might fix it.”</text>\n      <text x=\"352\" y=\"186\">“Sridhar, I'm in a real bind and I waited</text>\n      <text x=\"352\" y=\"198\">too long. Any way you could squeeze</text>\n      <text x=\"352\" y=\"210\">this in? It would really help me out.”</text>\n    </g>\n  </g>\n</svg>", "pragmatic": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\">\n    <path d=\"M150 108 l-20 30 h40 z\" fill=\"var(--ink)\" stroke=\"none\"/>\n    <path d=\"M40 84 H260\" stroke=\"var(--acc)\" stroke-width=\"2.4\"/>\n    <rect x=\"18\" y=\"52\" width=\"66\" height=\"26\"/>\n    <rect x=\"216\" y=\"52\" width=\"66\" height=\"26\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.4\">\n    <text x=\"51\" y=\"69\" font-size=\"9\" fill=\"var(--ink)\">PRAGMATIC</text>\n    <text x=\"249\" y=\"69\" font-size=\"9\" fill=\"var(--ink)\">VISIONARY</text>\n    <text x=\"51\" y=\"36\" font-size=\"7.8\" fill=\"var(--ink2)\">budget · time · skills</text>\n    <text x=\"51\" y=\"26\" font-size=\"7.8\" fill=\"var(--ink2)\">trade-offs · limits</text>\n    <text x=\"249\" y=\"36\" font-size=\"7.8\" fill=\"var(--ink2)\">strategic, imaginative,</text>\n    <text x=\"249\" y=\"26\" font-size=\"7.8\" fill=\"var(--ink2)\">still valid in five years</text>\n    <text x=\"150\" y=\"164\" fill=\"var(--ink)\">Load spikes? A visionary builds a data mesh.</text>\n    <text x=\"150\" y=\"178\" fill=\"var(--acc)\">A pragmatist finds the bottleneck first — then asks if a cache would do.</text>\n    <text x=\"150\" y=\"194\" font-size=\"8\" fill=\"var(--ink2)\">Stakeholders want vision inside constraints. Developers want something they can actually build.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
