<!--@ pipes-filters -->
<svg viewBox="0 0 620 196" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
    <rect x="8" y="52" width="120" height="46" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <rect x="172" y="52" width="120" height="46"/>
    <rect x="336" y="52" width="120" height="46"/>
    <rect x="492" y="52" width="120" height="46" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <g stroke="var(--ink3)" stroke-width="1.4">
      <path d="M128 75 H172 M292 75 H336 M456 75 H492"/>
      <path d="M164 71 l8 4 l-8 4 M328 71 l8 4 l-8 4 M484 71 l8 4 l-8 4"/>
    </g>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="10">
      <text x="68" y="72" fill="var(--acc)">PRODUCER</text>
      <text x="232" y="72" fill="var(--ink)">TRANSFORMER</text>
      <text x="396" y="72" fill="var(--ink)">TESTER</text>
      <text x="552" y="72" fill="var(--acc)">CONSUMER</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="68" y="88">outbound only</text><text x="232" y="88">like map</text>
      <text x="396" y="88">like reduce</text><text x="552" y="88">termination point</text>
      <text x="68" y="118">the source: a UI,</text><text x="68" y="129">an external request</text>
      <text x="232" y="118">enhance, convert,</text><text x="232" y="129">calculate</text>
      <text x="396" y="118">test and optionally</text><text x="396" y="129">forward — or stop</text>
      <text x="552" y="118">persist, or draw it</text><text x="552" y="129">on a screen</text>
    </g>
    <text x="310" y="42" font-size="8.6" fill="var(--ink3)">pipes are one-way and point-to-point. filters are stateless and do one thing.</text>
    <text x="310" y="158" font-size="9" fill="var(--ink)">A composite task is a sequence of filters, never one clever filter.</text>
    <text x="310" y="178" font-size="8.6" fill="var(--acc)">A filter is a component — it may be several classes, and it is still one filter.</text>
  </g>
</svg>
