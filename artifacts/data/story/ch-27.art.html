    <text x="152" y="85" text-anchor="middle" fill="var(--ink2)">queue</text>
    <text x="152" y="123" text-anchor="middle" fill="var(--ink2)">queue</text>
    <text x="383" y="85" text-anchor="middle" fill="var(--ink2)">Trading</text>

    <text x="14" y="24" font-size="9" fill="var(--ink)">QUEUES — POINT TO POINT</text>

      <text x="346" y="176">+ low coupling · one message sent</text>
      <text x="346" y="190">+ add a consumer without touching anything</text>
      <text x="346" y="204">− everyone reads the same message — stamp coupling</text>
      <text x="346" y="222">− and everyone can read all of it. can't scale one consumer.</text>
    </g>
  </g>

  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8.4">
    <text x="76" y="94" fill="var(--ink)">good</text>
    <text x="76" y="106" fill="var(--ink)">abstraction</text>
    <text x="224" y="94" fill="var(--ink)">low</text>
    <text x="224" y="106" fill="var(--ink)">volatility</text>

    <text x="150" y="102" font-size="8" fill="var(--acc)">works</text>

    <text x="150" y="196" fill="var(--acc)">Frameworks and platforms sit in the overlap. Domain concepts never do —</text>

  </g>
</svg>
