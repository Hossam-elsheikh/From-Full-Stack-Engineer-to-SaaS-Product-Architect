    <text x="20" y="44" font-size="8.4" fill="var(--ink2)">edges − nodes + 2 × connected components</text>
    <text x="20" y="58" font-size="8.4" fill="var(--ink2)">no branches = 1 · one conditional = 2</text>
    <g font-size="9" text-anchor="middle">
      <text x="48" y="90" fill="var(--acc)">under 5</text>

      <text x="254" y="90" fill="var(--ink2)">800</text>

      <text x="48" y="122">what the authors</text><text x="48" y="132">actually want</text>
      <text x="104" y="122">the industry's</text><text x="104" y="132">accepted line</text>
      <text x="174" y="122">Crap4J: no amount</text><text x="174" y="132">of coverage saves it</text>
      <text x="254" y="122">one C function,</text><text x="254" y="132">4,000 lines, GOTOs</text>
    </g>

    <text x="160" y="180" font-size="8.6" text-anchor="middle" fill="var(--acc)">so ask: hard problem, bad code, or badly partitioned code?</text>

</svg>
