      <path d="M270 58 L96 112 M290 58 L250 112 M330 58 L418 112 M352 58 L546 112"/>
    </g>
    <g stroke="var(--acc)" stroke-width="1.8">
      <path d="M96 112 L272 62"/><path d="M418 112 L346 62"/>

  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8">
    <text x="310" y="45" font-size="9.4" fill="var(--acc)">mediator</text>
    <text x="85" y="132" fill="var(--ink2)">ok</text>
    <text x="255" y="150" fill="var(--acc)">failed</text>
    <text x="425" y="132" fill="var(--ink2)">ok</text>
    <text x="558" y="132" fill="var(--ink2)">pending</text>
    <text x="310" y="180" font-size="8.6" fill="var(--ink)">One part fails, so the mediator tells every successful part to undo — a compensating transaction.</text>
    <text x="310" y="196" font-size="8.4" fill="var(--acc)">Requests sit in a pending state until the mediator confirms overall success.</text>
    <text x="310" y="210" font-size="8.2" fill="var(--ink2)">Connascence of Values across services — the worst dynamic form there is. Fix the granularity instead.</text>
  </g>
</svg>
