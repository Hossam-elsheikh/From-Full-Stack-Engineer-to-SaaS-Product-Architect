<!--@ sandwiches -->
<svg viewBox="0 0 620 224" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="6" y="34" width="298" height="150"/>
    <rect x="316" y="34" width="298" height="150" fill="var(--accBg)" stroke="var(--acc)"/>
    <path d="M6 60 H304 M316 60 H614" stroke="var(--rule)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace">
    <text x="6" y="18" font-size="8.6" letter-spacing="1.6" fill="var(--ink3)">SILICON SANDWICHES — WHAT THE KATA ACTUALLY YIELDS</text>
    <text x="155" y="52" font-size="10" text-anchor="middle" fill="var(--ink)">EXPLICIT — stated in the brief</text>
    <text x="465" y="52" font-size="10" text-anchor="middle" fill="var(--acc)">IMPLICIT — you have to know</text>
    <g font-size="9.4" fill="var(--ink)">
      <text x="20" y="82">scalability</text><text x="20" y="104">performance</text><text x="20" y="126">customizability</text>
      <text x="20" y="148">internationalization</text><text x="20" y="170">feasibility (cost)</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="140" y="82">“thousands, perhaps millions”</text>
      <text x="140" y="104">nobody waits for a sandwich site</text>
      <text x="140" y="126">national and local promotions</text>
      <text x="140" y="148">“plans to expand overseas”</text>
      <text x="140" y="170">franchised, each owner pays</text>
    </g>
    <g font-size="9.4" fill="var(--acc)">
      <text x="330" y="82">elasticity</text><text x="330" y="104">availability</text><text x="330" y="126">stability</text>
      <text x="330" y="148">security</text><text x="330" y="170">usability</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="430" y="82">nobody said “mealtimes”</text>
      <text x="430" y="104">the site has to be there</text>
      <text x="430" y="126">don't drop them mid-order</text>
      <text x="430" y="148">third-party payments, hygiene</text>
      <text x="430" y="170">“hire inexpensive labour”</text>
    </g>
    <text x="310" y="204" font-size="8.6" text-anchor="middle" fill="var(--ink)">the brief said “thousands of users” — it never said the word scalability</text>
    <text x="310" y="218" font-size="8.4" text-anchor="middle" fill="var(--ink2)">decoding domain language into engineering language is most of this job</text>
  </g>
</svg>
