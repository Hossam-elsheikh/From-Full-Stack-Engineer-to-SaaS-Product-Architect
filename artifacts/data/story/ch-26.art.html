<svg viewBox="0 0 620 210" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="6" y="36" width="146" height="88"/><rect x="160" y="36" width="146" height="88"/>
    <rect x="314" y="36" width="146" height="88" fill="var(--accBg)" stroke="var(--acc)"/>

    <path d="M6 62 H152 M160 62 H306 M314 62 H460 M468 62 H614" stroke="var(--rule)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <text x="6" y="26" text-anchor="start" font-size="8.6" letter-spacing="1.4" fill="var(--ink3)">FOUR WAYS DATA CAN BE MISALIGNED WITH AN ARCHITECTURE</text>
    <g font-size="9.6" fill="var(--ink)">
      <text x="79" y="54">TOPOLOGY</text><text x="233" y="54">CHARACTERISTICS</text>
      <text x="387" y="54" fill="var(--acc)">STRUCTURE</text><text x="541" y="54" fill="var(--acc)">READ / WRITE</text>
    </g>
    <g font-size="8" fill="var(--ink2)">
      <text x="79" y="80">monolithic, domain,</text><text x="79" y="91">or per service</text>
      <text x="79" y="108">microservices needs</text><text x="79" y="119">per service. no choice.</text>
      <text x="233" y="80">databases have superpowers</text><text x="233" y="91">too — match them</text>
      <text x="233" y="108">key-value and columnar scale,</text><text x="233" y="119">like the styles that need it</text>
      <text x="387" y="80">relational data in a relational DB.</text><text x="387" y="91">key-value pairs in one: waste.</text>
      <text x="387" y="108">use polyglot databases</text><text x="387" y="119">wherever feasible</text>
      <text x="541" y="80">write-heavy → columnar</text><text x="541" y="91">read-heavy → key-value,</text>
      <text x="541" y="102">document or graph</text>
      <text x="541" y="119">both → relational, NewSQL</text>
    </g>
    <text x="310" y="158" font-size="9" fill="var(--ink)">Monolithic databases give consistency and transactions, and cost scalability and fault tolerance.</text>
    <text x="310" y="176" font-size="9" fill="var(--acc)">Distributed topologies give scalability and change control, and cost integrity, consistency and performance.</text>
    <text x="310" y="198" font-size="8.4" fill="var(--ink2)">Choose the wrong one and it cancels out the characteristics you chose the architecture for.</text>
  </g>
</svg>
