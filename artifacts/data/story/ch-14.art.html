<!--@ granularity -->
<svg viewBox="0 0 620 226" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
    <rect x="14" y="46" width="256" height="98" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>

      <rect x="32" y="102" width="104" height="24"/><rect x="150" y="102" width="104" height="24"/>
    </g>
    <rect x="350" y="46" width="118" height="34"/><rect x="486" y="46" width="118" height="34"/>
    <rect x="350" y="110" width="118" height="34"/><rect x="486" y="110" width="118" height="34"/>
    <g stroke="var(--ink3)" stroke-width="1.2"><path d="M468 63 H486 M409 80 V110 M545 80 V110"/></g>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8">
    <text x="14" y="34" text-anchor="start" font-size="9.4" fill="var(--acc)">SERVICE-BASED — ONE COARSE SERVICE</text>
    <text x="350" y="34" text-anchor="start" font-size="9.4" fill="var(--ink)">MICROSERVICES — FOUR FINE ONES</text>
    <g fill="var(--acc)">
      <text x="84" y="81">place order</text><text x="202" y="81">generate ID</text>
      <text x="84" y="117">apply payment</text><text x="202" y="117">update inventory</text>
    </g>
    <g fill="var(--ink2)">
      <text x="409" y="66">OrderPlacement</text><text x="545" y="66">Payment</text>
      <text x="409" y="130">Inventory</text><text x="545" y="130">Notification</text>
    </g>
    <text x="142" y="170" font-size="9" fill="var(--acc)">ACID — commit and roll back</text>
    <text x="142" y="186" font-size="8.2" fill="var(--ink2)">expired card? the whole order</text>
    <text x="142" y="197" font-size="8.2" fill="var(--ink2)">unwinds in one transaction</text>
    <text x="477" y="170" font-size="9" fill="var(--ink)">BASE — eventual consistency</text>
    <text x="477" y="186" font-size="8.2" fill="var(--ink2)">expired card? the order row already</text>
    <text x="477" y="197" font-size="8.2" fill="var(--ink2)">exists. now write a compensating update.</text>
    <text x="310" y="220" font-size="8.6" fill="var(--ink)">The price of ACID: change order placement and you retest and redeploy payment too.</text>
  </g>
</svg>

    <text x="336" y="24" text-anchor="start" font-size="9" fill="var(--acc)">ONE LIBRARY PER LOGICAL DOMAIN</text>

    <text x="152" y="207" font-size="8.4" fill="var(--ink2)">redeploy every service, whether it uses the table or not</text>
