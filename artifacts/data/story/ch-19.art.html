<!--@ isomorphism -->
<svg viewBox="0 0 620 226" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round">
    <rect x="20" y="36" width="120" height="14"/><rect x="20" y="56" width="120" height="14"/>
    <rect x="20" y="76" width="120" height="14"/><rect x="20" y="96" width="120" height="14"/>

      <rect x="246" y="36" width="26" height="74"/><rect x="278" y="36" width="26" height="74"/>

    <g stroke="var(--acc)" stroke-width="1.5">
      <rect x="498" y="36" width="46" height="30"/><rect x="556" y="36" width="46" height="30"/>
      <rect x="498" y="80" width="46" height="30"/><rect x="556" y="80" width="46" height="30"/>
    </g>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8.2">
    <text x="80" y="26" fill="var(--ink)">LAYERED</text>
    <text x="243" y="26" fill="var(--acc)">MODULAR MONOLITH</text>
    <text x="409" y="26" fill="var(--ink)">MONOLITHIC</text>
    <text x="550" y="26" fill="var(--acc)">DISTRIBUTED</text>
    <text x="80" y="128" font-size="7.8" fill="var(--ink2)">separated by layer</text>
    <text x="243" y="128" font-size="7.8" fill="var(--ink2)">separated by domain</text>
    <text x="409" y="128" font-size="7.8" fill="var(--ink2)">one deployment</text>
    <text x="550" y="128" font-size="7.8" fill="var(--ink2)">many</text>
    <text x="310" y="164" font-size="9" fill="var(--ink)">Isomorphism: the generic shape of an architecture — how its components depend on each other.</text>
    <text x="310" y="184" font-size="8.6" fill="var(--acc)">Microkernel fits customisation. Space-based fits genome analysis — lots of discrete operations.</text>
    <text x="310" y="204" font-size="8.6" fill="var(--ink2)">A multipage insurance form where every page depends on the last is a *highly coupled problem*.</text>
    <text x="310" y="218" font-size="8.6" fill="var(--ink2)">Modelling it in microservices fights the domain. Service-based suits it better.</text>
  </g>
</svg>

    <g stroke="var(--ink3)" stroke-width="1.3">

  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="9.4" fill="var(--acc)">
      <text x="99" y="70">monolith or distributed?</text>
      <text x="311" y="70">where does data live?</text>
      <text x="523" y="70">sync or async?</text>
    </g>
    <g font-size="8" fill="var(--ink2)">
      <text x="99" y="86">one set of characteristics,</text><text x="99" y="96">or several?</text>
      <text x="311" y="86">which services persist —</text><text x="311" y="96">and how does data flow?</text>
      <text x="523" y="86">convenience against</text><text x="523" y="96">scale and reliability</text>
    </g>
    <text x="310" y="140" font-size="9.4" fill="var(--ink)">Default to synchronous. Go asynchronous only when you must.</text>
    <text x="310" y="164" font-size="8.6" fill="var(--ink2)">The output is not just a topology: it is the topology, the ADRs for the decisions that took the most work,</text>
    <text x="310" y="178" font-size="8.6" fill="var(--ink2)">and the fitness functions that protect the principles you just committed to.</text>
  </g>
</svg>
