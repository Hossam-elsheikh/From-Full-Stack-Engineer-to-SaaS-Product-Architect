<!-- Drawings for chapter 25 · Negotiation and Leadership Skills -->

<!--@ nines -->
<svg viewBox="0 0 620 216" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.3">
    <path d="M8 44 H612" stroke="var(--rule)"/>
    <path d="M8 72 H612 M8 100 H612 M8 128 H612 M8 156 H612" stroke="var(--rule2)"/>
    <rect x="8" y="104" width="604" height="28" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.7"/>
    <path d="M230 24 V180 M420 24 V180" stroke="var(--rule)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" font-size="9">
    <g font-size="8.4" fill="var(--ink3)" letter-spacing="1.2">
      <text x="8" y="36">AVAILABILITY</text><text x="240" y="36">DOWNTIME PER YEAR</text><text x="430" y="36">PER DAY</text>
    </g>
    <g fill="var(--ink2)">
      <text x="8" y="64">90.0%   one nine</text><text x="240" y="64">36 days 12 hrs</text><text x="430" y="64">2.4 hrs</text>
      <text x="8" y="92">99.0%   two nines</text><text x="240" y="92">87 hrs 46 min</text><text x="430" y="92">14 min</text>
      <text x="8" y="148">99.99%  four nines</text><text x="240" y="148">52 min 33 sec</text><text x="430" y="148">7 sec</text>
      <text x="8" y="176">99.9999% six nines</text><text x="240" y="176">31.5 sec</text><text x="430" y="176">86 ms</text>
    </g>
    <g fill="var(--acc)" font-size="9.4">
      <text x="8" y="122">99.9%   three nines</text><text x="240" y="122">8 hrs 46 min</text><text x="430" y="122">86 sec</text>
    </g>
    <text x="8" y="200" font-size="8.6" fill="var(--ink)">Five nines is 5 min 35 sec a year — about one second of unplanned downtime a day.</text>
    <text x="8" y="212" font-size="8.6" fill="var(--acc)">Get out of the “nines” vernacular and into hours and seconds. Then the conversation has numbers in it.</text>
  </g>
</svg>

<!--@ four-cs -->
<svg viewBox="0 0 300 216" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
    <rect x="26" y="30" width="112" height="52" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <rect x="160" y="30" width="112" height="52" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <rect x="26" y="98" width="112" height="52"/><rect x="160" y="98" width="112" height="52"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="10.5">
      <text x="82" y="54" fill="var(--acc)">COMMUNICATE</text><text x="216" y="54" fill="var(--acc)">COLLABORATE</text>
      <text x="82" y="122" fill="var(--ink)">CLEAR</text><text x="216" y="122" fill="var(--ink)">CONCISE</text>
    </g>
    <g font-size="8" fill="var(--ink2)">
      <text x="82" y="70">with everyone</text><text x="216" y="70">with everyone</text>
      <text x="82" y="138">no ambiguity</text><text x="216" y="138">no padding</text>
    </g>
    <text x="150" y="178" font-size="9" fill="var(--ink)">Essential complexity: we have a hard problem.</text>
    <text x="150" y="194" font-size="9" fill="var(--acc)">Accidental complexity: we have made a problem hard.</text>
    <text x="150" y="210" font-size="8.2" fill="var(--ink2)">Complexity added to look valuable, or to stay in the loop, is how an architect loses respect.</text>
  </g>
</svg>

<!--@ pragmatic -->
<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M150 108 l-20 30 h40 z" fill="var(--ink)" stroke="none"/>
    <path d="M40 84 H260" stroke="var(--acc)" stroke-width="2.4"/>
    <rect x="18" y="52" width="66" height="26"/>
    <rect x="216" y="52" width="66" height="26"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8.4">
    <text x="51" y="69" font-size="9" fill="var(--ink)">PRAGMATIC</text>
    <text x="249" y="69" font-size="9" fill="var(--ink)">VISIONARY</text>
    <text x="51" y="36" font-size="7.8" fill="var(--ink2)">budget · time · skills</text>
    <text x="51" y="26" font-size="7.8" fill="var(--ink2)">trade-offs · limits</text>
    <text x="249" y="36" font-size="7.8" fill="var(--ink2)">strategic, imaginative,</text>
    <text x="249" y="26" font-size="7.8" fill="var(--ink2)">still valid in five years</text>
    <text x="150" y="164" fill="var(--ink)">Load spikes? A visionary builds a data mesh.</text>
    <text x="150" y="178" fill="var(--acc)">A pragmatist finds the bottleneck first — then asks if a cache would do.</text>
    <text x="150" y="194" font-size="8" fill="var(--ink2)">Stakeholders want vision inside constraints. Developers want something they can actually build.</text>
  </g>
</svg>
