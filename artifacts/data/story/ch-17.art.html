    <text x="310" y="80" font-size="8.2" fill="var(--ink2)">ExecuteTrade · PlaceOrder — no code at all, just signatures, defined by business analysts</text>
    <text x="310" y="115" font-size="10.5" fill="var(--acc)">ORCHESTRATION ENGINE / MESSAGE BUS</text>

    <text x="310" y="212" font-size="10" fill="var(--ink)">APPLICATION SERVICES · INFRASTRUCTURE SERVICES</text>
    <text x="310" y="240" font-size="8.6" fill="var(--ink)">The litmus test for a business service: can you answer yes to “are we in the business of…”?</text>
    <text x="310" y="254" font-size="8.4" fill="var(--ink2)">You are in the business of executing trades. You are not in the business of creating customers.</text>
  </g>
