<!--@ coupling-4 -->
<svg viewBox="0 0 620 214" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="6" y="34" width="146" height="120"/><rect x="160" y="34" width="146" height="120"/>
    <rect x="314" y="34" width="146" height="120" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="468" y="34" width="146" height="120" fill="var(--accBg)" stroke="var(--acc)"/>
    <path d="M6 62 H152 M160 62 H306 M314 62 H460 M468 62 H614" stroke="var(--rule)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <text x="6" y="18" font-size="8.6" letter-spacing="1.6" text-anchor="start" fill="var(--ink3)">TWO THINGS ARE COUPLED IF CHANGING ONE MIGHT BREAK THE OTHER</text>
    <g font-size="10" fill="var(--ink)">
      <text x="79" y="54">SEMANTIC</text><text x="233" y="54">IMPLEMENTATION</text>
      <text x="387" y="54" fill="var(--acc)">STATIC</text><text x="541" y="54" fill="var(--acc)">DYNAMIC</text>
    </g>
    <g font-size="8.6" fill="var(--ink2)">
      <text x="79" y="82">the problem's own</text><text x="79" y="94">coupling — carts,</text><text x="79" y="106">orders, inventory</text>
      <text x="79" y="128">no pattern saves</text><text x="79" y="140">you from a change</text><text x="79" y="152">to the domain</text>
      <text x="233" y="82">how you chose to</text><text x="233" y="94">build it — one DB</text><text x="233" y="106">or many, mono or not</text>
      <text x="233" y="128">barely touches the</text><text x="233" y="140">semantics, decides</text><text x="233" y="152">the architecture</text>
      <text x="387" y="82">the wiring. who</text><text x="387" y="94">depends on whom</text><text x="387" y="106">to exist at all</text>
      <text x="387" y="128">shared database?</text><text x="387" y="140">same quantum.</text><text x="387" y="152">no exceptions.</text>
      <text x="541" y="82">the calls. who</text><text x="541" y="94">talks to whom</text><text x="541" y="106">while running</text>
      <text x="541" y="128">sync or async is</text><text x="541" y="140">the whole trade-off</text><text x="541" y="152">— see Ch. 15</text>
    </g>
    <text x="310" y="184" font-size="9" fill="var(--ink)">Higher coupling is fine at narrow scope.</text>
    <text x="310" y="202" font-size="9" fill="var(--acc)">The broader the scope, the looser the coupling has to be.</text>
  </g>
</svg>

    <text x="120" y="174" font-size="8.4" fill="var(--ink2)">deployed in lockstep</text>
    <text x="500" y="162" font-size="9.4" fill="var(--ink)">quantum boundaries, then data</text>

    <text x="310" y="262" font-size="8.6" fill="var(--ink2)">Fig. 7-1 · scope first, style second — not the other way round</text>
