<!--@ collision -->
<svg viewBox="0 0 620 246" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
    <rect x="40" y="44" width="150" height="40" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="240" y="44" width="150" height="40" fill="var(--accBg)" stroke="var(--acc)"/>
    <g stroke="var(--acc)" stroke-width="1.4" stroke-dasharray="5 4">
      <path d="M190 56 H240"/><path d="M240 74 H190"/>
    </g>
    <path d="M424 34 H614 M424 62 H614 M424 90 H614 M424 118 H614" stroke="var(--rule2)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" font-size="8.2">
    <text x="115" y="62" text-anchor="middle" font-size="9" fill="var(--acc)">instance A</text>
    <text x="115" y="76" text-anchor="middle" fill="var(--ink2)">500 → 490 (sold 10)</text>
    <text x="315" y="62" text-anchor="middle" font-size="9" fill="var(--acc)">instance B</text>
    <text x="315" y="76" text-anchor="middle" fill="var(--ink2)">500 → 495 (sold 5)</text>
    <text x="215" y="108" text-anchor="middle" fill="var(--ink)">A replicates → B becomes 490. B replicates → A becomes 495.</text>
    <text x="215" y="124" text-anchor="middle" fill="var(--acc)">Both wrong. The answer was 485.</text>
    <text x="215" y="150" text-anchor="middle" font-size="9.6" fill="var(--ink)">collision rate = N × (UR² ÷ S) × RL</text>
    <text x="215" y="166" text-anchor="middle" font-size="8" fill="var(--ink2)">instances × update rate squared ÷ cache rows × replication latency</text>
    <text x="424" y="24" font-size="8.6" fill="var(--ink3)">FROM 14.4 COLLISIONS/HOUR, CHANGE ONE THING:</text>
    <g font-size="8.6" fill="var(--ink)">
      <text x="424" y="54">RL 100 ms → 1 ms</text>
      <text x="424" y="82">instances 5 → 2</text>
      <text x="424" y="110">cache 50,000 → 10,000 rows</text>
    </g>
    <g font-size="8.6" text-anchor="end">
      <text x="614" y="54" fill="var(--acc)">0.1 / hour</text>
      <text x="614" y="82" fill="var(--acc)">5.8 / hour</text>
      <text x="614" y="110" fill="var(--ink2)">72 / hour</text>
    </g>
    <text x="424" y="140" font-size="8.4" fill="var(--ink2)">Cache size is the one inverse factor:</text>
    <text x="424" y="152" font-size="8.4" fill="var(--ink2)">a smaller cache collides more.</text>
    <text x="424" y="176" font-size="8.4" fill="var(--acc)">Measure RL in production. It is never published;</text>
    <text x="424" y="188" font-size="8.4" fill="var(--acc)">100 ms is the planning number.</text>
    <text x="310" y="222" font-size="9" text-anchor="middle" fill="var(--ink)">Collisions happen when the update rate outruns replication latency.</text>
    <text x="310" y="238" font-size="8.4" text-anchor="middle" fill="var(--ink2)">Calculate minimum, normal and peak rates — nobody's update rate is flat across a day.</text>
  </g>
</svg>
