      <text x="57" y="55">nurse UI</text><text x="57" y="91">self-service</text><text x="57" y="127">admin UI</text>

      <text x="14" y="214">AVAILABILITY → split the one database in two: clustered nurse profiles, single-instance case notes. Also better security.</text>

    </g>
