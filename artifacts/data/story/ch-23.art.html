<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">

  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="10.5">
      <text x="103" y="54" fill="var(--ink)">UML</text><text x="309" y="54" fill="var(--acc)">C4</text><text x="516" y="54" fill="var(--ink)">ARCHIMATE</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="103" y="80">Booch, Jacobson, Rumbaugh,</text><text x="103" y="91">1980s. Designed by committee</text>
      <text x="103" y="102">to unify three philosophies.</text>
      <text x="103" y="120" fill="var(--ink)">class and sequence diagrams survive.</text>
      <text x="309" y="80">Simon Brown, 2006–11.</text>
      <text x="309" y="91">Context · Container · Component · Class</text>
      <text x="309" y="102">— and it keeps class diagrams from UML,</text>
      <text x="309" y="113">because they work.</text>
      <text x="516" y="80">The Open Group. Enterprise</text><text x="516" y="91">modelling across business domains.</text>
      <text x="516" y="108">deliberately “as small as possible”,</text><text x="516" y="119">not covering every edge case.</text>
    </g>
    <text x="310" y="160" font-size="9" fill="var(--ink)">Establish a standard. Then allow reasonable exceptions — architects break the rules whenever the standard has no good way to say the thing.</text>
    <text x="310" y="182" font-size="8.6" fill="var(--acc)">The one near-universal convention: solid lines are synchronous, dotted lines are asynchronous.</text>
  </g>
</svg>
