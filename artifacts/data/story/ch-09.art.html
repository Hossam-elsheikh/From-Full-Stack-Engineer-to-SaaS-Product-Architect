<!-- Drawings for chapter 09 · Foundations -->

<!--@ style-vs-pattern -->
<svg viewBox="0 0 620 176" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="6" y="34" width="116" height="56" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="132" y="34" width="116" height="56" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="258" y="34" width="116" height="56" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="384" y="34" width="116" height="56" fill="var(--accBg)" stroke="var(--acc)"/>
    <rect x="504" y="34" width="110" height="56" fill="var(--accBg)" stroke="var(--acc)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <text x="6" y="20" font-size="8.6" letter-spacing="1.6" text-anchor="start" fill="var(--ink3)">NAMING A STYLE COMMITS YOU TO FIVE THINGS AT ONCE</text>
    <g font-size="9.6" fill="var(--acc)">
      <text x="64" y="55">component</text><text x="64" y="67">topology</text>
      <text x="190" y="55">physical</text><text x="190" y="67">architecture</text>
      <text x="316" y="61">deployment</text>
      <text x="442" y="55">communication</text><text x="442" y="67">style</text>
      <text x="559" y="55">data</text><text x="559" y="67">topology</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="64" y="110">technical layers,</text><text x="64" y="121">or domains?</text>
      <text x="190" y="110">monolithic or</text><text x="190" y="121">distributed?</text>
      <text x="316" y="110">one unit at a time,</text><text x="316" y="121">or pieces, fast?</text>
      <text x="442" y="110">method calls, or</text><text x="442" y="121">REST and queues?</text>
      <text x="559" y="110">one database,</text><text x="559" y="121">or many?</text>
    </g>
    <text x="310" y="150" font-size="9" fill="var(--ink)">A pattern is a contextualised solution. A style is all five of these, plus the characteristics that come with them.</text>
    <text x="310" y="168" font-size="8.6" fill="var(--ink2)">Nobody decrees styles. They emerge, get copied, and eventually earn a name — “microservices” is a label, not an instruction to build small services.</text>
  </g>
</svg>

    <text x="392" y="22" font-size="9.6" fill="var(--acc)">THREE-TIER</text>

  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <text x="6" y="20" font-size="8.6" letter-spacing="1.6" text-anchor="start" fill="var(--ink3)">DEUTSCH ET AL., 1994 — ALL EIGHT STILL APPLY</text>
    <g font-size="9.4" fill="var(--ink)">
      <text x="80" y="52">the network</text><text x="80" y="64">is reliable</text>
      <text x="234" y="52">latency</text><text x="234" y="64">is zero</text>
      <text x="388" y="52">bandwidth</text><text x="388" y="64">is infinite</text>
      <text x="541" y="52">the network</text><text x="541" y="64">is secure</text>
      <text x="80" y="112">the topology</text><text x="80" y="124">never changes</text>
      <text x="234" y="112">there is one</text><text x="234" y="124">administrator</text>
      <text x="388" y="112">transport cost</text><text x="388" y="124">is zero</text>
      <text x="541" y="112">the network is</text><text x="541" y="124">homogeneous</text>
    </g>
    <text x="6" y="158" font-size="8.6" letter-spacing="1.6" text-anchor="start" fill="var(--acc)">AND THREE THE AUTHORS ADD</text>
    <g font-size="9.4" fill="var(--acc)">
      <text x="104" y="190">versioning is easy</text>
      <text x="310" y="190">compensating updates always work</text>
      <text x="516" y="190">observability is optional</text>
    </g>
    <g font-size="8" fill="var(--ink2)">
      <text x="104" y="206">per service or per system?</text><text x="104" y="215">how many live at once?</text>
      <text x="310" y="206">what happens when the</text><text x="310" y="215">compensating update fails?</text>
      <text x="516" y="206">useful in a monolith.</text><text x="516" y="215">critical in a distributed one.</text>
    </g>
    <text x="310" y="248" font-size="9" fill="var(--ink)">Do you know your production round-trip latency? Not the average — the 95th percentile.</text>
    <text x="310" y="266" font-size="9" fill="var(--acc)">Average 60 ms with a 400 ms tail is what kills a distributed architecture.</text>
    <text x="310" y="286" font-size="8.4" fill="var(--ink2)">Chain ten calls at 100 ms each and you have added a full second to one business request.</text>
  </g>
</svg>

<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="6" y="32" width="284" height="42" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.7"/>
    <rect x="6" y="86" width="284" height="42" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.7"/>
    <rect x="314" y="32" width="144" height="96"/>

    <g stroke="var(--ink3)" stroke-width="1.2">
      <path d="M290 53 H314 M290 107 L314 90 M458 80 H470"/>
      <path d="M306 49 l8 4 l-8 4"/>
    </g>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace">
    <text x="6" y="20" font-size="8.6" letter-spacing="1.6" fill="var(--ink3)">TEAM TOPOLOGIES — SKELTON &amp; PAIS</text>
    <text x="20" y="52" font-size="10" fill="var(--acc)">STREAM-ALIGNED</text>
    <text x="20" y="66" font-size="8.2" fill="var(--ink2)">one product, service or capability. moves fast. everything else exists to unblock it.</text>
    <text x="20" y="106" font-size="10" fill="var(--acc)">STREAM-ALIGNED</text>
    <text x="20" y="120" font-size="8.2" fill="var(--ink2)">a stream is a line of work scoped to a business domain.</text>
    <text x="328" y="52" font-size="10" fill="var(--ink)">ENABLING</text>
    <text x="328" y="68" font-size="8.2" fill="var(--ink2)">bridges a capability gap:</text>
    <text x="328" y="79" font-size="8.2" fill="var(--ink2)">research and learning that</text>
    <text x="328" y="90" font-size="8.2" fill="var(--ink2)">is important, not urgent</text>
    <text x="328" y="112" font-size="8.2" fill="var(--ink2)">+ COMPLICATED-SUBSYSTEM:</text>
    <text x="328" y="123" font-size="8.2" fill="var(--ink2)">owns the hard part, cuts others' load</text>
    <text x="484" y="52" font-size="10" fill="var(--ink)">PLATFORM</text>
    <text x="484" y="68" font-size="8.2" fill="var(--ink2)">self-service APIs, tools and</text>
    <text x="484" y="79" font-size="8.2" fill="var(--ink2)">support as an internal product</text>
    <text x="484" y="95" font-size="8.2" fill="var(--ink2)">removes friction while keeping</text>
    <text x="484" y="106" font-size="8.2" fill="var(--ink2)">governance on quality, security</text>
    <text x="310" y="158" font-size="9" text-anchor="middle" fill="var(--ink)">Conway's Law: a design copies the communication structure of the people who made it.</text>
    <text x="310" y="176" font-size="9" text-anchor="middle" fill="var(--acc)">The Inverse Conway Maneuver: change the teams to get the architecture you want.</text>
    <text x="310" y="194" font-size="8.4" text-anchor="middle" fill="var(--ink2)">this is why layered architectures came with a DBA department and a frontend department</text>
  </g>
</svg>
