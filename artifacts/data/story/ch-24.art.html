  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8.2">
    <text x="102" y="30" font-size="9.4" fill="var(--ink)">TOO TIGHT</text>
    <text x="310" y="30" font-size="9.4" fill="var(--ink)">TOO LOOSE</text>
    <text x="518" y="30" font-size="9.4" fill="var(--acc)">RIGHT-SIZED</text>
    <text x="102" y="93" fill="var(--acc)">the team</text>
    <text x="310" y="93" fill="var(--acc)">the team</text>
    <text x="518" y="93" fill="var(--acc)">the team</text>
    <text x="102" y="158" fill="var(--ink2)">no libraries, no naming freedom,</text>
    <text x="102" y="169" fill="var(--ink2)">pseudocode handed down. people leave.</text>
    <text x="310" y="158" fill="var(--ink2)">too many choices. the team ends up</text>
    <text x="310" y="169" fill="var(--ink2)">doing the architect's job, badly.</text>

<!--@ involvement -->
<svg viewBox="0 0 620 236" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.5">
    <path d="M60 76 H560"/>
    <path d="M310 68 v16 M160 70 v12 M460 70 v12 M60 66 v20 M560 66 v20"/>
    <path d="M160 76 l-9 -14 h18 z" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <path d="M410 76 l-9 -14 h18 z" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <path d="M6 148 H614" stroke="var(--rule)"/>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" font-size="8.2">
    <text x="60" y="102" text-anchor="middle" fill="var(--ink)">ARMCHAIR</text>
    <text x="60" y="114" text-anchor="middle" fill="var(--ink2)">−100</text>
    <text x="560" y="102" text-anchor="middle" fill="var(--ink)">CONTROL FREAK</text>
    <text x="560" y="114" text-anchor="middle" fill="var(--ink2)">+100</text>
    <text x="310" y="102" text-anchor="middle" fill="var(--acc)">EFFECTIVE</text>
    <text x="160" y="48" text-anchor="middle" fill="var(--acc)">scenario 1: −60</text>
    <text x="410" y="48" text-anchor="middle" fill="var(--acc)">scenario 2: +20</text>
    <text x="6" y="138" font-size="8.6" letter-spacing="1.4" fill="var(--ink3)">FIVE FACTORS, ±20 EACH</text>
    <g font-size="8.6" fill="var(--ink)">
      <text x="6" y="166">team familiarity</text><text x="128" y="166">team size</text>
      <text x="232" y="166">overall experience</text><text x="382" y="166">project complexity</text>
      <text x="524" y="166">project duration</text>
    </g>
    <g font-size="8" fill="var(--ink2)">
      <text x="6" y="182">new to each other</text><text x="128" y="182">12+ is large,</text>
      <text x="232" y="182">mostly junior means</text><text x="382" y="182">complex means</text>
      <text x="524" y="182">longer means</text>
      <text x="6" y="192">= more involvement</text><text x="128" y="192">5 or fewer is small</text>
      <text x="232" y="192">mentor, not facilitator</text><text x="382" y="192">be available</text>
      <text x="524" y="192">more involvement</text>
    </g>
    <text x="310" y="218" font-size="8.6" text-anchor="middle" fill="var(--acc)">Duration is the counter-intuitive one: two months has its own urgency, so stay out of the way.</text>
    <text x="310" y="230" font-size="8.4" text-anchor="middle" fill="var(--ink2)">Two years and people take long lunches — that is when the architect keeps the hard work first.</text>
  </g>
</svg>

    <path d="M446 108 h60 M452 96 h48" stroke="var(--ink3)" stroke-width="1.2"/>

    <g stroke="var(--ink3)" stroke-width="1"><path d="M528 96 h58 M528 108 h58 M528 84 h58 M528 72 h44"/></g>
  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle" font-size="8">
    <g font-size="9.4" fill="var(--ink)">
      <text x="104" y="26">PROCESS LOSS</text><text x="310" y="26">PLURALISTIC IGNORANCE</text><text x="516" y="26">DIFFUSION OF RESPONSIBILITY</text>
    </g>
    <text x="150" y="58" font-size="7.4" fill="var(--ink3)">potential</text>
    <text x="160" y="106" font-size="7.4" fill="var(--acc)">actual</text>
    <text x="316" y="94" font-size="7.4" fill="var(--acc)">privately disagrees</text>
    <text x="470" y="72" font-size="7.4" fill="var(--acc)">stranded</text>
    <g font-size="8" fill="var(--ink2)">
      <text x="104" y="158">Brooks's Law: add people, the</text><text x="104" y="169">project takes longer. merge conflicts</text>
      <text x="104" y="180">mean people are in each other's way.</text>
      <text x="310" y="158">everyone privately rejects the norm</text><text x="310" y="169">and agrees anyway, in case they're</text>
      <text x="310" y="180">missing something obvious.</text>
      <text x="516" y="158">a country road: everyone stops.</text><text x="516" y="169">a city highway: nobody does —</text>
      <text x="516" y="180">someone else must have called.</text>
    </g>
    <text x="310" y="204" font-size="8.6" fill="var(--acc)">Watch faces in meetings. When you see the doubt, ask that person directly — and back them even when they're wrong.</text>
  </g>
</svg>

<!--@ stack -->
<svg viewBox="0 0 620 216" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="var(--ink)" stroke-width="1.4">
    <rect x="8" y="40" width="196" height="94" fill="var(--accBg)" stroke="var(--acc)" stroke-width="1.8"/>
    <rect x="214" y="40" width="196" height="94"/>

  </g>
  <g stroke="none" font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <text x="8" y="30" text-anchor="start" font-size="8.6" letter-spacing="1.4" fill="var(--ink3)">WHO DECIDES, FOR EACH KIND OF THIRD-PARTY LIBRARY</text>
    <g font-size="10">
      <text x="106" y="60" fill="var(--acc)">SPECIAL PURPOSE</text>
      <text x="312" y="60" fill="var(--ink)">GENERAL PURPOSE</text>
      <text x="516" y="60" fill="var(--ink2)">FRAMEWORK</text>
    </g>
    <g font-size="8.2" fill="var(--ink2)">
      <text x="106" y="86">PDF rendering, barcodes —</text><text x="106" y="97">not worth writing yourself</text>
      <text x="312" y="86">wrappers on the language API:</text><text x="312" y="97">Apache Commons, Guava</text>
      <text x="516" y="86">persistence, inversion of control:</text><text x="516" y="97">Hibernate, Spring. highly invasive.</text>
    </g>
    <g font-size="9" fill="var(--ink)">
      <text x="106" y="122" fill="var(--acc)">developer decides</text>
      <text x="312" y="122">developer analyses, architect approves</text>
      <text x="516" y="122">architect decides</text>
    </g>
    <text x="310" y="168" font-size="9" fill="var(--ink)">Two questions before any new library: does it overlap with what we already have, and what is the justification?</text>
    <text x="310" y="190" font-size="9" fill="var(--acc)">Ask for a business justification, not only a technical one.</text>
    <text x="310" y="208" font-size="8.4" fill="var(--ink2)">That single request is what turns a disruptive enthusiast into someone who understands the budget.</text>
  </g>
</svg>
