}

  }
}
:root[data-theme="dark"]{
  --paper:#0C161E; --sheet:#122230; --sunk:#0B141C; --chip:#17303F;
  --ink:#DCE7EE; --ink2:#9CB1BF; --ink3:#6C8493;
  --rule:#26404F; --rule2:#1D3340; --hair:rgba(126,196,235,.055);
  --blue:#5CACE8; --blueBg:rgba(92,172,232,.14); --blueLine:rgba(92,172,232,.4);
  --amber:#E5A340; --amberBg:rgba(229,163,64,.15);
  --green:#5CBE8B; --greenBg:rgba(92,190,139,.15);
  --red:#E4776C; --redBg:rgba(228,119,108,.15);

}
body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:27px 27px;
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Saira Condensed","IBM Plex Sans",sans-serif;font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem);letter-spacing:.005em}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,34px)}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--lift);position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:11px;height:11px;border:1px solid var(--rule);pointer-events:none}
.sheet::before{top:6px;left:6px;border-right:0;border-bottom:0}
.sheet::after{bottom:6px;right:6px;border-left:0;border-top:0}
.tblock{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:var(--sunk)}
.tcell{padding:8px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tcell:last-child{border-right:0}
.tcell .v{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1rem;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.tcell.grow{flex:1}
.btn{font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;
  background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:9px 20px;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.blue,:root:not([data-theme="light"]) .btn.blue{color:#08121A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.blue{color:#fff}}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stamp{font-family:"Saira Condensed",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:3px double currentColor;padding:4px 14px;display:inline-block;transform:rotate(-3.5deg);font-size:1.1rem;opacity:.92}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}60%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.hit{animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) both}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:2px 7px;color:var(--ink2);background:var(--chip);white-space:nowrap}
.rule{height:1px;background:var(--rule2);border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
[hidden]{display:none !important}
:root{--acc:#4A4F8C;--accBg:rgba(74,79,140,.12);--accLine:rgba(74,79,140,.42);--dot:rgba(74,79,140,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#A0A5DC;--accBg:rgba(160,165,220,.12);--accLine:rgba(160,165,220,.42);--dot:rgba(160,165,220,.22)}}
:root[data-theme="dark"]{--acc:#A0A5DC;--accBg:rgba(160,165,220,.12);--accLine:rgba(160,165,220,.42);--dot:rgba(160,165,220,.22)}
/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */
.sec{padding:clamp(20px,3vw,34px) clamp(16px,3vw,32px);border-top:1px solid var(--rule2)}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sechead .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc)}
.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}
.split{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);align-items:start}
@media(max-width:780px){.split{grid-template-columns:1fr}}
.sec.wide .split{grid-template-columns:1fr}
figure{margin:0;border:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px}
figure svg{width:100%;height:auto;display:block;padding:clamp(12px,2vw,20px);max-width:560px;margin:0 auto}
.sec.wide figure svg{max-width:900px}
figcaption{font-family:"IBM Plex Mono",monospace;font-size:.68rem;line-height:1.6;color:var(--ink2);
  padding:9px 13px;border-top:1px solid var(--rule);background:var(--sheet)}
.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.body p{font-size:.96rem;line-height:1.6;max-width:70ch;color:var(--ink2)}
.body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.body li{font-size:.95rem;line-height:1.5;padding-left:15px;position:relative;max-width:70ch}
.body li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--acc)}

/* ---------- the book's own words ---------- */
.qs{display:flex;flex-direction:column;gap:10px}
.q{border-left:4px solid var(--acc);background:var(--chip);padding:13px 16px;
  display:flex;flex-direction:column;gap:7px}
.q .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.4rem);
  line-height:1.18;letter-spacing:.01em;text-wrap:balance}
.q .a{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--acc)}
.q .n{font-size:.9rem;line-height:1.55;color:var(--ink2);max-width:70ch}

/* ---------- decisions ---------- */
.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);
  display:flex;flex-direction:column}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;
  background:var(--ink);color:var(--sheet)}
.dec .top .tag{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}
</style>

<script>
const D={"ch": "20", "book": "Chapter 20 · Architectural Patterns", "pages": "pp. 371–384", "title": "Patterns Under the Implementations", "gist": "A style is a named topology. A pattern is a contextualised solution to a problem. Four patterns that show up inside the styles you've already read — and why naming the pattern before the tool matters.", "read": "4 min · 30 sec to re-scan", "acc": {"l": "#4A4F8C", "d": "#A0A5DC"}, "minute": ["**Identify the pattern first, then choose the implementation.** Tools and frameworks encapsulate patterns at varying fidelity and mixed together; picking the tool first hides which trade-offs you accepted.", "Beware **“best practice”**. Calling something *better* practice invites argument; calling it *best* lets architects stop thinking and apply the same solution every time.", "**Orthogonal coupling**: two parts with distinct purposes that must still intersect. Monitoring is necessary and independent of catalog checkout. Recognising it lets you find the least entangling intersection.", "**CQRS** splits reads from writes into separate stores, so each can carry different architecture characteristics, data models and security posture.", "**Single broker or domain broker** — centralised discovery and minimal infrastructure, against isolation, scale and matching your domain boundaries. Neither is a best practice."], "sections": [{"t": "Reuse: separating domain from operational coupling", "art": "hexagonal", "alt": "A hexagon with domain logic at the centre surrounded by ports and adapters", "cap": "Fig. 20-1 · Alistair Cockburn's Hexagonal architecture — properly, Ports and Adapters.", "p": "Microservices says duplication is preferable to coupling, and accepts duplicated implementations to preserve decoupling. But some capabilities genuinely *benefit* from coupling — monitoring, logging, authentication, circuit breakers. Letting every team implement monitoring independently descends into chaos: how does anyone verify it was done, and how does an organisation coordinate a version upgrade across all of them?", "items": ["The pattern has a **flaw when applied to microservices**, visible only to people who know its original intent. It treats the database as just another pluggable adapter, and does not treat the data schema as business logic — a common misperception when the name was coined.", "**Eric Evans corrected this in Domain-Driven Design**: wherever they reside, database schemas must change to reflect the system's business logic. Which means the literal pattern would isolate the data and violate a core microservices principle.", "Using “Hexagonal” as shorthand for *separation of domain and operational concerns* is fine. Using it as an implementation instruction, in a microservices context, is not — and the modern implementation of that separation is the **Service Mesh**."]}, {"t": "Sidecar and Service Mesh as an orthogonal reuse pattern", "art": "broker", "wide": true, "alt": "A single broker serving eight services beside two domain brokers serving four each", "cap": "The Sidecar isn't only decoupling — it is a reuse pattern for a specific *kind* of coupling.", "p": "An **orthogonal reuse pattern** reuses something represented by one or more concerns that doesn't fit the preferred hierarchy. Microservices organises around domains; operational coupling has to cut across them. The sidecar isolates those concerns in a cross-cutting but consistent layer.", "items": ["**Advantages**: a consistent way to create isolated coupling; consistent infrastructure coordination; ownership that can be per-team, centralised, or a mix.", "**Disadvantages**: a sidecar per platform; the sidecar component itself grows large and complex; and **implementation drift** between independent teams.", "Hexagonal is the general-purpose implementation of the separation; Service Mesh is the one suited to microservices and other distributed architectures. **The pattern is the separation. The mesh is one way to get it.**"]}, {"k": "decision", "t": "Orchestration or choreography — the trade-offs, listed", "art": "cqrs", "wide": true, "alt": "A client/server application on one database beside a CQRS split into separate write and read stores", "sit": "Four domain services must collaborate to form a workflow. Either a separate orchestrator coordinates them, or they coordinate themselves. You have now met this decision in event-driven architecture *and* in microservices — same pattern, same trade-offs, twice.", "opts": [["Orchestration.", "**For**: a centralised workflow (valuable as complexity rises), real error handling with a state owner, recoverability through retries during short outages, and queryable workflow state. **Against**: all communication routes through the orchestrator, so it is a throughput bottleneck and a single point of failure; it scales worse by adding coordination points that cut parallelism; and it couples the domain services to itself."], ["Choreography.", "**For**: fewer chokepoints and more parallelism, so better responsiveness; independent scaling; multiple instances for fault tolerance without the orchestrator's sensitivity; and less coupling. **Against**: no workflow owner makes errors and boundary conditions harder, there is no centralised state, and recoverability suffers — domain services must carry more workflow knowledge."]], "verdict": "Any distributed architecture can use either. The reason this is worth naming as a pattern rather than learning twice: **recognising the pattern lurking inside an implementation makes its trade-offs visible**. And the Second Law applies — you cannot run this analysis once and be done."}, {"t": "CQRS and the broker patterns", "art": "cqrs", "wide": true, "alt": "A client/server application on one database beside a CQRS split into separate write and read stores", "cap": "Fig. 20-3 · writes to one store, synchronised (usually asynchronously) to another that serves reads.", "p": "**CQRS** — Command Query Responsibility Segregation — suits systems where read and write volumes differ starkly, or where reads should be isolated from writes for security. Separating them lets each side carry different architecture characteristics and, if useful, a different data model entirely.", "items": ["**Single-Broker**: centralised discovery and the least possible infrastructure. Against: it is a fault-tolerance risk — if it goes down the whole workflow stops — and a throughput ceiling as volume rises.", "**Domain-Broker**: each group of related services shares a broker, mirroring the architecture's domain partitioning. Better isolation, matches domain boundaries, more scalable. Against: harder discovery of queues and topics, more infrastructure to pay for, more moving parts to maintain.", "The reason infrastructure shows up in a patterns chapter at all: **in EDA the topic or queue is owned by the sender**, so a service's broker is part of that service's infrastructure. Coupling to infrastructure is coupling."]}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 20: Architectural Patterns, pp. 371–384.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"hexagonal": "<svg viewBox=\"0 0 300 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <path d=\"M150 34 L226 76 V160 L150 202 L74 160 V76 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <rect x=\"106\" y=\"98\" width=\"88\" height=\"42\"/>\n    <g stroke-width=\"1.4\">\n      <rect x=\"14\" y=\"60\" width=\"42\" height=\"24\"/><rect x=\"14\" y=\"152\" width=\"42\" height=\"24\"/>\n      <rect x=\"244\" y=\"60\" width=\"42\" height=\"24\"/><rect x=\"244\" y=\"152\" width=\"42\" height=\"24\"/>\n    </g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M56 72 L100 92 M56 164 L100 146 M244 72 L200 92 M244 164 L200 146\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"150\" y=\"124\" font-size=\"9\" fill=\"var(--ink)\">domain logic</text>\n    <text x=\"35\" y=\"52\" fill=\"var(--ink2)\">adapter</text><text x=\"35\" y=\"192\" fill=\"var(--ink2)\">adapter</text>\n    <text x=\"265\" y=\"52\" fill=\"var(--ink2)\">adapter</text><text x=\"265\" y=\"192\" fill=\"var(--ink2)\">adapter</text>\n    <text x=\"150\" y=\"216\" font-size=\"8.4\" fill=\"var(--acc)\">Cockburn wanted to call it Ports and Adapters. “Hexagonal” sounded cooler and stuck.</text>\n  </g>\n</svg>", "broker": "<svg viewBox=\"0 0 620 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"24\" y=\"34\" width=\"52\" height=\"24\"/><rect x=\"96\" y=\"34\" width=\"52\" height=\"24\"/>\n    <rect x=\"168\" y=\"34\" width=\"52\" height=\"24\"/><rect x=\"240\" y=\"34\" width=\"46\" height=\"24\"/>\n    <rect x=\"24\" y=\"130\" width=\"52\" height=\"24\"/><rect x=\"96\" y=\"130\" width=\"52\" height=\"24\"/>\n    <rect x=\"168\" y=\"130\" width=\"52\" height=\"24\"/><rect x=\"240\" y=\"130\" width=\"46\" height=\"24\"/>\n    <rect x=\"90\" y=\"82\" width=\"132\" height=\"24\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M50 58 L110 82 M122 58 V82 M194 58 L180 82 M263 58 L212 82\n      M110 106 L50 130 M122 106 V130 M180 106 L194 130 M212 106 L263 130\"/></g>\n\n    <g stroke=\"var(--acc)\" stroke-width=\"1.8\">\n      <rect x=\"378\" y=\"80\" width=\"90\" height=\"22\" fill=\"var(--accBg)\"/>\n      <rect x=\"500\" y=\"80\" width=\"90\" height=\"22\" fill=\"var(--accBg)\"/>\n    </g>\n    <rect x=\"366\" y=\"34\" width=\"52\" height=\"24\"/><rec he sender — so brokers are part of a service's infrastructure.</text>\n  </g>\n</svg>", "cqrs": "<svg viewBox=\"0 0 620 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"52\" y=\"40\" width=\"106\" height=\"32\"/>\n    <ellipse cx=\"105\" cy=\"122\" rx=\"46\" ry=\"9\"/><path d=\"M59 122 v16 a46 9 0 0 0 92 0 v-16\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M92 72 V113 M118 113 V72\"/></g>\n    <path d=\"M310 24 V180\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <rect x=\"408\" y=\"40\" width=\"106\" height=\"32\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.6\">\n      <ellipse cx=\"378\" cy=\"122\" rx=\"44\" ry=\"9\"/><path d=\"M334 122 v16 a44 9 0 0 0 88 0 v-16\"/>\n      <ellipse cx=\"546\" cy=\"122\" rx=\"44\" ry=\"9\"/><path d=\"M502 122 v16 a44 9 0 0 0 88 0 v-16\"/>\n      <path d=\"M430 72 L520 113\"/><path d=\"M492 72 L400 113\"/>\n      <path d=\"M422 132 H502\" stroke-dasharray=\"5 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"105\" y=\"60\" fill=\"var(--ink2)\">application</text>\n    <text x=\"105\" y=\"126\" fill=\"var(--ink2)\">one database</text>\n    <text x=\"105\" y=\"26\" font-size=\"9\" fill=\"var(--ink)\">CLIENT / SERVER</text>\n    <text x=\"461\" y=\"60\" fill=\"var(--ink2)\">application</text>\n    <text x=\"461\" y=\"26\" font-size=\"9\" fill=\"var(--acc)\">CQRS</text>\n    <text x=\"378\" y=\"126\" fill=\"var(--acc)\">writes</text><text x=\"546\" y=\"126\" fill=\"var(--acc)\">reads</text>\n    <text x=\"462\" y=\"147\" font-size=\"7.6\" fill=\"var(--acc)\">synchronised, usually async</text>\n    <text x=\"310\" y=\"176\" font-size=\"8.6\" fill=\"var(--ink)\">For systems where read and write volumes differ starkly, or where reads must be isolated for security.</text>\n    <text x=\"310\" y=\"192\" font-size=\"8.4\" fill=\"var(--acc)\">Two stores means two data models, and two sets of architecture characteristics.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
