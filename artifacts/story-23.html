<title>Drawing It So People Understand</title>

<style>

  --ink:#141B21; --ink2:#4B565F; --ink3:#7E888F;

  --blue:#0B5FA5; --blueBg:rgba(11,95,165,.10); --blueLine:rgba(11,95,165,.35);

}

  :root:not([data-theme="light"]){
    --paper:#0C161E; --sheet:#122230; --sunk:#0B141C; --chip:#17303F;

    --blue:#5CACE8; --blueBg:rgba(92,172,232,.14); --blueLine:rgba(92,172,232,.4);
    --amber:#E5A340; --amberBg:rgba(229,163,64,.15);
    --green:#5CBE8B; --greenBg:rgba(92,190,139,.15);
    --red:#E4776C; --redBg:rgba(228,119,108,.15);
    --plum:#B98AC9; --plumBg:rgba(185,138,201,.15);
    --lift:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -22px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#0C161E; --sheet:#122230; --sunk:#0B141C; --chip:#17303F;
  --ink:#DCE7EE; --ink2:#9CB1BF; --ink3:#6C8493;
  --rule:#26404F; --rule2:#1D3340; --hair:rgba(126,196,235,.055);
  --blue:#5CACE8; --blueBg:rgba(92,172,232,.14); --blueLine:rgba(92,172,232,.4);
  --amber:#E5A340; --amberBg:rgba(229,163,64,.15);
  --green:#5CBE8B; --greenBg:rgba(92,190,139,.15);
  --red:#E4776C; --redBg:rgba(228,119,108,.15);
  --plum:#B98AC9; --plumBg:rgba(185,138,201,.15);
  --lift:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -22px #000;
}
body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:27px 27px;
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Saira Condensed","IBM Plex Sans",sans-serif;font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem);letter-spacing:.005em}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,34px)}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--lift);position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:11px;height:11px;border:1px solid var(--rule);pointer-events:none}
.sheet::before{top:6px;left:6px;border-right:0;border-bottom:0}
.sheet::after{bottom:6px;right:6px;border-left:0;border-top:0}
.tblock{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:var(--sunk)}
.tcell{padding:8px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tcell:last-child{border-right:0}
.tcell .v{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1rem;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.tcell.grow{flex:1}
.btn{font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;
  background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:9px 20px;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.blue,:root:not([data-theme="light"]) .btn.blue{color:#08121A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.blue{color:#fff}}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stamp{font-family:"Saira Condensed",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:3px double currentColor;padding:4px 14px;display:inline-block;transform:rotate(-3.5deg);font-size:1.1rem;opacity:.92}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}60%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.hit{animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) both}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:2px 7px;color:var(--ink2);background:var(--chip);white-space:nowrap}
.rule{height:1px;background:var(--rule2);border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
[hidden]{display:none !important}
:root{--acc:#3D6570;--accBg:rgba(61,101,112,.12);--accLine:rgba(61,101,112,.42)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#92BCC7;--accBg:rgba(146,188,199,.12);--accLine:rgba(146,188,199,.42)}}
:root[data-theme="dark"]{--acc:#92BCC7;--accBg:rgba(146,188,199,.12);--accLine:rgba(146,188,199,.42)}
/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */
.sec{padding:clamp(20px,3vw,34px) clamp(16px,3vw,32px);border-top:1px solid var(--rule2)}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sechead .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc)}
.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}
.split{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);align-items:start}
@media(max-width:780px){.split{grid-template-columns:1fr}}
.sec.wide .split{grid-template-columns:1fr}
figure{margin:0;border:1px solid var(--rule);background:var(--sunk)}
figure svg{width:100%;height:auto;display:block;padding:clamp(12px,2vw,20px);max-width:560px;margin:0 auto}
.sec.wide figure svg{max-width:900px}
figcaption{font-family:"IBM Plex Mono",monospace;font-size:.68rem;line-height:1.6;color:var(--ink2);
  padding:9px 13px;border-top:1px solid var(--rule);background:var(--sheet)}
.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.body p{font-size:.96rem;line-height:1.6;max-width:70ch;color:var(--ink2)}
.body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.body li{font-size:.95rem;line-height:1.5;padding-left:15px;position:relative;max-width:70ch}
.body li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--acc)}

/* ---------- the book's own words ---------- */
.qs{display:flex;flex-direction:column;gap:10px}
.q{border-left:4px solid var(--acc);background:var(--chip);padding:13px 16px;
  display:flex;flex-direction:column;gap:7px}
.q .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.4rem);
  line-height:1.18;letter-spacing:.01em;text-wrap:balance}
.q .a{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--acc)}
.q .n{font-size:.9rem;line-height:1.55;color:var(--ink2);max-width:70ch}

/* ---------- decisions ---------- */
.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);
  display:flex;flex-direction:column}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;
  background:var(--ink);color:var(--sheet)}
.dec .top .tag{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}
</style>

<script>
const D={"ch": "23", "book": "Chapter 23 · Diagramming Architecture", "pages": "pp. 423–431", "title": "Drawing It So People Understand", "gist": "However good the idea, nobody funds or builds what they can't picture. Representational consistency, semantic layers, three standards worth knowing, and the antipattern that makes architects defend bad diagrams.", "read": "3 min · 30 sec to re-scan", "acc": {"l": "#3D6570", "d": "#92BCC7"}, "minute": ["**Representational consistency**: always show the relationship between parts before changing the view. Whole topology → where the part sits → the part in detail.", "Use drawing **layers semantically**. Base layer = topology, and it says *synchronous*, not *gRPC*. Next layer = implementation. Further layers = DDD boundaries, transaction scope, whatever you want to contrast.", "Three standards: **UML** (class and sequence diagrams survived; the rest didn't), **C4** (Context, Container, Component, Class — the modern default), **ArchiMate** (enterprise scope, deliberately minimal).", "The one near-universal convention: **solid lines are synchronous, dotted lines are asynchronous**. Almost nothing else about shapes is standard, so build your own set and publish a key.", "**Irrational Artifact Attachment**: your attachment to an artifact is proportional to how long it took to make. Stay low-fidelity early, so you can throw things away."], "sections": [{"t": "Representational consistency", "art": "rep-consistency", "wide": true, "alt": "A whole topology, then the same topology with one part highlighted, then that part in detail", "cap": "Fig. 23-1 · three frames, and the middle one is the one people skip.", "p": "To explain how the Silicon Sandwiches plug-ins relate to each other, you start with the whole topology, then show the relationship between it and the plug-in structure, and only then the plug-in structure itself. **Showing a portion without its place in the whole confuses viewers** — and it is a source of confusion you can eliminate for free."}, {"k": "decision", "t": "You spent four hours making the diagram beautiful", "art": "attachment", "alt": "Attachment plotted against hours spent producing an artifact, rising steeply", "sit": "You built a careful architecture diagram in a proper tool. In review, someone proposes a change that would invalidate the structure you drew. You find yourself explaining why the current design is fine.", "opts": [["Defend the design.", "This is **Irrational Artifact Attachment** — attachment proportional to production time. Four hours in Visio makes you twice as attached as two hours would have. The design isn't being defended on its merits."], ["Work in low-fidelity artifacts until the team has iterated enough.", "A whiteboard photo, index cards, sticky notes. Cheap enough to throw away, which is what frees people to experiment and lets the real shape emerge through revision and argument.", 1]], "verdict": "Eventually you *do* need the nice diagram in the fancy tool — just not before the team has iterated on the design. Many architects have replaced the whiteboard with a **tablet on a projector**: unlimited canvas, copy-paste for “what if” variants that would obscure the original, already digitised without the photograph glare, and it works with people who aren't in the room."}, {"t": "Layers, stencils, magnets", "art": "layers", "alt": "Three stacked planes: topology at the base, implementation above it, context overlays on top", "cap": "What to look for in a diagramming tool — and how to use the most important feature properly.", "items": ["**Layers** — group items logically and show or hide them. Build a comprehensive diagram and hide the detail until you're discussing it, or reveal a picture incrementally through a presentation.", "**Stencils and templates** — a library of common visual components, including composites. Building a stencil set for the patterns your organisation uses gives consistency across every diagram and makes new ones faster.", "**Magnets** — the points on a shape where connecting lines snap. Small feature, large effect on whether diagrams look considered."], "p": "The layer discipline is the part worth internalising: **the base layer is architecture, not implementation**. It should say *synchronous communication*, not name a protocol. Implementation details — which database, which protocol — go on the next layer up. Done this way, diagrams become extensible: you can add a layer for domain-driven design boundaries, or transactional scope, or any other meta-information you want to contrast against the topology."}, {"t": "Standards, and when to break them", "art": "standards", "wide": true, "alt": "UML, C4 and ArchiMate compared", "cap": "C4's four Cs: Context (users and external dependencies), Container (deployment boundaries — a good meeting point with operations), Component (the architect's view), Class.", "items": ["**Titles** on every element, unless it's genuinely well known to the audience. Rotate them to stick to the right thing and use space efficiently.", "**Lines** thick enough to see. Arrows for direction where flow matters. Different arrowheads may carry different meaning — just be consistent about it.", "**Shapes**: no pervasive standard exists. The authors use three-dimensional boxes for deployable artifacts, rectangles for containers, cylinders for databases — and admit there is no key beyond that.", "**Colour** is under-used, largely because books were printed in black and white for years. Use it to distinguish artifacts — but **never as the only distinction**, because colourblind viewers lose the meaning entirely. Pair it with distinct iconography, the way crossing lights pair red and green with different figures.", "**Keys** whenever shapes could be ambiguous. **An easily misinterpreted diagram is worse than no diagram at all.**"], "p": "Establish a standard for the organisation, and allow reasonable exceptions. Architects break the rules whenever the standard has no good way to express the design — and the alternative is what heavyweight CASE tools produced: elaborate models of simple things, full of details that were noise in that context."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 23: Diagramming Architecture, pp. 423–431. C4 is Simon Brown's; ArchiMate is The Open Group's.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"rep-consistency": "<svg viewBox=\"0 0 620 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"42\" width=\"150\" height=\"94\"/>\n    <g stroke-width=\"1.2\">\n      <rect x=\"26\" y=\"54\" width=\"40\" height=\"22\"/><rect x=\"74\" y=\"54\" width=\"40\" height=\"22\"/>\n      <rect x=\"122\" y=\"54\" width=\"30\" height=\"22\" stroke=\"var(--acc)\" stroke-width=\"1.8\" fill=\"var(--accBg)\"/>\n      <rect x=\"26\" y=\"86\" width=\"40\" height=\"22\"/><rect x=\"74\" y=\"86\" width=\"40\" height=\"22\"/>\n    </g>\n    <rect x=\"236\" y=\"42\" width=\"150\" height=\"94\"/>\n    <g stroke-width=\"1.2\" stroke=\"var(--ink3)\">\n      <rect x=\"248\" y=\"54\" width=\"40\" height=\"22\"/><rect x=\"296\" y=\"54\" width=\"40\" height=\"22\"/>\n      <rect x=\"248\" y=\"86\" width=\"40\" height=\"22\"/><rect x=\"296\" y=\"86\" width=\"40\" height=\"22\"/>\n    </g>\n    <rect x=\"336\" y=\"48\" width=\"42\" height=\"82\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"var(--accBg)\"/>\n    <rect x=\"458\" y=\"42\" width=\"150\" height=\"94\" stroke=\"var(--acc)\" stroke-width=\"2\" fill=\"var(--accBg)\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.3\">\n      <rect x=\"472\" y=\"56\" width=\"56\" height=\"24\"/><rect x=\"538\" y=\"56\" width=\"56\" height=\"24\"/>\n      <rect x=\"472\" y=\"96\" width=\"56\" height=\"24\"/><rect x=\"538\" y=\"96\" width=\"56\" height=\"24\"/>\n    </g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M164 89 H236 M386 89 H458\"/><path d=\"M228 85 l8 4 l-8 4 M450 85 l8 4 l-8 4\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.2\">\n    <text x=\"89\" y=\"32\" fill=\"var(--ink)\">the whole topology</text>\n    <text x=\"311\" y=\"32\" fill=\"var(--ink)\">where the part sits in it</text>\n    <text x=\"533\" y=\"32\" fill=\"var(--acc)\">the part, in detail</text>\n    <text x=\"310\" y=\"164\" font-size=\"9\" fill=\"var(--ink)\">Representational consistency: always show the relationship before you change the view.</text>\n    <text x=\"310\" y=\"184\" font-size=\"8.6\" fill=\"var(--acc)\">Show a portion without its place in the whole and you have manufactured confusion.</text>\n  </g>\n</svg>", "attachment": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M40 148 H278 M40 148 V26\"/>\n    <path d=\"M44 144 L268 36\" stroke=\"var(--acc)\" stroke-width=\"2.2\"/>\n    <circle cx=\"90\" cy=\"122\" r=\"4\" fill=\"var(--acc)\" stroke=\"none\"/>\n    <circle cx=\"230\" cy=\"54\" r=\"4\" fill=\"var(--acc)\" stroke=\"none\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.2\">\n    <text x=\"30\" y=\"88\" fill=\"var(--ink)\" transform=\"rotate(-90 30 88)\" text-anchor=\"middle\">attachment</text>\n    <text x=\"160\" y=\"164\" text-anchor=\"middle\" fill=\"var(--ink)\">hours spent producing it →</text>\n    <text x=\"98\" y=\"118\" fill=\"var(--ink2)\">whiteboard photo</text>\n    <text x=\"238\" y=\"48\" text-anchor=\"end\" fill=\"var(--acc)\">four hours in Visio</text>\n    <text x=\"150\" y=\"186\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--acc)\">Irrational Artifact Attachment</text>\n    <text x=\"150\" y=\"198\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"var(--ink2)\">the harder it was to make, the harder it is to throw away</text>\n  </g>\n</svg>", "layers": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <path d=\"M40 150 L150 110 L260 150 L150 190 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <path d=\"M40 108 L150 68 L260 108 L150 148 Z\"/>\n    <path d=\"M40 66 L150 26 L260 66 L150 106 Z\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.2\">\n    <text x=\"272\" y=\"152\" fill=\"var(--acc)\">topology</text>\n    <text x=\"272\" y=\"163\" fill=\"var(--ink2)\">containers, brokers,</text>\n    <text x=\"272\" y=\"174\" fill=\"var(--ink2)\">databases, dependencies</text>\n    <text x=\"272\" y=\"108\" fill=\"var(--ink)\">implementation</text>\n    <text x=\"272\" y=\"119\" fill=\"var(--ink2)\">which database, which protocol</text>\n    <text x=\"272\" y=\"64\" fill=\"var(--ink2)\">context overlays</text>\n    <text x=\"272\" y=\"75\" fill=\"var(--ink2)\">DDD boundaries, transaction scope</text>\n    <text x=\"150\" y=\"208\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink)\">Use layers semantically, not decoratively.</text>\n    <text x=\"14\" y=\"20\" font-size=\"8.4\" fill=\"var(--ink2)\">the base layer says</text>\n    <text x=\"14\" y=\"31\" font-size=\"8.4\" fill=\"var(--ink2)\">“synchronous” —</text>\n    <text x=\"14\" y=\"42\" font-size=\"8.4\" fill=\"var(--ink2)\">not “gRPC”</text>\n  </g>\n</svg>", "standards": "<svg viewBox=\"0 0 620 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"8\" y=\"36\" width=\"190\" height=\"96\"/>\n    <rect x=\"214\" y=\"36\" width=\"190\" height=\"96\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"420\" y=\"36\" width=\"192\" height=\"96\"/>\n    <path d=\"M8 62 H198 M214 62 H404 M420 62 H612\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <g font-size=\"10.5\">\n      <text x=\"103\" y=\"54\" fill=\"var(--ink)\">UML</text><text x=\"309\" y=\"54\" fill=\"var(--acc)\">C4</text><text x=\"516\" y=\"54\" fill=\"var(--ink)\">ARCHIMATE</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"103\" y=\"80\">Booch, Jacobson, Rumbaugh,</text><text x=\"103\" y=\"91\">1980s. Designed by committee</text>\n      <text x=\"103\" y=\"102\">to unify three philosophies.</text>\n      <text x=\"103\" y=\"120\" fill=\"var(--ink)\">class and sequence diagrams survive.</text>\n      <text x=\"309\" y=\"80\">Simon Brown, 2006–11.</text>\n      <text x=\"309\" y=\"91\">Context · Container · Component · Class</text>\n      <text x=\"309\" y=\"102\">— and it keeps class diagrams from UML,</text>\n      <text x=\"309\" y=\"113\">because they work.</text>\n      <text x=\"516\" y=\"80\">The Open Group. Enterprise</text><text x=\"516\" y=\"91\">modelling across business domains.</text>\n      <text x=\"516\" y=\"108\">deliberately “as small as possible”,</text><text x=\"516\" y=\"119\">not covering every edge case.</text>\n    </g>\n    <text x=\"310\" y=\"160\" font-size=\"9\" fill=\"var(--ink)\">Establish a standard. Then allow reasonable exceptions — architects break the rules whenever the standard has no good way to say the thing.</text>\n    <text x=\"310\" y=\"182\" font-size=\"8.6\" fill=\"var(--acc)\">The one near-universal convention: solid lines are synchronous, dotted lines are asynchronous.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
