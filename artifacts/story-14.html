.sheet::before,.sheet::after{content:"";position:absolute;width:11px;height:11px;border:1px solid var(--rule);pointer-events:none}
.sheet::before{top:6px;left:6px;border-right:0;border-bottom:0}
.sheet::after{bottom:6px;right:6px;border-left:0;border-top:0}

:root[data-theme="dark"] .btn.blue,:root:not([data-theme="light"]) .btn.blue{color:#08121A}

button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */
.sec{padding:clamp(20px,3vw,34px) clamp(16px,3vw,32px);border-top:1px solid var(--rule2)}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sechead .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc)}
.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}
.split{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);align-items:start}
@media(max-width:780px){.split{grid-template-columns:1fr}}

.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.body p{font-size:.96rem;line-height:1.6;max-width:70ch;color:var(--ink2)}
.body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.body li{font-size:.95rem;line-height:1.5;padding-left:15px;position:relative;max-width:70ch}
.body li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--acc)}

/* ---------- the book's own words ---------- */
.qs{display:flex;flex-direction:column;gap:10px}
.q{border-left:4px solid var(--acc);background:var(--chip);padding:13px 16px;
  display:flex;flex-direction:column;gap:7px}
.q .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.4rem);
  line-height:1.18;letter-spacing:.01em;text-wrap:balance}
.q .a{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--acc)}
.q .n{font-size:.9rem;line-height:1.55;color:var(--ink2);max-width:70ch}

/* ---------- decisions ---------- */
.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);
  display:flex;flex-direction:column}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;
  background:var(--ink);color:var(--sheet)}
.dec .top .tag{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

<script>
const D={"ch": "14", "book": "Chapter 14 · Service-Based Architecture Style", "pages": "pp. 209–226", "title": "The Pragmatic Distributed One", "gist": "A handful of coarse-grained domain services, a shared database, and none of the granularity problems. The cheapest way to be distributed — and the only distributed style that still gets ACID transactions.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#2E6480", "d": "#85BCD8"}, "minute": ["Separately deployed UI, **coarse-grained domain services** (keep it under about twelve), and — uniquely among distributed styles — an optional **monolithic database**.", "Because a service covers a whole domain, orchestration happens **inside** it, in classes, not across the network. That is what buys **ACID transactions**: an expired card rolls the whole order back in one commit.", "The price of coarse services: changing order placement means retesting and redeploying payment processing too, and there is more surface area to break.", "The database is the risk. A **single shared entity library** is an antipattern — one table change redeploys every service. Partition the database logically and give each partition its own library.", "No five-star ratings, and a lot of fours: **agility, testability, deployability, fault tolerance**, plus low cost and simplicity for a distributed style. Scalability three, elasticity two."], "sections": [{"t": "Topology: a distributed macro-layer", "art": "sb-topology", "wide": true, "alt": "A user interface above an optional API gateway above five coarse domain services sharing one database", "cap": "Fig. 14-1 · services deploy like monoliths would — containers optional, not required.", "items": ["Services are reached from the UI over **REST** usually, or messaging, RPC, an API layer, or SOAP. The UI typically embeds a **service locator**; that can also live in a gateway.", "Each domain service is usually **one instance**. Add more only where throughput or failover demands it — which then needs load balancing between UI and service.", "The **UI can be federated** too: one for customers placing orders, one for order packers, one for support. That raises scalability, fault tolerance and agility, and gives you real security separation.", "An **API gateway or reverse proxy** between UI and services is optional and useful: exposing services externally, consolidating metrics, security, auditing and service discovery, and load balancing multi-instance services."], "p": "Inside, a domain service is usually a small layered architecture — API façade, business, persistence — or partitioned into subdomains like a modular monolith. Whatever the design, it needs an **API access façade** that orchestrates the business request arriving from the UI."}, {"k": "decision", "t": "Expired card, halfway through an order", "art": "granularity", "wide": true, "alt": "One coarse service performing four operations in one transaction, beside four fine-grained services doing the same work across the network", "sit": "A customer places an order. The system must create the order, generate an ID, apply payment and update inventory. The card turns out to be expired.", "opts": [["One coarse OrderService doing all four internally.", "The whole thing is **one atomic transaction**. Standard rollback removes everything written so far, and the customer is told the payment failed. Database integrity is never in question.", 1], ["Four fine-grained services calling each other.", "OrderPlacement has already inserted the order and generated the ID before Payment rejects the card. The data is now inconsistent, and you owe a **compensating update** to put it back — plus an answer for what happens when *that* fails."]], "verdict": "This is the central trade of the style. Coarse services buy **ACID** where microservices get **BASE** (basic availability, soft state, eventual consistency) — service-based leverages traditional transactions better than any other distributed style. What you pay: change the order-placement logic and you must test and redeploy payment processing with it, because they ship together. More functionality per deployment means more that can break."}, {"k": "decision", "t": "Where do the entity objects live?", "art": "entity-libs", "wide": true, "alt": "A single shared entity library feeding every service, beside four domain-scoped libraries", "sit": "Services share a database, so they share the class files representing its table schemas — the entity objects, usually shipped as a JAR or DLL, sometimes carrying SQL too.", "opts": [["One shared library with all the entity objects.", "Any change to any table structure changes that library, which means changing and redeploying **every** service — whether or not it touches the altered table. Versioning helps a little; you still can't tell which services are affected without manual analysis. The chapter calls this an antipattern outright."], ["Partition the database logically; one library per partition.", "Common, customer, invoicing, order, tracking — five domains, five libraries. Change an invoicing table and only the services using `invoicing_entities_lib` are affected. Nothing else is retested or redeployed.", 1]], "verdict": "**Make the logical partitioning as fine-grained as you can while the data domains still make sense.** The `common` partition is the residual problem — every service uses it, so changing it needs coordination across all of them. A practical control: lock the common entity objects in version control and let only the database team change them, which both limits change and signals how significant those tables are."}, {"t": "Risks, governance and teams", "art": "sb-topology", "wide": true, "alt": "A user interface above an optional API gateway above five coarse domain services sharing one database", "cap": "Two failure modes, both about boundaries.", "items": ["**Too much interservice communication.** Normal in microservices, avoided here — domains should be independent, with coupling concentrated at the database. Heavy chatter means the domains were partitioned wrongly, or this is the wrong style for the problem.", "**Too many domain services.** The practical ceiling is about twelve. Past that, testing, deployment, monitoring, database connections and schema changes all start to hurt.", "**Governance**: check that changes don't span multiple domain services. If they routinely do, the boundaries are wrong. Where interservice calls exist, govern how many — orchestration should sit at the UI or gateway level, not between services.", "**Teams**: domain-partitioned, so align teams by domain. Technically organised teams (UI team, backend team, DB team) fit badly. Note the honest caveat about **enabling teams** — this style serves them less well than other distributed styles do, because the services are coarse; you recover some of it by identifying good components *inside* each service."], "p": "On cloud: it works well, and domain services are usually **containerised rather than serverless**, simply because their scope is too large for a function."}, {"t": "Characteristics, and when to reach for it", "wide": true, "alt": "Architecture characteristics ratings for the service-based style", "cap": "Fig. 14-8 · no fives. A great many fours, which is the whole argument for it.", "items": ["**Fault tolerance rates four** despite coarse services, because they are self-contained and largely avoid interservice calls. Going Green's Receiving service failing leaves the other six running.", "**Elasticity rates two** because scaling a coarse service replicates far more functionality than you needed — less efficient in machine resources than fine-grained services.", "**Quanta**: greater than or equal to one. Share a UI and database and the whole system is a single quantum; federate them and you get several. In the Going Green example the customer-facing side is one quantum, and internal operations — two UIs, several services, one shared database — is another."], "p": "A natural fit for **domain-driven design**, and a good choice when you want real modularity without taking on granularity and service-coordination problems. The book's own summary: more powerful distributed styles exist, but many companies find the power costs too much, and others find they never needed it — *like buying a Ferrari to sit in rush-hour traffic*.", "art": "_gen4"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 14: Service-Based Architecture Style, pp. 209–226.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"sb-topology": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"222\" y=\"20\" width=\"176\" height=\"30\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"180\" y=\"68\" width=\"260\" height=\"24\" stroke=\"var(--ink3)\" stroke-dasharray=\"6 4\"/>\n    <rect x=\"14\" y=\"112\" width=\"108\" height=\"42\"/><rect x=\"136\" y=\"112\" width=\"108\" height=\"42\"/>\n    <rect x=\"258\" y=\"112\" width=\"108\" height=\"42\"/><rect x=\"380\" y=\"112\" width=\"108\" height=\"42\"/>\n    <rect x=\"502\" y=\"112\" width=\"108\" height=\"42\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.1\">\n      <path d=\"M300 50 V68 M240 92 L120 112 M280 92 L200 112 M310 92 V112 M340 92 L420 112 M380 92 L540 112\"/>\n      <path d=\"M68 154 L280 182 M190 154 L292 182 M312 154 V182 M434 154 L332 182 M556 154 L344 182\"/>\n    </g>\n    <ellipse cx=\"312\" cy=\"192\" rx=\"66\" ry=\"10\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <path d=\"M246 192 v18 a66 10 0 0 0 132 0 v-18\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.4\">\n    <text x=\"310\" y=\"39\" font-size=\"9.4\" fill=\"var(--acc)\">user interface</text>\n    <text x=\"310\" y=\"84\" font-size=\"8.2\" fill=\"var(--ink2)\">optional API gateway / reverse proxy</text>\n    <g fill=\"var(--ink)\" font-size=\"8.6\">\n      <text x=\"68\" y=\"130\">Quoting</text><text x=\"190\" y=\"130\">Receiving</text><text x=\"312\" y=\"130\">Assessment</text>\n      <text x=\"434\" y=\"130\">Accounting</text><text x=\"556\" y=\"130\">Recycling</text>\n    </g>\n    <text x=\"68\" y=\"144\" font-size=\"7.4\" fill=\"var(--ink2)\">coarse-grained</text>\n    <text x=\"190\" y=\"144\" font-size=\"7.4\" fill=\"var(--ink2)\">domain service</text>\n    <text x=\"312\" y=\"197\" font-size=\"8.6\" fill=\"var(--acc)\">one shared database</text>\n    <text x=\"310\" y=\"228\" font-size=\"8.6\" fill=\"var(--ink)\">Distributed, and still able to use a monolithic database — no other style manages both.</text>\n  </g>\n</svg>", "granularity": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"46\" width=\"256\" height=\"98\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.3\">\n      <rect x=\"32\" y=\"66\" width=\"104\" height=\"24\"/><rect x=\"150\" y=\"66\" width=\"104\" height=\"24\"/>\n      <rect x=\"32\" y=\"102\" width=\"104\" height=\"24\"/><rect x=\"150\" y=\"102\" width=\"104\" height=\"24\"/>\n    </g>\n    <rect x=\"350\" y=\"46\" width=\"118\" height=\"34\"/><rect x=\"486\" y=\"46\" width=\"118\" height=\"34\"/>\n    <rect x=\"350\" y=\"110\" width=\"118\" height=\"34\"/><rect x=\"486\" y=\"110\" width=\"118\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M468 63 H486 M409 80 V110 M545 80 V110\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"14\" y=\"34\" text-anchor=\"start\" font-size=\"9.4\" fill=\"var(--acc)\">SERVICE-BASED — ONE COARSE SERVICE</text>\n    <text x=\"350\" y=\"34\" text-anchor=\"start\" font-size=\"9.4\" fill=\"var(--ink)\">MICROSERVICES — FOUR FINE ONES</text>\n    <g fill=\"var(--acc)\">\n      <text x=\"84\" y=\"81\">place order</text><text x=\"202\" y=\"81\">generate ID</text>\n      <text x=\"84\" y=\"117\">apply payment</text><text x=\"202\" y=\"117\">update inventory</text>\n    </g>\n    <g fill=\"var(--ink2)\">\n      <text x=\"409\" y=\"66\">OrderPlacement</text><text x=\"545\" y=\"66\">Payment</text>\n      <text x=\"409\" y=\"130\">Inventory</text><text x=\"545\" y=\"130\">Notification</text>\n    </g>\n    <text x=\"142\" y=\"170\" font-size=\"9\" fill=\"var(--acc)\">ACID — commit and roll back</text>\n    <text x=\"142\" y=\"186\" font-size=\"8.2\" fill=\"var(--ink2)\">expired card? the whole order</text>\n    <text x=\"142\" y=\"197\" font-size=\"8.2\" fill=\"var(--ink2)\">unwinds in one transaction</text>\n    <text x=\"477\" y=\"170\" font-size=\"9\" fill=\"var(--ink)\">BASE — eventual consistency</text>\n    <text x=\"477\" y=\"186\" font-size=\"8.2\" fill=\"var(--ink2)\">expired card? the order row already</text>\n    <text x=\"477\" y=\"197\" font-size=\"8.2\" fill=\"var(--ink2)\">exists. now write a compensating update.</text>\n    <text x=\"310\" y=\"220\" font-size=\"8.6\" fill=\"var(--ink)\">The price of ACID: change order placement and you retest and redeploy payment too.</text>\n  </g>\n</svg>", "entity-libs": "<svg viewBox=\"0 0 620 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"20\" y=\"34\" width=\"66\" height=\"26\"/><rect x=\"98\" y=\"34\" width=\"66\" height=\"26\"/>\n    <rect x=\"176\" y=\"34\" width=\"66\" height=\"26\"/><rect x=\"254\" y=\"34\" width=\"30\" height=\"26\"/>\n    <r const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
