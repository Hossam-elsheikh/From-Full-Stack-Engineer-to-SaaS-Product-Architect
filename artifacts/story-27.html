/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------

<script>
const D={"ch": "27", "book": "Chapter 27 · The Laws of Software Architecture, Revisited", "pages": "pp. 487–496", "title": "Only Trade-Offs, All The Way Down", "gist": "The three laws again, with the analysis method attached: two worked trade-off tables, the corollary about the trade-off you haven't found yet, and why weighting the criteria matters more than counting them.", "read": "4 min · 35 sec to re-scan", "acc": {"l": "#3F5B8A", "d": "#92AAD6"}, "minute": ["**The real job is analysing trade-offs**, not finding silver bullets. Build a reputation as an objective arbiter, not an evangelist — yesterday's best practice becomes tomorrow's antipattern, and evangelism ties your credibility to a decision that will age.", "The method: list the factors that matter **in this context**, score each option against each, then **weight them**. Counting pluses without weighting is the **Out of Context antipattern**.", "The hidden trade-off in code reuse: it needs **good abstraction *and* low volatility**. Architects find the first and miss the second — which is why frameworks reuse well and domain concepts never do.", "**You cannot have decoupling and high institutional reuse.** Reuse is implemented via coupling. The two are fundamentally incompatible, and organisations ask for both constantly.", "You can't do the analysis once. Dozens of variables, subtle differences pushing it either way — **trade-off analysis is the job, not a phase of it**."], "sections": [{"t": "The three laws", "art": "spectrum-3", "wide": true, "alt": "A spectrum from architecture to design with every real decision sitting somewhere in the middle", "cap": "Two decades of looking produced exactly three. That is the point of them.", "quotes": [["Everything in software architecture is a trade-off.", "First Law", "**Corollary 1** — if you think you've found something that isn't a trade-off, you just haven't identified it yet. **Corollary 2** — you can't run the analysis once and be done."], ["Why is more important than how.", "Second Law", "Every trade-off analysis generates a large amount of context that never appears in the solution. Document it — with diagrams *and* ADRs — or the next architect has to redo the whole analysis just to understand the result."], ["Most architecture decisions aren't binary but rather exist on a spectrum between extremes.", "Third Law · new in the 2nd edition", "This is why comprehensive definitions are so hard to write: architecture versus design, orchestration versus choreography, topics versus queues. **The decision criteria aren't binary; they lie on a messy spectrum.**"]], "p": "The third law also gives a usable definition of what makes something architectural: **a software architecture decision is one where each of the options has significant trade-offs.** If everything is a trade-off, then an architectural decision must involve real trade-offs on *every* option — not just one."}, {"k": "decision", "t": "Shared library, or shared service?", "art": "lib-vs-svc", "wide": true, "alt": "A shared service called at runtime beside a library compiled into each service, with a seven-factor trade-off table", "sit": "Common behaviour in a distributed architecture. Compile it into each service at build time as a **library**, or stand it up as a **service** other services call at runtime.", "opts": [["Shared library.", "**Versioning** resolves at compile time rather than runtime. **Change risk** is lower — once it compiles into the service you have real confidence. **Performance, fault tolerance and scalability** all favour it, because calls are in-process rather than across a network."], ["Shared service.", "**Heterogeneous code**: callers reach it over the network, so the implementation platform is irrelevant — with a library you need a version per stack and must keep them in sync. **High code volatility**: callers get new behaviour as soon as the service deploys, where a library means recompiling and redeploying every consumer."]], "verdict": "Five pluses to two says library — **and that count is the trap**. Imagine a team with code in several platforms, unconcerned with performance or scale, wanting a clean way to manage shared behaviour. Now the first two criteria outweigh everything below them and **the service is correct**. That is the **Out of Context antipattern**: understanding the trade-offs but not how to weight them for the situation in front of you. *Generic trade-off analysis isn't very useful; it only becomes valuable applied in a specific context.*"}, {"k": "decision", "t": "Queue, or topic?", "art": "queue-vs-topic", "wide": true, "alt": "A trading service writing to three separate queues, beside the same service publishing to one topic", "sit": "The Trading service must send trade information to Notification and Analytics. One queue per consumer, or one topic everyone subscribes to?", "opts": [["Queues.", "Each consumer can receive a **different message**, tailored to what it needs. Each queue is **monitored and scaled independently**. And it's **more secure** — the sender knows exactly who it talks to, making it harder for a rogue service to listen in. **Cost:** tight coupling. Adding a Compliance service means reworking Trading to write to a third queue."], ["A topic.", "Extremely **extensible** — a compliance consumer subscribes without touching any existing behaviour, and the publisher neither knows nor cares who consumes. One message sent, low coupling. **Cost:** every consumer gets the *same* message, which invites **stamp coupling**, and everyone can read all of it, which is a security question. No per-consumer monitoring or scaling."]], "verdict": "Then go back to the **organisational goals**. If security is the priority, queues. If the company is growing fast and other services will want trade data, extensibility wins and the answer is topics. Same analysis, opposite conclusions, and the deciding input was never technical."}, {"t": "The trade-off people miss in reuse", "art": "reuse-tradeoff", "alt": "Two overlapping circles — good abstraction and low volatility — with reuse working only in the intersection", "cap": "Two factors govern whether reuse works. Architects reliably find one of them.", "p": "**Abstraction** is the factor everyone checks: can this be abstracted and called from several places? **Low volatility** is the one that gets missed. Reuse a module that changes constantly and you create churn across the whole system — every change forces every caller to coordinate, and even non-breaking changes must be verified everywhere.", "items": ["This is precisely what orchestration-driven SOA taught the field. Teams working in those architectures were *swimming through quicksand*: every change had the potential to send unpredictable side effects rippling out.", "Which is why the most successful reuse targets are **plumbing** — frameworks, libraries, platforms. The fastest-changing part of most applications is the **domain**, which makes domain concepts terrible reuse candidates.", "And it is the mechanism underneath DDD's bounded context: **no bounded context may reuse another's implementation details.**"], "quotes": [["We like microservices because they allow high agility and fast deployment. However, we also want a high degree of institutional reuse so teams aren't constantly rewriting code.", "What clients ask for", "You cannot have both. **The way a system implements reuse is via coupling.** No organisation gets decoupling and high reuse at once; they are fundamentally incompatible — and this is the single most common misunderstanding of a key trade-off."]]}, {"t": "Parting advice", "art": "spectrum-3", "wide": true, "alt": "A spectrum from architecture to design with every real decision sitting somewhere in the middle", "cap": "Architects rarely get credit for good decisions, and always get blamed for bad ones.", "p": "Two reasons to be an arbiter rather than an advocate. First, **evangelism is dangerous long-term**: decisions made soundly with incomplete knowledge get weakened by an ecosystem in constant churn, and social capital spent evangelising is credibility lost when the decision has to change. Second, decision makers aren't looking for enthusiastic advocacy — they want **sober objectivity**, and the architect known for it becomes the person they trust when the decision matters.", "quotes": [["How do we get great designers? Great designers design, of course.", "Fred Brooks", ""], ["So how are we supposed to get great architects, if they only get the chance to architect fewer than a half-dozen times in their career?", "Ted Neward", "The answer the book offers is **architecture katas**, on its companion site. There is no answer guide — the authors tried keeping students' solutions and gave up, because the drawings captured *how* each team solved it and the trade-offs they weighed were never written down. **Keeping only the how meant they had half the story.**"], ["There are no right or wrong answers in architecture — only trade-offs.", "Neal Ford", ""]], "items": ["**We make decisions in a swamp of uncertainty.** Often on incomplete information — and even with complete information the answer would still sit somewhere on a spectrum rather than at one end.", "Their closing instruction, in full: **always learn, always practise, and go do some architecture.**"]}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 27: The Laws of Software Architecture, Revisited, pp. 487–496. The final chapter of the book.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"spectrum-3": "<svg viewBox=\"0 0 620 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <path d=\"M60 84 H560\"/>\n    <path d=\"M60 76 v16 M560 76 v16 M185 78 v12 M310 78 v12 M435 78 v12\"/>\n    <path d=\"M368 84 l-10 -16 h20 z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\">\n    <text x=\"60\" y=\"110\" text-anchor=\"middle\" fill=\"var(--ink)\">architecture</text>\n    <text x=\"560\" y=\"110\" text-anchor=\"middle\" fill=\"var(--ink)\">design</text>\n    <text x=\"368\" y=\"54\" text-anchor=\"middle\" fill=\"var(--acc)\">every real decision</text>\n    <text x=\"310\" y=\"146\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"var(--ink)\">A software architecture decision is one where each of the options has significant trade-offs.</text>\n    <text x=\"310\" y=\"172\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--acc)\">Don't reduce decisions to binaries. Few of them are — which is why the answer is always “it depends”.</text>\n  </g>\n</svg>", "lib-vs-svc": "<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"34\" width=\"76\" height=\"26\"/><rect x=\"102\" y=\"34\" width=\"76\" height=\"26\"/>\n    <rect x=\"58\" y=\"86\" width=\"76\" height=\"26\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M52 60 L82 86 M140 60 L112 86\"/></g>\n    <path d=\"M212 30 V120\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <rect x=\"238\" y=\"34\" width=\"76\" height=\"26\"/><rect x=\"326\" y=\"34\" width=\"76\" height=\"26\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\">\n      <rect x=\"246\" y=\"42\" width=\"60\" height=\"10\"/><rect x=\"334\" y=\"42\" width=\"60\" height=\"10\"/>\n    </g>\n    <path d=\"M6 148 H614\" stroke=\"var(--rule)\"/>\n    <path d=\"M6 176 H614 M6 204 H614\" stroke=\"var(--rule2)\"/>\n    <path d=\"M420 130 V240\" stroke=\"var(--rule)\"/><path d=\"M516 130 V240\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8\">\n    <text x=\"96\" y=\"24\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--acc)\">SHARED SERVICE</text>\n    <text x=\"320\" y=\"24\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--ink)\">SHARED LIBRARY</text>\n    <text x=\"96\" y=\"103\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"var(--acc)\">called at runtime</text>\n    <text x=\"320\" y=\"74\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"var(--acc)\">compiled in at build time</text>\n    <g font-size=\"8.6\" fill=\"var(--ink3)\" letter-spacing=\"1.2\">\n      <text x=\"6\" y=\"142\">FACTOR</text><text x=\"468\" y=\"142\" text-anchor=\"middle\">LIBRARY</text><text x=\"565\" y=\"142\" text-anchor=\"middle\">SERVICE</text>\n    </g>\n    <g font-size=\"8.6\" fill=\"var(--ink)\">\n      <text x=\"6\" y=\"164\">heterogeneous code · high code volatility</text>\n      <text x=\"6\" y=\"192\">versioning · change risk</text>\n      <text x=\"6\" y=\"220\">performance · fault tolerance · scalability</text>\n    </g>\n    <g font-size=\"12\" text-anchor=\"middle\">\n      <text x=\"468\" y=\"166\" fill=\"var(--ink2)\">−</text><text x=\"565\" y=\"166\" fill=\"var(--acc)\">+</text>\n      <text x=\"468\" y=\"194\" fill=\"var(--acc)\">+</text><text x=\"565\" y=\"194\" fill=\"var(--ink2)\">−</text>\n      <text x=\"468\" y=\"222\" fill=\"var(--acc)\">+</text><text x=\"565\" y=\"222\" fill=\"var(--ink2)\">−</text>\n    </g>\n    <text x=\"6\" y=\"244\" font-size=\"8.4\" fill=\"var(--acc)\">Five pluses to two — unless the team is polyglot, in which case the top row outweighs everything below it.</text>\n  </g>\n</svg>", "queue-vs-topic": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"66\" width=\"74\" height=\"30\"/>\n    <rect x=\"130\" y=\"34\" width=\"44\" height=\"20\"/><rect x=\"130\" y=\"72\" width=\"44\" height=\"20\"/><rect x=\"130\" y=\"110\" width=\"44\" height=\"20\"/>\n    <rect x=\"212\" y=\"34\" width=\"76\" height=\"20\"/><rect x=\"212\" y=\"72\" width=\"76\" height=\"20\"/><rect x=\"212\" y=\"110\" width=\"76\" height=\"20\"/>\n    <g stroke=\"var(--ink)\" stroke-width=\"1.3\"><path d=\"M88 76 L130 44 M88 81 L130 82 M88 88 L130 120 M174 44 H212 M174 82 H212 M174 120 H212\"/></g>\n    <path d=\"M320 24 V150\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <rect x=\"346\" y=\"66\" width=\"74\" height=\"30\"/>\n    <rect x=\"452\" y=\"60\" width=\"52\" height=\"42\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"540\" y=\"34\" width=\"70\" height=\"20\"/><rect x=\"540\" y=\"72\" width=\"70\" height=\"20\"/><rect x=\"540\" y=\"110\" width=\"70\" height=\"20\"/>\n    <path d=\"M420 81 H452\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.2\"><path d=\"M504 72 L540 44 M504 81 H540 M504 92 L540 120\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"7.6\">\n    <text x=\"51\" y=\"85\" text-anchor=\"middle\" fill=\"var(--ink2)\">Trading</text>\n    <text x=\"152\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink2)\">queue</text>\n    <text x=\"152\" y=\"85\" text-anchor=\"middle\" fill=\"var(--ink2)\">queue</text>\n    <text x=\"152\" y=\"123\" text-anchor=\"middle\" fill=\"var(--ink2)\">queue</text>\n    <text x=\"383\" y=\"85\" text-anchor=\"middle\" fill=\"var(--ink2)\">Trading</text>\n    <text x=\"478\" y=\"84\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--acc)\">topic</text>\n    <text x=\"14\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">QUEUES — POINT TO POINT</text>\n    <text x=\"346\" y=\"24\" font-size=\"9\" fill=\"var(--acc)\">TOPIC — BROADCAST</text>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"14\" y=\"176\">+ different message per consumer</text>\n      <text x=\"14\" y=\"190\">+ monitor and scale each queue</text>\n      <text x=\"14\" y=\"204\">+ more secure — nobody listens in</text>\n      <text x=\"14\" y=\"222\">− tight coupling · a new consumer means reworking Trading</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--acc)\">\n      <text x=\"346\" y=\"176\">+ low coupling · one message sent</text>\n      <text x=\"346\" y=\"190\">+ add a consumer without touching anything</text>\n      <text x=\"346\" y=\"204\">− everyone reads the same message — stamp coupling</text>\n      <text x=\"346\" y=\"222\">− and everyone can read all of it. can't scale one consumer.</text>\n    </g>\n  </g>\n</svg>", "reuse-tradeoff": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <circle cx=\"112\" cy=\"96\" r=\"62\" stroke=\"var(--acc)\" stroke-width=\"1.8\" fill=\"var(--accBg)\"/>\n    <circle cx=\"188\" cy=\"96\" r=\"62\" stroke=\"var(--acc)\" stroke-width=\"1.8\" fill=\"var(--accBg)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.4\">\n    <text x=\"76\" y=\"94\" fill=\"var(--ink)\">good</text>\n    <text x=\"76\" y=\"106\" fill=\"var(--ink)\">abstraction</text>\n    <text x=\"224\" y=\"94\" fill=\"var(--ink)\">low</text>\n    <text x=\"224\" y=\"106\" fill=\"var(--ink)\">volatility</text>\n    <text x=\"150\" y=\"90\" font-size=\"8\" fill=\"var(--acc)\">reuse</text>\n    <text x=\"150\" y=\"102\" font-size=\"8\" fill=\"var(--acc)\">works</text>\n    <text x=\"150\" y=\"180\" fill=\"var(--ink)\">Architects find the first factor and miss the second.</text>\n    <text x=\"150\" y=\"196\" fill=\"var(--acc)\">Frameworks and platforms sit in the overlap. Domain concepts never do —</text>\n    <text x=\"150\" y=\"208\" fill=\"var(--acc)\">the domain is the fastest-changing part of any system.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
