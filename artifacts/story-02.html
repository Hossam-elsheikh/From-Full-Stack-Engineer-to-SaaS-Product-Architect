/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */
.sec{padding:clamp(20px,3vw,34px) clamp(16px,3vw,32px);border-top:1px solid var(--rule2)}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sechead .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc)}
.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}
.split{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);align-items:start}
@media(max-width:780px){.split{grid-template-columns:1fr}}
.sec.wide .split{grid-template-columns:1fr}

  padding:9px 13px;border-top:1px solid var(--rule);background:var(--sheet)}
.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.body p{font-size:.96rem;line-height:1.6;max-width:70ch;color:var(--ink2)}
.body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.body li{font-size:.95rem;line-height:1.5;padding-left:15px;position:relative;max-width:70ch}
.body li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--acc)}

/* ---------- the book's own words ---------- */
.qs{display:flex;flex-direction:column;gap:10px}
.q{border-left:4px solid var(--acc);background:var(--chip);padding:13px 16px;
  display:flex;flex-direction:column;gap:7px}
.q .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.4rem);
  line-height:1.18;letter-spacing:.01em;text-wrap:balance}
.q .a{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--acc)}
.q .n{font-size:.9rem;line-height:1.55;color:var(--ink2);max-width:70ch}

/* ---------- decisions ---------- */
.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);
  display:flex;flex-direction:column}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;
  background:var(--ink);color:var(--sheet)}
.dec .top .tag{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

design is about appearance. The awkward cases (break this service apart? which UI framework?) sit in the middle, and these three questions are how you place them.", "quotes": [["Architecture is the stuff that's hard to change.", "Martin Fowler · “Who Needs an Architect?”", "The level-of-effort test in one line. Monolith to microservices is architecture; rearranging fields on a screen is design."]]}, {"t": "The knowledge pyramid", "art": "pyramid", "alt": "A triangle in three bands: stuff you know at the apex, stuff you know you don't know, and the large base of stuff you don't know you don't know", "cap": "Fig. 2-2 · all technical knowledge, in three bands. The bottom one is the biggest by far.", "items": ["**Stuff you know** — what you use daily and are expert in. The smallest band, because nobody can be expert at everything.", "**Stuff you know you don't know** — heard of it, know roughly what it is, couldn't write it. Much larger, because familiarity is cheap.", "**Stuff you don't know you don't know** — the biggest band, and the one that hurts. It contains the perfect solution to your current problem."], "p": "The career move is to promote things up one band at a time: from the bottom into the middle by hearing about them, and from the middle to the top only when expertise is actually needed."}, {"t": "The pyramid changes shape when you become an architect", "art": "pyramid-shift", "alt": "Two pyramids: a developer's with a deep narrow top, an architect's with a shallower top and a much deeper middle band", "cap": "Figs. 2-3 to 2-5 · sacrifice some hard-won expertise, buy a wider middle.", "p": "The top band is not free to keep — expertise in Ruby on Rails does not survive two years of ignoring Ruby on Rails. Developers spend a career growing the top; architects deliberately trade some of it for breadth, because it is worth more to know that five solutions exist than to be expert in one. Some depth stays, usually in whatever you enjoy; the rest usefully atrophies.", "items": ["**Dysfunction one** — trying to hold expertise in everything. You succeed at none of it and work yourself ragged.", "**Dysfunction two** — **stale expertise**: the mistaken sensation that your outdated information is still cutting edge. Common in founders who moved into leadership and still decide on ancient criteria."]}, {"k": "decision", "t": "“But what if we lose Italy?”", "art": "hickey", "alt": "Two rows of ledgers — benefits filled in both, trade-offs empty for the programmer and filled for the architect", "sit": "An architect on the review board blocks every centralised design with the same question. Years ago a freak communication failure cut headquarters off from the stores in Italy for a day. The chance of it recurring is very small. The question comes up every time.", "opts": [["Design for it. It's cheap insurance.", "You are now buying an availability characteristic on every system because of one incident, and nobody prices a requirement that was never questioned."], ["Assess whether the risk is real, then decide.", "Risk assessment is genuinely part of the job — it just has to be realistic. Telling genuine technical risk from perceived technical risk is the skill being tested.", 1], ["Overrule it and move on.", "You won the meeting and learned nothing about whether the risk was real. It will be back next quarter."]], "verdict": "The **Frozen Caveman antipattern**: reverting to a pet irrational concern on every architecture, usually because you were burned by one in the past. Worth watching for in yourself — thinking like an architect means noticing when the question you always ask is about your history rather than about this system."}, {"t": "Twenty minutes, before anything else", "art": "twenty", "alt": "A day timeline with a twenty-minute block at the start and crossed-out blocks at lunch and evening", "cap": "Fig. 2-6 · the slot survives only where nothing has started yet.", "p": "Twenty minutes a day on something new — a buzzword looked up, a Refcard, InfoQ, the Thoughtworks Technology Radar — promotes things from *don't know you don't know* into *know you don't know*. Most people schedule it at lunch or after work; both fail. Lunch becomes catching up on work, and evenings have families in them. Take it first thing, with the coffee, **before you open email** — once email is open, the day has started and the morning is gone."}, {"t": "Build a personal radar", "art": "radar", "wide": true, "alt": "A radar of four concentric rings — hold, assess, trial, adopt — divided into four quadrants", "cap": "Fig. 2-7 · four quadrants, four rings. The rings run outside-in: hold, assess, trial, adopt.", "p": "Get invested enough in one technology and you end up in a memetic bubble — everyone inside cares about it as much as you do, honest outside appraisals never reach you, and there is no warning before it collapses. One of the authors watched exactly that happen to Clipper. A radar is the antidote: a living document that forces you to place things.", "items": ["**Hold** — don't start anything new with it. For personal use, also the place for habits you're trying to break and low-value information streams.", "**Assess** — worth exploring: a spike, a research project, a conference session. A staging area for future research.", "**Trial** — worth pursuing now, on a low-risk project, until you understand it well enough to put it in a trade-off analysis.", "**Adopt** — what you're most excited about and your current best answer for a class of problem.", "Treat the portfolio like a financial one: **diversify**. Some skills widely in demand and tracked, plus a couple of gambits. The conversation the radar forces is worth more than the diagram it produces."]}, {"t": "“It depends” is the honest answer", "art": "hickey", "alt": "Two rows of ledgers — benefits filled in both, trade-offs empty for the programmer and filled for the architect", "cap": "Everyone can list the benefits. The second column is the job.", "quotes": [["Architecture is the stuff you can't Google or ask an LLM about.", "Mark Richards", "Not because the tools are weak, but because the answer depends on deployment environment, business drivers, culture, budget, timeframe and the skills of the people who will build it."], ["There are no right or wrong answers in architecture — only trade-offs.", "Neal Ford", ""], ["Programmers know the benefits of everything and the trade-offs of nothing. Architects need to understand both.", "Rich Hickey", "The practical instruction in this chapter: having found the obvious answer, go and look for what it costs. If you can't find anything, you haven't looked hard enough — that's the First Law's first corollary again."]]}, {"k": "decision", "t": "One topic, or three queues?", "art": "topic-queue", "alt": "A producer publishing to one topic feeding three consumers, above a producer writing to three separate queues", "sit": "An item-auction system. A **Bid Producer** sends every bid to three services — capture, tracking and analytics. Asynchronous either way. A single topic in publish-and-subscribe, or three queues point-to-point?", "opts": [["One topic, publish-and-subscribe.", "**For:** the producer holds one connection, and adding a Bid History service later needs no change to any existing service or to the infrastructure — it just subscribes. The producer never learns who consumes it. **Against:** a topic is easy to wiretap, every consumer must accept the *same* contract, and you can't see queue depth, so you can't autoscale on it."], ["Three queues, point-to-point.", "**For:** each consumer gets its own contract and its own channel; a rogue listener steals messages, so the loss is noticed immediately; each queue is monitorable, so consumers scale independently. **Against:** the producer holds three connections, and Bid History means a new queue *and* a change to the producer."]], "verdict": "**It depends** — and here that is the answer, not a dodge. Extensibility and decoupling on one side; security, heterogeneous contracts and programmatic scaling on the other. An auction house under a compliance regime answers differently from a startup shipping a new consumer every month. Note too that the trade-off is partly technology-specific: AMQP's split between an exchange and a queue recovers the monitoring advantage."}, {"k": "decision", "t": "Which code does the architect own?", "art": "bottleneck", "alt": "Work from a team funnelling through a single narrow point labelled you", "sit": "You believe architects should code, and you want to stay hands-on. The framework and the trickiest parts of the system are the interesting code, and you understand them best. You are also not a full-time developer — you have diagrams and meetings and more meetings.", "opts": [["Own the framework and the critical path.", "The **Bottleneck Trap**. Everything the team needs routes through the one person who cannot give it full time, and the team's progress becomes your calendar."], ["Delegate the critical path; code a minor feature one to three iterations out.", "You write production code without blocking anyone, the hard parts land with the team who should own them, and — most valuable — you feel the same build, test and deploy pain the team feels every day.", 1], ["Stop coding and stay in the diagrams.", "Depth erodes, and so does credibility with the people implementing your decisions."]], "verdict": "The point of coding is not the code. It is that an architect who ships nothing stops noticing what their decisions cost the people who do."}, {"t": "Five ways to stay hands-on", "art": "handson", "wide": true, "alt": "Five labelled routes to keeping hands-on: proofs of concept, technical debt, bug fixes, automation, code reviews", "cap": "When you can't get into the iteration with the team, these are the fallbacks.", "p": "On proofs of concept, one warning: write them at production quality. Throwaway POC code has a habit of landing in the repository and becoming the reference example everyone copies — and sloppy POCs are also just practice at writing badly. Automation counts double here, because fitness functions that check architectural compliance are code *and* governance at the same time (Ch. 6)."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 2: Architectural Thinking, pp. 17–36. Quotations are the book's; the decision scenarios are worked from the situations the chapter describes.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"spectrum-ad": "<svg viewBox=\"0 0 620 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <rect x=\"150\" y=\"20\" width=\"232\" height=\"176\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M8 52 H612\" stroke=\"var(--rule)\"/>\n    <path d=\"M8 100 H612 M8 148 H612\" stroke=\"var(--rule2)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <g font-size=\"10.5\" letter-spacing=\"1.6\" text-anchor=\"middle\">\n      <text x=\"266\" y=\"40\" fill=\"var(--acc)\">ARCHITECTURE</text>\n      <text x=\"497\" y=\"40\" fill=\"var(--ink)\">DESIGN</text>\n    </g>\n    <g font-size=\"9.6\" fill=\"var(--ink)\" text-anchor=\"end\">\n      <text x=\"140\" y=\"76\">how strategic?</text>\n      <text x=\"140\" y=\"124\">level of effort?</text>\n      <text x=\"140\" y=\"172\">trade-offs?</text>\n    </g>\n    <g font-size=\"9.2\" fill=\"var(--ink2)\">\n      <text x=\"162\" y=\"72\">weeks of planning, many</text><text x=\"162\" y=\"86\">stakeholders, long-term</text>\n      <text x=\"394\" y=\"72\">minutes, alone,</text><text x=\"394\" y=\"86\">changes again soon</text>\n      <text x=\"162\" y=\"120\">hard to change — layered</text><text x=\"162\" y=\"134\">monolith to microservices</text>\n      <text x=\"394\" y=\"120\">easy — rearrange</text><text x=\"394\" y=\"134\">fields on a screen</text>\n      <text x=\"162\" y=\"168\">significant — scale bought</text><text x=\"162\" y=\"182\">with complexity and cost</text>\n      <text x=\"394\" y=\"168\">minor — one more</text><text x=\"394\" y=\"182\">class to manage</text>\n    </g>\n    <text x=\"310\" y=\"14\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink3)\">most real decisions land somewhere between the two columns</text>\n  </g>\n</svg>", "pyramid": "<svg viewBox=\"0 0 346 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\">\n    <path d=\"M100 18 L180 202 H20 Z\"/>\n    <path d=\"M69 90 H131\" />\n    <path d=\"M45 148 H155\"/>\n    <path d=\"M100 18 L131 90 L69 90 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M120 56 H186\"/><path d=\"M138 120 H186\"/><path d=\"M160 176 H186\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\">\n    <text x=\"190\" y=\"52\" fill=\"var(--acc)\">stuff you know</text>\n    <text x=\"190\" y=\"64\" fill=\"var(--ink2)\">your depth — and it</text>\n    <text x=\"190\" y=\"75\" fill=\"var(--ink2)\">decays if you stop</text>\n    <text x=\"190\" y=\"116\" fill=\"var(--ink)\">stuff you know</text>\n    <text x=\"190\" y=\"128\" fill=\"var(--ink)\">you don't know</text>\n    <text x=\"190\" y=\"140\" fill=\"var(--ink2)\">heard of it, can't</text>\n    <text x=\"190\" y=\"151\" fill=\"var(--ink2)\">write it — your breadth</text>\n    <text x=\"190\" y=\"180\" fill=\"var(--ink)\">stuff you don't know</text>\n    <text x=\"190\" y=\"192\" fill=\"var(--ink)\">you don't know</text>\n    <text x=\"190\" y=\"204\" fill=\"var(--ink2)\">where the answer to</text>\n    <text x=\"190\" y=\"215\" fill=\"var(--ink2)\">your problem is hiding</text>\n    <text x=\"8\" y=\"232\" font-size=\"8.6\" fill=\"var(--ink2)\">the goal is to move things up one band, not two</text>\n  </g>\n</svg>", "pyramid-shift": "<svg viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <path d=\"M70 24 L130 160 H10 Z\"/>\n    <path d=\"M52 66 H88\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <path d=\"M70 24 L88 66 L52 66 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M31 113 H109\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n\n    <path d=\"M230 24 L290 160 H170 Z\"/>\n    <path d=\"M222 48 H238\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <path d=\"M230 24 L238 48 L222 48 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M191 145 H269\" stroke=\"var(--acc)\" stroke-width=\"1.4\"/>\n    <path d=\"M222 48 L269 145 H191 L238 48 Z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".55\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"70\" y=\"178\" font-size=\"10.5\" fill=\"var(--ink)\">DEVELOPER</text>\n    <text x=\"70\" y=\"192\" font-size=\"8.6\" fill=\"var(--ink2)\">deep top, and it</text>\n    <text x=\"70\" y=\"203\" font-size=\"8.6\" fill=\"var(--ink2)\">costs time to hold</text>\n    <text x=\"230\" y=\"178\" font-size=\"10.5\" fill=\"var(--acc)\">ARCHITECT</text>\n    <text x=\"230\" y=\"192\" font-size=\"8.6\" fill=\"var(--ink2)\">some depth traded</text>\n    <text x=\"230\" y=\"203\" font-size=\"8.6\" fill=\"var(--ink2)\">for a wider middle</text>\n    <text x=\"150\" y=\"96\" font-size=\"14\" fill=\"var(--ink3)\">→</text>\n  </g>\n</svg>", "hickey": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <rect x=\"66\" y=\"30\" width=\"106\" height=\"58\"/>\n    <rect x=\"182\" y=\"30\" width=\"106\" height=\"58\" stroke-dasharray=\"5 4\" stroke=\"var(--ink3)\"/>\n    <rect x=\"66\" y=\"110\" width=\"106\" height=\"58\"/>\n    <rect x=\"182\" y=\"110\" width=\"106\" height=\"58\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M78 46 h82 M78 58 h82 M78 70 h60\"/>\n      <path d=\"M78 126 h82 M78 138 h82 M78 150 h60\"/>\n    </g>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.1\">\n      <path d=\"M194 126 h82 M194 138 h82 M194 150 h64\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\">\n    <text x=\"119\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\">BENEFITS</text>\n    <text x=\"235\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\">TRADE-OFFS</text>\n    <text x=\"60\" y=\"62\" text-anchor=\"end\" fill=\"var(--ink2)\">programmer</text>\n    <text x=\"60\" y=\"142\" text-anchor=\"end\" fill=\"var(--acc)\">architect</text>\n    <text x=\"235\" y=\"63\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink3)\">—</text>\n    <text x=\"150\" y=\"190\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink2)\">the empty cell is where the surprises come from</text>\n  </g>\n</svg>", "twenty": "<svg viewBox=\"0 0 300 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <path d=\"M20 92 H286\"/>\n    <path d=\"M278 88 l8 4 l-8 4\"/>\n    <rect x=\"20\" y=\"76\" width=\"26\" height=\"32\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <rect x=\"128\" y=\"80\" width=\"34\" height=\"24\"/><rect x=\"220\" y=\"80\" width=\"34\" height=\"24\"/>\n      <path d=\"M128 80 l34 24 M162 80 l-34 24 M220 80 l34 24 M254 80 l-34 24\"/>\n    </g>\n    <path d=\"M62 92 v-1\" />\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\" text-anchor=\"middle\">\n    <text x=\"33\" y=\"66\" fill=\"var(--acc)\" font-size=\"10\">20 MIN</text>\n    <text x=\"33\" y=\"126\" fill=\"var(--acc)\">first thing,</text>\n    <text x=\"33\" y=\"137\" fill=\"var(--acc)\">before email</text>\n    <text x=\"145\" y=\"126\" fill=\"var(--ink2)\">lunch — you</text>\n    <text x=\"145\" y=\"137\" fill=\"var(--ink2)\">work through it</text>\n    <text x=\"237\" y=\"126\" fill=\"var(--ink2)\">evening — family,</text>\n    <text x=\"237\" y=\"137\" fill=\"var(--ink2)\">plans, exhaustion</text>\n    <text x=\"153\" y=\"172\" fill=\"var(--ink2)\">the slot only survives if nothing has started yet</text>\n    <text x=\"286\" y=\"108\" fill=\"var(--ink3)\" text-anchor=\"end\">the day</text>\n  </g>\n</svg>", "radar": "<svg viewBox=\"0 0 620 300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\">\n    <circle cx=\"310\" cy=\"152\" r=\"132\" stroke=\"var(--rule)\"/>\n    <circle cx=\"310\" cy=\"152\" r=\"99\" stroke=\"var(--rule)\"/>\n    <circle cx=\"310\" cy=\"152\" r=\"66\" stroke=\"var(--rule)\"/>\n    <circle cx=\"310\" cy=\"152\" r=\"33\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <path d=\"M178 152 H442 M310 20 V284\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <g fill=\"var(--ink)\" stroke=\"none\">\n      <circle cx=\"286\" cy=\"138\" r=\"3.4\"/><circle cx=\"332\" cy=\"166\" r=\"3.4\"/>\n      <circle cx=\"262\" cy=\"120\" r=\"3.4\"/><circle cx=\"358\" cy=\"190\" r=\"3.4\"/>\n      <circle cx=\"230\" cy=\"196\" r=\"3.4\"/><circle cx=\"388\" cy=\"104\" r=\"3.4\"/>\n      <circle cx=\"352\" cy=\"88\" r=\"3.4\"/><circle cx=\"252\" cy=\"222\" r=\"3.4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <g font-size=\"9\" fill=\"var(--ink2)\" text-anchor=\"middle\">\n      <text x=\"310\" y=\"155\" fill=\"var(--acc)\">ADOPT</text>\n      <text x=\"310\" y=\"105\">TRIAL</text>\n      <text x=\"310\" y=\"72\">ASSESS</text>\n      <text x=\"310\" y=\"39\">HOLD</text>\n    </g>\n    <g font-size=\"10\" fill=\"var(--ink)\">\n      <text x=\"8\" y=\"24\">TECHNIQUES</text>\n      <text x=\"612\" y=\"24\" text-anchor=\"end\">TOOLS</text>\n      <text x=\"8\" y=\"292\">LANGUAGES &amp; FRAMEWORKS</text>\n      <text x=\"612\" y=\"292\" text-anchor=\"end\">PLATFORMS</text>\n    </g>\n    <g font-size=\"8.6\" fill=\"var(--ink2)\">\n      <text x=\"8\" y=\"38\">practices, processes,</text><text x=\"8\" y=\"49\">engineering advice</text>\n      <text x=\"612\" y=\"38\" text-anchor=\"end\">IDEs through to</text><text x=\"612\" y=\"49\" text-anchor=\"end\">integration tooling</text>\n      <text x=\"8\" y=\"278\">libraries and languages,</text><text x=\"8\" y=\"267\">usually open source</text>\n      <text x=\"612\" y=\"278\" text-anchor=\"end\">databases, cloud,</text><text x=\"612\" y=\"267\" text-anchor=\"end\">operating systems</text>\n    </g>\n  </g>\n</svg>", "topic-queue": "<svg viewBox=\"0 0 300 260\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"8\" y=\"42\" width=\"58\" height=\"26\"/>\n    <rect x=\"102\" y=\"42\" width=\"52\" height=\"26\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M66 55 H102\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <rect x=\"200\" y=\"14\" width=\"86\" height=\"22\"/><rect x=\"200\" y=\"44\" width=\"86\" height=\"22\"/>\n    <rect x=\"200\" y=\"74\" width=\"86\" height=\"22\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M154 55 L200 25 M154 55 H200 M154 55 L200 85\"/></g>\n\n    <path d=\"M8 122 H292\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n\n    <rect x=\"8\" y=\"180\" width=\"58\" height=\"26\"/>\n    <rect x=\"102\" y=\"146\" width=\"52\" height=\"20\"/><rect x=\"102\" y=\"182\" width=\"52\" height=\"20\"/>\n    <rect x=\"102\" y=\"218\" width=\"52\" height=\"20\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\"><path d=\"M66 188 L102 156 M66 191 L102 192 M66 196 L102 226\"/></g>\n    <rect x=\"200\" y=\"146\" width=\"86\" height=\"20\"/><rect x=\"200\" y=\"182\" width=\"86\" height=\"20\"/>\n    <rect x=\"200\" y=\"218\" width=\"86\" height=\"20\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M154 156 H200 M154 192 H200 M154 228 H200\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8\" text-anchor=\"middle\">\n    <text x=\"150\" y=\"10\" font-size=\"9.6\" fill=\"var(--acc)\">ONE TOPIC · PUB-SUB</text>\n    <text x=\"37\" y=\"58\">producer</text><text x=\"128\" y=\"58\" fill=\"var(--acc)\">topic</text>\n    <text x=\"243\" y=\"28\">capture</text><text x=\"243\" y=\"58\">tracking</text><text x=\"243\" y=\"88\">analytics</text>\n    <text x=\"150\" y=\"108\" fill=\"var(--ink2)\">one connection · new consumer costs nothing</text>\n    <text x=\"150\" y=\"140\" font-size=\"9.6\" fill=\"var(--ink)\">THREE QUEUES · POINT-TO-POINT</text>\n    <text x=\"37\" y=\"196\">producer</text>\n    <text x=\"128\" y=\"160\">queue</text><text x=\"128\" y=\"196\">queue</text><text x=\"128\" y=\"232\">queue</text>\n    <text x=\"243\" y=\"160\">capture</text><text x=\"243\" y=\"196\">tracking</text><text x=\"243\" y=\"232\">analytics</text>\n    <text x=\"150\" y=\"254\" fill=\"var(--ink2)\">three connections · own contract, own scaling</text>\n  </g>\n</svg>", "bottleneck": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <path d=\"M12 26 H128 L162 92 L128 158 H12\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <circle cx=\"156\" cy=\"92\" r=\"17\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <path d=\"M173 92 H286\"/>\n    <path d=\"M278 88 l8 4 l-8 4\"/>\n    <g stroke=\"var(--ink)\" stroke-width=\"1.4\">\n      <path d=\"M26 44 H104\"/><path d=\"M26 68 H112\"/><path d=\"M26 116 H112\"/><path d=\"M26 140 H104\"/>\n    </g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M100 40 l8 4 l-8 4 M108 64 l8 4 l-8 4 M108 112 l8 4 l-8 4 M100 136 l8 4 l-8 4\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\">\n    <text x=\"14\" y=\"18\" fill=\"var(--ink2)\">everything the team needs</text>\n    <text x=\"156\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--acc)\">you</text>\n    <text x=\"156\" y=\"130\" text-anchor=\"middle\" fill=\"var(--acc)\">not a full-time</text>\n    <text x=\"156\" y=\"141\" text-anchor=\"middle\" fill=\"var(--acc)\">developer</text>\n    <text x=\"286\" y=\"82\" text-anchor=\"end\" fill=\"var(--ink2)\">progress</text>\n    <text x=\"150\" y=\"186\" text-anchor=\"middle\" fill=\"var(--ink2)\">own the critical path and you become the narrow point</text>\n  </g>\n</svg>", "handson": "<svg viewBox=\"0 0 620 156\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <rect x=\"6\" y=\"26\" width=\"116\" height=\"52\"/><rect x=\"130\" y=\"26\" width=\"116\" height=\"52\"/>\n    <rect x=\"254\" y=\"26\" width=\"116\" height=\"52\"/><rect x=\"378\" y=\"26\" width=\"116\" height=\"52\"/>\n    <rect x=\"502\" y=\"26\" width=\"116\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"8\" y=\"16\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--ink3)\">STAY HANDS-ON WITHOUT OWNING THE CRITICAL PATH</text>\n    <g font-size=\"10\" fill=\"var(--ink)\">\n      <text x=\"64\" y=\"48\">proofs of</text><text x=\"64\" y=\"61\">concept</text>\n      <text x=\"188\" y=\"48\">technical</text><text x=\"188\" y=\"61\">debt</text>\n      <text x=\"312\" y=\"55\">bug fixes</text>\n      <text x=\"436\" y=\"48\">automate the</text><text x=\"436\" y=\"61\">repetitive bits</text>\n      <text x=\"560\" y=\"48\" fill=\"var(--acc)\">code</text><text x=\"560\" y=\"61\" fill=\"var(--acc)\">reviews</text>\n    </g>\n    <g font-size=\"8.4\" fill=\"var(--ink2)\">\n      <text x=\"64\" y=\"96\">write them at</text><text x=\"64\" y=\"107\">production quality</text>\n      <text x=\"188\" y=\"96\">low priority, so</text><text x=\"188\" y=\"107\">slipping costs nothing</text>\n      <text x=\"312\" y=\"96\">finds the weak spots</text><text x=\"312\" y=\"107\">in the code and design</text>\n      <text x=\"436\" y=\"96\">fitness functions</text><text x=\"436\" y=\"107\">count — see Ch. 6</text>\n      <text x=\"560\" y=\"96\">not coding, but it</text><text x=\"560\" y=\"107\">holds compliance</text>\n    </g>\n    <text x=\"312\" y=\"134\" font-size=\"8.6\" fill=\"var(--ink2)\">code a minor feature one to three iterations out — never the framework</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
