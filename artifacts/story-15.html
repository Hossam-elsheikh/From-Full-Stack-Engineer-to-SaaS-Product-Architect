/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}

<script>
const D={"ch": "15", "book": "Chapter 15 · Event-Driven Architecture Style", "pages": "pp. 227–281", "title": "Reacting Instead of Requesting", "gist": "The longest chapter in the book, and the densest. Fire-and-forget processors reacting to things that already happened — with a payload decision, a granularity decision, a topology decision and a data decision, each of which can sink it.", "read": "9 min · 60 sec to re-scan", "acc": {"l": "#8A5A12", "d": "#DDA954"}, "minute": ["**Request-based** systems direct deterministic requests to processors. **Event-based** systems react to something that already happened. Placing a bid is not a request — it is an event the system must respond to.", "An **event** says something happened, expects no reply, and is broadcast to many. A **message** is a command or query, usually wants a reply, and goes to one. Broadcasting a command does not make it an event.", "Payloads: **data-based** (everything, fast, fragile, stamp-coupled) or **key-based** (just an ID, consistent, cheap, but every consumer must query). Choose **per event**, not per system, and avoid **anemic events** at one extreme and the **Swarm of Gnats** at the other.", "**Choreographed** gives performance and scalability; **mediated** gives workflow control, state, and error recovery. The mediator uses commands, must scale too, and can become a bottleneck.", "A **synchronous call between two quanta fuses them into one** — Dynamic Quantum Entanglement. Watch for it, because it silently undoes the decoupling the whole style is for."], "sections": [{"t": "Topology: initiating event, processor, derived event", "art": "eda-topology", "wide": true, "alt": "An initiating event entering an event processor which triggers derived events consumed by four more processors", "cap": "Fig. 15-3 · four processors react to *order placed* in parallel, and each advertises what it did.", "p": "Four components: the **initiating event** that starts the flow, the **event broker** (usually federated — clustered instances per domain, each holding that domain's channels), the **event processor**, and the **derived event** it triggers to tell the rest of the system what it did. This continues until every processor is idle and every derived event is consumed.", "items": ["The relay-race analogy is the useful one: once a processor hands off, it is out of that race and free for the next event. Each processor also **scales independently** against its own load.", "Notice what *isn't* there: nobody is listening to *email sent*. That is not waste — it is an **extensible derived event**, a built-in hook. Add an Email Analyzer later and no existing processor changes.", "**Poison event**: a derived event that loops back and re-triggers itself forever. Easy to create here, so trace your flows."]}, {"t": "Events and messages are not the same thing", "art": "event-vs-message", "wide": true, "alt": "A four-row comparison of events against messages, with four sentences classified as one or the other", "cap": "Four differences, and a test. The third sentence is the one that catches people.", "p": "EDA mostly uses events — hence the name — but it uses messages where it must: requesting data from another processor, and controlling processing order in the mediated topology."}, {"t": "Responsiveness is not performance", "art": "async-response", "wide": true, "alt": "A synchronous path taking 3,100 ms to the user beside an asynchronous path taking 25 ms", "cap": "Fig. 15-6 · the work still takes 3,000 ms either way. Only one of them makes the user watch.", "p": "Posting a product review needs several parsing engines — banned words, abusive phrasing, on-topic check. Synchronously that is 3,100 ms to the user; asynchronously it is 25 ms to *acknowledge*, and the work happens after. **Responsiveness** is telling the user it was accepted. **Performance** is making the end-to-end work faster — parallelising the parsers, caching. They are different problems with different fixes.", "items": ["The caveat is real: the synchronous path *guarantees* the comment was posted. The asynchronous path promises it will be. If the comment is rejected for profanity there is no one to tell — unless the user is registered, in which case you can message them.", "Now imagine the same trade-off on a stock purchase. **Error handling is the price of asynchrony**, and it is most of what makes this style complex."]}, {"t": "Dynamic Quantum Entanglement", "art": "entanglement", "wide": true, "alt": "Two systems joined synchronously forming one quantum, beside the same two joined asynchronously forming two", "cap": "Figs. 15-7 and 15-8 · one synchronous call, and two independent systems become one.", "p": "Portfolio Management sends a trade order to Trade Order and blocks waiting for a confirmation number. They are now **one architecture quantum**: characteristics live across both. Trade Order slow means Portfolio slow; Trade Order down means no orders; Portfolio needing to scale means Trade Order must scale too. Replace the call with a queue and a separate reply channel and they detangle into two quanta — orders keep flowing, confirmations arrive when they arrive."}, {"k": "decision", "t": "Data-based payload, or key-based?", "art": "payload", "wide": true, "alt": "A 500 KB data-based event beside a single-key event, with a six-row trade-off table", "sit": "An order has 45 attributes and weighs 500 KB. The *order_placed* event can carry all of it, or carry `{\"order_id\": \"123\"}` and let each consumer query the database.", "opts": [["Send all the data.", "Consumers never touch the database — better performance, responsiveness and scalability. Essential when consumers can't reach the data at all, which is normal under strict bounded contexts. **Costs:** two systems of record that drift (a customer fixing their shipping address immediately after ordering is enough to break it), heavy contract-versioning burden, **stamp coupling**, and bandwidth."], ["Send the key.", "One system of record, so consistency and integrity hold even when data changes mid-flow. Contracts stay simple, schema-less and stable — no versioning or deprecation strategy needed. Minimal bandwidth. **Costs:** every consumer queries the database, in parallel, which can flatten it."]], "verdict": "**Neither, globally — decide per event.** Creating or deleting an order works fine key-based; *updating* one does not, because the consumer can't tell what changed or what the previous values were. That is an **anemic event**. The bandwidth number is worth carrying: at 500 orders per second, a 500 KB payload is 250 MB/s to deliver 30 bytes of useful data. Consumer-driven contracts would fix stamp coupling, and are hard here — because broadcast means you often don't know who your consumers are."}, {"t": "Too few events, and too many", "art": "gnats", "wide": true, "alt": "One processor emitting five fine-grained field-change events, beside the same processor emitting one outcome event", "cap": "Figs. 15-16 and 15-17 · a customer moved house. One action; five events, or one.", "items": ["**Too coarse**: one `fraud_checked` event with the outcome buried in the payload forces every consumer to receive it, open it, and decide whether it applies. Two events — `fraud_detected` and `no_fraud_detected` — put the context *outside* the payload so consumers subscribe only to what concerns them.", "**Too fine — the Swarm of Gnats**: a profile update emitting a separate event per changed field saturates the system with events about one action, and makes the overall flows impossible to follow.", "The rule that resolves both: **focus derived events on the outcome or the state change**, and carry the before-and-after values so consumers have context the database no longer holds."]}, {"t": "Error handling: the Workflow Event pattern", "art": "workflow-event", "wide": true, "alt": "A consumer delegating a failed message to a workflow processor that repairs and resubmits it", "cap": "Fig. 15-18 · delegation, containment, repair. A pattern from reactive architecture.", "p": "On error the consumer **immediately delegates and moves to the next message** — that is the point. Stopping to reason about a bad message delays every message behind it. The workflow processor inspects the failure, repairs the data programmatically and resubmits it to the original queue, where it arrives as a new message. What it can't fix goes to a queue backing a human dashboard, and the person resubmits it via the `reply-to` header.", "items": ["The worked example: a trade instruction reading `2WE35HF6DHF,BUY,AAPL,8756 SHARES` throws a `NumberFormatException`. The workflow processor strips `SHARES`, resubmits, and the trade goes through — no human, no lost basket.", "**The consequence to plan for**: repaired messages return **out of order**. If order matters within a context — all trades in one brokerage account — hold that account's subsequent trades in a temporary FIFO queue until the repaired one clears."]}, {"t": "Preventing data loss", "art": "data-loss", "wide": true, "alt": "Three points where a message can be lost between producer, queue, consumer and database, each with its mitigation", "cap": "Figs. 15-20 and 15-21 · three failure points, three standard answers.", "items": ["**It never reached the queue** — the producer crashed before acknowledgement, or the broker crashed after. Fix: **persistent queues** (the event is written to disk, not just memory) plus **synchronous send**, which blocks the producer until the broker confirms it persisted.", "**The consumer read it and crashed.** By default a read removes the event from the queue — *auto acknowledge*. Fix: **client acknowledge mode**, which keeps the event in the queue with the client ID attached so nobody else takes it.", "**The consumer couldn't persist it.** Fix: an **ACID commit** plus **last participant support**, which only removes the event from the queue once all processing and persistence are confirmed.", "This is the **Event Forwarding pattern**, for AMQP brokers (SNS, RabbitMQ, Solace, Azure Event Hubs) and for JMS topics with **durable subscribers**. Kafka-style streaming prevents loss by entirely different means."]}, {"k": "decision", "t": "Choreographed, or mediated?", "art": "mediator", "wide": true, "alt": "An event mediator sending commands to five processors over dedicated queues and receiving acknowledgements", "sit": "Placing an order is five steps, some parallel, some strictly ordered — fulfilment cannot start until payment is applied. Do the processors work it out between themselves, or does something own the workflow?", "opts": [["Choreographed — processors broadcast, others react.", "Maximum decoupling, maximum performance and scalability. Nobody holds the workflow, so nobody can tell you its state, restart it, or recover it cleanly."], ["Mediated — a mediator holds the steps and issues commands.", "It knows the workflow, keeps event state, and handles errors, recovery and restart: expired card at step 2 means it stops, persists state, and resumes at step 3 once payment clears. It uses **commands** (`ship_order`) not events (`order_shipped`), and processors acknowledge rather than advertise."]], "verdict": "**Workflow control and error handling against performance and scalability.** Mediated is still good at both, just not as good. Its costs: complex dynamic flows are hard to model declaratively (most real systems end up **hybrid**), the mediator must scale too and can bottleneck, and processors are less decoupled. Use **several mediators**, one per domain, or you have built a single point of failure. Match the tool to the flow: Apache Camel, Mule or Spring Integration for simple flows; BPEL engines (Apache ODE, Oracle BPEL) for heavy conditional routing; a **BPM engine like jBPM** when a human has to approve something mid-workflow. Classify events as simple, hard or complex and let a simple mediator delegate onward."}, {"k": "decision", "t": "Which database topology?", "art": "eda-data", "wide": true, "alt": "Monolithic, domain and dedicated database topologies for event-driven architecture", "sit": "Order Placement needs two things it doesn't own: how many items are in stock, and what shipping options exist for this customer. Where the data lives decides how it gets them.", "opts": [["Monolithic — one database for everything.", "Any processor queries what it needs directly, with no synchronous calls at all — a real advantage in a style built on decoupling. **Costs:** the database is a single point of failure for every processor, it must scale to the combined concurrent load of all of them, one schema change coordinates everyone, and the whole system is **one quantum**."], ["Domain — one database per domain.", "Better fault tolerance, scalability and change control. If the order-processing database is down, order placement keeps accepting orders and the event channel acts as backpressure. **Cost:** shipping options now need a **synchronous call** into another domain."], ["Dedicated — database per processor.", "Highest isolation of the three: an outage stays inside one processor, each database scales for one consumer, a schema change touches one thing. **Costs:** expensive, and Order Placement now needs synchronous calls to *both* Inventory and Order Shipment."]], "verdict": "Identify every data requirement of every processor **before** choosing. The failure mode is the same in both partitioned options: synchronous coupling creeping back in, which costs exactly the fault tolerance and scalability you moved right to get. If processors are talking synchronously too much, **move left** — merge domains, or go monolithic — or reconsider whether EDA fits at all."}, {"t": "Characteristics, risks, and when to reach for it", "wide": true, "alt": "Architecture characteristics ratings for event-driven architecture", "cap": "Fig. 15-39 · performance and scalability are the reason to be here. Simplicity and testability are the bill.", "items": ["**Non-deterministic side effects** — processors triggering derived events unexpectedly, or failing to respond when they should. Flows get complex enough that nobody can predict what one event will do.", "**Static coupling through contracts.** The style is dynamically decoupled and statically coupled by event payloads, and you often don't know who consumes an event, so changing a contract is genuinely dangerous. Govern the **rate of contract change** and record which fields consumers never read.", "**State management.** Knowing when an initiating event has been *fully* processed is hard and often impossible. Sometimes you can identify the terminal event and have the originator subscribe to it; usually you can't.", "**Teams**: technically partitioned, so stream-aligned teams struggle as the system grows — a new step in order placement can mean changing several processors and restructuring derived events. **Enabling teams fit badly** here; **complicated-subsystem teams fit well**, because complex processing isolates cleanly into its own processor."], "p": "**Choose request-based** for well-structured, data-driven requests where certainty and control of the workflow matter. **Choose event-based** for flexible, action-based events needing high responsiveness and scale with dynamic processing. The trade you accept: eventual consistency only, less control over the flow, less certainty about the outcome, and real difficulty testing and debugging.", "art": "_gen10"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 15: Event-Driven Architecture Style, pp. 227–281 — the longest chapter in the book.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"eda-topology": "<svg viewBox=\"0 0 620 254\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"8\" y=\"100\" width=\"86\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"134\" y=\"100\" width=\"96\" height=\"34\"/>\n    <rect x=\"286\" y=\"30\" width=\"102\" height=\"30\"/><rect x=\"286\" y=\"76\" width=\"102\" height=\"30\"/>\n    <rect x=\"286\" y=\"122\" width=\"102\" height=\"30\"/><rect x=\"286\" y=\"168\" width=\"102\" height=\"30\"/>\n    <rect x=\"452\" y=\"53\" width=\"112\" height=\"30\"/><rect x=\"452\" y=\"99\" width=\"112\" height=\"30\"/>\n    <rect x=\"452\" y=\"145\" width=\"112\" height=\"30\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.1\">\n      <path d=\"M94 117 H134\"/><path d=\"M126 113 l8 4 l-8 4\"/>\n      <path d=\"M230 117 L286 45 M230 117 L286 91 M230 117 H286 M230 117 L286 183\"/>\n      <path d=\"M388 45 L452 68 M388 91 L452 114 M388 137 L452 160 M388 183 L452 160\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"51\" y=\"121\" font-size=\"8.6\" fill=\"var(--acc)\">place order</text>\n    <text x=\"51\" y=\"150\" font-size=\"7.6\" fill=\"var(--acc)\">initiating event</text>\n    <text x=\"182\" y=\"115\" font-size=\"8.6\" fill=\"var(--ink)\">Order Placement</text>\n    <text x=\"182\" y=\"126\" font-size=\"7.4\" fill=\"var(--ink2)\">event processor</text>\n    <text x=\"182\" y=\"150\" font-size=\"7.6\" fill=\"var(--ink2)\">order placed →</text>\n    <g fill=\"var(--ink2)\">\n      <text x=\"337\" y=\"49\">Notification</text><text x=\"337\" y=\"95\">Payment</text>\n      <text x=\"337\" y=\"141\">Inventory</text><text x=\"337\" y=\"187\">Order Fulfillment</text>\n      <text x=\"508\" y=\"72\">email sent</text><text x=\"508\" y=\"118\">payment applied / denied</text>\n      <text x=\"508\" y=\"164\">inventory updated</text>\n    </g>\n    <text x=\"508\" y=\"40\" font-size=\"7.6\" fill=\"var(--acc)\">derived events — nobody may be listening,</text>\n    <text x=\"508\" y=\"30\" font-size=\"7.6\" fill=\"var(--acc)\">and that is the extensibility hook</text>\n    <text x=\"310\" y=\"222\" font-size=\"9\" fill=\"var(--ink)\">A relay race: hand off the baton and you are done with this race, free for the next one.</text>\n    <text x=\"310\" y=\"242\" font-size=\"8.4\" fill=\"var(--acc)\">Watch for the poison event — a derived event that loops back and triggers itself forever.</text>\n  </g>\n</svg>", "event-vs-message": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"8\" y=\"34\" width=\"298\" height=\"118\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"322\" y=\"34\" width=\"290\" height=\"118\"/>\n    <path d=\"M8 60 H306 M322 60 H612\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"157\" y=\"52\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"var(--acc)\">EVENT</text>\n    <text x=\"467\" y=\"52\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"var(--ink)\">MESSAGE</text>\n    <g font-size=\"9\" fill=\"var(--ink)\">\n      <text x=\"22\" y=\"80\">something has already happened</text>\n      <text x=\"22\" y=\"98\">no response expected</text>\n      <text x=\"22\" y=\"116\">broadcast — one to many</text>\n      <text x=\"22\" y=\"134\">a topic, stream or notification service</text>\n      <text x=\"336\" y=\"80\">a command or a query</text>\n      <text x=\"336\" y=\"98\">usually needs a response</text>\n      <text x=\"336\" y=\"116\">directed — one to one</text>\n      <text x=\"336\" y=\"134\">a queue or messaging service</text>\n    </g>\n    <text x=\"8\" y=\"176\" font-size=\"9\" fill=\"var(--ink3)\">Which of these are events?</text>\n    <g font-size=\"8.6\" fill=\"var(--ink2)\">\n      <text x=\"8\" y=\"192\">“Flight 6557, turn left, heading 230.”</text>\n      <text x=\"8\" y=\"206\">“A cold front has moved into the area.”</text>\n      <text x=\"8\" y=\"220\">“Class, turn to page 145.”</text>\n      <text x=\"8\" y=\"234\">“Sorry I'm late for the meeting.”</text>\n    </g>\n    <g font-size=\"8.6\">\n      <text x=\"330\" y=\"192\" fill=\"var(--ink)\">message — a command, aimed at one pilot</text>\n      <text x=\"330\" y=\"206\" fill=\"var(--acc)\">event — happened, broadcast, no reply wanted</text>\n      <text x=\"330\" y=\"220\" fill=\"var(--ink)\">message — broadcasting a command doesn't make it an event</text>\n      <text x=\"330\" y=\"234\" fill=\"var(--acc)\">event</text>\n    </g>\n  </g>\n</svg>", "async-response": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <path d=\"M60 56 H160\" stroke=\"var(--ink3)\"/><rect x=\"160\" y=\"42\" width=\"330\" height=\"28\"/>\n    <path d=\"M490 56 H590\" stroke=\"var(--ink3)\"/>\n    <path d=\"M60 148 H92\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n    <rect x=\"92\" y=\"134\" width=\"330\" height=\"28\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <path d=\"M60 178 H92 M92 178 V148\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.4\">\n    <text x=\"8\" y=\"30\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">SYNCHRONOUS REST</text>\n    <text x=\"110\" y=\"36\" text-anchor=\"middle\" fill=\"var(--ink2)\">50 ms</text>\n    <text x=\"325\" y=\"60\" text-anchor=\"middle\" fill=\"var(--ink)\">3,000 ms — parse, check, validate, post</text>\n    <text x=\"540\" y=\"36\" text-anchor=\"middle\" fill=\"var(--ink2)\">50 ms</text>\n    <text x=\"600\" y=\"60\" text-anchor=\"end\" fill=\"var(--ink)\">3,100 ms to the user</text>\n    <text x=\"8\" y=\"118\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--acc)\">ASYNCHRONOUS MESSAGE</text>\n    <text x=\"257\" y=\"152\" text-anchor=\"middle\" fill=\"var(--ink2)\">3,000 ms — same work, later</text>\n    <text x=\"76\" y=\"196\" text-anchor=\"middle\" fill=\"var(--acc)\">25 ms</text>\n    <text x=\"600\" y=\"152\" text-anchor=\"end\" fill=\"var(--acc)\">25 ms to the user</text>\n    <text x=\"310\" y=\"212\" font-size=\"9\" text-anchor=\"middle\" fill=\"var(--ink)\">Responsiveness is telling the user it was accepted. Performance is making the work faster. These are different problems.</text>\n  </g>\n</svg>", "entanglement": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"18\" y=\"46\" width=\"106\" height=\"38\"/><rect x=\"164\" y=\"46\" width=\"106\" height=\"38\"/>\n    <path d=\"M124 58 H164\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/><path d=\"M156 54 l8 4 l-8 4\"/>\n    <path d=\"M164 74 H124\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/><path d=\"M132 70 l-8 4 l8 4\"/>\n    <rect x=\"6\" y=\"34\" width=\"278\" height=\"62\" stroke=\"var(--ink3)\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\"/>\n\n    <rect x=\"348\" y=\"46\" width=\"106\" height=\"38\"/><rect x=\"494\" y=\"46\" width=\"106\" height=\"38\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\">\n      <path d=\"M454 58 H494\"/><path d=\"M494 74 H454\"/>\n    </g>\n    <rect x=\"336\" y=\"34\" width=\"130\" height=\"62\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\"/>\n    <rect x=\"482\" y=\"34\" width=\"130\" height=\"62\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"71\" y=\"69\" fill=\"var(--ink2)\">Portfolio Mgmt</text><text x=\"217\" y=\"69\" fill=\"var(--ink2)\">Trade Order</text>\n    <text x=\"145\" y=\"26\" font-size=\"8.6\" fill=\"var(--ink)\">ONE QUANTUM — synchronous</text>\n    <text x=\"401\" y=\"69\" fill=\"var(--ink2)\">Portfolio Mgmt</text><text x=\"547\" y=\"69\" fill=\"var(--ink2)\">Trade Order</text>\n    <text x=\"474\" y=\"26\" font-size=\"8.6\" fill=\"var(--acc)\">TWO QUANTA — asynchronous</text>\n    <text x=\"145\" y=\"122\" font-size=\"8.4\" fill=\"var(--ink2)\">Trade Order slow → Portfolio slow.</text>\n    <text x=\"145\" y=\"134\" font-size=\"8.4\" fill=\"var(--ink2)\">Trade Order down → no orders.</text>\n    <text x=\"145\" y=\"146\" font-size=\"8.4\" fill=\"var(--ink2)\">Portfolio must scale → so must Trade Order.</text>\n    <text x=\"474\" y=\"122\" font-size=\"8.4\" fill=\"var(--acc)\">Trade Order down → orders still accepted.</text>\n    <text x=\"474\" y=\"134\" font-size=\"8.4\" fill=\"var(--acc)\">Confirmation arrives on its own channel.</text>\n    <text x=\"474\" y=\"146\" font-size=\"8.4\" fill=\"var(--acc)\">Each scales on its own.</text>\n    <text x=\"310\" y=\"184\" font-size=\"9\" fill=\"var(--ink)\">Dynamic Quantum Entanglement: a synchronous call between two quanta fuses them into one.</text>\n    <text x=\"310\" y=\"204\" font-size=\"8.6\" fill=\"var(--acc)\">Architecture characteristics then live across both, whether you designed that or not.</text>\n  </g>\n</svg>", "payload": "<svg viewBox=\"0 0 620 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"40\" width=\"88\" height=\"30\"/>\n    <rect x=\"140\" y=\"34\" width=\"120\" height=\"42\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <path d=\"M102 55 H140\" stroke=\"var(--acc)\" stroke-width=\"2.6\"/>\n    <rect x=\"14\" y=\"120\" width=\"88\" height=\"30\"/>\n    <rect x=\"176\" y=\"126\" width=\"46\" height=\"20\" stroke=\"var(--acc)\"/>\n    <path d=\"M102 136 H176\" stroke=\"var(--acc)\" stroke-width=\"1\"/>\n    <path d=\"M320 34 H612 M320 62 H612 M320 90 H612 M320 118 H612 M320 146 H612 M320 174 H612\" stroke=\"var(--rule2)\"/>\n    <path d=\"M496 24 V196\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8\">\n    <text x=\"58\" y=\"59\" text-anchor=\"middle\" fill=\"var(--ink2)\">Order Placement</text>\n    <text x=\"200\" y=\"52\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--acc)\">45 attributes</text>\n    <text x=\"200\" y=\"64\" text-anchor=\"middle\" fill=\"var(--acc)\">500 KB</text>\n    <text x=\"200\" y=\"90\" text-anchor=\"middle\" fill=\"var(--ink2)\">data-based</text>\n    <text x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"var(--ink2)\">Order Placement</text>\n    <text x=\"199\" y=\"139\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"var(--acc)\">order_id</text>\n    <text x=\"199\" y=\"162\" text-anchor=\"middle\" fill=\"var(--ink2)\">key-based</text>\n    <text x=\"150\" y=\"196\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--ink)\">500 orders/sec × 500 KB = 250 MB/s.</text>\n    <text x=\"150\" y=\"208\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--acc)\">The same events at 30 bytes = 15 KB/s.</text>\n    <g font-size=\"8.6\" text-anchor=\"middle\">\n      <text x=\"410\" y=\"24\" fill=\"var(--acc)\">DATA-BASED</text><text x=\"556\" y=\"24\" fill=\"var(--ink)\">KEY-BASED</text>\n    </g>\n    <g font-size=\"8.6\" fill=\"var(--ink)\" text-anchor=\"end\">\n      <text x=\"312\" y=\"52\">performance and scalability</text><text x=\"312\" y=\"80\">contract management</text>\n      <text x=\"312\" y=\"108\">stamp coupling</text><text x=\"312\" y=\"136\">bandwidth</text>\n      <text x=\"312\" y=\"164\">restricted database access</text><text x=\"312\" y=\"192\">overall fragility</text>\n    </g>\n    <g font-size=\"9\" text-anchor=\"middle\">\n      <text x=\"410\" y=\"52\" fill=\"var(--acc)\">good</text><text x=\"556\" y=\"52\" fill=\"var(--ink2)\">bad</text>\n      <text x=\"410\" y=\"80\" fill=\"var(--ink2)\">bad</text><text x=\"556\" y=\"80\" fill=\"var(--acc)\">good</text>\n      <text x=\"410\" y=\"108\" fill=\"var(--ink2)\">bad</text><text x=\"556\" y=\"108\" fill=\"var(--acc)\">good</text>\n      <text x=\"410\" y=\"136\" fill=\"var(--ink2)\">bad</text><text x=\"556\" y=\"136\" fill=\"var(--acc)\">good</text>\n      <text x=\"410\" y=\"164\" fill=\"var(--acc)\">good</text><text x=\"556\" y=\"164\" fill=\"var(--ink2)\">bad</text>\n      <text x=\"410\" y=\"192\" fill=\"var(--ink2)\">bad</text><text x=\"556\" y=\"192\" fill=\"var(--acc)\">good</text>\n    </g>\n    <text x=\"466\" y=\"222\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink)\">Table 15-1 · scale and speed against contract management and bandwidth.</text>\n    <text x=\"466\" y=\"236\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--acc)\">It is per event, not per system — different events can use different payloads.</text>\n  </g>\n</svg>", "gnats": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"70\" width=\"98\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M112 87 L182 40 M112 87 L182 66 M112 87 H182 M112 87 L182 108 M112 87 L182 134\"/></g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <rect x=\"182\" y=\"30\" width=\"90\" height=\"20\"/><rect x=\"182\" y=\"56\" width=\"90\" height=\"20\"/>\n      <rect x=\"182\" y=\"82\" width=\"90\" height=\"20\"/><rect x=\"182\" y=\"108\" width=\"90\" height=\"20\"/>\n      <rect x=\"182\" y=\"134\" width=\"90\" height=\"20\"/>\n    </g>\n    <rect x=\"348\" y=\"70\" width=\"98\" height=\"34\"/>\n    <rect x=\"486\" y=\"66\" width=\"112\" height=\"42\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <path d=\"M446 87 H486\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"7.6\">\n    <text x=\"14\" y=\"58\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">SWARM OF GNATS</text>\n    <text x=\"63\" y=\"91\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--ink2)\">Customer Profile</text>\n    <g fill=\"var(--ink2)\" text-anchor=\"middle\">\n      <text x=\"227\" y=\"44\">billto_changed</text><text x=\"227\" y=\"70\">shipto_changed</text>\n      <text x=\"227\" y=\"96\">phone_changed</text><text x=\"227\" y=\"122\">email_changed</text><text x=\"227\" y=\"148\">name_changed</text>\n    </g>\n    <text x=\"348\" y=\"58\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--acc)\">ONE OUTCOME EVENT</text>\n    <text x=\"397\" y=\"91\" text-anchor=\"middle\" font-size=\"8.4\" fill=\"var(--ink2)\">Customer Profile</text>\n    <text x=\"542\" y=\"84\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--acc)\">profile_updated</text>\n    <text x=\"542\" y=\"97\" text-anchor=\"middle\" fill=\"var(--acc)\">before and after values</text>\n    <text x=\"150\" y=\"180\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">one customer, one action, five events —</text>\n    <text x=\"150\" y=\"192\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">and nobody can follow the flows any more</text>\n    <text x=\"470\" y=\"180\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--acc)\">focus derived events on the outcome</text>\n    <text x=\"470\" y=\"192\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--acc)\">or the state change, not each field</text>\n    <text x=\"310\" y=\"212\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink)\">The opposite failure is the anemic event: a key with no context, so no consumer knows what changed or what to do.</text>\n  </g>\n</svg>", "workflow-event": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"70\" width=\"104\" height=\"36\"/>\n    <rect x=\"164\" y=\ const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
