/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

<script>
const D={"ch": "11", "book": "Chapter 11 · The Modular Monolith Architecture Style", "pages": "pp. 165–179", "title": "A Monolith With Real Seams", "gist": "New to the second edition, and popular for a reason: domain partitioning without the cost of going distributed. One deployment unit, modules by domain, and strict governance holding the boundaries.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#38664B", "d": "#85C09A"}, "minute": ["One deployment unit, functionality grouped by **domain** rather than technical capability. In the namespace, the third node stops being *presentation* and becomes *customer*.", "Modules can live as directories in **one repository** (monolithic structure — simplest, easiest to erode) or as separate **JARs and DLLs** assembled at deploy time (modular structure — cleaner boundaries, worse when modules must talk).", "Modules talking to each other is never good and often necessary. **Peer-to-peer** is convenient and turns into a big ball of mud; a **mediator** decouples the modules from each other and couples them all to the mediator.", "Governance is the load-bearing part: enforce the module list in namespaces, cap the number of interdependencies, and forbid specific module pairs from talking.", "Strengths are **cost, simplicity and modularity**. Weaknesses are the monolith's: elasticity, scalability, fault tolerance. Use it when changes are **domain-based**; use layered instead when changes are **technical**."], "sections": [{"t": "Topology: modules, not layers", "art": "mm-topology", "wide": true, "alt": "Six domain modules inside one dashed deployment boundary, with the namespace comparison below", "cap": "Fig. 11-1 · a single deployment unit with functionality grouped by domain area.", "p": "Domains — or subdomains — are called **modules** here. A module is made of one or more components, so it nests: `com.easymeals.placeorder` contains `.menu`, `.shoppingcart`, `.customerdata`, `.paymentdata`, `.checkout`. If a module is complex enough, it may divide by technical concern *below* the domain node: `com.app.customer.profile.presentation`."}, {"k": "decision", "t": "One repository, or one artifact per module?", "art": "structures", "wide": true, "alt": "A monolithic structure of directories in one repo beside a modular structure of separate artifacts assembled at deployment", "sit": "You have six modules. They can be six top-level directories in a single source repository, or six independently built artifacts — JARs, DLLs — combined into one deployment unit at release time.", "opts": [["Monolithic structure — one repository, directories per module.", "Simplest to maintain, test and deploy: all the source is in one place. It also needs **strict governance**, because developers reuse too much across modules and let modules talk too freely, and a well-architected modular monolith becomes an unstructured big ball of mud."], ["Modular structure — self-contained artifacts.", "Each module is genuinely self-contained, teams can own their own repositories, and the boundaries stay cleaner because crossing one requires a compile-time dependency. Works best when modules are **largely independent** and when different modules need different expertise."]], "verdict": "The deciding question is how much the modules must communicate. Modular structure loses its advantage exactly where modules are interdependent — a module that calls another won't compile without the class references, so you end up creating shared interface artifacts, and too much of that is **JAR Hell** (or DLL Hell). Where modules must talk a lot, the monolithic structure is more effective."}, {"k": "decision", "t": "OrderPlacement needs InventoryManagement", "art": "communication", "alt": "Peer-to-peer calls between three modules above a mediator sitting between them", "sit": "Placing an order has to adjust inventory, possibly reorder stock, and apply payment. Three modules, one workflow. How do they reach each other?", "opts": [["Peer-to-peer — instantiate the class and call the method.", "The most straightforward thing, and in the monolithic structure it is *far* too convenient: any class in any module is one import away. This is the exact mechanism by which the style degrades into a big ball of mud."], ["A mediator between the modules.", "The mediator orchestrates: it accepts the request and routes it to the right modules. The modules no longer know about each other, and only the **mediator** needs an API or interface to invoke them.", 1]], "verdict": "The mediator does not remove coupling — every module is now coupled to the mediator instead. What it buys is that the modules stay independent **of each other**, which is the property the style exists to protect. And if intermodule chatter is high whichever way you route it, that is a signal the domains were drawn wrong in the first place."}, {"t": "Data, cloud, and the size problem", "art": "mm-data", "alt": "One shared database beside three per-module databases", "cap": "Fig. 11-6 · monolithic deployment doesn't force monolithic data.", "items": ["**Data.** Usually one database — shared data reduces the need for modules to talk. But independent modules doing specific jobs can hold their own contextual data even inside a monolithic deployment.", "**Cloud.** Poorly suited in general: a monolith cannot take much advantage of on-demand provisioning. Small systems in this style can still use cloud file storage, databases and messaging.", "**Too big** is the primary risk, and it has recognisable symptoms: changes take too long; changing one area unexpectedly breaks another; team members get in each other's way; startup takes too long.", "**Too much reuse** is the second risk. Reuse blurs module boundaries and produces the *unstructured monolith* — interdependent to the point where it cannot be unravelled."]}, {"t": "Governance is what keeps it modular", "art": "structures", "wide": true, "alt": "A monolithic structure of directories in one repo beside a modular structure of separate artifacts assembled at deployment", "cap": "Three automated checks, in ArchUnit, ArchUnitNet, NetArchTest, PyTestArch or TSArch.", "items": ["**Enforce the module list.** Walk every namespace in the system and alert on any that doesn't start with one of the defined modules. A new top-level directory is a new module nobody agreed to.", "**Cap the interdependencies.** For each module, count incoming plus outgoing references and alert above a threshold — five is the example used. Subjective, and worth setting anyway.", "**Forbid specific pairs.** `noClasses().that().resideInAPackage(\"..orderplacement..\").should().accessClassesThat().resideInAPackage(\"..shipping..\")`.", "Note the asymmetry: the first check works well for the **monolithic structure** and is awkward for the modular structure, where the code isn't in one repository — there, each module gets tested separately."], "p": "On teams: this is a domain-partitioned architecture, so it wants **domain-aligned, cross-functional teams**. A team organised by technical layer — UI team, backend team, database team — fits it badly, because every domain requirement then needs coordination across all of them."}, {"t": "Characteristics, and when to reach for it", "wide": true, "alt": "Architecture characteristics ratings for the modular monolith", "cap": "Deployability and testability beat layered's, on the strength of the module boundaries. Everything monolithic still applies.", "items": ["**Use it** under tight budget and time constraints; as a first system when the architectural direction is still unclear; with domain-focused cross-functional teams; when most changes are **domain-based**; and when the team is doing domain-driven design.", "**Don't use it** when you need high scalability, elasticity, availability, fault tolerance, responsiveness or performance — it is a monolith and cannot buy those.", "**Don't use it** when most changes are **technical** — continuously replacing the UI framework or the database technology hits every module at once and needs heavy coordination between domain teams. Layered is the better choice there.", "Starting here and moving later to service-based (Ch. 14) or microservices (Ch. 18) is usually more effective than jumping straight to a distributed architecture."], "p": "The worked example is EasyMeals, a small delivery restaurant with no scalability needs and a limited budget: PlaceOrder, PaymentProcessing, PrepareOrder, Delivery, Recipes and Inventory. Adding loyalty points as a payment type means adding `com.easymeals.payment.loyalty` and nothing else — which is what the modularity is for.", "art": "_gen5"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 11: The Modular Monolith Architecture Style, pp. 165–179. New in the second edition; the style was popularised by Simon Brown.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"mm-topology": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"34\" width=\"592\" height=\"106\" stroke=\"var(--acc)\" stroke-width=\"1.9\" stroke-dasharray=\"7 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"30\" y=\"52\" width=\"88\" height=\"70\"/><rect x=\"128\" y=\"52\" width=\"88\" height=\"70\"/>\n    <rect x=\"226\" y=\"52\" width=\"88\" height=\"70\"/><rect x=\"324\" y=\"52\" width=\"88\" height=\"70\"/>\n    <rect x=\"422\" y=\"52\" width=\"88\" height=\"70\"/><rect x=\"520\" y=\"52\" width=\"70\" height=\"70\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M40 90 h68 M40 104 h68 M138 90 h68 M138 104 h68 M236 90 h68 M236 104 h68\"/>\n      <path d=\"M334 90 h68 M334 104 h68 M432 90 h ules are</text>\n    <text x=\"229\" y=\"151\" fill=\"var(--ink2)\">genuinely independent</text>\n    <text x=\"150\" y=\"184\" fill=\"var(--ink)\">the deployment is monolithic. the data does not have to be.</text>\n  </g>\n</svg>", "_gen5": "<svg viewBox=\"0 0 620 278\" xmlns=\"http://www.w3.org/2000/svg\">\n<g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"0\" y=\"13\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">MODULAR MONOLITH — DOMAIN PARTITIONED · QUANTUM 1</text>\n<text x=\"620\" y=\"13\" font-size=\"8.6\" text-anchor=\"end\" fill=\"var(--ink2)\">1 = weak   5 = strong</text>\n</g>\n<text x=\"178\" y=\"38\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">overall cost</text>\n<rect x=\"190\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"298\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<text x=\"333\" y=\"38\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">no distributed tax</text>\n<text x=\"178\" y=\"61\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">simplicity</text>\n<rect x=\"190\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\" =\".92\"/>\n<rect x=\"217\" y=\"164\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"176\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">still one unit</text>\n<text x=\"178\" y=\"199\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">fault tolerance</text>\n<rect x=\"190\" y=\"187\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"199\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">one OOM kills it</text>\n<text x=\"178\" y=\"222\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">scalability</text>\n<rect x=\"190\" y=\"210\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\ const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
