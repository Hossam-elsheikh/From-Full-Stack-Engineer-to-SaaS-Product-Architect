/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}

.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}

.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;

<script>
const D={"ch": "04", "book": "Chapter 4 · Architectural Characteristics Defined", "pages": "pp. 55–65", "title": "The Capabilities, Not the Behaviour", "gist": "What actually qualifies as an architecture characteristic, the four families they fall into, and why supporting more of them makes the design worse rather than better.", "read": "4 min · 40 sec to re-scan", "acc": {"l": "#2F6A6E", "d": "#86C3C7"}, "minute": ["A requirement is an **architecture characteristic** only if it passes all three tests: it is **non-domain**, it **influences structure**, and it is **critical to success**. Fail one and it is a design concern, not an architectural one.", "The domain is what the system **does**. Characteristics are what it must be **good at**. Both are structural design; only one of them arrives written down.", "**Implicit** characteristics — availability, reliability, security — almost never appear in a requirements document, and you are expected to surface them from domain knowledge anyway.", "Four families: **operational** (availability, performance, scalability), **structural** (maintainability, extensibility, portability), **cloud** (on-demand scaling, zone availability, region privacy — new in the 2nd edition) and **cross-cutting** (security, legal, accessibility, privacy).", "Each characteristic you support costs design effort and drags the others around with it. **Never strive for the best architecture; aim for the least worst.**"], "sections": [{"t": "Behaviour and capability are different jobs", "art": "domain-vs-ac", "alt": "Two panels — the domain on the left and architecture characteristics on the right — resting on one bar", "cap": "Fig. 4-1 · both halves are structural design. Only the left half is in the requirements document.", "p": "Defining characteristics is a large part of what separates architecture from coding and design. Requirements say what the application should do; characteristics say how it is implemented and why those choices were made.", "quotes": [["Never strive for the best architecture; aim for the least worst architecture.", "Richards & Ford", "The chapter's own summary, and a working test: if your design maximises everything, you have not chosen anything."]]}, {"t": "Three tests, all of which must pass", "art": "ac-triangle", "alt": "A triangle whose three corners are non-domain, structural and critical", "cap": "Fig. 4-2 · the triangle is deliberate — each corner supports the others, and they pull against each other.", "items": ["**Non-domain design consideration** — it isn't about what the system does. No requirements document says “prevent technical debt”, but it is a real design consideration.", "**Influences structure** — it needs special shape, not just careful coding. Ask directly: can I implement this by design, or does it change the architecture?", "**Critical or important to success** — every characteristic you support adds complexity, so the aim is the fewest you can get away with, not the most you can name."]}, {"k": "decision", "t": "Is security an architecture characteristic on this project?", "art": "design-or-structure", "alt": "Security achievable by design or by structure, above scalability which only structure can achieve", "sit": "Security matters on every project — every system needs baseline precautions. Does that make it an architecture characteristic *here*, or a coding standard?", "opts": [["It's always architectural. It matters everywhere.", "Then so is everything, and the word stops distinguishing anything. Baseline hygiene — encryption, hashing, salting — is design, and a monolith can hold it that way."], ["It becomes architectural when the architecture must change shape for it.", "In a distributed system you build a hardened service with stricter access protocols. That is structure, not hygiene, and it belongs in the characteristics list.", 1]], "verdict": "Security can be met by design *or* by structure, so the answer depends on the system. **Scalability cannot** — no amount of clever design gets a monolith past a certain point; beyond it you change to a distributed style. That's why operational characteristics get the closest attention: they are the ones that most often force structure."}, {"t": "Four families of characteristic", "art": "categories", "wide": true, "alt": "Four columns listing operational, structural, cloud and cross-cutting characteristics", "cap": "Tables 4-1 to 4-4. Not a standard — a starting vocabulary you are expected to localise.", "p": "There is no universal list and no authoritative definitions. ISO publishes categories that partly overlap these, and even there the authors disagree with one entry: *functional suitability* describes why you're building the software, not a characteristic of the architecture.", "items": ["Many terms are ambiguous and some overlap. **Interoperability** implies easy integration with other systems, so it implies published, documented APIs; **compatibility** is about industry and domain standards. Different things.", "**Availability** and **reliability** look identical until you consider IP, which is available but not reliable — packets arrive out of order and the receiver has to ask again.", "**Learnability** has two definitions in current use: how easily users learn the software, and whether the system learns its own environment to self-configure. Pick one and write it down.", "The practical answer to all of this is domain-driven design's **ubiquitous language**: your organisation defines its own terms, objectively, and everyone uses those."]}, {"k": "decision", "t": "The requirements never mention availability", "art": "ac-triangle", "alt": "A triangle whose three corners are non-domain, structural and critical", "sit": "You have a full requirements document for a trading system. It specifies the domain in detail. It says nothing about latency, nothing about availability, nothing about recovery. The business considers the document complete.", "opts": [["Build to the document. Anything missing is out of scope.", "You will ship a system that does the right things and cannot be relied on to do them. Availability, reliability and security underpin virtually every application and are almost never written down."], ["Use domain knowledge to surface the implicit characteristics, then confirm them.", "A high-frequency trading firm doesn't specify low latency in every document because everyone in that domain already knows. Your job is to know it too, name it, and get it agreed.", 1]], "verdict": "**Explicit** characteristics appear in the requirements. **Implicit** ones are the ones you are expected to find during analysis, using knowledge of the problem domain. The second group is where architects earn their keep — and where a missing one is discovered in production rather than in review."}, {"t": "They are synergistic, which is the whole problem", "art": "synergy", "alt": "A beam on a fulcrum: raising security lowers performance", "cap": "Raise one and the others move. Security buys itself with encryption, indirection and hidden secrets — all of which cost time.", "p": "Pilots learning helicopters find that every control interacts with every other one: changing any input requires adjusting all the rest. Choosing characteristics is that, permanently. This is also why the number of *categories* keeps growing — operations used to be a black box architects ignored, and microservices ended that."}, {"t": "Least worst, and iterate", "art": "least-worst", "alt": "A cost curve rising steeply with the number of characteristics supported", "cap": "Support for a characteristic is never free: design effort, implementation, maintenance, sometimes structure.", "p": "Trying to support too many produces a generic solution aimed at every business problem, which becomes unwieldy and rarely works. The mitigation is not to guess better on the first attempt — it is to make the architecture **as iterative as possible**, so that being wrong early costs less. That is the Agile lesson applied one level up."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 4: Architectural Characteristics Defined, pp. 55–65.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"domain-vs-ac": "<svg viewBox=\"0 0 300 186\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"34\" width=\"126\" height=\"82\"/>\n    <rect x=\"160\" y=\"34\" width=\"126\" height=\"82\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M26 66 h100 M26 80 h100 M26 94 h70\"/></g>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.1\"><path d=\"M172 66 h100 M172 80 h100 M172 94 h70\"/></g>\n    <path d=\"M150 30 V120\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n    <path d=\"M14 134 H286\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"77\" y=\"24\" font-size=\"9.6\" fill=\"var(--ink)\">THE DOMAIN</text>\n    <text x=\"223\" y=\"24\" font-size=\"9.6\" fill=\"var(--acc)\">CHARACTERISTICS</text>\n    <text x=\"77\" y=\"53\" font-size=\"8.4\" fill=\"var(--ink2)\">what the system does</text>\n    <text x=\"223\" y=\"53\" font-size=\"8.4\" fill=\"var(--acc)\">what it must be good at</text>\n    <text x=\"77\" y=\"130\" font-size=\"8.4\" fill=\"var(--ink2)\">behaviour · requirements</text>\n    <text x=\"223\" y=\"130\" font-size=\"8.4\" fill=\"var(--ink2)\">capabilities · the -ilities</text>\n    <text x=\"150\" y=\"152\" font-size=\"9.4\" fill=\"var(--ink)\">a software solution needs both</text>\n    <text x=\"150\" y=\"172\" font-size=\"8.4\" fi \"192\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"468\" y=\"26\" width=\"146\" height=\"192\"/>\n    <path d=\"M6 52 H152 M160 52 H306 M314 52 H460 M468 52 H614\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"8\" y=\"16\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--ink3)\">FOUR CATEGORIES — AND NO UNIVERSAL STANDARD BEHIND ANY OF THEM</text>\n    <g font-size=\"10\" fill=\"var(--ink)\">\n      <text x=\"79\" y=\"45\">OPERATIONAL</text><text x=\"233\" y=\"45\">STRUCTURAL</text>\n      <text x=\"387\" y=\"45\" fill=\"var(--acc)\">CLOUD</text><text x=\"541\" y=\"45\">CROSS-CUTTING</text>\n    </g>\n    <g font-size=\"9\" fill=\"var(--ink2)\">\n      <text x=\"79\" y=\"72\">availability</text><text x=\"79\" y=\"88\">continuity</text><text x=\"79\" y=\"104\">performance</text>\n      <text x=\"79\" y=\"120\">recoverability</text><text x=\"79\" y=\"136\">reliability / safety</text><text x=\"79\" y=\"152\">robustness</text>\n      <text x=\"79\" y=\"168\">scalability</text>\n      <text x=\"233\" y=\"72\">configurability</text><text x=\"233\" y=\"88\">extensibility</text><text x=\"233\" y=\"104\">installability</text>\n      <text x=\"233\" y=\"120\">reuse</text><text x=\"233\" y=\"136\">localization</text><text x=\"233\" y=\"152\">maintainability</text>\n      <text x=\"233\" y=\"168\">portability</text><text x=\"233\" y=\"184\">upgradeability</text>\n      <text x=\"387\" y=\"72\">on-demand scaling</text><text x=\"387\" y=\"88\">on-demand elasticity</text>\n      <text x=\"387\" y=\"104\">zone availability</text><text x=\"387\" y=\"120\">region privacy</text>\n      <text x=\"387\" y=\"136\">region security</text>\n      <text x=\"541\" y=\"72\">accessibility</text><text x=\"541\" y=\"88\">archivability</text><text x=\"541\" y=\"104\">authentication</text>\n      <text x=\"541\" y=\"120\">authorization</text><text x=\"541\" y=\"136\">legal</text><text x=\"541\" y=\"152\">privacy</text>\n      <text x=\"541\" y=\"168\">security</text><text x=\"541\" y=\"184\">supportability</text><text x=\"541\" y=\"200\">usability</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink3)\">\n      <text x=\"79\" y=\"204\">the ones that most</text><text x=\"79\" y=\"214\">often force structure</text>\n      <text x=\"387\" y=\"164\" fill=\"var(--acc)\">new in the 2nd ed.</text>\n      <text x=\"541\" y=\"214\">the ones that defy</text>\n    </g>\n    <text x=\"310\" y=\"240\" font-size=\"8.6\" fill=\"var(--ink2)\">every list is incomplete — each organisation writes its own, with definitions</text>\n  </g>\n</svg>", "synergy": "<svg viewBox=\"0 0 300 196\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\">\n    <path d=\"M150 116 l-22 34 h44 z\" fill=\"var(--ink)\" stroke=\"none\"/>\n    <path d=\"M42 78 L258 132\" stroke=\"var(--acc)\" stroke-width=\"2.4\"/>\n    <rect x=\"14\" y=\"52\" width=\"62\" height=\"26\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"226\" y=\"118\" width=\"62\" height=\"26\"/>\n    <path d=\"M45 44 v-14 M39 36 l6 -8 l6 8\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <path d=\"M257 154 v14 M251 162 l6 8 l6 -8\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9\">\n    <text x=\"45\" y=\"69\" fill=\"var(--acc)\">security</text>\n    <text x=\"257\" y=\"135\" fill=\"var(--ink)\">performance</text>\n    <text x=\"45\" y=\"22\" font-size=\"8.2\" fill=\"var(--acc)\">raise this</text>\n    <text x=\"257\" y=\"186\" font-size=\"8.2\" fill=\"var(--ink2)\">and this moves</text>\n    <text x=\"150\" y=\"180\" font-size=\"8.4\" fill=\"var(--ink2)\">on-the-fly encryption,</text>\n    <text x=\"150\" y=\"191\" font-size=\"8.4\" fill=\"var(--ink2)\">indirection, hidden secrets</text>\n  </g>\n</svg>", "least-worst": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\">\n    <path d=\"M40 152 H284 M40 152 V22\"/>\n    <path d=\"M40 148 C110 146 160 120 200 74 C222 48 236 34 268 26\" stroke=\"var(--acc)\" stroke-width=\"2.2\"/>\n    <rect x=\"46\" y=\"118\" width=\"58\" height=\"32\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\"/>\n    <circle cx=\"75\" cy=\"141\" r=\"4\" fill=\"var(--acc)\" stroke=\"none\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"34\" y=\"88\" font-size=\"8.6\" fill=\"var(--ink)\" transform=\"rotate(-90 34 88)\" text-anchor=\"middle\">design cost</text>\n    <text x=\"162\" y=\"170\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink)\">characteristics supported →</text>\n    <text x=\"75\" y=\"110\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--acc)\">aim here</text>\n    <text x=\"256\" y=\"46\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">generic solution</text>\n    <text x=\"256\" y=\"57\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">that solves nothing</text>\n    <text x=\"150\" y=\"190\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--acc)\">never the best architecture — the least worst one</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
