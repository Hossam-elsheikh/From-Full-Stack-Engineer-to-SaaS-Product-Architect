/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------

<script>
const D={"ch": "03", "book": "Chapter 3 · Modularity", "pages": "pp. 37–54", "title": "Measuring How It Holds Together", "gist": "Modularity is an organising principle nobody puts in the requirements, and entropy eats it unless you spend energy on it. This chapter gives you the three tools for measuring it — cohesion, coupling and connascence — and the language to argue about coupling precisely.", "read": "5 min · 45 sec to re-scan", "acc": {"l": "#8A5333", "d": "#DBA173"}, "minute": ["**Modularity** is breaking a system apart. **Granularity** is how big the pieces are. Modularity is rarely the problem; granularity is. Spaghetti architecture, distributed monoliths and the big ball of distributed mud are all granularity failures.", "**Cohesion** — how much a module's parts belong together — runs from *functional* (best) down to *coincidental* (same file, that's all). Dividing a cohesive module only increases coupling and decreases readability.", "**Coupling** — *afferent* is incoming (who depends on you), *efferent* is outgoing (who you depend on). From these come **Abstractness**, **Instability** and **Distance from the Main Sequence**, which finds the Zone of Uselessness and the Zone of Pain.", "**Connascence** is not a metric, it's precise vocabulary for coupling: two things are connascent if changing one forces the other to change. **Static** forms (name, type, meaning, position, algorithm) are weaker and safer than **dynamic** ones (execution, timing, values, identity).", "Two rules to work by: **convert strong connascence into weaker forms**, and **the further apart two pieces of code sit, the weaker the form between them must be**. Maximise coupling inside a boundary — that is what the boundary is for."], "sections": [{"t": "Modularity is not the problem. Granularity is.", "art": "mod-gran", "alt": "A monolith splitting into six pieces above a dial for how big each piece should be", "cap": "Breaking it apart is the easy half. Choosing the size is where architectures die.", "p": "Modularity is a logical grouping of related code — a package, a namespace, a set of functions. It doesn't have to mean physical separation, and it's worth reasoning about separately from whatever separation your platform forces on you. Granularity is the size question, and it is the one that causes coupling between the pieces you just created.", "quotes": [["95% of the words [written about software architecture] are spent extolling the benefits of “modularity” and little, if anything, is said about how to achieve it.", "Glenford J. Myers, 1978", "Still roughly true, which is why this chapter is about measurement rather than exhortation."], ["Embrace modularity, but beware of granularity.", "Mark Richards", ""]]}, {"t": "Cohesion, best to worst", "art": "cohesion-ladder", "alt": "Seven levels of cohesion stacked from functional at the top to coincidental at the bottom", "cap": "Seven rungs. Anything below procedural is worth a second look.", "p": "Cohesion measures how much a module's parts belong in the same module. It is a *less* precise metric than coupling — where a given module sits is often the architect's judgement call, which is exactly the kind of trade-off analysis the job consists of.", "quotes": [["Attempting to divide a cohesive module would only result in increased coupling and decreased readability.", "Larry Constantine · Structured Design", "The cautionary half. Splitting is not free: what was a call inside a module becomes a call between modules."]]}, {"k": "decision", "t": "Do customer orders belong in Customer Maintenance?", "art": "lcom", "alt": "Three classes drawn as fields and methods, showing high, low and mixed cohesion", "sit": "A module called **Customer Maintenance** holds: add customer, update customer, get customer, notify customer, **get customer orders**, **cancel customer orders**. The last two are about orders, not customers.", "opts": [["Leave them. It's one module about one customer.", "Fine if those really are the only two order operations — pulling them out to make a two-method module buys nothing and costs a call across a boundary."], ["Split out an Order Maintenance module.", "Right if Customer Maintenance is going to keep growing, and wrong if Order Maintenance would need so much customer knowledge that the split just converts cohesion into coupling."]], "verdict": "**It depends — and here are the three questions that decide it.** Are those the only order operations? Is Customer Maintenance expected to grow? Would separating them require so much shared knowledge that the coupling cost exceeds the cohesion gain? There is no metric that answers this; **LCOM** (lack of cohesion in methods) finds *structural* lack of cohesion — methods that never share a field — but it cannot tell you whether pieces belong together logically. Second Law again: why beats how."}, {"t": "Afferent and efferent coupling", "art": "coupling-ae", "alt": "A module with three incoming arrows labelled afferent and three outgoing arrows labelled efferent", "cap": "Two metrics named almost identically because the authors preferred symmetry to clarity.", "items": ["**Abstractness** — the ratio of abstract artifacts to concrete ones. Five thousand lines in one `main()` scores near zero; a codebase where nobody can find the implementation scores near one.", "**Instability** — efferent over total coupling. High instability means the module breaks easily when things around it change, because it delegates to so many others."], "p": "Both come from graph analysis of the call graph, and tools exist for essentially every platform. Both are inputs to the one holistic structural metric architects have."}, {"t": "Distance from the Main Sequence", "art": "main-sequence", "wide": true, "alt": "Abstractness plotted against instability with a diagonal ideal line, a zone of uselessness top-right and a zone of pain bottom-left", "cap": "Figs. 3-2 to 3-4 · the diagonal is the healthy mix. The corners are the two ways to fail.", "p": "Abstractness and Instability both fall between 0 and 1, so plotting them against each other produces one line where the two competing concerns are in balance — the main sequence. A class's distance from that line is one of the very few holistic structural measurements available.", "items": ["**Zone of Uselessness** (top right) — so abstract that nobody can work out how to use it. `AbstractSingletonProxyFactoryBean` lives here.", "**Zone of Pain** (bottom left) — all implementation, no abstraction: brittle, and hard to change without breaking something.", "Useful when you are getting familiar with an unfamiliar codebase, preparing a migration, or trying to put a number on technical debt. Like every code metric, it still needs interpretation — cyclomatic complexity, for instance, cannot tell *essential* complexity from *accidental*."]}, {"t": "Connascence: precise words for coupling", "art": "connascence", "wide": true, "alt": "Nine forms of connascence on one axis, five static and four dynamic, ordered from weaker to stronger", "cap": "Fig. 3-5 · not a metric — a vocabulary. Two things are connascent if changing one forces the other to change.", "items": ["**Static** forms live in the source and a tool can find them. Name is the weakest and most desirable — modern refactoring makes a rename trivial. Meaning is a magic number where a constant belongs. Position is `updateSeat(\"14D\", \"Ford, N\")` with the arguments the wrong way round: right types, wrong semantics.", "**Dynamic** forms only appear at runtime and cost far more to find. Execution is setting the subject after calling `send()`. Timing is a race condition. Values is a transaction across separate databases that must all change or none. Identity is two components that must share the same instance."], "p": "The value is the same as the value of design-pattern names. “Don't put a magic string in the middle of a method” is advice; “that's connascence of meaning, refactor it to connascence of name” is an instruction with a direction."}, {"t": "Strength, locality, degree", "art": "locality", "alt": "The same coupling drawn twice — once inside one module boundary, once crossing between two", "cap": "The same connascence is tolerable inside a boundary and a defect across one.", "items": ["**Strength** — how easily a developer can refactor it away. Prefer static to dynamic, because static is visible to tools.", "**Locality** — how close the two pieces sit. Strong forms within one module are much less of a smell than the same forms spread apart. This is bounded context, described twenty years early.", "**Degree** — how many things a change touches. Strong dynamic connascence across three modules is survivable; codebases grow, and it will not stay three."], "p": "Page-Jones's three guidelines: minimise connascence overall by encapsulating; minimise whatever still crosses an encapsulation boundary; and **maximise connascence inside** one. The last is the one people miss — tight coupling inside a boundary is not a failure, it is the reason the boundary is there."}, {"k": "decision", "t": "You find `if (status == 1)` in a code review", "art": "connascence", "alt": "Nine forms of connascence on one axis, five static and four dynamic, ordered from weaker to stronger", "sit": "A method compares a status field against the literal `1`. Elsewhere another team's service writes that field, and somewhere there is a comment explaining that `1` means active. Nothing is broken. The tests pass.", "opts": [["Leave it. It works and the comment explains it.", "This is **connascence of meaning** across a service boundary — the strongest cross-boundary form here. The day someone flips the values, both sides are wrong and neither compiler notices."], ["Extract a named constant and share it.", "You have converted connascence of meaning into **connascence of name** — the weakest static form, and one that tooling can rename across a whole codebase safely.", 1], ["Extract a constant, but keep a private copy on each side.", "Better than a literal, worse than a shared name: you still have two definitions that must agree, so the connascence is still of meaning, just prettier."]], "verdict": "**Rule of Degree** — convert strong forms into weaker ones. **Rule of Locality** — as the distance between two pieces of code grows, the form of connascence between them must get weaker. A magic number in one method is a smell; the same magic number spanning two services is a defect waiting for a release."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 3: Modularity, pp. 37–54. Connascence is Meilir Page-Jones's, popularised by Jim Weirich; the coupling metrics are Yourdon, Constantine and Robert C. Martin's.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"mod-gran": "<svg viewBox=\"0 0 300 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"10\" y=\"26\" width=\"60\" height=\"52\"/>\n    <path d=\"M78 52 H108\" stroke=\"var(--ink3)\"/><path d=\"M100 48 l8 4 l-8 4\" stroke=\"var(--ink3)\"/>\n    <rect x=\"118\" y=\"26\" width=\"34\" height=\"22\"/><rect x=\"158\" y=\"26\" width=\"34\" height=\"22\"/>\n    <rect x=\"198\" y=\"26\" width=\"34\" height=\"22\"/><rect x=\"118\" y=\"56\" width=\"34\" height=\"22\"/>\n    <rect x=\"158\" y=\"56\" width=\"34\" height=\"22\"/><rect x=\"198\" y=\"56\" width=\"34\" height=\"22\"/>\n    <path d=\"M20 122 H280\"/>\n    <path d=\"M20 116 v12 M280 116 v12 M150 118 v8\"/>\n    <path d=\"M150 122 l-9 -15 h18 z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\">\n    <text x=\"8\" y=\"16\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">MODULARITY — BREAKING IT APART</text>\n    <text x=\"40\" y=\"94\" text-anchor=\"middle\" fill=\"var(--ink2)\">monolith</text>\n    <text x=\"175\" y=\"94\" text-anchor=\"middle\" fill=\"var(--ink2)\">pieces</text>\n    <text x=\"8\" y=\"112\" letter-spacing=\"1.6\" fill=\"var(--acc)\">GRANULARITY — HOW BIG EACH PIECE IS</text>\n    <text x=\"20\" y=\"142\" fill=\"var(--ink2)\">too coarse</text>\n    <text x=\"280\" y=\"142\" text-anchor=\"end\" fill=\"var(--ink2)\">too fine</text>\n    <text x=\"150\" y=\"160\" text-anchor=\"middle\" fill=\"var(--acc)\">this is where the trouble lives</text>\n    <g fill=\"var(--ink2)\" font-size=\"9\">\n      <text x=\"150\" y=\"188\" text-anchor=\"middle\">spaghetti architecture · distributed monolith</text>\n      <text x=\"150\" y=\"202\" text-anchor=\"middle\">big ball of distributed mud</text>\n    </g>\n    <text x=\"150\" y=\"219\" text-anchor=\"middle\" fill=\"var(--ink3)\">all three are granularity failures, not modularity ones</text>\n  </g>\n</svg>", "cohesion-ladder": "<svg viewBox=\"0 0 320 242\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"60\" y=\"14\" width=\"176\" height=\"26\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"60\" y=\"46\" width=\"176\" height=\"26\"/><rect x=\"60\" y=\"78\" width=\"176\" height=\"26\"/>\n    <rect x=\"60\" y=\"110\" width=\"176\" height=\"26\"/><rect x=\"60\" y=\"142\" width=\"176\" height=\"26\"/>\n    <rect x=\"60\" y=\"174\" width=\"176\" height=\"26\"/>\n    <rect x=\"60\" y=\"206\" width=\"176\" height=\"26\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <path d=\"M44 20 V226\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <path d=\"M40 24 l4 -6 l4 6 M40 220 l4 6 l4 -6\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9.4\">\n    <text x=\"148\" y=\"31\" text-anchor=\"middle\" fill=\"var(--acc)\">functional</text>\n    <text x=\"148\" y=\"63\" text-anchor=\"middle\" fill=\"var(--ink)\">sequential</text>\n    <text x=\"148\" y=\"95\" text-anchor=\"middle\" fill=\"var(--ink)\">communicational</text>\n    <text x=\"148\" y=\"127\" text-anchor=\"middle\" fill=\"var(--ink)\">procedural</text>\n    <text x=\"148\" y=\"159\" text-anchor=\"middle\" fill=\"var(--ink)\">temporal</text>\n    <text x=\"148\" y=\"191\" text-anchor=\"middle\" fill=\"var(--ink)\">logical</text>\n    <text x=\"148\" y=\"223\" text-anchor=\"middle\" fill=\"var(--ink2)\">coincidental</text>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"244\" y=\"30\">has everything it needs</text>\n      <text x=\"244\" y=\"62\">one's output, one's input</text>\n      <text x=\"244\" y=\"94\">a chain around shared data</text>\n      <text x=\"244\" y=\"126\">must run in this order</text>\n      <text x=\"244\" y=\"158\">related only by startup time</text>\n      <text x=\"244\" y=\"190\">StringUtils</text>\n      <text x=\"244\" y=\"222\">same file. that's all.</text>\n    </g>\n    <text x=\"30\" y=\"120\" font-size=\"8.6\" fill=\"var(--ink3)\" transform=\"rotate(-90 30 120)\" text-anchor=\"middle\">best to worst</text>\n  </g>\n</svg>", "lcom": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"8\" y=\"28\" width=\"84\" height=\"112\"/>\n    <rect x=\"108\" y=\"28\" width=\"84\" height=\"112\" stroke=\"var(--acc)\" fill=\"var(--accBg)\"/>\n    <rect x=\"208\" y=\"28\" width=\"84\" height=\"112\"/>\n    <g stroke-width=\"1.3\">\n      <circle cx=\"34\" cy=\"52\" r=\"8\"/><circle cx=\"66\" cy=\"52\" r=\"8\"/>\n      <rect x=\"20\" y=\"86\" width=\"17\" height=\"15\"/><rect x=\"42\" y=\"86\" width=\"17\" height=\"15\"/>\n      <rect x=\"64\" y=\"86\" width=\"17\" height=\"15\"/><rect x=\"42\" y=\"112\" w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"112\" y=\"62\" width=\"76\" height=\"46\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <path d=\"M16 48 H112 M16 85 H112 M16 122 H112\"/>\n      <path d=\"M104 44 l8 4 l-8 4 M104 81 l8 4 l-8 4 M104 118 l8 4 l-8 4\"/>\n      <path d=\"M188 62 H284 M188 85 H284 M188 108 H284\"/>\n      <path d=\"M276 58 l8 4 l-8 4 M276 81 l8 4 l-8 4 M276 104 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\">\n    <text x=\"150\" y=\"89\" text-anchor=\"middle\" fill=\"var(--acc)\">your module</text>\n    <text x=\"16\" y=\"30\" fill=\"var(--ink)\">AFFERENT — incoming</text>\n    <text x=\"16\" y=\"42\" font-size=\"8.2\" fill=\"var(--ink2)\">who depends on you</text>\n    <text x=\"284\" y=\"30\" text-anchor=\"end\" fill=\"var(--ink)\">EFFERENT — outgoing</text>\n    <text x=\"284\" y=\"42\" font-size=\"8.2\" text-anchor=\"end\" fill=\"var(--ink2)\">who you depend on</text>\n    <text x=\"150\" y=\"152\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink2)\">a before e, like in before out · the e in efferent is the e in exit</text>\n    <text x=\"150\" y=\"168\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--acc)\">instability I = Ce / (Ce + Ca) — how easily you break when things change</text>\n  </g>\n</svg>", "main-sequence": "<svg viewBox=\"0 0 620 300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M92 254 H556 M92 254 V40\"/>\n    <path d=\"M548 250 l8 4 l-8 4 M88 48 l4 -8 l4 8\" stroke-width=\"1.2\"/>\n    <path d=\"M92 40 L556 254\" stroke=\"var(--acc)\" stroke-width=\"2.2\"/>\n    <circle cx=\"556\" cy=\"40\" r=\"52\" fill=\"var(--accBg)\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <circle cx=\"92\" cy=\"254\" r=\"52\" fill=\"var(--accBg)\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <circle cx=\"248\" cy=\"196\" r=\"5\" fill=\"var(--ink)\" stroke=\"none\"/>\n    <path d=\"M248 196 L316 133\" stroke=\"var(--ink3)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"70\" y=\"44\" font-size=\"10\" text-anchor=\"end\" fill=\"var(--ink)\">1</text>\n    <text x=\"70\" y=\"258\" font-size=\"10\" text-anchor=\"end\" fill=\"var(--ink)\">0</text>\n    <text x=\"556\" y=\"272\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--ink)\">1</text>\n    <text x=\"46\" y=\"150\" font-size=\"9.6\" fill=\"var(--ink)\" transform=\"rotate(-90 46 150)\" text-anchor=\"middle\">ABSTRACTNESS</text>\n    <text x=\"324\" y=\"288\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"var(--ink)\">INSTABILITY</text>\n    <text x=\"504\" y=\"34\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"var(--ink)\">ZONE OF USELESSNESS</text>\n    <text x=\"504\" y=\"47\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">so abstract nobody</text>\n    <text x=\"504\" y=\"58\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">can work out how to use it</text>\n    <text x=\"142\" y=\"238\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"var(--ink)\">ZONE OF PAIN</text>\n    <text x=\"142\" y=\"251\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">all implementation,</text>\n    <text x=\"142\" y=\"262\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">brittle, hard to change</text>\n    <text x=\"330\" y=\"128\" font-size=\"9.4\" fill=\"var(--acc)\">D = |A + I − 1|</text>\n    <text x=\"330\" y=\"141\" font-size=\"8.4\" fill=\"var(--ink2)\">distance from the line</text>\n    <text x=\"380\" y=\"196\" font-size=\"8.6\" fill=\"var(--acc)\">the main sequence — the healthy mix</text>\n  </g>\n</svg>", "connascence": "<svg viewBox=\"0 0 620 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"8\" y=\"40\" width=\"60\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"76\" y=\"40\" width=\"60\" height=\"52\"/><rect x=\"144\" y=\"40\" width=\"60\" height=\"52\"/>\n    <rect x=\"212\" y=\"40\" width=\"60\" height=\"52\"/><rect x=\"280\" y=\"40\" width=\"60\" height=\"52\"/>\n    <rect x=\"348\" y=\"40\" width=\"60\" height=\"52\" stroke=\"var(--ink3)\"/><rect x=\"416\" y=\"40\" width=\"60\" height=\"52\" stroke=\"var(--ink3)\"/>\n    <rect x=\"484\" y=\"40\" width=\"60\" height=\"52\" stroke=\"var(--ink3)\"/><rect x=\"552\" y=\"40\" width=\"60\" height=\"52\" stroke=\"var(--ink3)\"/>\n    <path d=\"M8 120 H612\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <path d=\"M604 116 l8 4 l-8 4\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <path d=\"M340 30 V104\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"8\" y=\"24\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--acc)\">STATIC — visible in the source</text>\n    <text x=\"612\" y=\"24\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"end\" fill=\"var(--ink2)\">DYNAMIC — only visible at runtime</text>\n    <g font-size=\"9.6\" fill=\"var(--ink)\">\n      <text x=\"38\" y=\"62\" fill=\"var(--acc)\">name</text><text x=\"106\" y=\"62\">type</text>\n      <text x=\"174\" y=\"62\">meaning</text><text x=\"242\" y=\"62\">position</text><text x=\"310\" y=\"62\">algorithm</text>\n      <text x=\"378\" y=\"62\">execution</text><text x=\"446\" y=\"62\">timing</text>\n      <text x=\"514\" y=\"62\">values</text><text x=\"582\" y=\"62\">identity</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"38\" y=\"80\">rename it</text><text x=\"106\" y=\"80\">agree a type</text>\n      <text x=\"174\" y=\"80\">magic number</text><text x=\"242\" y=\"80\">arg order</text><text x=\"310\" y=\"80\">same hash</text>\n      <text x=\"378\" y=\"80\">call order</text><text x=\"446\" y=\"80\">race</text>\n      <text x=\"514\" y=\"80\">change together</text><text x=\"582\" y=\"80\">same instance</text>\n    </g>\n    <text x=\"60\" y=\"138\" font-size=\"8.6\" fill=\"var(--ink2)\">weaker · trivial to refactor</text>\n    <text x=\"560\" y=\"138\" font-size=\"8.6\" fill=\"var(--ink2)\">stronger · expensive to unpick</text>\n    <g font-size=\"9\" fill=\"var(--ink)\">\n      <text x=\"310\" y=\"170\">Rule of Degree — convert strong forms into weaker ones.</text>\n      <text x=\"310\" y=\"188\" fill=\"var(--acc)\">Rule of Locality — the further apart the code, the weaker the form must be.</text>\n      <text x=\"310\" y=\"208\" font-size=\"8.4\" fill=\"var(--ink2)\">Jim Weirich, on Meilir Page-Jones</text>\n    </g>\n  </g>\n</svg>", "locality": "<svg viewBox=\"0 0 300 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"10\" y=\"30\" width=\"118\" height=\"72\" stroke-dasharray=\"6 4\" stroke=\"var(--acc)\" fill=\"var(--accBg)\"/>\n    <rect x=\"26\" y=\"48\" width=\"34\" height=\"24\"/><rect x=\"78\" y=\"48\" width=\"34\" height=\"24\"/>\n    <path d=\"M60 60 H78\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n\n    <rect x=\"166\" y=\"30\" width=\"56\" height=\"72\" stroke-dasharray=\"6 4\" stroke=\"var(--ink3)\"/>\n    <rect x=\"238\" y=\"30\" width=\"52\" height=\"72\" stroke-dasharray=\"6 4\" stroke=\"var(--ink3)\"/>\n    <rect x=\"178\" y=\"48\" width=\"32\" height=\"24\"/><rect x=\"248\" y=\"48\" width=\"32\" height=\"24\"/>\n    <path d=\"M210 60 H248\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n    <path d=\"M222 52 l14 16 M236 52 l-14 16\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\" text-anchor=\"middle\">\n    <text x=\"69\" y=\"22\" font-size=\"9.4\" fill=\"var(--acc)\">SAME MODULE</text>\n    <text x=\"228\" y=\"22\" font-size=\"9.4\" fill=\"var(--ink)\">ACROSS MODULES</text>\n    <text x=\"69\" y=\"120\" fill=\"var(--ink2)\">strong connascence</text>\n    <text x=\"69\" y=\"131\" fill=\"var(--ink2)\">here is tolerable</text>\n    <text x=\"228\" y=\"120\" fill=\"var(--ink2)\">the same coupling</text>\n    <text x=\"228\" y=\"131\" fill=\"var(--ink2)\">here is a defect</text>\n    <text x=\"150\" y=\"158\" fill=\"var(--ink)\">minimise it overall · minimise what crosses a boundary</text>\n    <text x=\"150\" y=\"172\" fill=\"var(--acc)\">maximise it inside one — that is what a boundary is for</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
