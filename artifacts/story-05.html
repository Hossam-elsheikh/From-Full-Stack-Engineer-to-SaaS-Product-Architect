/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */

.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}

.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}

/* ---------- the book's own words ---------- */

.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

<script>
const D={"ch": "05", "book": "Chapter 5 · Identifying Architectural Characteristics", "pages": "pp. 67–79", "title": "Translating What the Business Said", "gist": "Stakeholders talk about time to market and user satisfaction; architects talk about deployability and fault tolerance. This chapter is the translation table, the trap of composite characteristics, and a technique for getting a room of people down to three priorities.", "read": "5 min · 45 sec to re-scan", "acc": {"l": "#6B4276", "d": "#C296CE"}, "minute": ["Characteristics come from three places: **domain concerns**, **requirements documents**, and your own **implicit domain knowledge** of that industry.", "The business and the architect speak different languages. *Time to market* means agility, testability, deployability. *Mergers and acquisitions* means interoperability, scalability, adaptability, extensibility. Translating is the work.", "**Composite characteristics** — agility, for one — have no objective definition. Break them into measurable parts before you design for them, and never pick just one of the parts.", "**Scalability** is more users over time; **elasticity** is bursts. A hotel booking system needs the first, a concert-ticket system needs the second, and they are not the same design.", "Overspecifying is as damaging as underspecifying. Ask stakeholders to rank everything and the answer is “all of them” — so use a **seven-slot worksheet and pick the top three, in any order**."], "sections": [{"t": "The translation table", "art": "translate", "wide": true, "alt": "Five business concerns on the left mapped to the architecture characteristics that support them", "cap": "Table 5-1 · say “availability” to a stakeholder and you lose the room; say it as *user satisfaction* and you keep it.", "p": "Most characteristics come out of listening to domain stakeholders, and the obstacle is vocabulary. They talk about mergers, user satisfaction, time to market and competitive advantage; you talk about interoperability, fault tolerance and learnability. Neither side can act on the other's words until someone translates — and knowing the key domain goals is what makes an architecture decision justifiable rather than merely defensible."}, {"t": "Composite characteristics have to be broken up", "art": "composite", "alt": "Agility cracking into three measurable parts: deployability, modularity and testability", "cap": "There is no unit of agility. There are units of deployability, modularity and testability.", "p": "The common false equivalence is *agility = time to market*. Agility has no single objective definition; it is composed of other things that can actually be measured. Decomposing composites and giving the parts objective definitions is part of the job — and it is what makes governance possible at all (Ch. 6)."}, {"k": "decision", "t": "“End-of-day fund pricing must complete on time”", "art": "composite", "alt": "Agility cracking into three measurable parts: deployability, modularity and testability", "sit": "A domain stakeholder tells you, with regulators in mind, that end-of-day fund pricing absolutely must finish on time. The concern is obviously about speed.", "opts": [["Design for performance. That's what they asked for.", "This is the flour-missing-from-the-cake antipattern: picking the one visible part of a composite. It doesn't matter how fast the system is if it isn't up, can't cope as funds are added, crashes at 85%, or prices things wrongly."], ["Decompose the concern, then design for all of it.", "Performance **and** availability (it must be there), scalability (more funds every year), reliability (it must not crash mid-run), recoverability (restart from 85%, not from zero) and auditability (the prices must be right, provably).", 1]], "verdict": "Business goals arrive as composites almost every time. The architect's contribution is to take one sentence from a stakeholder and return six characteristics with objective definitions — not to design against the sentence as written."}, {"t": "Scalability is not elasticity", "art": "scale-vs-elastic", "alt": "A rising curve of users over time beside a spiky burst graph", "cap": "Figs. 5-1 and 5-2 · one is a slope, one is a spike. They need different designs.", "p": "A sandwich-shop brief that says “thousands, perhaps millions of users” is asking for scalability out loud. It is also asking for elasticity silently, because nobody eats evenly across the day — traffic arrives at mealtimes. Requirements sometimes state a characteristic outright; more often it lurks in the domain and you are expected to find it."}, {"t": "Deriving characteristics: Silicon Sandwiches", "art": "sandwiches", "wide": true, "alt": "Two columns of characteristics derived from the kata, explicit on the left and implicit on the right", "cap": "Architecture katas — Ted Neward's idea — give you a brief, some users, requirements and additional context.", "p": "Work through a brief line by line and most requirements contribute nothing structural. “Dispatch the driver with the order” needs no special characteristic. But “thousands, perhaps millions” is scalability, “national and local promotions” is customizability, “plans to expand overseas” is internationalization, and “franchised, each with a different owner” is a cost constraint — check feasibility before designing anything expensive.", "quotes": [["How do we get great designers? Great designers design, of course.", "Fred Brooks", "The argument for katas. An architect might design half a dozen real systems in a career, which is not enough repetitions to get good at it by accident."]]}, {"k": "decision", "t": "The external traffic service is down", "art": "scale-vs-elastic", "alt": "A rising curve of users over time beside a spiky burst graph", "sit": "Pickup customers get directions to the shop, integrated with external mapping services that include traffic information. That's a third-party integration point, and third-party calls fail.", "opts": [["Treat the integration as required and design hard for reliability around it.", "You have just made a sandwich shop's ordering system depend on a traffic API. Now a stranger's outage takes your orders offline, and you paid design effort for the privilege."], ["Degrade: show directions without traffic information.", "Slightly less efficient directions, orders still flowing. The characteristic you needed was not high reliability of the integration — it was not being brittle.", 1]], "verdict": "Integration points do affect reliability, and it is right to notice them. It is equally right to **guard against building unnecessary brittleness or fragility into a design**. Overspecifying a characteristic is a real cost, not a safe default."}, {"k": "decision", "t": "Customizability: architecture, or design?", "art": "sandwiches", "alt": "Two columns of characteristics derived from the kata, explicit on the left and implicit on the right", "sit": "National promotions, local promotions, locally overridden directions, regional recipes. Several parts of the domain need custom behaviour. Do you build structure for it, or write it in the application?", "opts": [["Microkernel: default behaviour in the core, the custom parts as plug-ins.", "Structural support for customisation, and the style is built for exactly this (Ch. 13). It also brings its own costs in performance and coupling that may fight your other characteristics."], ["A design pattern — Template Method — inside whatever style you pick.", "A parent class defines the workflow and children override the varying parts. No structural commitment, and you keep the style you chose for other reasons."], ["Decide it with the tech lead, the developers and the domain analysts.", "Whichever of the two you land on, this is the part that isn't optional. An architecture decision made alone, away from the people implementing it, is the **Ivory Tower** antipattern.", 1]], "verdict": "Three questions settle the first two options: are there good reasons *not* to use microkernel here? Are other desirable characteristics harder in one design than the other? And what does supporting it in the architecture cost, versus supporting it in the design? A characteristic only becomes architectural when part of the domain **relies on custom structure** to support it."}, {"t": "Limit the list, then pick three", "art": "worksheet", "wide": true, "alt": "A worksheet with seven driving slots, a column of implicit characteristics, and an others-considered column", "cap": "Fig. 5-3 · seven slots, because a list has to stop somewhere.", "items": ["Implicit characteristics sit in their own column; **pull one left** when it becomes a genuine driver for this system.", "When the seven slots are full and something better appears, the loser moves right into *others considered* — nothing is deleted, so the reasoning survives.", "Then ask the stakeholders for the **top three, in any order**. Ranking all seven never reaches consensus and produces frustration; picking three does, and it starts the conversation about what actually matters.", "A useful counter-exercise: ask which characteristic you would **remove** if forced. Explicit ones usually go first, since implicit ones tend to underpin general success."], "p": "Ask a room full of stakeholders which characteristics they want and the answer is always “all of them”. The Vasa was built that way — troop transport *and* gunship, two decks instead of one, every cannon twice the usual size. It capsized in Stockholm harbour firing its own salute.", "quotes": [["There are no wrong answers in architecture, only expensive ones.", "Mark Richards", ""]]}, {"t": "The Vasa", "art": "vasa", "alt": "A top-heavy two-decked warship listing over", "cap": "Built 1626–28 for a king who wanted every characteristic at once. Sank on its maiden voyage; salvaged in 1961; now a museum.", "p": "The shipbuilders had doubts and could not say no to King Adolphus. Every characteristic added, none removed, and the result was top-heavy. Don't obsess over the exact number in your list — but do remember what the number is for: keeping the design simple enough to build."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 5: Identifying Architectural Characteristics, pp. 67–79. Architecture katas are Ted Neward's; the Silicon Sandwiches kata runs through several later chapters.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"translate": "<svg viewBox=\"0 0 620 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M6 40 H614\" stroke=\"var(--rule)\"/>\n    <path d=\"M6 78 H614 M6 116 H614 M6 154 H614 M6 192 H614\" stroke=\"var(--rule2)\"/>\n    <path d=\"M212 22 V226\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M196 60 h10 M196 98 h10 M196 136 h10 M196 174 h10 M196 212 h10\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"6\" y=\"16\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">WHAT THE BUSINESS SAYS</text>\n    <text x=\"228\" y=\"16\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--acc)\">WHAT YOU HAVE TO BUILD</text>\n    <g font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"end\">\n      <text x=\"188\" y=\"64\">mergers and acquisitions</text>\n      <text x=\"188\" y=\"102\">time to market</text>\n      <text x=\"188\" y=\"140\">user satisfaction</text>\n      <text x=\"188\" y=\"178\">competitive advantage</text>\n      <text x=\"188\" y=\"216\">time and budget</text>\n    </g>\n    <g font-size=\"9.4\" fill=\"var(--acc)\">\n      <text x=\"228\" y=\"64\">interoperability · scalability · adaptability · extensibility</text>\n      <text x=\"228\" y=\"102\">agility · testability · deployability</text>\n      <text x=\"228\" y=\"134\">performance · availability · fault tolerance ·</text>\n      <text x=\"228\" y=\"147\">testability · deployability · agility · security</text>\n      <text x=\"228\" y=\"172\">agility · testability · deployability ·</text>\n      <text x=\"228\" y=\"185\">scalability · availability · fault tolerance</text>\n      <text x=\"228\" y=\"216\">simplicity · feasibility</text>\n    </g>\n    <text x=\"310\" y=\"240\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink2)\">Table 5-1 · neither side can hear the other until someone translates</text>\n  </g>\n</svg>", "composite": "<svg viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"96\" y=\"20\" width=\"108\" height=\"34\" stroke-dasharray=\"6 4\" stroke=\"var(--ink3)\"/>\n    <path d=\"M150 54 V78\" stroke=\"var(--ink3)\"/>\n    <path d=\"M60 78 H240 M60 78 V96 M150 78 V96 M240 78 V96\" stroke=\"var(--ink3)\"/>\n    <rect x=\"16\" y=\"96\" width=\"86\" height=\"38\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"108\" y=\"96\" width=\"86\" height=\"38\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"200\" y=\"96\" width=\"86\" height=\"38\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"150\" y=\"42\" font-size=\"12\" fill=\"var(--ink2)\">agility</text>\n    <text x=\"150\" y=\"14\" font-size=\"8.4\" fill=\"var(--ink3)\">no objective definition · nothing to measure</text>\n    <text x=\"59\" y=\"112\" font-size=\"9.4\" fill=\"var(--acc)\">deployability</text>\n    <text x=\"151\" y=\"112\" font-size=\"9.4\" fill=\"var(--acc)\">modularity</text>\n    <text x=\"243\" y=\"112\" font-size=\"9.4\" fill=\"var(--acc)\">testability</text>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"59\" y=\"126\">measurable</text><text x=\"151\" y=\"126\">measurable</text><text x=\"243\" y=\"126\">measurable</text>\n    </g>\n    <text x=\"150\" y=\"164\" font-size=\"9\" fill=\"var(--ink)\">a composite has to be broken up before</text>\n    <text x=\"150\" y=\"177\" font-size=\"9\" fill=\"var(--ink)\">it can be measured or governed</text>\n    <text x=\"150\" y=\"197\" font-size=\"8.4\" fill=\"var(--acc)\">picking only one of the parts is the common antipattern</text>\n  </g>\n</svg>", "scale-vs-elastic": "<svg viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M22 84 H136 M22 84 V16\"/>\n    <path d=\"M22 78 C50 70 74 52 92 38 C106 28 120 24 134 22\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n    <path d=\"M170 84 H284 M170 84 V16\"/>\n    <path d=\"M170 76 H186 L192 26 L198 76 H222 L228 22 L234 76 H258 L264 34 L270 76 H282\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n    <path d=\"M22 190 H284\" stroke=\"var(--rule)\" stroke-dasharray=\"4 5\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"79\" y=\"106\" font-size=\"9.6\" fill=\"var(--ink)\">SCALABILITY</text>\n    <text x=\"227\" y=\"106\" font-size=\"9.6\" fill=\"var(--acc)\">ELASTICITY</text>\n    <g font-size=\"8.4\" fill=\"var(--ink2)\">\n      <text x=\"79\" y=\"122\">more users, over time</text>\n      <text x=\"79\" y=\"134\">without degrading</text>\n      <text x=\"227\" y=\"122\">bursts — the spike</text>\n      <text x=\"227\" y=\"134\">is the whole problem</text>\n      <text x=\"79\" y=\"156\">hotel reservations:</text><text x=\"79\" y=\"167\">seasonal, predictable</text>\n      <text x=\"227\" y=\"156\">concert tickets:</text><text x=\"227\" y=\"167\">everyone at 09:00</text>\n    </g>\n    <text x=\"150\" y=\"206\" font-size=\"8.6\" fill=\"var(--ink2)\">often lumped together, but a system can be one and not the other</text>\n  </g>\n</svg>", "sandwiches": "<svg viewBox=\"0 0 620 224\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"34\" width=\"298\" height=\"150\"/>\n    <rect x=\"316\" y=\"34\" width=\"298\" height=\"150\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M6 60 H304 M316 60 H614\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"6\" y=\"18\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">SILICON SANDWICHES — WHAT THE KATA ACTUALLY YIELDS</text>\n    <text x=\"155\" y=\"52\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--ink)\">EXPLICIT — stated in the brief</text>\n    <text x=\"465\" y=\"52\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--acc)\">IMPLICIT — you have to know</text>\n    <g font-size=\"9.4\" fill=\"var(--ink)\">\n      <text x=\"20\" y=\"82\">scalability</text><text x=\"20\" y=\"104\">performance</text><text x=\"20\" y=\"126\">customizability</text>\n      <text x=\"20\" y=\"148\">internationalization</text><text x=\"20\" y=\"170\">feasibility (cost)</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"140\" y=\"82\">“thousands, perhaps millions”</text>\n      <text x=\"140\" y=\"104\">nobody waits for a sandwich site</text>\n      <text x=\"140\" y=\"126\">national and local promotions</text>\n      <text x=\"140\" y=\"148\">“plans to expand overseas”</text>\n      <text x=\"140\" y=\"170\">franchised, each owner pays</text>\n    </g>\n    <g font-size=\"9.4\" fill=\"var(--acc)\">\n      <text x=\"330\" y=\"82\">elasticity</text><text x=\"330\" y=\"104\">availability</text><text x=\"330\" y=\"126\">stability</text>\n      <text x=\"330\" y=\"148\">security</text><text x=\"330\" y=\"170\">usability</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"430\" y=\"82\">nobody said “mealtimes”</text>\n      <text x=\"430\" y=\"104\">the site has to be there</text>\n      <text x=\"430\" y=\"126\">don't drop them mid-order</text>\n      <text x=\"430\" y=\"148\">third-party payments, hygiene</text>\n      <text x=\"430\" y=\"170\">“hire inexpensive labour”</text>\n    </g>\n    <text x=\"310\" y=\"204\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink)\">the brief said “thousands of users” — it never said the word scalability</text>\n    <text x=\"310\" y=\"218\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">decoding domain language into engineering language is most of this job</text>\n  </g>\n</svg>", "worksheet": "<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"30\" width=\"290\" height=\"182\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"312\" y=\"30\" width=\"140\" height=\"182\"/>\n    <rect x=\"468\" y=\"30\" width=\"146\" height=\"182\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.2\">\n      <path d=\"M18 62 h266 M18 86 h266 M18 110 h266 M18 134 h266 M18 158 h266 M18 182 h266 M18 202 h266\"/>\n      <rect x=\"18\" y=\"52\" width=\"11\" height=\"11\"/><rect x=\"18\" y=\"76\" width=\"11\" height=\"11\"/><rect x=\"18\" y=\"124\" width=\"11\" height=\"11\"/>\n    </g>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M324 62 h116 M324 86 h116 M324 110 h116 M324 134 h116 M324 158 h116 M324 182 h116\"/>\n      <path d=\"M480 62 h122 M480 86 h122 M480 110 h122\"/>\n      <path d=\"M452 96 h16 M460 92 l8 4 l-8 4\"/>\n      <path d=\"M312 96 h-16\" /><path d=\"M300 92 l-8 4 l8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"6\" y=\"20\" font-size=\"9.6\" fill=\"var(--acc)\">DRIVING CHARACTERISTICS — seven slots</text>\n    <text x=\"312\" y=\"20\" font-size=\"9.6\" fill=\"var(--ink)\">IMPLICIT</text>\n    <text x=\"468\" y=\"20\" font-size=\"9.6\" fill=\"var(--ink2)\">OTHERS CONSIDERED</text>\n    <g font-size=\"8.4\" fill=\"var(--ink2)\">\n      <text x=\"34\" y=\"60\">scalability</text><text x=\"34\" y=\"84\">availability</text><text x=\"34\" y=\"132\">elasticity</text>\n      <text x=\"324\" y=\"60\">security</text><text x=\"324\" y=\"84\">maintainability</text><text x=\"324\" y=\"108\">observability</text>\n    </g>\n    <text x=\"6\" y=\"230\" font-size=\"8.6\" fill=\"var(--ink)\">Fig. 5-3 · pull an implicit one left when it becomes a driver; push a loser right when the slots fill.</text>\n    <text x=\"6\" y=\"244\" font-size=\"8.6\" fill=\"var(--acc)\">Then tick the top three — in any order. Ranking all seven never reaches consensus.</text>\n  </g>\n</svg>", "vasa": "<svg viewBox=\"0 0 300 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <g transform=\"rotate(-24 150 120)\">\n      <path d=\"M74 128 h152 l-20 26 h-112 z\"/>\n      <path d=\"M74 104 h152 v24 H74 z\"/>\n      <path d=\"M86 80 h128 v24 H86 z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n      <path d=\"M150 80 V26\"/>\n      <path d=\"M150 30 h44 v22 h-44\"/>\n      <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n        <circle cx=\"100\" cy=\"116\" r=\"4\"/><circle cx=\"124\" cy=\"116\" r=\"4\"/><circle cx=\"150\" cy=\"116\" r=\"4\"/>\n        <circle cx=\"176\" cy=\"116\" r=\"4\"/><circle cx=\"200\" cy=\"116\" r=\"4\"/>\n        <circle cx=\"106\" cy=\"92\" r=\"4\"/><circle cx=\"132\" cy=\"92\" r=\"4\"/><circle cx=\"158\" cy=\"92\" r=\"4\"/><circle cx=\"184\" cy=\"92\" r=\"4\"/>\n      </g>\n    </g>\n    <path d=\"M8 176 q22 -8 44 0 t44 0 t44 0 t44 0 t44 0 t44 0\" stroke=\"var(--ink3)\" stroke-width=\"1.4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"150\" y=\"18\" font-size=\"9.6\" fill=\"var(--acc)\">THE VASA, 1628</text>\n    <g font-size=\"8.4\" fill=\"var(--ink2)\">\n      <text x=\"150\" y=\"196\">troop transport AND gunship · two decks instead of one</text>\n      <text x=\"150\" y=\"207\">every cannon twice the usual size · capsized in the harbour</text>\n    </g>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
