/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- the book's own words ---------- */

.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

<script>
const D={"ch": "26", "book": "Chapter 26 · Architectural Intersections", "pages": "pp. 469–487", "title": "Nine Things That Must Point the Same Way", "gist": "A correct architecture can still fail. Nine alignments decide whether it works in practice — and the ones architects skip are the ones that take systems down at 80,000 concurrent users.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#4E6B58", "d": "#9CC2A9"}, "minute": ["**Implementation** must align on three things: operational concerns, structural integrity (the source tree *is* the logical architecture), and constraints.", "**Infrastructure**: an architecture that *can* support scalability won't unless the infrastructure does. Pets.com is the cautionary case — too much success killed the business.", "**Data topologies**: topology, database characteristics, data structure and read/write priority all have to match. The wrong choice cancels out the architecture's superpowers.", "**Engineering practices** are separate from process. Building microservices with manual provisioning, manual deployment and little testing fails regardless of the design.", "**Business environment**: cost-cutting doesn't align with microservices or space-based; aggressive M&A doesn't align with a monolith. *All architectures become iterative because of unknown unknowns — Agile just recognises it sooner.*"], "sections": [{"t": "The nine intersections", "art": "intersections", "wide": true, "alt": "Nine alignments arranged around the architecture at the centre", "cap": "Implementation · infrastructure · data topologies · engineering practices · team topologies · systems integration · enterprise · business environment · generative AI.", "p": "An architect's second most common response, after *“it depends”*, is **“that's an implementation detail.”** When an architecture fails to achieve its goals, that second response is often to blame."}, {"k": "decision", "t": "The team added a replicated cache and the system died at 80,000 users", "art": "cache-mismatch", "wide": true, "alt": "An inventory service replicating a cache into order placement instances, and instances running out of memory", "sit": "You chose microservices for a system needing anywhere from a few thousand to half a million concurrent customers — the right call on scalability and elasticity. In implementation, the team found that Order Placement couldn't reach the inventory database directly and had to call the Inventory service synchronously, which coupled them and hurt responsiveness. So they introduced an **in-memory replicated cache**.", "opts": [["The team was wrong to change the design.", "They weren't. The cache decoupled the services and significantly improved responsiveness — a good decision, made for good reasons, using a legitimate technique (Hazelcast, Apache Ignite)."], ["The architecture was wrong.", "It wasn't either. Microservices was the right style for the scalability and elasticity requirements."], ["Neither was wrong. They were optimising for different goals, and nobody checked.", "The architecture pursued scalability and elasticity; the implementation pursued responsiveness and decoupling. As instances multiplied, the cache's memory demand caused out-of-memory conditions across every VM at around **80,000 concurrent customers**.", 1]], "verdict": "This is what misalignment looks like from the inside: **two sets of good decisions serving different objectives**, invisible until production load exposes them. It is also the strongest argument in the book for the collaboration model from Chapter 24 — an architect who hands the design over and leaves has no mechanism to catch this."}, {"t": "Structural integrity and constraints", "art": "structure", "wide": true, "alt": "An ungoverned tangle of directories beside a governed structure matching the logical architecture", "cap": "Figs. 26-2 and 26-3 · the same system, with and without governance on its source structure.", "items": ["**Structural integrity** — logical components live in directories and namespaces, so *the source tree is the logical architecture*. Without guidance and governance, developers create structures as they please, and the result is hard to maintain, test, deploy and evolve. Automate it: ArchUnit, ArchUnitNet, NetArchTest, PyTestArch, TSArch.", "**Constraints** — governing rules the implementation must obey or the architecture fails. For a tight-budget system expecting frequent database changes, layered is a good fit, but only with two constraints: *all database logic lives in the Persistence layer*, and *Presentation must go through every layer, even for simple queries*.", "Break those and you get exactly what the constraints existed to prevent: UI developers calling the database directly for speed, backend developers merging business and database logic because it's easier to test — and now a dropped column touches code in every layer, and the business goal the style was chosen for is gone."]}, {"t": "Infrastructure, data and engineering practices", "art": "data-align", "wide": true, "alt": "Four ways data can be misaligned: topology, characteristics, structure and read/write priority", "cap": "Databases have superpowers too. Match them to the architecture's.", "items": ["**Infrastructure.** Pets.com had a superstar sock-puppet mascot and no infrastructure. Orders arrived, the site was slow, transactions were lost, deliveries were late, and it closed after one Christmas — selling the mascot as its last valuable asset. **Too much success can kill a business**, and that is where elastic scale came from.", "**Cloud can still misalign.** Deploying across regions or availability zones can cancel out the benefits of replicated and distributed caches; co-locating services or Kubernetes pods on one VM raises performance while damaging scalability, fault tolerance, availability and elasticity.", "**Data.** Four checks: does the topology match the style (microservices requires database-per-service); do the database's characteristics amplify the architecture's (key-value and columnar scale, like the styles that need scaling); does the structure fit (key-value pairs in a relational database is waste — use polyglot databases); and does the read/write priority match (write-heavy → columnar, read-heavy → key-value, document or graph, balanced → relational or NewSQL).", "**Engineering practices are not process.** Process is how teams form, meet and organise; practices are the process-agnostic techniques — XP, CI, CD, TDD. Microservices *assumes* automated provisioning, testing and deployment. Attempting it with an antiquated operations group and manual processes will likely fail whatever the design says."], "p": "Note the historical shape of the infrastructure intersection. In the 1990s and 2000s, operations was outsourced and outside the architect's control, so architects built **elaborate internal machinery** for scale and elasticity — and vastly more complex architectures as a result. The creators of microservices concluded that operational concerns are better handled by operations, teamed up with them, and the collaboration became DevOps."}, {"k": "decision", "t": "The business is in severe cost-cutting. The team wants microservices.", "art": "intersections", "wide": true, "alt": "Nine alignments arranged around the architecture at the centre", "sit": "The company is cutting costs aggressively to stay afloat. The engineering team is proposing a microservices migration on the strength of its scalability, deployability and evolvability ratings.", "opts": [["Approve it — the ratings are the best in the book.", "Microservices and space-based are the two most **expensive** styles to create and operate. Excellent ratings in the columns that don't currently matter, bought with money the business doesn't have."], ["Match the architecture to the business environment.", "**Domain-to-architecture isomorphism**: read the company's position and direction and align to it. Cost-cutting doesn't fit microservices; a business expanding aggressively through mergers doesn't fit a monolith that can't evolve.", 1]], "verdict": "The recurring hazard here is **unknown unknowns** — Rumsfeld's third category, and the reason Big Design Up Front always suffers. As Mark Richards puts it: *all architectures become iterative because of unknown unknowns; Agile just recognises this and does it sooner.* The mitigations are evolutionary and iterative architecture, plus characteristics that keep options open — portability, scalability, evolvability, adaptability. Barry O'Reilly's **residuality theory** treats business changes as *stressors* and architectural responses as *residues*, on the theory that enough residues start covering changes nobody could have predicted."}, {"t": "Generative AI, as a component and as an assistant", "art": "cache-mismatch", "wide": true, "alt": "An inventory service replicating a cache into order placement instances, and instances running out of memory", "cap": "Two separate intersections that get conflated.", "items": ["**As a component**: leverage **abstraction and modularity** so one LLM can be swapped for another quickly, and so you can add guardrails and evaluate results. A résumé-anonymising service needs to know whether the model removes too much or too little demographic information — which means gathering samples and metrics and comparing engines. Tools like Langfuse provide that observability.", "**As an assistant**: the authors report limited success. Asking whether microservices or space-based fits a situation *rarely if ever* yields the right answer, because everything is a trade-off and the wisdom required carries so much context that it's faster for the architect to solve the problem than to teach the model the environment. **The nine intersections in this chapter are themselves the evidence** of how much context that is.", "**What does show promise**: tools like Thoughtworks Haiven, which can read an architecture diagram directly and describe the architecture — saving the export to a machine-readable format — and then answer questions about bottlenecks and issues."], "p": "Two intersections that get less attention and cost as much: **systems integration** — availability, scale and responsiveness of the systems you call, plus protocols, contracts, compatible characteristics and whether the integration preserves each system's quantum — and **the enterprise**, where a technically excellent architecture that ignores enterprise standards, platforms and practices gets labelled a failed one-off and scrapped."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 26: Architectural Intersections, pp. 469–487. Residuality theory is Barry O'Reilly's.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"intersections": "<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"238\" y=\"102\" width=\"144\" height=\"46\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n    <rect x=\"8\" y=\"34\" width=\"132\" height=\"34\"/><rect x=\"8\" y=\"82\" width=\"132\" height=\"34\"/>\n    <rect x=\"8\" y=\"130\" width=\"132\" height=\"34\"/><rect x=\"8\" y=\"178\" width=\"132\" height=\"34\"/>\n    <rect x=\"480\" y=\"34\" width=\"132\" height=\"34\"/><rect x=\"480\" y=\"82\" width=\"132\" height=\"34\"/>\n    <rect x=\"480\" y=\"130\" width=\"132\" height=\"34\"/><rect x=\"480\" y=\"178\" width=\"132\" height=\"34\"/>\n    <rect x=\"244\" y=\"192\" width=\"132\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\">\n      <path d=\"M140 51 L238 108 M140 99 L238 116 M140 147 L238 130 M140 195 L238 142\"/>\n      <path d=\"M480 51 L382 108 M480 99 L382 116 M480 147 L382 130 M480 195 L382 142\"/>\n      <path d=\"M310 148 V192\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9\">\n    <text x=\"310\" y=\"130\" font-size=\"11\" fill=\"var(--acc)\">THE ARCHITECTURE</text>\n    <g fill=\"var(--ink2)\">\n      <text x=\"74\" y=\"55\">implementation</text><text x=\"74\" y=\"103\">infrastructure</text>\n      <text x=\"74\" y=\"151\">data topologies</text><text x=\"74\" y=\"199\">engineering practices</text>\n      <text x=\"546\" y=\"55\">team topologies</text><text x=\"546\" y=\"103\">systems integration</text>\n      <text x=\"546\" y=\"151\">the enterprise</text><text x=\"546\" y=\"199\">the business environment</text>\n      <text x=\"310\" y=\"213\">generative AI</text>\n    </g>\n    <text x=\"310\" y=\"244\" font-size=\"8.6\" fill=\"var(--ink)\">An architecture can be right and still fail, because one of these nine is pointing somewhere else.</text>\n  </g>\n</svg>", "cache-mismatch": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"30\" y=\"46\" width=\"120\" height=\"56\"/>\n    <rect x=\"230\" y=\"46\" width=\"120\" height=\"56\"/>\n    <rect x=\"44\" y=\"72\" width=\"92\" height=\"22\" stroke=\"var(--acc)\" stroke-width=\"1.7\" fill=\"var(--accBg)\"/>\n    <rect x=\"244\" y=\"72\" width=\"92\" height=\"22\" stroke=\"var(--acc)\" stroke-width=\"1.7\" fill=\"var(--accBg)\"/>\n    <path d=\"M150 83 H230\" stroke=\"var(--acc)\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <rect x=\"418\" y=\"34\" width=\"66\" height=\"24\"/><rect x=\"494\" y=\"34\" width=\"66\" height=\"24\"/>\n      <rect x=\"418\" y=\"66\" width=\"66\" height=\"24\"/><rect x=\"494\" y=\"66\" width=\"66\" height=\"24\"/>\n      <rect x=\"418\" y=\"98\" width=\"66\" height=\"24\"/><rect x=\"494\" y=\"98\" width=\"66\" height=\"24\"/>\n    </g>\n    <path d=\"M436 118 l108 26 M544 118 l-108 26\" stroke=\"var(--acc)\" stroke-width=\"2.4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"90\" y=\"62\" fill=\"var(--ink2)\">Inventory</text>\n    <text x=\"290\" y=\"62\" fill=\"var(--ink2)\">Order Placement</text>\n    <text x=\"90\" y=\"87\" font-size=\"7.4\" fill=\"var(--acc)\">writable cache</text>\n    <text x=\"290\" y=\"87\" font-size=\"7.4\" fill=\"var(--acc)\">read-only replica</text>\n    <text x=\"190\" y=\"76\" font-size=\"7.4\" fill=\"var(--acc)\">replicated</text>\n    <text x=\"490\" y=\"160\" font-size=\"8.4\" fill=\"var(--acc)\">out of memory at ~80,000 users</text>\n    <text x=\"310\" y=\"192\" font-size=\"9\" fill=\"var(--ink)\">The architecture optimised for scalability and elasticity. The implementation optimised for responsiveness and decoupling.</text>\n    <text x=\"310\" y=\"212\" font-size=\"8.6\" fill=\"var(--acc)\">Both teams made good decisions. They were serving different goals, and nobody noticed until production.</text>\n  </g>\n</svg>", "structure": "<svg viewBox=\"0 0 620 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\" stroke-linejoin=\"round\">\n    <rect x=\"8\" y=\"34\" width=\"290\" height=\"140\" stroke=\"var(--ink3)\" stroke-dasharray=\"6 4\"/>\n    <g stroke=\"var(--ink3)\">\n      <rect x=\"24\" y=\"50\" width=\"72\" height=\"20\"/><rect x=\"112\" y=\"62\" width=\"58\" height=\"20\"/>\n      <rect x=\"186\" y=\"48\" width=\"94\" height=\"20\"/><rect x=\"30\" y=\"86\" width=\"104\" height=\"20\"/>\n      <rect x=\"152\" y=\"94\" width=\"66\" height=\"20\"/><rect x=\"232\" y=\"82\" width=\"52\" height=\"20\"/>\n      <rect x=\"42\" y=\"124\" width=\"86\" height=\"20\"/><rect x=\"146\" y=\"132\" width=\"118\" height=\"20\"/>\n      <path d=\"M96 60 L112 72 M170 72 L186 58 M134 96 L152 104 M218 104 L232 92 M128 134 L146 142\"/>\n      <path d=\"M60 70 L70 86 M100 106 L110 124 M200 68 L210 82 M180 114 L190 132\"/>\n    </g>\n    <rect x=\"322\" y=\"34\" width=\"290\" height=\"140\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.5\">\n      <rect x=\"342\" y=\"52\" width=\"112\" height=\"24\"/><rect x=\"480\" y=\"52\" width=\"112\" height=\"24\"/>\n      <rect x=\"342\" y=\"94\" width=\"112\" height=\"24\"/><rect x=\"480\" y=\"94\" width=\"112\" height=\"24\"/>\n      <rect x=\"412\" y=\"136\" width=\"112\" height=\"24\"/>\n      <path d=\"M398 76 V94 M536 76 V94 M454 106 H480 M398 118 L468 136 M536 118 L468 136\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.4\">\n    <text x=\"153\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">NO GOVERNANCE</text>\n    <text x=\"467\" y=\"24\" font-size=\"9\" fill=\"var(--acc)\">ALIGNED</text>\n    <text x=\"153\" y=\"196\" fill=\"var(--ink2)\">developers made directories as they pleased.</text>\n    <text x=\"153\" y=\"208\" fill=\"var(--ink2)\">hard to maintain, test, deploy, evolve.</text>\n    <text x=\"467\" y=\"196\" fill=\"var(--acc)\">the source tree *is* the logical architecture.</text>\n    <text x=\"467\" y=\"208\" fill=\"var(--acc)\">ArchUnit · NetArchTest · PyTestArch · TSArch</text>\n    <text x=\"310\" y=\"222\" font-size=\"8.2\" fill=\"var(--ink)\">Structural integrity: if the directories don't match the logical architecture, the logical architecture is fiction.</text>\n  </g>\n</svg>", "data-align": "<svg viewBox=\"0 0 620 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"36\" width=\"146\" height=\"88\"/><rect x=\"160\" y=\"36\" width=\"146\" height=\"88\"/>\n    <rect x=\"314\" y=\"36\" width=\"146\" height=\"88\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"468\" y=\"36\" width=\"146\" height=\"88\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M6 62 H152 M160 62 H306 M314 62 H460 M468 62 H614\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"6\" y=\"26\" text-anchor=\"start\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">FOUR WAYS DATA CAN BE MISALIGNED WITH AN ARCHITECTURE</text>\n    <g font-size=\"9.6\" fill=\"var(--ink)\">\n      <text x=\"79\" y=\"54\">TOPOLOGY</text><text x=\"233\" y=\"54\">CHARACTERISTICS</text>\n      <text x=\"387\" y=\"54\" fill=\"var(--acc)\">STRUCTURE</text><text x=\"541\" y=\"54\" fill=\"var(--acc)\">READ / WRITE</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"79\" y=\"80\">monolithic, domain,</text><text x=\"79\" y=\"91\">or per service</text>\n      <text x=\"79\" y=\"108\">microservices needs</text><text x=\"79\" y=\"119\">per service. no choice.</text>\n      <text x=\"233\" y=\"80\">databases have superpowers</text><text x=\"233\" y=\"91\">too — match them</text>\n      <text x=\"233\" y=\"108\">key-value and columnar scale,</text><text x=\"233\" y=\"119\">like the styles that need it</text>\n      <text x=\"387\" y=\"80\">relational data in a relational DB.</text><text x=\"387\" y=\"91\">key-value pairs in one: waste.</text>\n      <text x=\"387\" y=\"108\">use polyglot databases</text><text x=\"387\" y=\"119\">wherever feasible</text>\n      <text x=\"541\" y=\"80\">write-heavy → columnar</text><text x=\"541\" y=\"91\">read-heavy → key-value,</text>\n      <text x=\"541\" y=\"102\">document or graph</text>\n      <text x=\"541\" y=\"119\">both → relational, NewSQL</text>\n    </g>\n    <text x=\"310\" y=\"158\" font-size=\"9\" fill=\"var(--ink)\">Monolithic databases give consistency and transactions, and cost scalability and fault tolerance.</text>\n    <text x=\"310\" y=\"176\" font-size=\"9\" fill=\"var(--acc)\">Distributed topologies give scalability and change control, and cost integrity, consistency and performance.</text>\n    <text x=\"310\" y=\"198\" font-size=\"8.4\" fill=\"var(--ink2)\">Choose the wrong one and it cancels out the characteristics you chose the architecture for.</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
