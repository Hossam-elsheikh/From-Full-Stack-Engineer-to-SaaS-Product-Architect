/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;

.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;

.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}

.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}

<script>
const D={"ch": "17", "book": "Chapter 17 · Orchestration-Driven Service-Oriented Architecture", "pages": "pp. 315–328", "title": "The Lesson Reuse Taught", "gist": "An architecture that made complete sense in its era and failed anyway. Worth knowing not to build, but to understand what the industry learned — because microservices, DDD and team topologies are all reactions to it.", "read": "4 min · 35 sec to re-scan", "acc": {"l": "#7A4A63", "d": "#CE9CB6"}, "minute": ["Born in the late 1990s under real constraints: per-machine OS licences, Byzantine database licensing, expensive everything. **Reuse was the rational response** to scarce, commercial computing resources.", "A strict **taxonomy of services**: business (signatures only, defined by analysts), enterprise (fine-grained shared implementations), application (one-off), infrastructure (operational). All stitched by an **orchestration engine**.", "**Reuse is implemented via coupling.** Consolidating six divisions' Customer into one canonical service means every change ripples to six divisions, and every division carries fields it doesn't use.", "The killer was **technical partitioning taken to its limit**: a change like “add an address line to CatalogCheckout” could touch dozens of services across several tiers plus a schema.", "Single quantum despite being distributed — one shared database, and an orchestration engine that couples everything to itself. **It found the disadvantages of both monolithic and distributed architectures.**"], "sections": [{"t": "The taxonomy", "art": "soa-taxonomy", "wide": true, "alt": "Business services above an orchestration engine above enterprise, application and infrastructure services", "cap": "Fig. 17-1 · every layer has a well-defined responsibility, and a different team.", "items": ["**Business services** — the entry point for business processes: `ExecuteTrade`, `PlaceOrder`. They contain **no code**, only input, output and sometimes schema, and business analysts define them.", "**Enterprise services** — fine-grained shared implementations: `CreateCustomer`, `CalculateQuote`, plus transactional entities. The intended reusable building blocks, composed into business services by the engine.", "**Application services** — one-off, single-implementation, owned by one application team. Geolocation that nobody wants to generalise.", "**Infrastructure services** — monitoring, logging, authentication, authorisation. Concrete, owned by a shared team near operations."], "p": "The goal behind enterprise services was to build up a permanent collection of reusable business assets so the company would never rewrite that workflow again. It defeats itself: **business components are not construction materials**. Markets, technology and engineering practice all move, and no amount of taxonomy imposes stability on them."}, {"k": "decision", "t": "Six divisions each have a Customer", "art": "reuse-coupling", "wide": true, "alt": "Six divisional services each containing a customer notion, consolidated into one canonical Customer service", "sit": "An insurance company: auto, disability, home, life, marine, travel. Each division's services contain their own notion of **Customer**. The duplication is obvious and the reuse opportunity is obvious with it.", "opts": [["Extract one canonical Customer service.", "Every division now references one definition. Which means a change to Customer **ripples to all six**, requiring coordinated deployment and holistic testing — and it means the single Customer must carry every attribute any division needs. Auto insurance needs a driver's licence; disability insurance now carries driver's-licence complexity it does not care about."], ["Let each bounded context keep its own Customer and reconcile at the seams.", "This is what the industry eventually concluded. **Domain-driven design's insistence on avoiding holistic reuse comes directly from experience with these architectures.**", 1]], "verdict": "The trap is that the first option is *obviously right* by every principle taught at the time. **Reuse is implemented via coupling** — there is no other mechanism — and that means every reuse decision is also a coupling decision, whether or not anyone frames it that way. This is the First Law arriving uninvited: an architecture built to optimise one thing, with the trade-off unexamined."}, {"t": "Everything goes through the bus", "art": "soa-flow", "alt": "A business service calling a service bus which calls two enterprise services which call application services", "cap": "Fig. 17-2 · the engine is an integration hub and an orchestration engine at once. Even internal calls route through it.", "p": "That combination is exactly what an **enterprise service bus** provides, which is why ESBs remain genuinely useful in integration-heavy environments even though building a whole architecture around one is a bad idea. Conway's Law then does its work: the team of integration architects who own the engine become a political force, and then a bureaucratic bottleneck.", "items": ["**Declarative transactions** were an era feature — configuring an entity's transactional scope in XML, per workflow. It failed twice over: developers who can't know the runtime transactional behaviour end up building near-identical entities that differ only in scope, and no message bus ever covered the failure-mode edge cases. **Some features cannot be cleanly abstracted away.**", "**Teams**: this style's strict taxonomy is the communication antipattern that team topologies were later formulated against. It was rare for someone building business services to speak to someone building enterprise services — they communicated through contracts and enterprise ticketing tools."]}, {"k": "decision", "t": "The ESB keeps growing", "art": "soa-flow", "alt": "A business service calling a service bus which calls two enterprise services which call application services", "sit": "You use an ESB as an integration facility between an ERP package, an online sales tool and modern accounting microservices. It works. Each quarter, a little more workflow logic finds its way into it, because that is where the routing already lives.", "opts": [["Let it keep absorbing. It's already the hub.", "**Accidental SOA**: gradually and unintentionally building a fully orchestration-driven SOA without deciding to. Nobody chooses this architecture any more; people arrive at it."], ["Set encapsulation boundaries and enforce them.", "Decide what the ESB is allowed to orchestrate, watch the transactional boundaries, and write **fitness functions over the integration logs** — for example, alert when any update from the ERP or sales logs targets anything other than accounting.", 1]], "verdict": "The modern use of this style is as an **integration architecture**, and there it earns its place: legacy systems that must interact with modern ones, combining results and aggregating behaviour, is precisely what an ESB is for. The skill being tested is the one the chapter names directly — telling a tool's real uses apart from the hype around it, in both directions."}, {"t": "Characteristics, and what it left behind", "wide": true, "alt": "Architecture characteristics ratings for orchestration-driven SOA", "cap": "Fig. 17-5 · the most technically partitioned general-purpose architecture ever attempted.", "p": "Most of these criteria weren't priorities when the style was popular — Agile had barely started and had not reached the enterprises building these systems. The projects were rarely called failures; they were quietly converted into integration architectures with better boundaries, aligned closer to DDD.", "items": ["The **single quantum** has two causes: one shared database, and an orchestration engine that couples everything to itself — no part of the architecture can hold different characteristics from the mediator running all of it.", "The word architects in this style dreaded was **change**: a lucky day meant touching only enterprise services; a bad day meant highly coupled edits across four or five layers, and the scope was unknowable in advance.", "**What it taught the field**: the practical limits of technical partitioning, how hard distributed transactions really are, and why holistic reuse across an organisation is a coupling strategy in disguise. Microservices is in large part the backlash."], "art": "_gen4"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 17: Orchestration-Driven Service-Oriented Architecture, pp. 315–328.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"soa-taxonomy": "<svg viewBox=\"0 0 620 260\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"120\" y=\"24\" width=\"380\" height=\"34\"/>\n    <rect x=\"60\" y=\"94\" width=\"500\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"120\" y=\"152\" width=\"380\" height=\"30\"/>\n    <rect x=\"120\" y=\"192\" width=\"380\" height=\"30\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <path d=\"M310 58 V94 M310 128 V152\"/>\n      <path d=\"M304 88 l6 6 l6 -6 M304 146 l6 6 l6 -6\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"310\" y=\"44\" font-size=\"10\" fill=\"var(--ink)\">BUSINESS SERVICES</text>\n    <text x=\"310\" y=\"80\" font-size=\"8.2\" fill=\"var(--ink2)\">ExecuteTrade · PlaceOrder — no code at all, just signatures, defined by business analysts</text>\n    <text x=\"310\" y=\"115\" font-size=\"10.5\" fill=\"var(--acc)\">ORCHESTRATION ENGINE / MESSAGE BUS</text>\n    <text x=\"310\" y=\"144\" font-size=\"8.2\" fill=\"var(--acc)\">e width=\"152\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1\">\n      <path d=\"M452 56 L470 164 M536 56 L520 164 M452 98 L478 164 M536 98 L512 164 M452 140 L484 164 M536 140 L506 164\"/>\n    </g>\n    <path d=\"M300 90 H360\" stroke=\"var(--ink3)\" stroke-width=\"1.3\"/>\n    <path d=\"M352 86 l8 4 l-8 4\" stroke=\"var(--ink3)\" stroke-width=\"1.3\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"7.6\">\n    <text x=\"142\" y=\"28\" font-size=\"9\" fill=\"var(--ink)\">SIX DIVISIONS, SIX CUSTOMERS</text>\n    <text x=\"494\" y=\"16\" font-size=\"9\" fill=\"var(--acc)\">ONE CANONICAL CUSTOMER</text>\n    <text x=\"494\" y=\"185\" font-size=\"9\" fill=\"var(--acc)\">Customer service</text>\n    <text x=\"142\" y=\"146\" fill=\"var(--ink2)\">auto · disability · home · life · marine · travel</text>\n    <text x=\"142\" y=\"170\" font-size=\"8.4\" fill=\"var(--ink)\">the obvious duplication</text>\n    <text x=\"494\" y=\"220\" font-size=\"8.4\" fill=\"var(--acc)\">reuse is implemented via coupling</text>\n    <text x=\"310\" y=\"244\" font-size=\"8.6\" fill=\"var(--ink)\">Now disability insurance carries driver's licence fields it will never use — and one change ripples to six divisions.</text>\n  </g>\n</svg>", "soa-flow": "<svg viewBox=\"0 0 300 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"94\" y=\"16\" width=\"112\" height=\"28\"/>\n    <rect x=\"40\" y=\"82\" width=\"220\" height=\"30\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <rect x=\"30\" y=\"148\" width=\"106\" height=\"28\"/><rect x=\"164\" y=\"148\" width=\"106\" height=\"28\"/>\n    <rect x=\"30\" y=\"192\" width=\"106\" height=\"26\" stroke=\"var(--ink3)\"/><rect x=\"164\" y=\"192\" width=\"106\" height=\"26\" stroke=\"var(--ink3)\"/>\ troke-width=\"1.2\"/>\n<rect x=\"298\" y=\"26\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"38\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">vendors worked hard for this</text>\n<text x=\"178\" y=\"61\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">scalability</text>\n<rect x=\"190\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"49\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"49\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"61\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">session replication etc.</text>\n<text x=\"178\" y=\"84\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">evolvability</text>\n<rect x=\"190\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"84\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">a change can cross five layers</text>\n<text x=\"178\" y=\"107\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">deployability</text>\n<rect x=\"190\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"107\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">not an aspiration at the time</text>\n<text x=\"178\" y=\"130\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">testability</text>\n<rect x=\"190\" y=\"118\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"130\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">holistic testing was uncommon then</text>\n<text x=\"178\" y=\"153\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">performance</text>\n<rect x=\"190\" y=\"141\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"153\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">one request, split everywhere</text>\n<text x=\"178\" y=\"176\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">simplicity</text>\n<rect x=\"190\" y=\"164\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"178\" y=\"199\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">overall cost</text>\n<rect x=\"190\" y=\"187\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"199\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">multi-year, board-level projects</text>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
