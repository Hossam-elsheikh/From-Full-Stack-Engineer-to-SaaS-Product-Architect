/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */

  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;

.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}

.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;

<script>
const D={"ch": "21", "book": "Chapter 21 · Architectural Decisions", "pages": "pp. 387–403", "title": "Writing Down the Why", "gist": "Three antipatterns that stop decisions from happening, sticking, or being known — and the one-page format that fixes all three, doubles as documentation, and turns standards into something developers will actually follow.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#7E3B3B", "d": "#D18E8E"}, "minute": ["Three antipatterns in sequence: **Covering Your Assets** (you avoided deciding), **Groundhog Day** (you decided and never justified it), **Email-Driven Architecture** (you justified it in an email nobody can find).", "**Last responsible moment**: decide when the cost of deferring exceeds the risk of deciding. Later means lower risk and higher cost; the crossing point is the moment.", "A decision is **architecturally significant** if it affects structure, non-functional characteristics, dependencies, interfaces, or construction techniques. A technology choice made to protect a characteristic *is* an architectural decision.", "An **ADR** is one to two pages: Title, Status, Context, Decision, Consequences — plus **Compliance** (how it will be governed) and **Notes** (who, when, approved by whom).", "Justify **technically and commercially**. Decoupling for cheaper VMs is a technical justification; *faster time to market* is why the business should pay for it. If there's no business value, reconsider the decision."], "sections": [{"t": "Three antipatterns, in order", "art": "antipatterns", "wide": true, "alt": "Covering Your Assets leading to Groundhog Day leading to Email-Driven Architecture", "cap": "They chain: solving each one delivers you to the next.", "items": ["**Covering Your Assets** — deferring a decision out of fear of getting it wrong. Two cures: decide at the **last responsible moment**, and **collaborate with the development teams** so you find out early when a decision can't be implemented as designed.", "**Groundhog Day** — nobody knows why the decision was made, so it gets discussed again, and again, and never resolves. The cure is justification, and it must be **both technical and business**: the four common business justifications are cost, time to market, user satisfaction and strategic positioning. Pick the one the stakeholders actually care about.", "**Email-Driven Architecture** — the decision is lost, forgotten, or unknown. Putting the decision *in* an email creates as many systems of record as there are inboxes, usually missing the justification, and there is no way to know who received the revision."], "p": "The fix is one sentence long: *“I've made an important decision about communication between services that directly impacts you. Please see the decision here: [link].”* Context in the body, decision behind a link — and **“directly impacts you”** is also the test for who needs the email at all."}, {"k": "decision", "t": "You don't feel ready to decide yet", "art": "last-moment", "alt": "Cost rising and risk falling over time, crossing at the last responsible moment", "sit": "Teams are waiting on a caching decision. You don't have complete information. More analysis would reduce the risk of being wrong — and every week of analysis costs delivery time.", "opts": [["Defer until you're confident.", "Cost climbs, and confidence never arrives. This is **Covering Your Assets**, and its terminal form is **Analysis Paralysis** — permanently analysing a decision instead of making it."], ["Decide at the last responsible moment.", "When there is enough information to justify and validate the decision, but not so late that teams are blocked. **Ask when the cost of deferring exceeds the risk of deciding** — that intersection is the moment.", 1]], "verdict": "The second cure matters as much: **collaborate with the teams implementing it**. You decide that product reference data will be held in a read-only replicated cache owned by Catalog, to avoid interservice calls. The teams discover that the scalability requirements make the in-process memory unaffordable. Because you were close to them, you learn that in days and adjust — instead of learning it in production."}, {"t": "What makes a decision architecturally significant", "art": "adr-structure", "wide": true, "alt": "The seven sections of an architecture decision record with example content", "cap": "Michael Nygard's structure, plus Compliance and Notes.", "items": ["**Structure** — decisions affecting the patterns or styles in use. Sharing code between microservices changes their bounded contexts, and therefore the structure of the system.", "**Non-functional characteristics** — if a technology choice affects a characteristic that matters, it is architectural, even though it names a specific product.", "**Dependencies** — coupling points between components and services, which drive scalability, modularity, agility, testability and reliability.", "**Interfaces** — how things are accessed and orchestrated, which means contracts, versioning and deprecation strategy, which affects everyone using the system.", "**Construction techniques** — platforms, frameworks, tools and even processes that, while technical, touch some aspect of the architecture."], "p": "On **Status**: *Proposed* needs higher approval, *Accepted* is ready to implement, *Superseded* points at the ADR that replaced it — and the replacement points back. That trail is what prevents someone reopening “but what about messaging?” two years later. A useful fourth status is **RFC with a deadline**, which turns the draft into a real invitation to collaborate before you commit."}, {"t": "Why the Decision section is the valuable one", "art": "adr-storage", "alt": "A directory tree with application, common, integration and enterprise ADR folders", "cap": "Fig. 21-5 · a dedicated ADR repository or wiki — not the application's own Git repo.", "p": "State decisions in the **affirmative, commanding voice**: *“We will use asynchronous messaging between services.”* Not *“I think messaging would be best”*, which leaves it unclear whether a decision was even made. Then justify it — because understanding *why* matters far more than understanding how, and people who understand the reasoning are more likely to agree with it.", "items": ["The cautionary example: gRPC was chosen between two services to cut latency, at the cost of tight coupling. Years later a new architect standardised on REST for consistency, not knowing why gRPC was there — and caused timeouts in upstream systems. **An ADR would have prevented it.**", "**Consequences** is where the trade-off analysis lives. Asynchronous review posting takes responsiveness from 3,100 ms to 25 ms and buys complicated error handling. If the discussion with the business is recorded there, the developer who objects can read the answer instead of reopening it.", "**Storage**: a dedicated ADR Git repository everyone can reach, or a wiki, or a shared directory. Not the application's repo — not everyone has access, and integration and enterprise decisions have no application to live under.", "**Structure it by scope**: `application/common`, `application/app1`, `integration`, `enterprise`. An enterprise ADR looks like *“all access to a system database will only be from the owning system.”*"]}, {"k": "decision", "t": "Can an LLM make this architectural decision?", "art": "antipatterns", "wide": true, "alt": "Covering Your Assets leading to Groundhog Day leading to Email-Driven Architecture", "sit": "Should payment processing be one service or one per payment type? Messaging, streaming or event sourcing downstream? One database or several? These are exactly the questions people now put to a model.", "opts": [["Ask it for the answer.", "LLMs answer largely on **probability** — the most probable answer given the prompt, and the “best practice” for the problem. **Probability and best practices have no place in architectural decisions**, because every situation and environment differs."], ["Ask it to enumerate the trade-offs you might have missed.", "The authors' own experiments land here: generative AI is useful for outlining possible trade-offs and catching ones you overlooked. **It has knowledge; it lacks the wisdom to choose.**", 1]], "verdict": "The reason is concrete. One payment service performs better; several are more maintainable. Which is right depends on translating a **business concern** — time to market, say — into an **architectural characteristic**, and that translation takes years of experience and specific context to get right. If time to market dominates, maintainability beats performance and separate services win. Change the business concern and the same question has the opposite answer."}, {"t": "Two uses people miss", "art": "adr-storage", "alt": "A directory tree with application, common, integration and enterprise ADR folders", "cap": "ADRs as documentation, and ADRs as standards.", "items": ["**As documentation.** Diagramming has emerging standards — C4, ArchiMate — but documenting architecture has none. ADRs fill the gap: **Context** describes the area of the system and its alternatives, **Decision** records why, and **Consequences** carries the trade-off analysis. That is the best architectural documentation available.", "**As standards.** Very few developers like standards, largely because standards are often about control. An ADR forces a standard to state *why it needs to exist* — which is a good test of whether it should. If you cannot justify it, it is probably not a standard worth enforcing, and the more developers understand the reason, the more they follow it without challenge.", "**On existing systems.** Write ADRs for the significant decisions already made, and use the exercise to ask whether each one is still right. Why *are* those services sharing a database? Often the person who decided has left, and then it falls to you to identify the alternatives, analyse the trade-offs, and either validate the existing decision or find the inefficiency."]}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 21: Architectural Decisions, pp. 387–403. ADRs are Michael Nygard's, from a 2011 post; Thoughtworks Radar recommended adoption in 2017.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"antipatterns": "<svg viewBox=\"0 0 620 196\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"10\" y=\"46\" width=\"172\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"224\" y=\"46\" width=\"172\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"438\" y=\"46\" width=\"172\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.4\">\n      <path d=\"M182 74 H224 M396 74 H438\"/>\n      <path d=\"M216 70 l8 4 l-8 4 M430 70 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"10\" y=\"30\" text-anchor=\"start\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">SOLVE ONE AND YOU ARRIVE AT THE NEXT</text>\n    <g font-size=\"9.6\" fill=\"var(--acc)\">\n      <text x=\"96\" y=\"70\">COVERING YOUR ASSETS</text>\n      <text x=\"310\" y=\"70\">GROUNDHOG DAY</text>\n      <text x=\"524\" y=\"70\">EMAIL-DRIVEN ARCHITECTURE</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"96\" y=\"88\">you didn't decide</text>\n      <text x=\"310\" y=\"88\">you decided, and never said why</text>\n      <text x=\"524\" y=\"88\">you said why, in an email</text>\n      <text x=\"96\" y=\"126\">fear of the wrong choice.</text><text x=\"96\" y=\"137\">next stop: analysis paralysis.</text>\n      <text x=\"310\" y=\"126\">so the room relitigates it</text><text x=\"310\" y=\"137\">every month, forever.</text>\n      <text x=\"524\" y=\"126\">now there are nine systems of record</text><text x=\"524\" y=\"137\">and none of them is current.</text>\n    </g>\n    <text x=\"310\" y=\"172\" font-size=\"9\" fill=\"var(--ink)\">Put the *context* in the email and a link to the one place the decision lives.</text>\n    <text x=\"310\" y=\"188\" font-size=\"8.6\" fill=\"var(--acc)\">And “directly impacts you” is the test for who gets the email at all.</text>\n  </g>\n</svg>", "last-moment": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M34 156 H284 M34 156 V26\"/>\n    <path d=\"M40 152 C90 148 150 120 270 34\" stroke=\"var(--ink)\" stroke-width=\"1.9\"/>\n    <path d=\"M40 36 C110 44 170 116 270 150\" stroke=\"var(--ink3)\" stroke-width=\"1.7\" stroke-dasharray=\"5 4\"/>\n    <circle cx=\"152\" cy=\"98\" r=\"6\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"2\"/>\n    <path d=\"M152 104 V156\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.2\">\n    <text x=\"266\" y=\"30\" text-anchor=\"end\" fill=\"var(--ink)\">cost</text>\n    <text x=\"266\" y=\"162\" text-anchor=\"end\" fill=\"var(--ink2)\">risk</text>\n    <text x=\"152\" y=\"176\" text-anchor=\"middle\" fill=\"var(--acc)\">the last responsible moment</text>\n    <text x=\"150\" y=\"196\" text-anchor=\"middle\" fill=\"var(--ink)\">decide when the cost of deferring exceeds</text>\n    <text x=\"150\" y=\"208\" text-anchor=\"middle\" fill=\"var(--ink)\">the risk of deciding</text>\n    <text x=\"160\" y=\"170\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"var(--ink3)\">time →</text>\n  </g>\n</svg>", "adr-structure": "<svg viewBox=\"0 0 620 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"150\" y=\"24\" width=\"320\" height=\"200\"/>\n    <path d=\"M150 56 H470 M150 84 H470 M150 128 H470 M150 172 H470 M150 200 H470\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\">\n    <text x=\"164\" y=\"44\" font-size=\"10\" fill=\"var(--acc)\">TITLE</text>\n    <text x=\"300\" y=\"44\" font-size=\"8.2\" fill=\"var(--ink2)\">42. Use of Asynchronous Messaging Between Order and Payment</text>\n    <text x=\"164\" y=\"74\" font-size=\"10\" fill=\"var(--acc)\">STATUS</text>\n    <text x=\"300\" y=\"74\" font-size=\"8.2\" fill=\"var(--ink2)\">Proposed · Accepted · Superseded by 68 · RFC, deadline 09 JAN</text>\n    <text x=\"164\" y=\"104\" font-size=\"10\" fill=\"var(--acc)\">CONTEXT</text>\n    <text x=\"300\" y=\"102\" font-size=\"8.2\" fill=\"var(--ink2)\">what situation is forcing this decision —</text>\n    <text x=\"300\" y=\"114\" font-size=\"8.2\" fill=\"var(--ink2)\">and the alternatives considered</text>\n    <text x=\"164\" y=\"148\" font-size=\"10\" fill=\"var(--acc)\">DECISION</text>\n    <text x=\"300\" y=\"146\" font-size=\"8.2\" fill=\"var(--ink2)\">“We will use…” — affirmative, commanding voice.</text>\n    <text x=\"300\" y=\"158\" font-size=\"8.2\" fill=\"var(--ink2)\">And the full justification. This is the part that matters.</text>\n    <text x=\"164\" y=\"190\" font-size=\"10\" fill=\"var(--acc)\">CONSEQUENCES</text>\n    <text x=\"300\" y=\"188\" font-size=\"8.2\" fill=\"var(--ink2)\">the impact, good and bad —</text>\n    <text x=\"300\" y=\"200\" font-size=\"8.2\" fill=\"var(--ink2)\">and the trade-off analysis you performed</text>\n    <text x=\"164\" y=\"216\" font-size=\"10\" fill=\"var(--ink)\">COMPLIANCE</text>\n    <text x=\"300\" y=\"216\" font-size=\"8.2\" fill=\"var(--ink2)\">manual review, or a named fitness function?</text>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"8\" y=\"44\">Michael Nygard's</text><text x=\"8\" y=\"56\">five sections, plus</text>\n      <text x=\"8\" y=\"68\">two the authors add:</text>\n      <text x=\"8\" y=\"92\" fill=\"var(--ink)\">COMPLIANCE</text>\n      <text x=\"8\" y=\"104\">how it will be governed</text>\n      <text x=\"8\" y=\"126\" fill=\"var(--ink)\">NOTES</text>\n      <text x=\"8\" y=\"138\">author, approver,</text><text x=\"8\" y=\"150\">approval and</text><text x=\"8\" y=\"162\">superseded dates</text>\n      <text x=\"486\" y=\"44\">One to two pages.</text><text x=\"486\" y=\"56\">AsciiDoc, Markdown</text><text x=\"486\" y=\"68\">or a wiki template.</text>\n      <text x=\"486\" y=\"92\" fill=\"var(--acc)\">42 superseded by 68.</text>\n      <text x=\"486\" y=\"104\" fill=\"var(--acc)\">68 supersedes 42.</text>\n      <text x=\"486\" y=\"116\">The trail is what</text><text x=\"486\" y=\"128\">stops “but what</text><text x=\"486\" y=\"140\">about messaging?”</text>\n    </g>\n    <text x=\"310\" y=\"240\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink)\">Agree in advance what you may approve yourself: start with cost, cross-team impact and security.</text>\n  </g>\n</svg>", "adr-storage": "<svg viewBox=\"0 0 300 226\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\" stroke-linejoin=\"round\">\n    <path d=\"M20 24 h30 l5 6 h44 v18 H20 z\"/>\n    <path d=\"M46 62 h26 l5 6 h40 v18 H46 z\"/>\n    <path d=\"M46 100 h26 l5 6 h40 v18 H46 z\"/>\n    <path d=\"M46 138 h26 l5 6 h40 v18 H46 z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <path d=\"M20 180 h30 l5 6 h44 v18 H20 z\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1\"><path d=\"M30 48 V72 h16 M30 72 V110 h16 M30 110 V148 h16\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.4\">\n    <text x=\"60\" y=\"42\" fill=\"var(--ink2)\">application</text>\n    <text x=\"86\" y=\"80\" fill=\"var(--ink2)\">common</text>\n    <text x=\"86\" y=\"118\" fill=\"var(--ink2)\">app1 · app2</text>\n    <text x=\"86\" y=\"156\" fill=\"var(--acc)\">integration</text>\n    <text x=\"60\" y=\"198\" fill=\"var(--acc)\">enterprise</text>\n    <text x=\"150\" y=\"216\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"var(--ink2)\">a dedicated ADR repo, or a wiki — not the app's own Git repo,</text>\n    <text x=\"150\" y=\"226\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"var(--ink2)\">because not everyone has access and not every decision is one app's</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
