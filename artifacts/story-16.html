/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------

/* ---------- cover ---------- */

is the ceiling, take it out of the request path."}, {"t": "The eight moving parts", "art": "sba-topology", "wide": true, "alt": "Processing units with in-memory grids above virtualized middleware, with data pumps, writers and readers feeding a database", "cap": "Fig. 16-2 · the name comes from *tuple space* — parallel processors communicating through shared memory.", "items": ["**Processing unit** — application logic plus an in-memory data grid and replication engine (Hazelcast, Apache Ignite, Oracle Coherence). Small applications fit in one; larger ones split by functional area.", "**Messaging grid** — routes incoming requests to an available processing unit and manages session state. Usually just a load-balancing web server: HAProxy, Nginx.", "**Data grid** — keeps same-named caches in sync across units, asynchronously, typically inside 100 ms. Each instance holds a **member list** of every other instance sharing that cache; joins and departures update it automatically.", "**Processing grid** — optional, orchestrates a request spanning several processing units. Modern implementations use small per-workflow orchestration units rather than one coarse engine.", "**Deployment manager** — starts and stops instances on load. This is what makes elasticity real, and Kubernetes or the cloud provider usually is it.", "**Data pump / writer / reader** — always asynchronous, usually messaging, so you get guaranteed delivery, persistence and FIFO order, and the unit keeps working when the writer is down."], "p": "A new instance doesn't read the database to warm up: it broadcasts a join request, and an existing instance ships it the cache. **Data readers only fire in three situations** — every instance of a cache crashed, they were all redeployed, or someone asked for archive data not held in memory."}, {"k": "decision", "t": "Replicated cache, or distributed?", "art": "caching", "wide": true, "alt": "Three processing units replicating caches between themselves, beside three units sharing one central cache server, with a five-row comparison", "sit": "Every processing unit needs the same data, and the messaging grid may route a request to any of them. Each unit can hold its own copy and sync with the others, or all of them can read one central cache server.", "opts": [["Replicated — each unit holds the cache.", "Extremely fast, and **no single point of failure**. Breaks down in two situations: caches over ~100 MB (units run in containers with finite memory, which caps how many you can start) and very high update rates the replication engine cannot keep up with."], ["Distributed — one central cache server.", "Strong consistency, because the data is in one place and never replicated. Slower — every access is remote — and the cache server is a single point of failure. Mirroring it helps, and reintroduces the consistency problem it was solving."]], "verdict": "**Neither, system-wide.** Below 100 MB and with a manageable update rate, this is a straight choice between consistency (distributed) and performance plus fault tolerance (replicated), and the deciding factor is usually the *kind* of data. Inventory counts need consistency — distributed. Reference data like product codes and descriptions barely changes — replicated. Use both, in different processing units, and take each model's strength."}, {"k": "decision", "t": "Collisions are appearing in the inventory cache", "art": "collision", "wide": true, "alt": "Two instances updating the same inventory count and overwriting each other, with the collision-rate formula and three levers", "sit": "Two instances hold 500 blue widgets. A sells 10 and writes 490; before that replicates, B sells 5 and writes 495. Replication crosses. A ends at 495, B at 490, and the true answer — 485 — exists nowhere.", "opts": [["Reduce replication latency.", "The strongest lever, because it is the multiplier: 100 ms → 1 ms takes 14.4 collisions an hour down to 0.1, at the same 72,000 updates. It depends on network type and physical distance between units."], ["Reduce the number of instances sharing the cache.", "Directly proportional: 5 instances → 2 gives 5.8 an hour instead of 14.4. It also caps your throughput, which is why you were here."], ["Shrink the cache.", "**Backwards.** Cache size is the one *inverse* factor — 50,000 rows → 10,000 takes collisions from 14.4 to 72 an hour."]], "verdict": "`collision rate = N × (UR² ÷ S) × RL`. Worth running before committing to replicated caching: at 20 updates a second across 5 instances of a 50,000-row cache at 100 ms latency, you get 14 collisions in 72,000 updates — 0.02%, entirely viable. **Measure RL in production**; it is rarely published, and 100 ms is the planning number when you have nothing better. And calculate minimum, normal *and* peak rates, because no real system has a flat update rate across a day."}, {"t": "Risks, governance and the cloud split", "art": "hybrid-cloud", "wide": true, "alt": "Processing units and middleware in the cloud connected by a data pump to an on-premises database", "cap": "Fig. 16-14 · transactional processing in elastic cloud, physical data and analytics on-premises.", "items": ["**Frequent database reads** defeat the style. Reads should only happen for archive data and cold starts. If most data has to be archived and re-fetched, or units crash and redeploy often, this is the wrong architecture for the problem.", "**Pump bottlenecks.** Database writes take longer than cache writes, so the pump is a backpressure point. Under high concurrency it delays data reaching the database — a real risk if downstream systems need current data. Govern it with a fitness function on **queue depth**.", "**Data loss in the pump** — mitigate with persisted queues and client-acknowledge mode in the writers, accepting that both slow responsiveness and degrade consistency.", "**Memory.** All transactional data is cached in the units, so volumes must stay low, especially as instance counts rise. Watch cache size or a unit runs out of memory and dies."], "p": "Governance here is unusually measurable: track **average synchronisation time** per unit and overall as a continuous fitness function, so you can see whether architectural changes made it better or worse against the business's timing goal. Also track read frequency, and measure scalability, elasticity and responsiveness directly — since those are the reasons you chose this style."}, {"t": "Characteristics, teams, and when to reach for it", "wide": true, "alt": "Architecture characteristics ratings for space-based architecture", "cap": "Fig. 16-18 · the only style in the book with three fives — and it pays for every one of them.", "items": ["**Teams**: technically partitioned, and most effective with technically aligned teams. **Stream-aligned teams struggle** as the system grows, because one domain change can touch processing units, pumps, readers, writers, cache contracts, orchestrators *and* the database.", "**Enabling teams fit well here** — the opposite of event-driven — because pumps, readers, writers and middleware are shared, cross-cutting artifacts a dedicated team can make more efficient independently.", "**Complicated-subsystem teams** are close to essential: handling data collisions and asynchronous synchronisation errors in the writers is genuinely complex work, and domain teams working on processing units should not have to think about it.", "**Use it** for high and *variable* concurrency — the driving case is unpredictable load spikes, not merely large load. **Don't use it** where the data must be strongly consistent, where cached volumes are too large for memory, or where the team cannot carry the operational complexity."], "art": "_gen5"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 16: Space-Based Architecture Style, pp. 283–314.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"bottleneck-triangle": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"24\" y=\"30\" width=\"252\" height=\"34\"/>\n    <rect x=\"66\" y=\"80\" width=\"168\" height=\"34\"/>\n    <rect x=\"112\" y=\"130\" width=\"76\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M150 64 V80 M150 114 V130\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.4\">\n    <text x=\"150\" y=\"52\" font-size=\"9.4\" fill=\"var(--ink)\">web servers</text>\n    <text x=\"150\" y=\"102\" font-size=\"9.4\" fill=\"var(--ink)\">application servers</text>\n    <text x=\"150\" y=\"152\" font-size=\"9.4\" fill=\"var(--acc)\">database</text>\n    <text x=\"290\" y=\"52\" text-anchor=\"end\" font-size=\"7.6\" fill=\"var(--ink2)\">easy, cheap</text>\n    <text x=\"290\" y=\"102\" text-anchor=\"end\" font-size=\"7.6\" fill=\"var(--ink2)\">harder, dearer</text>\n    <text x=\"290\" y=\"152\" text-anchor=\"end\" font-size=\"7.6\" fill=\"var(--acc)\">hardest</text>\n    <text x=\"150\" y=\"188\" fill=\"var(--ink)\">Scale the top and the bottleneck moves down a layer.</text>\n    <text x=\"150\" y=\"204\" fill=\"var(--acc)\">Eventually it stops moving, and the database is the ceiling.</text>\n  </g>\n</svg>", "sba-topology": "<svg viewBox=\"0 0 620 270\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"34\" width=\"316\" height=\"122\" stroke=\"var(--ink3)\" stroke-dasharray=\"6 4\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.6\">\n      <rect x=\"30\" y=\"52\" width=\"90\" height=\"88\" fill=\"var(--accBg)\"/>\n      <rect x=\"132\" y=\"52\" width=\"90\" height=\"88\" fill=\"var(--accBg)\"/>\n      <rect x=\"234\" y=\"52\" width=\"80\" height=\"88\" fill=\"var(--accBg)\"/>\n      <path d=\"M120 96 H132 M222 96 H234\" stroke-dasharray=\"4 3\"/>\n      <rect x=\"42\" y=\"96\" width=\"66\" height=\"30\"/><rect x=\"144\" y=\"96\" width=\"66\" height=\"30\"/>\n      <rect x=\"246\" y=\"96\" width=\"56\" height=\"30\"/>\n    </g>\n    <rect x=\"14\" y=\"176\" width=\"316\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M172 156 V176\"/></g>\n    <rect x=\"378\" y=\"52\" width=\"52\" height=\"30\"/><rect x=\"378\" y=\"110\" width=\"52\" height=\"30\"/>\n    <rect x=\"452\" y=\"52\" width=\"70\" height=\"30\"/><rect x=\"452\" y=\"110\" width=\"70\" height=\"30\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <path d=\"M330 76 H378 M330 116 H378 M430 67 H452 M430 125 H452\"/>\n    </g>\n    <ellipse cx=\"570\" cy=\"88\" rx=\"42\" ry=\"9\"/><path d=\"M528 88 v16 a42 9 0 0 0 84 0 v-16\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M522 74 L534 82 M522 118 L534 104\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8\">\n    <text x=\"14\" y=\"26\" text-anchor=\"start\" font-size=\"8.6\" fill=\"var(--ink3)\">PROCESSING UNITS — application logic + in-memory data grid</text>\n    <g fill=\"var(--acc)\" font-size=\"7.6\">\n      <text x=\"75\" y=\"72\">unit</text><text x=\"177\" y=\"72\">unit</text><text x=\"274\" y=\"72\">unit</text>\n      <text x=\"75\" y=\"115\">cache</text><text x=\"177\" y=\"115\">cache</text><text x=\"274\" y=\"115\">cache</text>\n    </g>\n    <text x=\"172\" y=\"197\" font-size=\"8.6\" fill=\"var(--ink)\">VIRTUALIZED MIDDLEWARE — messaging grid · data grid · processing grid · deployment manager</text>\n    <text x=\"404\" y=\"71\" fill=\"var(--ink2)\">data</text><text x=\"404\" y=\"80\" fill=\"var(--ink2)\">pump</text>\n    <text x=\"404\" y=\"125\" fill=\"var(--ink2)\">reverse</text><text x=\"404\" y=\"134\" fill=\"var(--ink2)\">pump</text>\n    <text x=\"487\" y=\"71\" fill=\"var(--ink2)\">data writer</text>\n    <text x=\"487\" y=\"129\" fill=\"var(--ink2)\">data reader</text>\n    <text x=\"570\" y=\"93\" fill=\"var(--ink2)\">database</text>\n    <text x=\"310\" y=\"240\" font-size=\"9\" fill=\"var(--ink)\">No processing unit reads or writes the database directly. That is the whole trick.</text>\n    <text x=\"310\" y=\"258\" font-size=\"8.4\" fill=\"var(--acc)\">Replication between same-named caches completes in under about 100 ms, asynchronously.</text>\n  </g>\n</svg>", "caching": "<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <g stroke=\"var(--acc)\" stroke-width=\"1.6\">\n      <rect x=\"14\" y=\"40\" width=\"66\" height=\"52\" fill=\"var(--accBg)\"/><rect x=\"92\" y=\"40\" width=\"66\" height=\"52\" fill=\"var(--accBg)\"/>\n      <rect x=\"170\" y=\"40\" width=\"66\" height=\"52\" fill=\"var(--accBg)\"/>\n      <path d=\"M80 66 H92 M158 66 H170\" stroke-dasharray=\"4 3\"/>\n      <path d=\"M47 92 C90 116 160 116 203 92\" stroke-dasharray=\"4 3\"/>\n    </g>\n    <rect x=\"332\" y=\"40\" width=\"58\" height=\"34\"/><rect x=\"402\" y=\"40\" width=\"58\" height=\"34\"/>\n    <rect x=\"472\" y=\"40\" width=\"58\" height=\"34\"/>\n    <rect x=\"392\" y=\"112\" width=\"88\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M361 74 L420 112 M431 74 V112 M501 74 L452 112\"/></g>\n    <path d=\"M6 168 H614\" stroke=\"var(--rule)\"/>\n    <path d=\"M300 160 V244\" stroke=\"var(--rule)\"/>\n    <path d=\"M452 160 V244\" stroke=\"var(--rule)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8\">\n    <text x=\"125\" y=\"28\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"var(--acc)\">REPLICATED</text>\n    <text x=\"431\" y=\"28\" text-anchor=\"middle\" font-size=\"9.4\" fill=\"var(--ink)\">DISTRIBUTED</text>\n    <g fill=\"var(--ink2)\" text-anchor=\"middle\">\n      <text x=\"47\" y=\"70\">cache</text><text x=\"125\" y=\"70\">cache</text><text x=\"203\" y=\"70\">cache</text>\n      <text x=\"361\" y=\"60\">unit</text><text x=\"431\" y=\"60\">unit</text><text x=\"501\" y=\"60\">unit</text>\n      <text x=\"436\" y=\"133\" fill=\"var(--acc)\">one cache server</text>\n    </g>\n    <text x=\"125\" y=\"126\" text-anchor=\"middle\" fill=\"var(--ink2)\">no single point of failure. very fast.</text>\n    <text x=\"431\" y=\"162\" text-anchor=\"middle\" fill=\"var(--ink2)\">consistent, remote, and a single point of failure</text>\n    <g font-size=\"8.6\" text-anchor=\"end\" fill=\"var(--ink)\">\n      <text x=\"292\" y=\"186\">optimises for</text><text x=\"292\" y=\"204\">cache size</text>\n      <text x=\"292\" y=\"222\">data</text><text x=\"292\" y=\"240\">fault tolerance</text>\n    </g>\n    <g font-size=\"8.6\" text-anchor=\"middle\">\n      <text x=\"376\" y=\"186\" fill=\"var(--acc)\">performance</text><text x=\"376\" y=\"204\" fill=\"var(--acc)\">small, under 100 MB</text>\n      <text x=\"376\" y=\"222\" fill=\"var(--acc)\">static, low update rate</text><text x=\"376\" y=\"240\" fill=\"var(--acc)\">high</text>\n      <text x=\"533\" y=\"186\" fill=\"var(--ink2)\">consistency</text><text x=\"533\" y=\"204\" fill=\"var(--ink2)\">large, over 500 MB</text>\n      <text x=\"533\" y=\"222\" fill=\"var(--ink2)\">highly dynamic</text><text x=\"533\" y=\"240\" fill=\"var(--ink2)\">low</text>\n    </g>\n    <text x=\"150\" y=\"196\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink)\">Table 16-1 · not a system-wide choice.</text>\n    <text x=\"150\" y=\"212\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink)\">Inventory counts want a distributed cache;</text>\n    <text x=\"150\" y=\"226\" text-anchor=\"middle\" font-size=\"8.6\" fill=\"var(--ink)\">customer profiles want a replicated one.</text>\n    <text x=\"150\" y=\"244\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"var(--acc)\">The near-cache hybrid is not recommended here.</text>\n  </g>\n</svg>", "collision": "<svg viewBox=\"0 0 620 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"40\" y=\"44\" width=\"150\" height=\"40\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"240\" y=\"44\" width=\"150\" height=\"40\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\">\n      <path d=\"M190 56 H240\"/><path d=\"M240 74 H190\"/>\n    </g>\n    <path d=\"M424 34 H614 M424 62 H614 M424 90 H614 M424 118 H614\" stroke=\"var(--rule2)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.2\">\n    <text x=\"115\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--acc)\">instance A</text>\n    <text x=\"115\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink2)\">500 → 490 (sold 10)</text>\n    <text x=\"315\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--acc)\">instance B</text>\n    <text x=\"315\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink2)\">500 → 495 (sold 5)</text>\n    <text x=\"215\" y=\"108\" text-anchor=\"middle\" fill=\"var(--ink)\">A replicates → B becomes 490. B replicates → A becomes 495.</text>\n    <text x=\"215\" y=\"124\" text-anchor=\"middle\" fill=\"var(--acc)\">Both wrong. The answer was 485.</text>\n    <text x=\"215\" y=\"150\" text-anchor=\"middle\" font-size=\"9.6\" fill=\"var(--ink)\">collision rate = N × (UR² ÷ S) × RL</text>\n    <text x=\"215\" y=\"166\" text-anchor=\"middle\" font-size=\"8\" fill=\"var(--ink2)\">instances × update rate squared ÷ cache rows × replication latency</text>\n    <text x=\"424\" y=\"24\" font-size=\"8.6\" fill=\"var(--ink3)\">FROM 14.4 COLLISIONS/HOUR, CHANGE ONE THING:</text>\n    <g font-size=\"8.6\" fill=\"var(--ink)\">\n      <text x=\"424\" y=\"54\">RL 100 ms → 1 ms</text>\n      <text x=\"424\" y=\"82\">instances 5 → 2</text>\n      <text x=\"424\" y=\"110\">cache 50,000 → 10,000 rows</text>\n    </g>\n    <g font-size=\"8.6\" text-anchor=\"end\">\n      <text x=\"614\" y=\"54\" fill=\"var(--acc)\">0.1 / hour</text>\n      <text x=\"614\" y=\"82\" fill=\"var(--acc)\">5.8 / hour</text>\n      <text x=\"614\" y=\"110\" fill=\"var(--ink2)\">72 / hour</text>\n    </g>\n    <text x=\"424\" y=\"140\" font-size=\"8.4\" fill=\"var(--ink2)\">Cache size is the one inverse factor:</text>\n    <text x=\"424\" y=\"152\" font-size=\"8.4\" fill=\"var(--ink2)\">a smaller cache collides more.</text>\n    <text x=\"424\" y=\"176\" font-size=\"8.4\" fill=\"var(--acc)\">Measure RL in production. It is never published;</text>\n    <text x=\"424\" y=\"188\" font-size=\"8.4\" fill=\"var(--acc)\">100 ms is the planning number.</text>\n    <text x=\"310\" y=\"222\" font-size=\"9\" text-anchor=\"middle\" fill=\"var(--ink)\">Collisions happen when the update rate outruns replication latency.</text>\n    <text x=\"310\" y=\"238\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">Calculate minimum, normal and peak rates — nobody's update rate is flat across a day.</text>\n  </g>\n</svg>", "hybrid-cloud": "<svg viewBox=\"0 0 620 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"40\" width=\"300\" height=\"110\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\" fill=\"var(--accBg)\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.4\">\n      <rect x=\"34\" y=\"58\" width=\"80\" height=\"34\"/><rect x=\"126\" y=\"58\" width=\"80\" height=\"34\"/><rect x=\"218\" y=\"58\" width=\"76\" height=\"34\"/>\n      <rect x=\"34\" y=\"108\" width=\"260\" height=\"26\"/>\n    </g>\n    <rect x=\"380\" y=\"40\" width=\"226\" height=\"110\" stroke=\"var(--ink3)\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\"/>\n    <ellipse cx=\"493\" cy=\"82\" rx=\"60\" ry=\"10\"/><path d=\"M433 82 v20 a60 10 0 0 0 120 0 v-20\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.3\"><path d=\"M314 90 H380\"/><path d=\"M372 86 l8 4 l-8 4\"/></g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"8.2\">\n    <text x=\"164\" y=\"30\" font-size=\"9.4\" fill=\"var(--acc)\">CLOUD — elastic, transactional</text>\n    <text x=\"493\" y=\"30\" font-size=\"9.4\" fill=\"var(--ink)\">ON-PREMISES — secure, analytical</text>\n    <text x=\"74\" y=\"79\" fill=\"var(--ink2)\">unit</text><text x=\"166\" y=\"79\" fill=\"var(--ink2)\">unit</text><text x=\"256\" y=\"79\" fill=\"var(--ink2)\">unit</text>\n    <text x=\"164\" y=\"125\" fill=\"var(--ink2)\">virtualized middleware</text>\n    <text x=\"493\" y=\"88\" fill=\"var(--ink2)\">physical data · reporting · analytics</text>\n    <text x=\"347\" y=\"82\" font-size=\"7.4\" fill=\"var(--ink3)\">data pump</text>\n    <text x=\"310\" y=\"180\" font-size=\"9\" fill=\"var(--ink)\">Fig. 16-14 · asynchronous pumps and eventual consistency make this split practical.</text>\n    <text x=\"310\" y=\"198\" font-size=\"8.4\" fill=\"var(--acc)\">No other style in the book can be deployed half in the cloud and half on-premises this cleanly.</text>\n  </g>\n</svg>", "_gen5": "<svg viewBox=\"0 0 620 278\" xmlns=\"http://www.w3.org/2000/svg\">\n<g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"0\" y=\"13\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">SPACE-BASED — TECHNICALLY PARTITIONED</text>\n<text x=\"620\" y=\"13\" font-size=\"8.6\" text-anchor=\"end\" fill=\"var(--ink2)\">1 = weak   5 = strong</text>\n</g>\n<text x=\"178\" y=\"38\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">el e=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"298\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<text x=\"333\" y=\"84\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">in-memory, no database in the path</text>\n<text x=\"178\" y=\"107\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">fault tolerance</text>\n<rect x=\"190\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"298\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"107\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">replicated cache has no SPOF</text>\n<text x=\"178\" y=\"130\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">evolvability</text>\n<rect x=\"190\" y=\"118\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"118\" width=\"21\" heig "333\" y=\"176\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">a lot of moving parts to run</text>\n<text x=\"178\" y=\"199\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">data consistency</text>\n<rect x=\"190\" y=\"187\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"199\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">eventual, by construction</text>\n<text x=\"178\" y=\"222\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">testability</text>\n<rect x=\"190\" y=\"210\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"222\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">hard to simulate this load</text>\n<text x=\"178\" y=\"245\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(- const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
