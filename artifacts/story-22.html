/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;

.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}

.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}

<script>
const D={"ch": "22", "book": "Chapter 22 · Analyzing Architecture Risk", "pages": "pp. 405–422", "title": "Making Risk a Number", "gist": "Risk is an opinion until you multiply two ratings together. A matrix, an assessment grid that shows direction as well as level, and a three-phase collaborative exercise that finds the risks one architect never would.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#8A5C1E", "d": "#DCA95E"}, "minute": ["**Risk = impact × likelihood**, each rated 1–3. 1–2 low, 3–4 medium, 6–9 high. Rate **impact first**; if you're unsure of likelihood, use high until you can confirm.", "Build a **risk assessment** from architecture characteristics as criteria and domains as contexts. Rows total to the worst criterion, columns to the worst context.", "A snapshot doesn't show whether things are improving. Add **direction** from continuous fitness-function measurements: ▲ worsening, ▼ improving, ● steady.", "**Risk storming** in three phases: identify **alone** (so nobody's attention gets steered), reach **consensus** together, then **mitigate** with a stakeholder who can authorise the cost.", "**Unknown or unproven technology is automatically a 9.** The matrix cannot rate what nobody in the room understands."], "sections": [{"t": "The risk matrix", "art": "risk-matrix", "alt": "A three by three matrix of impact against likelihood with products from one to nine", "cap": "Fig. 22-1 · two dimensions, multiplied, so that an opinion becomes a number.", "p": "The worked example: your central database going down has **high impact** — that's the bottom row, 3, 6 or 9. But it sits on highly available clustered servers, so the **likelihood is low** — first column. High impact × low likelihood = **3, medium risk**. The value isn't the number; it's that two architects who disagree now have something specific to disagree about."}, {"t": "The assessment, with direction", "art": "risk-assessment", "wide": true, "alt": "A risk assessment grid of five characteristics against four domains, each cell showing a level and a trend arrow", "cap": "Figs. 22-2 to 22-4 · criteria down the side, contexts across the top, direction in the symbol.", "items": ["**Use architecture characteristics as the criteria.** Why analyse performance risk when the system's critical characteristics are scalability, elasticity and data integrity?", "**Use domains or subdomains as the contexts.** Assessing at service level is usually too fine-grained and misses risk that lives in the *communication between* services.", "Read it both ways. In the example, **data integrity totals 17** — the worst criterion — while **availability totals 10**. Context-wise, customer registration carries the most risk and order fulfilment the least. That tells you where to spend effort.", "**Filter for the audience.** Presenting to stakeholders, drop the low and medium cells and show only the high ones. Better signal-to-noise, clearer message.", "**Direction changes the story.** In the example, data integrity is worsening across three contexts — which suggests a database problem — while security and availability are improving. Level alone would have told you none of that."]}, {"t": "Risk storming, in three phases", "art": "risk-storming", "wide": true, "alt": "Identification alone, then consensus together, then mitigation with stakeholders", "cap": "No architect can assess a whole system alone: they'll miss something, and nobody knows every part.", "items": ["**Phase 1 — identification, alone.** Each participant rates risk against a shared architecture diagram, unbiased, before anyone speaks. This is the phase that stops one loud voice directing everyone's attention.", "**Phase 2 — consensus, together.** Sticky notes go on the diagram, and the differences get discussed until the group agrees. This phase is the point of the whole exercise.", "**Phase 3 — mitigation, with money in the room.** Mitigation usually means changing an architecture someone thought was finished, and it usually costs. Include a stakeholder who can decide whether the cost outweighs the risk.", "**Bring senior developers and tech leads**, not just architects. They contribute the implementation perspective — and they come away understanding the architecture."], "p": "Restrict a session to **one criterion or one context**. “Where are our security risks?” or “What's at risk in customer registration?” — not both at once, which produces sticky notes nobody can interpret. And the technique generalises: teams use the same matrix during story grooming, rating the impact of a story not finishing this iteration against the likelihood that it won't."}, {"k": "decision", "t": "One person rated the cache a 9. Nobody else flagged it.", "art": "risk-storming", "wide": true, "alt": "Identification alone, then consensus together, then mitigation with stakeholders", "sit": "During consensus, a developer has put a 9 on the Redis cache. Everyone else left it blank. Asked to explain, they say: *“What's a Redis cache?”*", "opts": [["Discard it — they don't know the technology, so the rating is uninformed.", "You have just discarded the most useful data point in the session. That a developer who will maintain this system doesn't know a core component *is* the risk."], ["Keep it at 9. Unknown technology is automatically the highest rating.", "The matrix cannot rate what nobody understands. The architect now has a real choice: change the technology, or budget the training to bring the team up to speed.", 1]], "verdict": "The parallel case in the same session is the opposite shape: one participant rated the **Push Expansion Servers** a 9 because they had watched that product crash repeatedly under exactly this load, and nobody else had flagged it at all. Without that one person in the room, the risk surfaces in production. **Both of these are why the room is bigger than the architects.**"}, {"k": "decision", "t": "The mitigation costs $50,000", "art": "risk-matrix", "alt": "A three by three matrix of impact against likelihood with products from one to nine", "sit": "The session rated the central database a **4** — medium — for availability. The group agrees that clustering it and splitting it into separate physical databases would mitigate the risk. The quote is $50,000.", "opts": [["Take it to the stakeholders as a yes/no.", "The business owner says no, the risk stays unmitigated, and everyone concludes risk storming produces expensive suggestions nobody acts on."], ["Take it as a trade-off, and bring a second option.", "The owner rejects $50,000. The architect proposes splitting into two domain-based databases instead — $16,000, and it still reduces the availability risk. The stakeholders agree.", 1]], "verdict": "This is the part of risk storming that isn't about risk: it **structures the negotiation**. You arrive with a quantified risk and a priced mitigation, which turns “we should really cluster the database” into a decision someone with budget authority can actually make."}, {"t": "What three sessions did to one architecture", "art": "hotline", "wide": true, "alt": "A nursing hotline architecture with per-user API gateways, two message channels, an outbreak cache and two databases", "cap": "Figs. 22-8 to 22-12 · the same system, after availability, elasticity and security sessions.", "items": ["**Availability.** The central database rated 6. Nurses could write case notes by hand, but the call router could not function without nurse profiles. Fix: **split into two databases** — clustered profiles, single-instance case notes — which also improved security. For the two external systems, the team went looking for published SLAs and found them: 99.99% on the Diagnostics Engine (52.6 minutes a year) and 99.90% on Medical Records (8.77 hours a year). **That was enough to remove the risk** without changing anything.", "**Elasticity.** The Diagnostics Engine handles 500 requests a second, and self-service patients hit it too. Everyone rated it 9. Queues gave backpressure but left users waiting; the **Ambulance pattern** — two channels, nurses prioritised over self-service — helped but still didn't fix wait times. The answer was a new **Diagnostics Outbreak Cache** absorbing flu and outbreak questions so they never reach the engine at all.", "**Security.** HIPAA requires that only nurses reach medical records. The facilitator had rated the single API gateway a 2; the participants rated it 6 and **convinced him**, on the grounds that admin, self-service and nurse calls all pass through the same gateway. Fix: **one gateway per user type**, so a non-nurse call can never reach the Medical Records interface."], "p": "Risk storming is **not a one-time process**. Run it on particular dimensions after a major feature lands, or at the end of an iteration — the frequency depends on how fast the system changes and how much architectural refactoring is underway."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 22: Analyzing Architecture Risk, pp. 405–422.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"risk-matrix": "<svg viewBox=\"0 0 320 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"86\" y=\"52\" width=\"66\" height=\"50\"/><rect x=\"154\" y=\"52\" width=\"66\" height=\"50\" fill=\"var(--accBg)\"/>\n    <rect x=\"222\" y=\"52\" width=\"66\" height=\"50\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.9\"/>\n    <rect x=\"86\" y=\"104\" width=\"66\" height=\"50\"/><rect x=\"154\" y=\"104\" width=\"66\" height=\"50\"/>\n    <rect x=\"222\" y=\"104\" width=\"66\" height=\"50\" fill=\"var(--accBg)\"/>\n    <rect x=\"86\" y=\"156\" width=\"66\" height=\"50\"/><rect x=\"154\" y=\"156\" width=\"66\" height=\"50\"/>\n    <rect x=\"222\" y=\"156\" width=\"66\" height=\"50\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <g font-size=\"17\" fill=\"var(--ink)\">\n      <text x=\"119\" y=\"84\">9</text><text x=\"187\" y=\"84\" fill=\"var(--acc)\">6</text><text x=\"255\" y=\"84\" fill=\"var(--acc)\">3</text>\n      <text x=\"119\" y=\"136\">6</text><text x=\"187\" y=\"136\">4</text><text x=\"255\" y=\"136\" fill=\"var(--acc)\">2</text>\n      <text x=\"119\" y=\"188\">3</text><text x=\"187\" y=\"188\">2</text><text x=\"255\" y=\"188\">1</text>\n    </g>\n    <g font-size=\"8.6\" fill=\"var(--ink2)\">\n      <text x=\"119\" y=\"44\">high</text><text x=\"187\" y=\"44\">medium</text><text x=\"255\" y=\"44\">low</text>\n    </g>\n    <text x=\"187\" y=\"30\" font-size=\"9\" fill=\"var(--ink)\">LIKELIHOOD</text>\n    <g font-size=\"8.6\" fill=\"var(--ink2)\" text-anchor=\"end\">\n      <text x=\"78\" y=\"82\">high</text><text x=\"78\" y=\"134\">medium</text><text x=\"78\" y=\"186\">low</text>\n    </g>\n    <text x=\"30\" y=\"130\" font-size=\"9\" fill=\"var(--ink)\" transform=\"rotate(-90 30 130)\">IMPACT</text>\n    <text x=\"160\" y=\"222\" font-size=\"8.6\" fill=\"var(--ink)\">1–2 low · 3–4 medium · 6–9 high</text>\n    <text x=\"160\" y=\"234\" font-size=\"8.4\" fill=\"var(--acc)\">Impact first, likelihood second. Unsure of likelihood? Use high until you can confirm.</text>\n  </g>\n</svg>", "risk-assessment": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\">\n    <path d=\"M160 34 H600 M160 34 V196\"/>\n    <path d=\"M160 66 H600 M160 98 H600 M160 130 H600 M160 162 H600\" stroke=\"var(--rule2)\"/>\n    <path d=\"M270 34 V196 M380 34 V196 M490 34 V196\" stroke=\"var(--rule2)\"/>\n    <path d=\"M160 196 H600\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.4\">\n    <g fill=\"var(--ink)\" text-anchor=\"end\">\n      <text x=\"152\" y=\"56\">data integrity</text><text x=\"152\" y=\"88\">security</text>\n      <text x=\"152\" y=\"120\">availability</text><text x=\"152\" y=\"152\">performance</text><text x=\"152\" y=\"184\">scalability</text>\n    </g>\n    <g fill=\"var(--ink2)\" font-size=\"7.6\" text-anchor=\"middle\">\n      <text x=\"215\" y=\"28\">customer</text><text x=\"215\" y=\"20\">registration</text>\n      <text x=\"325\" y=\"28\">catalog</text><text x=\"325\" y=\"20\">checkout</text>\n      <text x=\"435\" y=\"28\">order</text><text x=\"435\" y=\"20\">fulfillment</text>\n      <text x=\"545\" y=\"28\">order</text><text x=\"545\" y=\"20\">shipping</text>\n    </g>\n    <g font-size=\"11\" text-anchor=\"middle\">\n      <text x=\"215\" y=\"58\" fill=\"var(--acc)\">6 ▲</text><text x=\"325\" y=\"58\" fill=\"var(--acc)\">6 ▲</text>\n      <text x=\"435\" y=\"58\" fill=\"var(--ink2)\">3 ▲</text><text x=\"545\" y=\"58\" fill=\"var(--acc)\">6 ▲</text>\n      <text x=\"215\" y=\"90\" fill=\"var(--acc)\">6 ▼</text><text x=\"325\" y=\"90\" fill=\"var(--ink2)\">3 ▼</text>\n      <text x=\"435\" y=\"90\" fill=\"var(--ink2)\">2 ●</text><text x=\"545\" y=\"90\" fill=\"var(--ink2)\">2 ●</text>\n      <text x=\"215\" y=\"122\" fill=\"var(--ink2)\">4 ▼</text><text x=\"325\" y=\"122\" fill=\"var(--ink2)\">2 ▼</text>\n      <text x=\"435\" y=\"122\" fill=\"var(--ink2)\">2 ●</text><text x=\"545\" y=\"122\" fill=\"var(--ink2)\">2 ●</text>\n      <text x=\"215\" y=\"154\" fill=\"var(--ink2)\">3 ●</text><text x=\"325\" y=\"154\" fill=\"var(--ink2)\">4 ●</text>\n      <text x=\"435\" y=\"154\" fill=\"var(--ink2)\">2 ●</text><text x=\"545\" y=\"154\" fill=\"var(--ink2)\">3 ●</text>\n      <text x=\"215\" y=\"186\" fill=\"var(--acc)\">6 ●</text><text x=\"325\" y=\"186\" fill=\"var(--ink2)\">4 ●</text>\n      <text x=\"435\" y=\"186\" fill=\"var(--ink2)\">1 ●</text><text x=\"545\" y=\"186\" fill=\"var(--ink2)\">2 ●</text>\n    </g>\n    <text x=\"160\" y=\"214\" font-size=\"8.6\" fill=\"var(--ink)\">Rows total to worst criterion. Columns total to worst context. ▲ getting worse · ▼ improving · ● steady.</text>\n    <text x=\"160\" y=\"228\" font-size=\"8.4\" fill=\"var(--acc)\">Presenting to stakeholders? Filter out the low and medium. Signal beats noise.</text>\n  </g>\n</svg>", "risk-storming": "<svg viewBox=\"0 0 620 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"10\" y=\"44\" width=\"180\" height=\"60\"/>\n    <rect x=\"220\" y=\"44\" width=\"180\" height=\"60\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"430\" y=\"44\" width=\"180\" height=\"60\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.3\">\n      <path d=\"M190 74 H220 M400 74 H430\"/><path d=\"M212 70 l8 4 l-8 4 M422 70 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <g font-size=\"9.6\">\n      <text x=\"100\" y=\"66\" fill=\"var(--ink)\">1 · IDENTIFICATION</text>\n      <text x=\"310\" y=\"66\" fill=\"var(--acc)\">2 · CONSENSUS</text>\n      <text x=\"520\" y=\"66\" fill=\"var(--acc)\">3 · MITIGATION</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"100\" y=\"84\">alone, unbiased,</text><text x=\"100\" y=\"95\">nobody's attention steered</text>\n      <text x=\"310\" y=\"84\">together, until everyone</text><text x=\"310\" y=\"95\">agrees on the level</text>\n      <text x=\"520\" y=\"84\">together, with a stakeholder</text><text x=\"520\" y=\"95\">who can authorise the cost</text>\n    </g>\n    <text x=\"310\" y=\"132\" font-size=\"9\" fill=\"var(--ink)\">Bring senior developers and tech leads, not only architects. They see implementation risk — and they learn the architecture.</text>\n    <text x=\"310\" y=\"152\" font-size=\"9\" fill=\"var(--acc)\">Restrict a session to one criterion or one context. “Where are our security risks?” — not “find all our risks.”</text>\n    <text x=\"310\" y=\"176\" font-size=\"8.6\" fill=\"var(--ink2)\">Also works on user stories: impact if it doesn't finish this iteration × likelihood it doesn't.</text>\n  </g>\n</svg>", "hotline": "<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"40\" width=\"86\" height=\"24\"/><rect x=\"14\" y=\"76\" width=\"86\" height=\"24\"/><rect x=\"14\" y=\"112\" width=\"86\" height=\"24\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\">\n      <rect x=\"146\" y=\"34\" width=\"62\" height=\"24\" fill=\"var(--accBg)\"/>\n      <rect x=\"146\" y=\"76\" width=\"62\" height=\"24\" fill=\"var(--accBg)\"/>\n      <rect x=\"146\" y=\"118\" width=\"62\" height=\"24\" fill=\"var(--accBg)\"/>\n      <path d=\"M100 52 H146 M100 88 H146 M100 124 H146\"/>\n    </g>\n    <rect x=\"256\" y=\"34\" width=\"92\" height=\"24\"/><rect x=\"256\" y=\"76\" width=\"92\" height=\"24\"/>\n    <rect x=\"256\" y=\"118\" width=\"92\" height=\"24\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\"><path d=\"M208 46 H256 M208 88 H256 M208 130 H256\"/></g>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.6\">\n      <rect x=\"398\" y=\"34\" width=\"24\" height=\"30\"/><rect x=\"430\" y=\"34\" width=\"24\" height=\"30\"/>\n      <path d=\"M348 46 L398 49 M454 49 L490 49\"/>\n    </g>\n    <rect x=\"490\" y=\"34\" width=\"112\" height=\"30\"/>\n    <rect x=\"490\" y=\"90\" width=\"112\" height=\"26\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <path d=\"M348 90 H490\" stroke=\"var(--acc)\" stroke-width=\"1.4\"/>\n    <g stroke=\"var(--ink)\" stroke-width=\"1.3\">\n      <ellipse cx=\"446\" cy=\"176\" rx=\"34\" ry=\"8\"/><path d=\"M412 176 v14 a34 8 0 0 0 68 0 v-14\"/>\n      <ellipse cx=\"546\" cy=\"176\" rx=\"34\" ry=\"8\"/><path d=\"M512 176 v14 a34 8 0 0 0 68 0 v-14\"/>\n      <path d=\"M302 142 L420 168 M302 142 L520 168\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"7.4\">\n    <text x=\"14\" y=\"30\" font-size=\"8.6\" letter-spacing=\"1.4\" fill=\"var(--ink3)\">THREE SESSIONS, THREE ARCHITECTURE CHANGES</text>\n    <g fill=\"var(--ink2)\" text-anchor=\"middle\">\n      <text x=\"57\" y=\"55\">nurse UI</text><text x=\"57\" y=\"91\">self-service</text><text x=\"57\" y=\"127\">admin UI</text>\n      <text x=\"177\" y=\"49\" fill=\"var(--acc)\">gateway</text><text x=\"177\" y=\"91\" fill=\"var(--acc)\">gateway</text><text x=\"177\" y=\"133\" fill=\"var(--acc)\">gateway</text>\n      <text x=\"302\" y=\"49\">Medical Records</text><text x=\"302\" y=\"91\">Diagnostics Iface</text><text x=\"302\" y=\"133\">Case + Profile</text>\n      <text x=\"410\" y=\"52\" fill=\"var(--acc)\">Q</text><text x=\"442\" y=\"52\" fill=\"var(--acc)\">Q</text>\n      <text x=\"546\" y=\"52\">Diagnostics Engine</text>\n      <text x=\"546\" y=\"106\" fill=\"var(--acc)\">Outbreak Cache</text>\n      <text x=\"446\" y=\"180\">nurse profiles</text><text x=\"546\" y=\"180\">case notes</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--acc)\">\n      <text x=\"14\" y=\"214\">AVAILABILITY → split the one database in two: clustered nurse profiles, single-instance case notes. Also better security.</text>\n      <text x=\"14\" y=\"228\">ELASTICITY → two message channels (the Ambulance pattern: nurses ahead of self-service) plus an outbreak cache that never reaches the engine.</text>\n      <text x=\"14\" y=\"242\">SECURITY → one API gateway per user type, so an admin or self-service call can never reach medical records at all.</text>\n    </g>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
