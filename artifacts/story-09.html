/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine/--dot come from build.py per chapter. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */

/* ---------- the book's own words ---------- */

.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);

  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:7px 7px;
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

<script>
const D={"ch": "09", "book": "Chapter 9 · Foundations", "pages": "pp. 131–152", "title": "Before the Catalogue", "gist": "What a style actually commits you to, the one partitioning decision that shapes everything after it, and the eleven things about networks that distributed architectures will teach you the hard way if you let them.", "read": "7 min · 50 sec to re-scan", "acc": {"l": "#45566B", "d": "#9FB0C2"}, "minute": ["A **style** dictates five things at once: component topology, physical architecture, deployment, communication style and data topology. A **pattern** is a contextualised solution to one problem. Styles are also the *default* characteristics you inherit, good and bad.", "**Top-level partitioning** is one of the first decisions and the hardest to reverse: **technical** (layers — presentation, business, services, persistence) or **domain** (workflows — CatalogCheckout, ShipOrder). Technical smears every workflow across all layers.", "**Conway's Law**: a design copies the communication structure of the organisation that produced it. The **Inverse Conway Maneuver** uses that on purpose — change the teams to get the architecture.", "The **eight fallacies of distributed computing** (Deutsch, 1994) all still hold, and the authors add three: versioning is easy, compensating updates always work, and observability is optional.", "Know your production latency at the **95th percentile**, not the average. A 60 ms mean with a 400 ms tail is what kills a distributed architecture."], "sections": [{"t": "A style is five commitments in one word", "art": "style-vs-pattern", "wide": true, "alt": "Five things a style dictates: component topology, physical architecture, deployment, communication style, data topology", "cap": "Saying “event-driven” settles all five before anyone has drawn anything.", "p": "Styles aren't decreed by a committee. An architect notices that a new capability solves an old problem, combines it with a few other things, and other architects copy it until it's common enough to need a name. Microservices came from DevOps tooling plus reliable open-source operating systems plus domain-driven design — and the *name* was a reaction to the huge orchestrated services of the time. **It is a label, not an instruction to build the smallest services you can.**"}, {"t": "The Big Ball of Mud", "art": "mud", "alt": "A circle of class dots connected by a dense tangle of dependency lines", "cap": "Fig. 9-1 · every dot is a class, every line a dependency. A real client codebase.", "quotes": [["A haphazardly structured, sprawling, sloppy, duct-tape-and-baling-wire, spaghetti-code jungle… Information is shared promiscuously among distant elements of the system, often to the point where nearly all the important information becomes global or duplicated.", "Brian Foote & Joseph Yoder, 1997", "Few architects intend to build one. Most of these arrive through absent governance around code quality and structure, one expedient repair at a time."]], "p": "The damage isn't only the missing structure. Because everything couples to everything, changes have unpredictable rippling effects — and there is a point past which developers spend all their time chasing side effects instead of building features."}, {"t": "Unitary, client/server, three-tier", "art": "tiers", "wide": true, "alt": "The progression from one machine, through client and server, to three tiers and beyond", "cap": "Every era draws a new line through the same question: what runs where, and who owns the data.", "p": "Client/server has had four wardrobes — desktop plus database server, browser plus web server, single-page JavaScript apps that are the desktop model again with the rich client in the browser, and three-tier with an application server in the middle. There will always be layers separating parts of an architecture; what changes is where the platform makes it cheap to draw them.", "items": ["A cautionary detail: Java's designers assumed three-tier computing was permanent and baked object **serialization** into the language so objects could move over the network conveniently. The style came and went. Every new Java feature still has to support serialization for backward compatibility.", "The advice to favour simple designs is, among other things, a future-proofing strategy — because nobody has ever been good at predicting the long-term implications of a design decision."]}, {"t": "Technical or domain partitioning", "art": "partitioning", "wide": true, "alt": "A layered technical partition with one workflow crossing every layer, beside a domain partition where the workflow is one component", "cap": "Figs. 9-3 and 9-4 · the same workflow, drawn under both regimes.", "items": ["**Technical partitioning** organises by capability: presentation, business rules, services, persistence. Persistence code is easy to find; the Model-View-Controller pattern maps onto it, which is why it's many organisations' default. The decoupling is real — a change in the Services layer touches only its neighbours.", "**Domain partitioning** organises by workflow. Inspired by domain-driven design, and the philosophy microservices is built on. Components nest, so CatalogCheckout may still have layers *inside* it — the top level is what's being decided here.", "The cost of technical partitioning is that **most realistic workflows cut across technical capabilities**, so the domain ends up smeared across every layer. The cost of domain partitioning is that cross-cutting code appears in several places."]}, {"k": "decision", "t": "Silicon Sandwiches: which partitioning?", "art": "partitioning", "wide": true, "alt": "A layered technical partition with one workflow crossing every layer, beside a domain partition where the workflow is one component", "sit": "The sandwich-shop kata needs national and local customisation throughout. Two designs are on the table: components per workflow (Purchase, Promotion, MakeOrder, ManageInventory, Recipes, Delivery, Location), or top-level Common and Local components with Purchase and Delivery handling the workflow.", "opts": [["Domain partitioning.", "Models how the business works rather than an implementation detail; makes cross-functional teams easy to form; message flow matches the problem; migrating to a distributed architecture later is straightforward. **Cost:** customisation code appears in several places."], ["Technical partitioning around Common and Local.", "Cleanly separates the customisation code and matches the layered style. **Cost:** high global coupling — a change to Common or Local hits everything; domain concepts get duplicated across both; and data coupling tends to be high, which is what makes a later migration painful."]], "verdict": "It depends, and this one is genuinely balanced — but note where the costs *land*. Technical partitioning's disadvantages are all about **later**: untangling data relationships, migrating to distributed, duplicated concepts. That asymmetry is why the industry has drifted toward domain partitioning for both monoliths and distributed systems over the last decade."}, {"t": "Eleven fallacies", "art": "fallacies", "wide": true, "alt": "The eight fallacies of distributed computing in a grid, plus three more the authors add", "cap": "Every architect learns these — from the list, or one at a time over a career.", "items": ["**The network is reliable.** Service B can be perfectly healthy and unreachable. This is why timeouts and circuit breakers exist.", "**Latency is zero.** A local call is nanoseconds; a remote one is milliseconds. Know your production number, and know the 95th percentile — the long tail is what kills you.", "**Bandwidth is infinite.** Irrelevant in a monolith, decisive once you split. See the stamp-coupling example below.", "**The network is secure.** Every endpoint of every deployment unit must be secured, interservice calls included — which is part of why highly distributed synchronous styles are slower.", "**The topology never changes.** It changes constantly, and a “minor” 2am upgrade can invalidate every latency assumption you hold.", "**There is only one administrator.** A large company has dozens. Who do you call about latency?", "**Transport cost is zero.** Not latency — money. Hardware, servers, gateways, firewalls, subnets, proxies. Distributed costs significantly more.", "**The network is homogeneous.** Multiple hardware vendors, mostly interoperable, occasionally not — which loops back into reliability, latency and bandwidth."]}, {"k": "decision", "t": "Service B returns 45 fields. You need one.", "art": "stamp", "alt": "A profile service returning 500 KB when only 200 bytes are needed, compared with a trimmed response", "sit": "The Wish List service needs the customer's **name** for its response. It calls the Profile service, which returns 45 attributes totalling 500 KB. Wish list requests arrive about **2,000 times a second**.", "opts": [["Leave it. It's one field off an existing endpoint.", "2,000 × 500 KB is **1 GB per second** of interservice traffic to move 200 bytes of useful data. That slows the network, which worsens latency and reliability — three fallacies in one call."], ["Send only what the caller needs.", "400 Kb/s in total. Private RESTful endpoints, field selectors in the contract, GraphQL, consumer-driven contracts, or an internal messaging endpoint — the technique matters less than the principle.", 1]], "verdict": "This is **stamp coupling**: passing a large data structure where a small one would do. It is invisible in a monolith and expensive the moment a network is involved, which makes it one of the most common surprises in a first migration to microservices."}, {"t": "Team topologies", "art": "teams", "wide": true, "alt": "Stream-aligned teams supported by enabling, complicated-subsystem and platform teams", "cap": "Skelton and Pais's four team types, and how each one shows up in an architecture.", "items": ["**Stream-aligned** — scoped to one business domain or capability, delivering discrete value. Every other team type exists to reduce friction for these.", "**Enabling** — bridges a capability gap with research and learning that is important but not urgent. Highly collaborative, proactive, temporary by nature.", "**Complicated-subsystem** — owns a genuinely specialised part so that stream-aligned teams don't have to carry it. Its purpose is reducing others' cognitive load.", "**Platform** — self-service APIs, tools, services and support arranged as a compelling internal product, so delivery teams move faster with less coordination. Removes friction while keeping governance on quality and security."], "p": "This connects straight back to partitioning. Layered architectures came with a backend department, a DBA department and a presentation team — an artificial separation of common concerns that hampers collaboration, and a textbook case of Conway's Law being obeyed rather than used."}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 9: Foundations, pp. 131–152. The fallacies are L. Peter Deutsch et al. (Sun Microsystems, 1994); Big Ball of Mud is Foote & Yoder; Team Topologies is Skelton & Pais.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"style-vs-pattern": "<svg viewBox=\"0 0 620 176\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"34\" width=\"116\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"132\" y=\"34\" width=\"116\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"258\" y=\"34\" width=\"116\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"384\" y=\"34\" width=\"116\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"504\" y=\"34\" width=\"110\" height=\"56\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"6\" y=\"20\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--ink3)\">NAMING A STYLE COMMITS YOU TO FIVE THINGS AT ONCE</text>\n    <g font-size=\"9.6\" fill=\"var(--acc)\">\n      <text x=\"64\" y=\"55\">component</text><text x=\"64\" y=\"67\">topology</text>\n      <text x=\"190\" y=\"55\">physical</text><text x=\"190\" y=\"67\">architecture</text>\n      <text x=\"316\" y=\"61\">deployment</text>\n      <text x=\"442\" y=\"55\">communication</text><text x=\"442\" y=\"67\">style</text>\n      <text x=\"559\" y=\"55\">data</text><text x=\"559\" y=\"67\">topology</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"64\" y=\"110\">technical layers,</text><text x=\"64\" y=\"121\">or domains?</text>\n      <text x=\"190\" y=\"110\">monolithic or</text><text x=\"190\" y=\"121\">distributed?</text>\n      <text x=\"316\" y=\"110\">one unit at a time,</text><text x=\"316\" y=\"121\">or pieces, fast?</text>\n      <text x=\"442\" y=\"110\">method calls, or</text><text x=\"442\" y=\"121\">REST and queues?</text>\n      <text x=\"559\" y=\"110\">one database,</text><text x=\"559\" y=\"121\">or many?</text>\n    </g>\n    <text x=\"310\" y=\"150\" font-size=\"9\" fill=\"var(--ink)\">A pattern is a contextualised solution. A style is all five of these, plus the characteristics that come with them.</text>\n    <text x=\"310\" y=\"168\" font-size=\"8.6\" fill=\"var(--ink2)\">Nobody decrees styles. They emerge, get copied, and eventually earn a name — “microservices” is a label, not an instruction to build small services.</text>\n  </g>\n</svg>", "mud": "<svg viewBox=\"0 0 300 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\"><path d=\"M139.1 184.7 L186.9 74.5\" str --ink2)\">Inventory</text>\n    </g>\n    <text x=\"141\" y=\"212\" font-size=\"8.4\" fill=\"var(--acc)\">CatalogCheckout is smeared</text>\n    <text x=\"141\" y=\"223\" font-size=\"8.4\" fill=\"var(--acc)\">across all four layers</text>\n    <text x=\"467\" y=\"212\" font-size=\"8.4\" fill=\"var(--acc)\">CatalogCheckout is one thing</text>\n    <text x=\"467\" y=\"223\" font-size=\"8.4\" fill=\"var(--acc)\">with layers inside it</text>\n    <text x=\"310\" y=\"244\" font-size=\"8.6\" fill=\"var(--ink)\">Neither is more correct. The industry has drifted toward domain for a decade.</text>\n  </g>\n</svg>", "fallacies": "<svg viewBox=\"0 0 620 296\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.3\">\n    <rect x=\"6\" y=\"30\" width=\"148\" height=\"52\"/><rect x=\"160\" y=\"30\" width=\"148\" height=\"52\"/>\n    <rect x=\"314\" y=\"30\" width=\"148\" height=\"52\"/><rect x=\"468\" y=\"30\" width=\"146\" height=\"52\"/>\n    <rect x=\"6\" y=\"90\" width=\"148\" height=\"52\"/><rect x=\"160\" y=\"90\" width=\"148\" height=\"52\"/>\n    <rect x=\"314\" y=\"90\" width=\"148\" height=\"52\"/><rect x=\"468\" y=\"90\" width=\"146\" height=\"52\"/>\n    <rect x=\"6\" y=\"168\" width=\"196\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"212\" y=\"168\" width=\"196\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"418\" y=\"168\" width=\"196\" height=\"52\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"6\" y=\"20\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--ink3)\">DEUTSCH ET AL., 1994 — ALL EIGHT STILL APPLY</text>\n    <g font-size=\"9.4\" fill=\"var(--ink)\">\n      <text x=\"80\" y=\"52\">the network</text><text x=\"80\" y=\"64\">is reliable</text>\n      <text x=\"234\" y=\"52\">latency</text><text x=\"234\" y=\"64\">is zero</text>\n      <text x=\"388\" y=\"52\">bandwidth</text><text x=\"388\" y=\"64\">is infinite</text>\n      <text x=\"541\" y=\"52\">the network</text><text x=\"541\" y=\"64\">is secure</text>\n      <text x=\"80\" y=\"112\">the topology</text><text x=\"80\" y=\"124\">never changes</text>\n      <text x=\"234\" y=\"112\">there is one</text><text x=\"234\" y=\"124\">administrator</text>\n      <text x=\"388\" y=\"112\">transport cost</text><text x=\"388\" y=\"124\">is zero</text>\n      <text x=\"541\" y=\"112\">the network is</text><text x=\"541\" y=\"124\">homogeneous</text>\n    </g>\n    <text x=\"6\" y=\"158\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--acc)\">AND THREE THE AUTHORS ADD</text>\n    <g font-size=\"9.4\" fill=\"var(--acc)\">\n      <text x=\"104\" y=\"190\">versioning is easy</text>\n      <text x=\"310\" y=\"190\">compensating updates always work</text>\n      <text x=\"516\" y=\"190\">observability is optional</text>\n    </g>\n    <g font-size=\"8\" fill=\"var(--ink2)\">\n      <text x=\"104\" y=\"206\">per service or per system?</text><text x=\"104\" y=\"215\">how many live at once?</text>\n      <text x=\"310\" y=\"206\">what happens when the</text><text x=\"310\" y=\"215\">compensating update fails?</text>\n      <text x=\"516\" y=\"206\">useful in a monolith.</text><text x=\"516\" y=\"215\">critical in a distributed one.</text>\n    </g>\n    <text x=\"310\" y=\"248\" font-size=\"9\" fill=\"var(--ink)\">Do you know your production round-trip latency? Not the average — the 95th percentile.</text>\n    <text x=\"310\" y=\"266\" font-size=\"9\" fill=\"var(--acc)\">Average 60 ms with a 400 ms tail is what kills a distributed architecture.</text>\n    <text x=\"310\" y=\"286\" font-size=\"8.4\" fill=\"var(--ink2)\">Chain ten calls at 100 ms each and you have added a full second to one business request.</text>\n  </g>\n</svg>", "stamp": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"52\" width=\"82\" height=\"34\"/>\n    <rect x=\"204\" y=\"52\" width=\"82\" height=\"34\"/>\n    <path d=\"M96 62 H204\" stroke=\"var(--ink3)\"/><path d=\"M196 58 l8 4 l-8 4\" stroke=\"var(--ink3)\"/>\n    <path d=\"M204 78 H96\" stroke=\"var(--acc)\" stroke-width=\"2.4\"/><path d=\"M104 74 l-8 4 l8 4\" stroke=\"var(--acc)\" stroke-width=\"2.4\"/>\n    <rect x=\"14\" y=\"126\" width=\"82\" height=\"34\"/>\n    <rect x=\"204\" y=\"126\" width=\"82\" height=\"34\"/>\n    <path d=\"M96 136 H204\" stroke=\"var(--ink3)\"/><path d=\"M196 132 l8 4 l-8 4\" stroke=\"var(--ink3)\"/>\n    <path d=\"M204 152 H96\" stroke=\"var(--acc)\" stroke-width=\"1.1\"/><path d=\"M104 148 l-8 4 l8 4\" stroke=\"var(--acc)\" stroke-width=\"1.1\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.2\" text-anchor=\"middle\">\n    <text x=\"55\" y=\"72\" font-size=\"9\" fill=\"var(--ink)\">Wish List</text>\n    <text x=\"245\" y=\"72\" font-size=\"9\" fill=\"var(--ink)\">Profile</text>\n    <text x=\"150\" y=\"42\" fill=\"var(--ink2)\">“give me the customer”</text>\n    <text x=\"150\" y=\"100\" fill=\"var(--acc)\">45 attributes · 500 KB · 2,000 a second = 1 GB/s</text>\n    <text x=\"55\" y=\"146\" font-size=\"9\" fill=\"var(--ink)\">Wish List</text>\n    <text x=\"245\" y=\"146\" font-size=\"9\" fill=\"var(--ink)\">Profile</text>\n    <text x=\"150\" y=\"116\" fill=\"var(--ink3)\">…or…</text>\n    <text x=\"150\" y=\"176\" fill=\"var(--acc)\">just the name · 200 bytes · 400 Kb/s in total</text>\n    <text x=\"150\" y=\"198\" fill=\"var(--ink)\">stamp coupling: send only what the caller needs.</text>\n    <text x=\"150\" y=\"210\" fill=\"var(--ink2)\">private endpoints · field selectors · GraphQL · consumer-driven contracts</text>\n  </g>\n</svg>", "teams": "<svg viewBox=\"0 0 620 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"32\" width=\"284\" height=\"42\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"6\" y=\"86\" width=\"284\" height=\"42\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"314\" y=\"32\" width=\"144\" height=\"96\"/>\n    <rect x=\"470\" y=\"32\" width=\"144\" height=\"96\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.2\">\n      <path d=\"M290 53 H314 M290 107 L314 90 M458 80 H470\"/>\n      <path d=\"M306 49 l8 4 l-8 4\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"6\" y=\"20\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">TEAM TOPOLOGIES — SKELTON &amp; PAIS</text>\n    <text x=\"20\" y=\"52\" font-size=\"10\" fill=\"var(--acc)\">STREAM-ALIGNED</text>\n    <text x=\"20\" y=\"66\" font-size=\"8.2\" fill=\"var(--ink2)\">one product, service or capability. moves fast. everything else exists to unblock it.</text>\n    <text x=\"20\" y=\"106\" font-size=\"10\" fill=\"var(--acc)\">STREAM-ALIGNED</text>\n    <text x=\"20\" y=\"120\" font-size=\"8.2\" fill=\"var(--ink2)\">a stream is a line of work scoped to a business domain.</text>\n    <text x=\"328\" y=\"52\" font-size=\"10\" fill=\"var(--ink)\">ENABLING</text>\n    <text x=\"328\" y=\"68\" font-size=\"8.2\" fill=\"var(--ink2)\">bridges a capability gap:</text>\n    <text x=\"328\" y=\"79\" font-size=\"8.2\" fill=\"var(--ink2)\">research and learning that</text>\n    <text x=\"328\" y=\"90\" font-size=\"8.2\" fill=\"var(--ink2)\">is important, not urgent</text>\n    <text x=\"328\" y=\"112\" font-size=\"8.2\" fill=\"var(--ink2)\">+ COMPLICATED-SUBSYSTEM:</text>\n    <text x=\"328\" y=\"123\" font-size=\"8.2\" fill=\"var(--ink2)\">owns the hard part, cuts others' load</text>\n    <text x=\"484\" y=\"52\" font-size=\"10\" fill=\"var(--ink)\">PLATFORM</text>\n    <text x=\"484\" y=\"68\" font-size=\"8.2\" fill=\"var(--ink2)\">self-service APIs, tools and</text>\n    <text x=\"484\" y=\"79\" font-size=\"8.2\" fill=\"var(--ink2)\">support as an internal product</text>\n    <text x=\"484\" y=\"95\" font-size=\"8.2\" fill=\"var(--ink2)\">removes friction while keeping</text>\n    <text x=\"484\" y=\"106\" font-size=\"8.2\" fill=\"var(--ink2)\">governance on quality, security</text>\n    <text x=\"310\" y=\"158\" font-size=\"9\" text-anchor=\"middle\" fill=\"var(--ink)\">Conway's Law: a design copies the communication structure of the people who made it.</text>\n    <text x=\"310\" y=\"176\" font-size=\"9\" text-anchor=\"middle\" fill=\"var(--acc)\">The Inverse Conway Maneuver: change the teams to get the architecture you want.</text>\n    <text x=\"310\" y=\"194\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">this is why layered architectures came with a DBA department and a frontend department</text>\n  </g>\n</svg>"}};

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
