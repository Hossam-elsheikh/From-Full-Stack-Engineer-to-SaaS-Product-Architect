/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

<script>
const D={"ch": "06", "book": "Chapter 6 · Measuring and Governing Architecture Characteristics", "pages": "pp. 81–93", "title": "From Adjective to Build Failure", "gist": "How to turn vague words into numbers you can measure, and then into automated checks that hold the design together when the schedule doesn't.", "read": "5 min · 40 sec to re-scan", "acc": {"l": "#6A6329", "d": "#C6BC72"}, "minute": ["Characteristics resist definition for three reasons: they **aren't physics**, definitions **vary even inside one company**, and many are **composites**. Objective definitions, agreed org-wide, fix all three.", "Measure operationally with care — the **average hides the outliers**. Good teams alarm against a statistical model rather than a fixed number, so a breach means either the model is wrong or something is.", "**Cyclomatic Complexity** is the main structural measure: `CC = E − N + 2P`. Industry tolerates under 10; the authors want under 5. It cannot tell essential complexity from accidental — that judgement is yours.", "A **fitness function** is any mechanism giving an objective integrity assessment of a characteristic. Not a framework — a new use for unit tests, metrics tools, monitors and chaos engineering.", "**Governance** comes from *kubernan*, to steer. Fitness functions steer the **important but not urgent** things — modularity, layering, security — that always lose to a deadline otherwise."], "sections": [{"t": "Why the words resist measurement", "art": "avg-vs-max", "alt": "A response-time distribution with the average marked and a long tail of slow outliers highlighted", "cap": "Measure the mean alone and a boundary condition making 1% of requests ten times slower never appears.", "items": ["**They aren't physics.** *Wicked fast performance* has no unit. Neither does agility, deployability or “good modularity”.", "**Definitions vary.** Two departments in one company can hold different meanings for *performance*, and no useful conversation happens until they don't.", "**They're composite.** Agility is really modularity plus deployability plus testability, each of which can actually be measured."], "p": "The fix for all three is the same: decompose composites, give the parts objective definitions, and get the organisation to agree on them — a **ubiquitous language** for architecture. Measurement targets also move: performance budgets now cover *first contentful paint* and *first CPU idle*, and some teams set **K-weight budgets** capping the bytes of libraries a page may load, because only so many bytes cross a mobile network at once."}, {"t": "Cyclomatic Complexity, and what it can't tell you", "art": "cc", "alt": "A scale of cyclomatic complexity thresholds from under five through to eight hundred", "cap": "Thomas McCabe, 1976. Graph theory applied to decision points in code.", "p": "Overly complex code harms modularity, testability and deployability at once, and if nobody watches it grow, it wins. But CC is a blunt instrument: it measures complexity without knowing whether the problem is hard or the code is bad. Useful questions when a number is high: is the domain genuinely complex, is this poor coding, or is a large method simply badly partitioned into smaller cohesive ones?", "items": ["Test-driven development lowers average CC as a **side effect** — writing the smallest code that passes a small test tends to produce well-factored methods.", "Generative AI tends to raise it, because brute force is a valid way to pass a test and an invalid way to design. That makes CC a useful check on generated code specifically."]}, {"k": "decision", "t": "The team keeps auto-importing across components", "art": "cycles", "alt": "Three components each referencing the others in a cycle", "sit": "Every Java and .NET IDE offers to auto-import a class the moment you reference it, and everyone accepts reflexively. Three components now reference each other in a cycle. You cannot reuse any one of them without dragging the other two along.", "opts": [["Catch it in code review.", "Reviews help, but they arrive too late in the cycle. A week of enthusiastic importing does real damage before anyone looks."], ["Look over their shoulders.", "Not a mechanism. It doesn't scale past one team and it makes you the bottleneck from Chapter 2."], ["Write a cycle fitness function and wire it into the build.", "A JDepend test that fails when any package cycle exists. Now the rule is enforced continuously, by the build, and you stop thinking about it.", 1]], "verdict": "This is the archetype of what fitness functions are for: **important but not urgent**. Modularity has almost no impact on today's coding and total impact on next year's. Automation is the only governance that survives contact with a deadline."}, {"t": "Fitness functions", "art": "ff-mechanisms", "wide": true, "alt": "A central fitness function node connected to unit tests, metrics tools, coverage, monitors, chaos engineering and architecture tests", "cap": "Fig. 6-2 · borrowed from evolutionary computing, where a fitness function scores how close an output is to its aim.", "p": "The definition is deliberately wide: **any mechanism that provides an objective integrity assessment of some architecture characteristic**. That phrase — *any mechanism* — is the point. Verification techniques are as varied as the characteristics themselves, so a fitness function might be a unit test, a metric threshold, a production monitor, or a monkey killing servers.", "items": ["**JDepend** for cycles and for Distance from the Main Sequence against a project-chosen tolerance.", "**ArchUnit** (Java) codifies layering rules as unit tests, and can require that every unit test contains at least one assertion.", "**NetArchTest** does the same job in .NET: *classes in Presentation should not directly reference Data*."]}, {"t": "Layers that enforce themselves", "art": "layers-rule", "alt": "Three layers with permitted downward access and a forbidden shortcut crossed out", "cap": "Fig. 6-4 and Example 6-4 · the architect's intent, written as something that fails a build.", "p": "You define layers for reasons (Ch. 10 covers them). Some developers won't know those reasons; others will decide it is better to ask forgiveness than permission when performance is on the line. Either way the architecture erodes. ArchUnit lets you state the relationship — controller accessed by nobody, service only by controller, persistence only by service — and have it checked on every commit.", "quotes": [["Architects must ensure that developers understand the purpose of a fitness function before imposing it on them.", "Richards & Ford", "The point is not for architects to ascend to an ivory tower and write esoteric rules nobody can read. A governance rule whose reason is invisible is just an obstacle."]]}, {"k": "decision", "t": "100% coverage, and the tests have no assertions", "art": "ff-mechanisms", "alt": "A central fitness function node connected to unit tests, metrics tools, coverage, monitors, chaos engineering and architecture tests", "sit": "You set a code-coverage target as a testability measure. The team hits it. Reading the tests, many of them execute code and assert nothing — the coverage tool counts a line as covered if it was *touched*.", "opts": [["Raise the coverage target.", "You have asked for more of exactly the thing being gamed. The number goes up, confidence does not."], ["Add a governance rule that every test must contain at least one assertion.", "ArchUnit can check this. It won't stop a determined rule-breaker, but it stops the accidental lapses, which are the overwhelming majority.", 1], ["Drop the metric and trust the team.", "Every check can be gamed, so no check is worth having — which is also the argument against ever measuring anything."]], "verdict": "Any metric invites coding to the metric rather than to the goal. Code coverage in particular **cannot replace thinking and intent**: a codebase can have 100% coverage and poor assertions and give no confidence whatsoever. The mitigation is to measure the thing you actually want as directly as you can, and to explain why."}, {"t": "Governance you run in production", "art": "simian", "wide": true, "alt": "Five members of Netflix's Simian Army and what each one checks", "cap": "When Netflix moved to AWS, the architects lost control of operations. Chaos engineering was the answer.", "p": "The Chaos Monkey is a fitness function that runs against production. Latency was such a problem on some AWS instances that it earned its own Latency Monkey; Chaos Kong simulates an entire datacenter failure, and has kept Netflix up through real ones. Conformity checks the architects' own rules on live services, Security looks for open ports and configuration errors, and Janitor deletes services nothing routes to any more — because an evolutionary architecture leaves orphans, and orphans cost money.", "items": ["The perspective this gives is worth as much as the tooling: it is **not a question of whether something will break, but when**. Anticipating breakages and testing for them is what makes a system robust.", "Atul Gawande's *The Checklist Manifesto* is the right analogy. Pilots and surgeons use checklists not because they don't know their jobs, but because doing a detailed job repeatedly makes details slip. Fitness functions are that, for architecture."]}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 6: Measuring and Governing Architecture Characteristics, pp. 81–93. Fitness functions come from Building Evolutionary Architectures (Ford, Parsons, Kua, Sadalage).", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"avg-vs-max": "<svg viewBox=\"0 0 300 206\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M26 140 H286 M26 140 V22\"/>\n    <path d=\"M26 138 C56 136 66 40 92 38 C118 36 128 118 150 130 C176 134 190 130 210 130 C240 130 250 128 284 128\"\n          stroke=\"var(--ink)\" stroke-width=\"1.8\"/>\n    <path d=\"M92 140 V30\" stroke=\"var(--ink3)\" stroke-dasharray=\"4 4\"/>\n    <rect x=\"214\" y=\"122\" width=\"70\" height=\"18\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <path d=\"M249 122 V70\" stroke=\"var(--acc)\" stroke-width=\"1.4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.4\">\n    <text x=\"92\" y=\"24\" text-anchor=\"middle\" fill=\"var(--ink2)\">the average</text>\n    <text x=\"249\" y=\"62\" text-anchor=\"middle\" fill=\"var(--acc)\">the 1% at 10x</text>\n    <text x=\"249\" y=\"52\" text-anchor=\"middle\" fill=\"var(--acc)\">the maximum</text>\n    <text x=\"156\" y=\"156\" text-anchor=\"middle\" fill=\"var(--ink)\">response time →</text>\n    <text x=\"150\" y=\"180\" text-anchor=\"middle\" fill=\"var(--ink2)\">with enough traffic the outliers never show up in the mean</text>\n    <text x=\"150\" y=\"196\" text-anchor=\"middle\" fill=\"var(--acc)\">good teams alarm on a statistical model, not a fixed number</text>\n  </g>\n</svg>", "cc": "<svg viewBox=\"0 0 320 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <path d=\"M20 104 H300\"/>\n    <path d=\"M20 98 v12 M76 98 v12 M132 98 v12 M216 98 v12 M292 98 v12\"/>\n    <rect x=\"20\" y=\"76\" width=\"56\" height=\"20\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.7\"/>\n    <rect x=\"76\" y=\"76\" width=\"56\" height=\"20\"/>\n    <rect x=\"132\" y=\"76\" width=\"84\" height=\"20\" stroke=\"var(--ink3)\"/>\n    <rect x=\"216\" y=\"76\" width=\"76\" height=\"20\" stroke=\"var(--ink3)\" stroke-dasharray=\"5 4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n    <text x=\"20\" y=\"30\" font-size=\"9.6\" fill=\"var(--ink)\">CC = E − N + 2P</text>\n    <text x=\"20\" y=\"44\" font-size=\"8.4\" fill=\"var(--ink2)\">edges − nodes + 2 × connected components</text>\n    <text x=\"20\" y=\"58\" font-size=\"8.4\" fill=\"var(--ink2)\">no branches = 1 · one conditional = 2</text>\n    <g font-size=\"9\" text-anchor=\"middle\">\n      <text x=\"48\" y=\"90\" fill=\"var(--acc)\">under 5</text>\n      <text x=\"104\" y=\"90\" fill=\"var(--ink)\">under 10</text>\n      <text x=\"174\" y=\"90\" fill=\"var(--ink2)\">over 50</text>\n      <text x=\"254\" y=\"90\" fill=\"var(--ink2)\">800</text>\n    </g>\n    <g font-size=\"8.2\" text-anchor=\"middle\" fill=\"var(--ink2)\">\n      <text x=\"48\" y=\"122\">what the authors</text><text x=\"48\" y=\"132\">actually want</text>\n      <text x=\"104\" y=\"122\">the industry's</text><text x=\"104\" y=\"132\">accepted line</text>\n      <text x=\"174\" y=\"122\">Crap4J: no amount</text><text x=\"174\" y=\"132\">of coverage saves it</text>\n      <text x=\"254\" y=\"122\">one C function,</text><text x=\"254\" y=\"132\">4,000 lines, GOTOs</text>\n    </g>\n    <text x=\"160\" y=\"164\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--ink)\">CC cannot tell essential complexity from accidental complexity</text>\n    <text x=\"160\" y=\"180\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"var(--acc)\">so ask: hard problem, bad code, or badly partitioned code?</text>\n    <text x=\"160\" y=\"202\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"var(--ink2)\">TDD lowers it as a side effect · generative AI tends to raise it</text>\n  </g>\n</svg>", "cycles": "<svg viewBox=\"0 0 300 196\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"112\" y=\"20\" width=\"76\" height=\"30\"/>\n    <rect x=\"20\" y=\"98\" width=\"76\" height=\"30\"/>\n    <rect x=\"204\" y=\"98\" width=\"76\" height=\"30\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\">\n      <path d=\"M118 50 L74 98\"/><path d=\"M96 110 H204\"/><path d=\"M226 98 L182 50\"/>\n      <path d=\"M76 92 l-4 10 l10 -2\"/><path d=\"M196 106 l10 4 l-10 4\"/><path d=\"M184 56 l-4 -10 l10 2\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" font-size=\"8.6\" text-anchor=\"middle\">\n    <text x=\"150\" y=\"39\" font-size=\"9.4\" fill=\"var(--ink)\">component a</text>\n    <text x=\"58\" y=\"117\" font-size=\"9.4\" fill=\"var(--ink)\">component b</text>\n    <text x=\"242\" y=\"117\" font-size=\"9.4\" fill=\"var(--ink)\">component c</text>\n    <text x=\"150\" y=\"154\" fill=\"var(--acc)\">you cannot reuse one without bringing all three</text>\n    <text x=\"150\" y=\"170\" fill=\"var(--ink2)\">Fig. 6-3 · the IDE offers to auto-import, and everyone says yes</text>\n    <text x=\"150\" y=\"188\" fill=\"var(--ink2)\">unchecked, this becomes the big ball of mud</text>\n  </g>\n</svg>", "ff-mechanisms": "<svg viewBox=\"0 0 620 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <ellipse cx=\"310\" cy=\"118\" rx=\"96\" ry=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-width=\"1.8\"/>\n    <rect x=\"8\" y=\"34\" width=\"128\" height=\"34\"/><rect x=\"8\" y=\"98\" width=\"128\" height=\"34\"/>\n    <rect x=\"8\" y=\"162\" width=\"128\" height=\"34\"/>\n    <rect x=\"484\" y=\"34\" width=\"128\" height=\"34\"/><rect x=\"484\" y=\"98\" width=\"128\" height=\"34\"/>\n    <rect x=\"484\" y=\"162\" width=\"128\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.1\">\n      <path d=\"M136 51 L226 100 M136 115 H214 M136 179 L226 136\"/>\n      <path d=\"M484 51 L394 100 M484 115 H406 M484 179 L394 136\"/>\n    </g>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9.4\">\n    <text x=\"310\" y=\"114\" fill=\"var(--acc)\" font-size=\"11\">FITNESS FUNCTION</text>\n    <text x=\"310\" y=\"130\" fill=\"var(--ink2)\" font-size=\"8.2\">any objective integrity check</text>\n    <g fill=\"var(--ink)\">\n      <text x=\"72\" y=\"55\">unit test frameworks</text>\n      <text x=\"72\" y=\"119\">metrics tools</text>\n      <text x=\"72\" y=\"183\">code coverage</text>\n      <text x=\"548\" y=\"55\">monitors</text>\n      <text x=\"548\" y=\"119\">chaos engineering</text>\n      <text x=\"548\" y=\"183\">architecture tests</text>\n    </g>\n    <g fill=\"var(--ink2)\" font-size=\"8\">\n      <text x=\"72\" y=\"196\">assertions, not touches</text>\n      <text x=\"548\" y=\"196\">ArchUnit · NetArchTest</text>\n    </g>\n    <text x=\"310\" y=\"220\" font-size=\"8.6\" fill=\"var(--ink2)\">Fig. 6-2 · not a framework to download — a new use for tools you already run</text>\n  </g>\n</svg>", "layers-rule": "<svg viewBox=\"0 0 300 216\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"70\" y=\"20\" width=\"160\" height=\"34\"/>\n    <rect x=\"70\" y=\"80\" width=\"160\" height=\"34\"/>\n    <rect x=\"70\" y=\"140\" width=\"160\" height=\"34\"/>\n    <g stroke=\"var(--acc)\" stroke-width=\"1.7\">\n      <path d=\"M150 54 V74\"/><path d=\"M144 68 l6 8 l6 -8\"/>\n      <path d=\"M150 114 V134\"/><path d=\"M144 128 l6 8 l6 -8\"/>\n    </g>\n    <path d=\"M70 34 C24 34 24 158 70 158\" stroke=\"var(--ink3)\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n    <path d=\"M40 84 l16 16 M56 84 l-16 16\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9.6\">\n    <text x=\"150\" y=\"41\" fill=\"var(--ink)\">controller</text>\n    <text x=\"150\" y=\"101\" fill=\"var(--ink)\">service</text>\n    <text x=\"150\" y=\"161\" fill=\"var(--ink)\">persistence</text>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"248\" y=\"41\" text-anchor=\"start\">accessed by</text><text x=\"248\" y=\"51\" text-anchor=\"start\">no layer</text>\n      <text x=\"248\" y=\"101\" text-anchor=\"start\">only by</text><text x=\"248\" y=\"111\" text-anchor=\"start\">controller</text>\n      <text x=\"248\" y=\"161\" text-anchor=\"start\">only by</text><text x=\"248\" y=\"171\" text-anchor=\"start\">service</text>\n    </g>\n    <text x=\"150\" y=\"196\" font-size=\"8.6\" fill=\"var(--acc)\">whereLayer(“Persistence”).mayOnlyBeAccessedByLayers(“Service”)</text>\n    <text x=\"150\" y=\"210\" font-size=\"8.4\" fill=\"var(--ink2)\">the rule stops being a paragraph and starts being a build failure</text>\n  </g>\n</svg>", "simian": "<svg viewBox=\"0 0 620 172\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\">\n    <rect x=\"6\" y=\"30\" width=\"120\" height=\"60\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"132\" y=\"30\" width=\"120\" height=\"60\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"258\" y=\"30\" width=\"120\" height=\"60\" fill=\"var(--accBg)\" stroke=\"var(--acc)\"/>\n    <rect x=\"384\" y=\"30\" width=\"112\" height=\"60\"/>\n    <rect x=\"502\" y=\"30\" width=\"112\" height=\"60\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\">\n    <text x=\"6\" y=\"18\" font-size=\"8.6\" letter-spacing=\"1.6\" text-anchor=\"start\" fill=\"var(--ink3)\">NETFLIX'S SIMIAN ARMY — GOVERNANCE THAT RUNS IN PRODUCTION</text>\n    <g font-size=\"10\" fill=\"var(--ink)\">\n      <text x=\"66\" y=\"52\" fill=\"var(--acc)\">Chaos Monkey</text><text x=\"192\" y=\"52\" fill=\"var(--acc)\">Latency Monkey</text>\n      <text x=\"318\" y=\"52\" fill=\"var(--acc)\">Chaos Kong</text>\n      <text x=\"440\" y=\"52\">Conformity</text><text x=\"558\" y=\"52\">Janitor</text>\n    </g>\n    <g font-size=\"8.2\" fill=\"var(--ink2)\">\n      <text x=\"66\" y=\"70\">kills instances</text><text x=\"66\" y=\"81\">at random</text>\n      <text x=\"192\" y=\"70\">simulates the</text><text x=\"192\" y=\"81\">slow AWS instance</text>\n      <text x=\"318\" y=\"70\">takes out a whole</text><text x=\"318\" y=\"81\">datacenter</text>\n      <text x=\"440\" y=\"70\">your rules, checked</text><text x=\"440\" y=\"81\">on live services</text>\n      <text x=\"558\" y=\"70\">deletes services</text><text x=\"558\" y=\"81\">nothing routes to</text>\n    </g>\n    <text x=\"310\" y=\"122\" font-size=\"9\" fill=\"var(--ink)\">Not if something breaks — when. Anticipate it, then test for it.</text>\n    <text x=\"310\" y=\"142\" font-size=\"9\" fill=\"var(--acc)\">A Security Monkey is a checklist, not a bureaucracy.</text>\n    <text x=\"310\" y=\"160\" font-size=\"8.4\" fill=\"var(--ink2)\">pilots and surgeons use them for the same reason: repetition makes details slip</text>\n  </g>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
