}
:root[data-theme="dark"]{
  --paper:#0C161E; --sheet:#122230; --sunk:#0B141C; --chip:#17303F;
  --ink:#DCE7EE; --ink2:#9CB1BF; --ink3:#6C8493;
  --rule:#26404F; --rule2:#1D3340; --hair:rgba(126,196,235,.055);
  --blue:#5CACE8; --blueBg:rgba(92,172,232,.14); --blueLine:rgba(92,172,232,.4);

body{

}
h1,h2,h3,h4{font-family:"Saira Condensed","IBM Plex Sans",sans-serif;font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem);letter-spacing:.005em}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,34px)}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--lift);position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:11px;height:11px;border:1px solid var(--rule);pointer-events:none}
.sheet::before{top:6px;left:6px;border-right:0;border-bottom:0}
.sheet::after{bottom:6px;right:6px;border-left:0;border-top:0}
.tblock{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:var(--sunk)}
.tcell{padding:8px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tcell:last-child{border-right:0}
.tcell .v{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1rem;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.tcell.grow{flex:1}
.btn{font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;
  background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:9px 20px;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.blue,:root:not([data-theme="light"]) .btn.blue{color:#08121A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.blue{color:#fff}}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stamp{font-family:"Saira Condensed",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:3px double currentColor;padding:4px 14px;display:inline-block;transform:rotate(-3.5deg);font-size:1.1rem;opacity:.92}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}60%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.hit{animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) both}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:2px 7px;color:var(--ink2);background:var(--chip);white-space:nowrap}
.rule{height:1px;background:var(--rule2);border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
[hidden]{display:none !important}
:root{--acc:#7A6224;--accBg:rgba(122,98,36,.12);--accLine:rgba(122,98,36,.42)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#D2BC6C;--accBg:rgba(210,188,108,.12);--accLine:rgba(210,188,108,.42)}}
:root[data-theme="dark"]{--acc:#D2BC6C;--accBg:rgba(210,188,108,.12);--accLine:rgba(210,188,108,.42)}
/* ---------- chapter sheet: notes you re-scan, not prose you re-read ----------
   The figure is the unit of memory. Text is caption-length. Decisions are the
   only place a scene appears, and they are boxed so they read as a different
   kind of thing. --acc/--accBg/--accLine come from build.py per chapter. Figure
   grounds are flat — the old halftone fought the line work. */

.scroll{position:sticky;top:0;z-index:6;height:3px;background:var(--sunk);border-bottom:1px solid var(--rule)}
.scroll i{display:block;height:100%;width:0;background:var(--acc);transition:width .18s linear}

/* ---------- cover ---------- */
.cover{padding:clamp(22px,3.8vw,44px) clamp(18px,3vw,38px) clamp(20px,3vw,34px);
  border-bottom:1px solid var(--rule);background:var(--sheet);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,2.6vw,32px);align-items:start}
@media(max-width:640px){.cover{grid-template-columns:1fr}}
.cover .num{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,5.4rem);
  line-height:.78;color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cover .bk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink3)}
.cover h1{font-size:clamp(1.9rem,4.8vw,3rem);margin-top:7px}
.cover .gist{font-size:1.04rem;line-height:1.55;color:var(--ink2);max-width:62ch;margin-top:11px}

/* ---------- the card you actually come back for ---------- */
.minute{margin:clamp(15px,2.6vw,30px);border:2px solid var(--acc);background:var(--accBg);
  padding:clamp(16px,2.6vw,26px)}
.minute .h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--accLine)}
.minute h2{font-size:clamp(1.15rem,2.4vw,1.45rem);letter-spacing:.02em}
.minute .h .lbl{color:var(--acc)}
.minute ol{margin:0;padding:0;list-style:none;counter-reset:m;display:flex;flex-direction:column;gap:10px}
.minute li{counter-increment:m;display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;
  font-size:.97rem;line-height:1.52;max-width:88ch}
.minute li::before{content:counter(m,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;color:var(--acc);padding-top:4px;font-variant-numeric:tabular-nums}

/* ---------- topics ---------- */
.sec{padding:clamp(20px,3vw,34px) clamp(16px,3vw,32px);border-top:1px solid var(--rule2)}
.sechead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.sechead .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--acc)}
.sechead h2{font-size:clamp(1.25rem,2.7vw,1.7rem);flex-basis:100%}
.split{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:clamp(16px,2.6vw,30px);align-items:start}
@media(max-width:780px){.split{grid-template-columns:1fr}}
.sec.wide .split{grid-template-columns:1fr}
figure{margin:0;border:1px solid var(--rule);background:var(--sunk)}
figure svg{width:100%;height:auto;display:block;padding:clamp(12px,2vw,20px);max-width:560px;margin:0 auto}
.sec.wide figure svg{max-width:900px}
figcaption{font-family:"IBM Plex Mono",monospace;font-size:.68rem;line-height:1.6;color:var(--ink2);
  padding:9px 13px;border-top:1px solid var(--rule);background:var(--sheet)}
.body{display:flex;flex-direction:column;gap:12px;min-width:0}
.body p{font-size:.96rem;line-height:1.6;max-width:70ch;color:var(--ink2)}
.body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.body li{font-size:.95rem;line-height:1.5;padding-left:15px;position:relative;max-width:70ch}
.body li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:1px;background:var(--acc)}

/* ---------- the book's own words ---------- */
.qs{display:flex;flex-direction:column;gap:10px}
.q{border-left:4px solid var(--acc);background:var(--chip);padding:13px 16px;
  display:flex;flex-direction:column;gap:7px}
.q .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.4rem);
  line-height:1.18;letter-spacing:.01em;text-wrap:balance}
.q .a{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--acc)}
.q .n{font-size:.9rem;line-height:1.55;color:var(--ink2);max-width:70ch}

/* ---------- decisions ---------- */
.dec{border:2px solid var(--ink);background:var(--sheet);margin:clamp(16px,2.6vw,30px);
  display:flex;flex-direction:column}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;
  background:var(--ink);color:var(--sheet)}
.dec .top .tag{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 8px}
.dec .top h2{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.12rem;letter-spacing:.03em;color:inherit}
.dec .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,38%);gap:0}
@media(max-width:820px){.dec .in{grid-template-columns:1fr}}
.dec .main{padding:clamp(15px,2.2vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.dec .art{border-left:1px solid var(--rule);background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,18px)}
@media(max-width:820px){.dec .art{border-left:0;border-top:1px solid var(--rule);order:-1}}
.dec .art svg{width:100%;height:auto;max-width:330px;display:block}
.sit{font-size:.98rem;line-height:1.58;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule2);border:1px solid var(--rule)}
.opt{background:var(--sheet);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.opt .o{font-size:.95rem;font-weight:600;line-height:1.4}
.opt .c{font-size:.88rem;line-height:1.52;color:var(--ink2)}
.opt.pick{background:var(--accBg)}
.opt.pick .o::after{content:"the book's answer";font-family:"IBM Plex Mono",monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:9px;white-space:nowrap;font-weight:400}
.verdict{border-left:4px solid var(--acc);padding:2px 0 2px 13px;font-size:.94rem;line-height:1.58;max-width:74ch}

.foot{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;
  padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--accLine)}
.foot .cite{font-family:"IBM Plex Mono",monospace;font-size:.68rem;max-width:78ch}

const D={"ch": "10", "book": "Chapter 10 · Layered Architecture Style", "pages": "pp. 153–164", "title": "The One Everybody Already Built", "gist": "The default architecture — the one you get by just starting to code. Cheap, simple, familiar, and degrading in every dimension as it grows. Worth knowing precisely, because you will inherit one.", "read": "4 min · 35 sec to re-scan", "acc": {"l": "#7A6224", "d": "#D2BC6C"}, "minute": ["Four standard layers — **presentation, business, persistence, database**. Technically partitioned, so every domain is smeared across all of them. Domain-driven design fits it badly.", "**Layers of isolation**: a change in one layer doesn't touch the others, *provided the layers in the request path are closed*. Open a layer and you trade isolation for a shortcut.", "The **Architecture Sinkhole** antipattern: requests passing through layers that do nothing. 20% is fine. 80% means the style is wrong for the problem.", "Its strengths are **cost and simplicity**; its weaknesses are **deployability, testability, elasticity and scalability**. Every rating starts good and degrades as the codebase grows.", "Good for small applications, tight budgets, and as a starting point while you work out whether you need something more complex. **Keep reuse minimal and inheritance shallow** so you can leave later."], "sections": [{"t": "Topology: four layers, technically partitioned", "art": "layers", "alt": "Five stacked layers with a services layer marked open and a bypass arrow around it", "cap": "Fig. 10-1 · a closed layer must be passed through. An open layer may be skipped.", "p": "Also called n-tiered. It is the de facto standard for legacy applications, and it is what *Architecture by Implication* and *Accidental Architecture* both produce: when a team just starts coding without deciding on a style, this is the style they get.", "items": ["Each layer forms an abstraction around one kind of work. Presentation doesn't know how customer data is fetched; business doesn't know how it will be displayed.", "That separation makes role and responsibility models easy, and lets developers work to their technical specialism. **The trade-off is holistic agility** — the system's ability to respond to change as a whole.", "Because partitioning is technical, the domain of *customer* lives in presentation, business, rules, services and database at once. Changing that domain means touching every layer."]}, {"t": "Three ways to deploy it", "art": "deploy-variants", "wide": true, "alt": "Three physical topology variants: one unit plus database, UI split off, and everything in one unit", "cap": "Fig. 10-2 · the logical layers stay the same; only the deployment boundary moves.", "p": "The third variant — all four layers in one unit with an embedded or in-memory database — is how a great many on-premises products ship to customers, and how mobile applications are built."}, {"k": "decision", "t": "Presentation wants to read the database directly", "art": "layers", "alt": "Five stacked layers with a services layer marked open and a bypass arrow around it", "sit": "A screen needs a simple customer lookup. Going presentation → business → persistence → database is slower and more code than reading it directly. In the early 2000s this shortcut had a name: the **Fast-Lane Reader** pattern.", "opts": [["Open the layers so simple reads can skip.", "Faster, and it dissolves layers of isolation. Now a change to persistence reaches both business *and* presentation, and you have a tightly coupled, brittle architecture that is difficult and expensive to change."], ["Keep the layers on the request path closed.", "You pay for a hop you didn't need. In exchange, any layer can be replaced without touching the others — swapping the UI framework stays inside presentation, provided contracts hold.", 1], ["Open one specific layer, deliberately, and document why.", "The right move when there's a reason. Adding a **Services layer** for shared business objects only works if that layer is open — otherwise business is forced to route through it to reach persistence."]], "verdict": "The rule is **layers of isolation**: layers involved in the major request flow must be closed, or the isolation is fictional. Which layers are open, which are closed, and *why*, has to be documented — failing to communicate it is how these architectures become brittle, untestable and undeployable."}, {"k": "decision", "t": "Most requests pass through doing nothing", "art": "sinkhole", "alt": "A request traversing four layers with no logic applied at any of them", "sit": "You audit the request log. A large share of requests enter presentation, get handed to business unchanged, handed to persistence unchanged, become one SQL call, and return up the stack with nothing added — no aggregation, no calculation, no rules.", "opts": [["Nothing. It's only some of the requests.", "Correct, if it really is only some. Every layered architecture has sinkhole scenarios; the 80-20 rule is the usual guide, and around 20% is acceptable."], ["Open all the layers so simple requests short-circuit.", "Fixes the wasted object instantiation and memory. The trade-off you just accepted is that change is now much harder to manage."], ["Treat it as evidence the style is wrong here.", "If 80% of requests are sinkholes, the architecture is doing almost no work per request and charging you for four layers of ceremony to do it.", 1]], "verdict": "The **Architecture Sinkhole antipattern** is not a bug to fix but a ratio to measure. The useful discipline is that you *count* it rather than argue about it — and the count is a genuine signal about whether the style fits the problem domain."}, {"t": "Risks, governance and teams", "art": "deploy-variants", "wide": true, "alt": "Three physical topology variants: one unit plus database, UI split off, and everything in one unit", "cap": "One deployment unit means one failure domain and one restart.", "items": ["**Fault tolerance is poor.** One out-of-memory condition anywhere crashes the whole unit. Availability suffers too, because monolithic **mean time to recover** is high — two minutes for a small application, fifteen or more for a large one.", "**Governance is unusually good.** The original structural testing tools were built with this style in mind: ArchUnit's `layeredArchitecture()` states exactly which layer may be accessed by which, and enforces open and closed layers on every build.", "**Team topologies: it fits all four.** Stream-aligned teams own a flow through every layer. Enabling teams can experiment inside one layer — a new UI library touches only presentation. Complicated-subsystem teams get a clean hook at the persistence layer for analytics.", "**The platform team carries the long-term cost.** Keep adding features and, however well partitioned, the monolith eventually strains against database connections, memory, concurrent users or something else — and keeping it running gets progressively harder."]}, {"t": "Characteristics, and when to reach for it", "alt": "Architecture characteristics ratings for the layered style", "cap": "Cost and simplicity carry it. Everything else starts adequate and degrades with size.", "items": ["**Use it** for small, simple applications and websites; when budget and time are very tight; and as a starting point while you work out whether something more complex is warranted. It is often the cheapest route to **feasibility** — can we deliver this scope, in this time, with these people?", "**Don't use it** once the application is large. Maintainability, agility, testability and deployability all degrade with size, and this is the style that degrades first.", "**If you use it as a stepping stone**, keep code reuse minimal and inheritance trees shallow. That is what makes moving to another style later possible rather than theoretical."], "p": "The style also shows up far outside application code, for exactly the same reason — separation of concerns. Operating systems layer hardware, kernel, system-call interface and user space. TCP/IP layers physical, data link, network, transport and application.", "wide": true, "art": "_gen5"}], "source": "Fundamentals of Software Architecture: An Engineering Approach, 2nd ed. — Mark Richards & Neal Ford (O'Reilly, 2025). Chapter 10: Layered Architecture Style, pp. 153–164. Ratings are the chapter's own scorecard.", "links": [["All 27 chapters", "https://claude.ai/code/artifact/58ed5102-a32b-464d-b258-5b7a3da53fbb"], ["The Architect's Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"]], "art": {"layers": "<svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <rect x=\"46\" y=\"20\" width=\"208\" height=\"34\"/>\n    <rect x=\"46\" y=\"66\" width=\"208\" height=\"34\"/>\n    <rect x=\"46\" y=\"112\" width=\"208\" height=\"34\" fill=\"var(--accBg)\" stroke=\"var(--acc)\" stroke-dasharray=\"6 4\"/>\n    <rect x=\"46\" y=\"158\" width=\"208\" height=\"34\"/>\n    <rect x=\"46\" y=\"204\" width=\"208\" height=\"34\"/>\n    <g stroke=\"var(--ink3)\" stroke-width=\"1.3\">\n      <path d=\"M150 54 V66 M150 100 V112 M150 146 V158 M150 192 V204\"/>\n      <path d=\"M144 62 l6 6 l6 -6 M144 108 l6 6 l6 -6 M144 154 l6 6 l6 -6 M144 200 l6 6 l6 -6\"/>\n    </g>\n    <path d=\"M254 83 C288 83 288 175 254 175\" stroke=\"var(--acc)\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9.4\">\n    <text x=\"150\" y=\"41\" fill=\"var(--ink)\">presentation</text>\n    <text x=\"150\" y=\"87\" fill=\"var(--ink)\">business</text>\n    <text x=\"150\" y=\"133\" fill=\"var(--acc)\">services — open</text>\n    <text x=\"150\" y=\"179\" fill=\"var(--ink)\">persistence</text>\n    <text x=\"150\" y=\"225\" fill=\"var(--ink)\">database</text>\n    <g font-size=\"8\" fill=\"var(--ink2)\" text-anchor=\"end\">\n      <text x=\"40\" y=\"41\">closed</text><text x=\"40\" y=\"87\">closed</text>\n      <text x=\"40\" y=\"179\">closed</text><text x=\"40\" y=\"225\">closed</text>\n    </g>\n    <text x=\"284\" y=\"129\" font-size=\"8\" fill=\"var(--acc)\" transform=\"rotate(-90 284 129)\">may be bypassed</text>\n  </g>\n</svg>", "deploy-variants": "<svg viewBox=\"0 0 620 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"14\" y=\"34\" width=\"150\" height=\"90\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"28\" y=\"44\" width=\"122\" height=\"22\"/><rect x=\"28\" y=\"70\" width=\"122\" height=\"22\"/><rect x=\"28\" y=\"96\" width=\"122\" height=\"22\"/>\n    <ellipse cx=\"89\" cy=\"150\" rx=\"42\" ry=\"8\"/><path d=\"M47 150 v14 a42 8 0 0 0 84 0 v-14\"/>\n\n    <rect x=\"234\" y=\"34\" width=\"150\" height=\"30\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"248\" y=\"40\" width=\"122\" height=\"18\"/>\n    <rect x=\"234\" y=\"76\" width=\"150\" height=\"60\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"248\" y=\"84\" width=\"122\" height=\"20\"/><rect x=\"248\" y=\"108\" width=\"122\" height=\"20\"/>\n    <ellipse cx=\"309\" cy=\"162\" rx=\"42\" ry=\"8\"/><path d=\"M267 162 v14 a42 8 0 0 0 84 0 v-14\"/>\n\n    <rect x=\"454\" y=\"34\" width=\"150\" height=\"128\" stroke=\"var(--acc)\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\" fill=\"var(--accBg)\"/>\n    <rect x=\"468\" y=\"44\" width=\"122\" height=\"20\"/><rect x=\"468\" y=\"68\" width=\"122\" height=\"20\"/>\n    <rect x=\"468\" y=\"92\" width=\"122\" height=\"20\"/>\n    <ellipse cx=\"529\" cy=\"130\" rx=\"42\" ry=\"8\"/><path d=\"M487 130 v14 a42 8 0 0 0 84 0 v-14\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"7.8\" fill=\"var(--ink2)\">\n    <text x=\"89\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">ONE UNIT + DATABASE</text>\n    <text x=\"309\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">UI SPLIT OFF</text>\n    <text x=\"529\" y=\"24\" font-size=\"9\" fill=\"var(--ink)\">EVERYTHING IN ONE</text>\n    <text x=\"89\" y=\"58\">presentation</text><text x=\"89\" y=\"84\">business</text><text x=\"89\" y=\"110\">persistence</text>\n    <text x=\"89\" y=\"192\" fill=\"var(--ink3)\">the common case</text>\n    <text x=\"309\" y=\"53\">presentation</text><text x=\"309\" y=\"97\">business</text><text x=\"309\" y=\"121\">persistence</text>\n    <text x=\"309\" y=\"192\" fill=\"var(--ink3)\">two deployment units</text>\n    <text x=\"529\" y=\"57\">presentation</text><text x=\"529\" y=\"81\">business</text><text x=\"529\" y=\"105\">persistence</text>\n    <text x=\"529\" y=\"192\" fill=\"var(--ink3)\">embedded DB · mobile, on-prem</text>\n  </g>\n</svg>", "sinkhole": "<svg viewBox=\"0 0 300 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\">\n    <rect x=\"60\" y=\"20\" width=\"180\" height=\"28\"/><rect x=\"60\" y=\"62\" width=\"180\" height=\"28\"/>\n    <rect x=\"60\" y=\"104\" width=\"180\" height=\"28\"/><rect x=\"60\" y=\"146\" width=\"180\" height=\"28\"/>\n    <path d=\"M150 48 V62 M150 90 V104 M150 132 V146\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/>\n    <path d=\"M172 48 V174\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"3 4\"/>\n  </g>\n  <g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\" text-anchor=\"middle\" font-size=\"9\">\n    <text x=\"150\" y=\"39\" fill=\"var(--ink)\">presentation</text>\n    <text x=\"150\" y=\"81\" fill=\"var(--ink)\">business</text>\n    <text x=\"150\" y=\"123\" fill=\"var(--ink)\">persistence</text>\n    <text x=\"150\" y=\"165\" fill=\"var(--ink)\">database</text>\n    <g font-size=\"8\" fill=\"var(--acc)\" text-anchor=\"start\">\n      <text x=\"248\" y=\"80\">passes it on</text>\n      <text x=\"248\" y=\"122\">passes it on</text>\n    </g>\n    <text x=\"150\" y=\"196\" font-size=\"8.6\" fill=\"var(--ink)\">get a name and an address. no rules, no aggregation,</text>\n    <text x=\"150\" y=\"208\" font-size=\"8.6\" fill=\"var(--ink)\">no calculation — objects created and discarded at every stop.</text>\n    <text x=\"150\" y=\"224\" font-size=\"8.6\" fill=\"var(--acc)\">tolerable at 20% of requests. at 80% you chose the wrong style.</text>\n  </g>\n</svg>", "_gen5": "<svg viewBox=\"0 0 620 278\" xmlns=\"http://www.w3.org/2000/svg\">\n<g stroke=\"none\" font-family=\"IBM Plex Mono, monospace\">\n<text x=\"0\" y=\"13\" font-size=\"8.6\" letter-spacing=\"1.6\" fill=\"var(--ink3)\">LAYERED ARCHITECTURE</text>\n<text x=\"620\" y=\"13\" font-size=\"8.6\" text-anchor=\"end\" fill=\"var(--ink2)\">1 = weak   5 = strong</text>\n</g>\n<text x=\"178\" y=\"38\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">overall cost</text>\n<rect x=\"190\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"298\" y=\"26\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<text x=\"333\" y=\"38\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">its main argument</text>\n<text x=\"178\" y=\"61\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">simplicity</text>\n<rect x=\"190\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"298\" y=\"49\" width=\"21\" height=\"13\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<text x=\"333\" y=\"61\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">familiar to everyone</text>\n<text x=\"178\" y=\"84\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">reliability</text>\n<rect x=\"190\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"72\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"72\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"178\" y=\"107\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">performance</text>\n<rect x=\"190\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"95\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"271\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"95\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"107\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">cache and thread to lift it</text>\n<text x=\"178\" y=\"130\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">testability</text>\n<rect x=\"190\" y=\"118\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"118\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"118\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"130\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">you can mock a whole layer</text>\n<text x=\"178\" y=\"153\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">deployability</text>\n<rect x=\"190\" y=\"141\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"141\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"244\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"141\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"153\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">three lines = full redeploy</text>\n<text x=\"178\" y=\"176\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">evolvability</text>\n<rect x=\"190\" y=\"164\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"164\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"178\" y=\"199\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">fault tolerance</text>\n<rect x=\"190\" y=\"187\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"187\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"199\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">one OOM kills the unit</text>\n<text x=\"178\" y=\"222\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">scalability</text>\n<rect x=\"190\" y=\"210\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"210\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<text x=\"333\" y=\"222\" font-size=\"9\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink2)\">quantum is always 1</text>\n<text x=\"178\" y=\"245\" font-size=\"10\" text-anchor=\"end\" font-family=\"IBM Plex Mono, monospace\" fill=\"var(--ink)\">elasticity</text>\n<rect x=\"190\" y=\"233\" width=\"21\" height=\"13\" fill=\"var(--ink)\" stroke=\"var(--ink)\" stroke-width=\"1.2\" opacity=\".92\"/>\n<rect x=\"217\" y=\"233\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"244\" y=\"233\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"271\" y=\"233\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n<rect x=\"298\" y=\"233\" width=\"21\" height=\"13\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/>\n</svg>"}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
const $=s=>document.querySelector(s);

function fig(s){
  if(!s.art)return"";
  return '<figure role="img" aria-label="'+esc(s.alt||"")+'">'+(D.art[s.art]||"")+
    (s.cap?'<figcaption>'+md(s.cap)+'</figcaption>':"")+'</figure>';
}
function quotes(list){
  return '<div class="qs">'+list.map(q=>'<div class="q"><span class="t">'+md(q[0])+
    '</span><span class="a">'+esc(q[1])+'</span>'+
    (q[2]?'<span class="n">'+md(q[2])+'</span>':"")+'</div>').join("")+'</div>';
}
function topic(s,i){
  const body='<div class="body">'+
    (s.quotes?quotes(s.quotes):"")+
    (s.items?'<ul>'+s.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>':"")+
    (s.p?'<p>'+md(s.p)+'</p>':"")+'</div>';
  return '<section class="sec'+(s.wide?" wide":"")+'" id="s'+i+'">'+
    '<div class="sechead"><span class="k">'+esc(s.k==="quote"?"The book\u2019s words":"Topic "+s.n)+
    '</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="split">'+fig(s)+body+'</div></section>';
}
function decision(s,i){
  return '<section class="dec" id="s'+i+'">'+
    '<div class="top"><span class="tag">Decision</span><h2>'+md(s.t)+'</h2></div>'+
    '<div class="in"><div class="main">'+
      '<p class="sit">'+md(s.sit)+'</p>'+
      '<div class="opts">'+s.opts.map(o=>'<div class="opt'+(o[2]?" pick":"")+'">'+
        '<span class="o">'+md(o[0])+'</span><span class="c">'+md(o[1])+'</span></div>').join("")+'</div>'+
      '<p class="verdict">'+md(s.verdict)+'</p>'+
    '</div>'+(s.art?'<div class="art" role="img" aria-label="'+esc(s.alt||"")+'">'+
      (D.art[s.art]||"")+'</div>':"")+'</div></section>';
}

let n=0;
$("#secs").innerHTML=D.sections.map((s,i)=>{
  if(s.k==="decision")return decision(s,i);
  if(s.k!=="quote")s.n=String(++n).padStart(2,"0");
  return topic(s,i);
}).join("");

const figs=D.sections.filter(s=>s.art).length;
$("#tbC").textContent="Ch. "+D.ch; $("#tbT").textContent=D.title;
$("#tbF").textContent=figs; $("#tbR").textContent=D.read;
$("#cN").textContent=D.ch; $("#cB").textContent=D.book+" · "+D.pages;
$("#cT").textContent=D.title; $("#cG").textContent=D.gist;
$("#mL").textContent=D.minute.length+" things to keep";
$("#minute").innerHTML=D.minute.map(x=>'<li><span>'+md(x)+'</span></li>').join("");
$("#cite").textContent=D.source||"";
$("#links").innerHTML=(D.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+
  esc(l[0])+' &#8599;</a>').join(" &middot; ");

const bar=$("#sc"),onScroll=()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,Math.max(0,scrollY/h*100)):0)+"%";
};
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onScroll);onScroll();
</script>
