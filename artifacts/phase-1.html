  --ink:#DCE7EE; --ink2:#9CB1BF; --ink3:#6C8493;
  --rule:#26404F; --rule2:#1D3340; --hair:rgba(126,196,235,.055);
  --blue:#5CACE8; --blueBg:rgba(92,172,232,.14); --blueLine:rgba(92,172,232,.4);

body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:27px 27px;
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Saira Condensed","IBM Plex Sans",sans-serif;font-weight:700;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.1rem,5.2vw,3.4rem);letter-spacing:.005em}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.15rem;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,34px)}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--lift);position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:11px;height:11px;border:1px solid var(--rule);pointer-events:none}
.sheet::before{top:6px;left:6px;border-right:0;border-bottom:0}
.sheet::after{bottom:6px;right:6px;border-left:0;border-top:0}
.tblock{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);background:var(--sunk)}
.tcell{padding:8px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;min-width:0}
.tcell:last-child{border-right:0}
.tcell .v{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1rem;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.tcell.grow{flex:1}
.btn{font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;
  background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:9px 20px;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.blue,:root:not([data-theme="light"]) .btn.blue{color:#08121A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.blue{color:#fff}}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stamp{font-family:"Saira Condensed",sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:3px double currentColor;padding:4px 14px;display:inline-block;transform:rotate(-3.5deg);font-size:1.1rem;opacity:.92}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.4);opacity:0}60%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.hit{animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) both}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:2px 7px;color:var(--ink2);background:var(--chip);white-space:nowrap}
.rule{height:1px;background:var(--rule2);border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
[hidden]{display:none !important}
.two{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.rail{position:sticky;top:0;align-self:start;padding:16px 14px;border-right:1px solid var(--rule);background:var(--sunk);max-height:100vh;overflow:auto}
@media(max-width:900px){.rail{position:static;border-right:0;border-bottom:1px solid var(--rule);max-height:none}}
.rail ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:1px;counter-reset:c}
.rail a{display:grid;grid-template-columns:22px 1fr 9px;gap:7px;align-items:baseline;padding:5px 6px;text-decoration:none;color:var(--ink2);font-size:.83rem;border:1px solid transparent}
.rail a:hover{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.rail a.on{background:var(--sheet);border-color:var(--blue);color:var(--ink)}
.rail a .i{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.rail a .d{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule);align-self:center}
.rail a.done .d{background:var(--green);border-color:var(--green)}
.body{padding:clamp(18px,3vw,34px);min-width:0;display:flex;flex-direction:column;gap:0}
.intro{max-width:62ch;display:flex;flex-direction:column;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.intro .lede{font-size:1.06rem;color:var(--ink2)}
.cpt{padding:30px 0;border-bottom:1px solid var(--rule2);display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.cpt:last-of-type{border-bottom:0}
.cpt .top{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.cpt h2{font-size:clamp(1.5rem,3.2vw,2.05rem)}
.cpt .idx{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink3);letter-spacing:.1em}
.cpt .lede{font-size:1rem;color:var(--ink2);max-width:62ch}
.blk{display:flex;flex-direction:column;gap:8px;max-width:64ch}
.blk h4{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.02rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.blk ul,.blk ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.blk li{font-size:.94rem}
.blk p{font-size:.94rem;color:var(--ink2)}
.tbl{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-family:"IBM Plex Mono",monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
.call{border-left:3px solid var(--amber);background:var(--amberBg);padding:10px 14px;font-size:.92rem;max-width:64ch}
.call.blue{border-left-color:var(--blue);background:var(--blueBg)}
code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--chip);border:1px solid var(--rule);padding:1px 4px}
.fig{border:1px solid var(--rule);background:var(--sheet);padding:16px;max-width:64ch;display:flex;flex-direction:column;gap:8px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink3);letter-spacing:.05em}
.cards{border:1px solid var(--rule);background:var(--chip);max-width:64ch}
.cards .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--rule)}
.cards .ch .lbl{color:var(--ink2)}
.cards .ch button{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink2);padding:3px 8px;cursor:pointer}
.cards .ch button:hover{border-color:var(--ink2);color:var(--ink)}
.rc{border-bottom:1px dashed var(--rule);cursor:pointer}
.rc:last-child{border-bottom:0}
.rc .q{padding:10px 13px;font-size:.9rem;display:grid;grid-template-columns:20px 1fr;gap:9px}
.rc .q .m{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink3);padding-top:3px}
.rc .a{display:none;padding:0 13px 11px 42px;font-size:.89rem;color:var(--ink2)}
.rc.open .a{display:block}
.rc:hover .q{background:var(--sheet)}
.cfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:64ch}
.mark{font-family:"Saira Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;
  background:none;border:1px solid var(--rule);color:var(--ink2);padding:6px 14px;cursor:pointer}
.mark:hover{border-color:var(--ink2);color:var(--ink)}
.mark.on{background:var(--greenBg);border-color:var(--green);color:var(--green)}
.src{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink3)}
.res{padding:26px 0 8px;display:flex;flex-direction:column;gap:14px}
.reslist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.r{border:1px solid var(--rule);background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.r .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.r .t{font-family:"Saira Condensed",sans-serif;font-weight:600;font-size:1.05rem;line-height:1.15}
.r .w{font-size:.83rem;color:var(--ink2)}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--rule);background:var(--sunk);font-size:.78rem;color:var(--ink3)}
.foot a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blueLine)}
.pbar{height:7px;background:var(--sheet);border:1px solid var(--rule);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .5s ease}
</style>

<script>
const D={"phase": "1", "title": "Architecture & Design", "weeks": "6 weeks · ~45 hrs", "lede": "The core skill of the whole plan: turning requirements into a structure. Everything here answers one of two questions — what should drive this design, and how should the pieces talk to each other. The phase ends in C4 diagrams and five ADRs for a system you actually run.", "source": "Notes from Udemy: Software Architecture & Design of Modern Large Scale Systems — Michael Pogrebinsky", "foot": "Built from concepts/phase-1-architecture/", "links": [["The Atlas", "https://claude.ai/code/artifact/f3e583da-ec48-4778-8d52-e1c0a4764fcd"], ["The Build Bench", "https://claude.ai/code/artifact/674ef97b-db8f-46c9-9050-06b83ba95e7b"], ["Year One", "https://claude.ai/code/artifact/6f151972-b169-4e67-8676-ef1f3d243b5c"]], "concepts": [{"id": "architectural-drivers", "t": "Architectural Drivers", "vault": "concepts/phase-1-architecture/architectural-drivers.md", "lede": "The user does not always know what they need — but they know the problem. Gathering requirements early is critical because the cost of change grows over time.", "blocks": [{"h": "Three categories of requirements", "items": ["**Functional / feature requirements** — what the system does. They do **not** determine the architecture.", "**Quality attributes (non-functional)** — scalability, availability, performance. These dictate the architecture.", "**System constraints** — the boundaries the system must operate within."]}, {"h": "System constraints", "items": ["**Technical** — must use a given framework; on-premise versus cloud", "**Business** — limited budget, hard deadlines, third-party integrations", "**Regulatory / legal** — HIPAA, GDPR, SOC 2"]}, {"call": "Some constraints have room for negotiation and others do not. Use loosely-coupled architecture so that the ones that move later do not force a rewrite."}], "cards": [["You are in a design meeting. The PM lists features, the CTO asks what determines the architecture. Which requirement type?", "Non-functional requirements — the quality attributes."], ["Your startup has a strict budget, must use AWS, and handles EU user data. Which three constraint types?", "Business (budget), technical (AWS), regulatory (GDPR)."], ["A PM wants to change a core feature after six months of development. Why is this costly?", "The cost of change grows over time — late requirement changes cost more in time, money and reputation."]], "drill": "Year One · The kickoff"}, {"id": "requirement-gathering", "t": "Requirement Gathering", "vault": "concepts/phase-1-architecture/requirement-gathering.md", "lede": "Use cases describe a situation in which the system is used. User flows turn each one into a step-by-step sequence of events.", "blocks": [{"h": "Three steps", "num": ["Identify all actors and users in the system", "Capture and describe every possible use case or scenario", "Create user flows — expand each use case into a flow of events, each event carrying an **action** and its **data**"]}, {"h": "UML sequence diagram", "p": "A diagram of the interactions between actors and objects over time. The right tool when the question is *what talks to what, in what order*."}, {"call": "Every action in a user flow maps to an API call. Do the flows first and the endpoint list writes itself.", "blue": true}], "cards": [["You are designing a login system. Walk the three steps to capture requirements via use cases.", "Identify actors (users, admins) → capture use cases (login, reset password) → create user flows with an action and data per event."], ["During API design a colleague says they are not sure which endpoints are needed. Which earlier artifact would have mapped that out?", "User flows — each action maps to an API call."], ["Your team needs to visualize how a user and the database interact over time during checkout. Which UML diagram?", "A sequence diagram."]], "drill": "Build Bench · Cold start"}, {"id": "quality-attributes", "t": "Quality Attributes", "vault": "concepts/phase-1-architecture/quality-attributes.md", "lede": "Systems get redesigned not because a feature was missing, but because the system is not fast enough, does not scale, is slow to develop, is hard to maintain, or is not secure enough.", "blocks": [{"call": "No single architecture provides every quality attribute. Some contradict each other outright — the job is picking the right trade-off, not maximising all of them."}, {"h": "Performance", "items": ["**Response time** = processing time + waiting time (latency)", "**Throughput** = tasks or data per second", "Measure with **percentile distributions and tail latency** (P99, P95) — never simple averages"]}, {"h": "Scalability", "num": ["**Vertical (scaling up)** — a bigger machine. Easy, but a finite ceiling and low fault tolerance.", "**Horizontal (scaling out)** — more machines. Near-unlimited, but adds complexity and may require code changes.", "**Team scalability** — productivity versus team size. Modularize or split services to counter coordination overhead."]}, {"h": "Availability", "p": "Availability = uptime / (uptime + downtime) = **MTBF / (MTBF + MTTR)**, where MTBF is mean time between failures and MTTR is mean time to recovery."}, {"table": {"cols": ["Target", "Downtime per year", "In practice"], "rows": [["99%", "3.65 days", "a hobby project"], ["99.9% — three nines", "8.77 hours", "a normal SaaS without an availability clause"], ["99.99% — four nines", "52.6 minutes", "what enterprise contracts ask for — deploys included"], ["99.999% — five nines", "5.26 minutes", "an architecture most companies cannot afford"]]}}, {"h": "Fault tolerance tactics", "items": ["**Failure prevention** — run on multiple servers (active-active, active-passive)", "**Time redundancy** — retry until success or give up", "**Failure detection** — monitoring and health checks", "**Recovery** — automated failover"]}, {"h": "SLA, SLO, SLI", "items": ["**SLA** — the contract with the customer, with penalties", "**SLO** — the internal target you hold yourself to", "**SLI** — the indicator you actually measure"]}], "cards": [["Your API reports an average response time of 200ms but P99 is 2s. Why is the average misleading?", "Averages hide tail latency — use percentile distributions (P99, P95) to see true performance under load."], ["Your monolith is struggling under load. What is the quick cheap fix versus the scalable long-term fix?", "Vertical — a bigger machine, cheap but a finite ceiling. Horizontal — more machines, complex but near-unlimited."], ["A client demands 99.99% availability. What is the maximum yearly downtime?", "About 52.6 minutes — four nines."], ["Your system has MTBF = 720h and MTTR = 4h. Calculate availability.", "720 / 724 = 99.45%."], ["Your payment service runs on a single server and it crashes. Which fault tolerance tactic was missing?", "Failure prevention — run on multiple servers, active-passive or active-active."], ["The ops team argues about whether they met the contract. Which term is the contract, the target, and the measurement?", "SLA is the contract, SLO the target, SLI the measurement."]], "drill": "Year One · The number in the contract"}, {"id": "multi-tier-architecture", "t": "Multi-Tier Architecture", "vault": "concepts/phase-1-architecture/multi-tier-architecture.md", "lede": "Organizes a system into tiers, each running on its own infrastructure. Multi-tier (separate infrastructure) is routinely confused with multi-layer (internal separation inside one application).", "blocks": [{"svg": "three-tier", "cap": "The classic three-tier split — and where it goes wrong"}, {"h": "Benefits", "items": ["Versatile for web-based services", "The application tier scales horizontally on its own", "Maintenance is simpler because business logic is centralized"]}, {"h": "Drawbacks", "items": ["The application tier tends to become **monolithic** — performance suffers and development slows as the codebase grows"]}, {"h": "Variants", "items": ["**Two-tier** — presentation and application merged", "**Four-tier** — adds a tier for API management"]}], "cards": [["Your team says they split controllers from services so they are multi-tier. Why is that actually multi-layer?", "Multi-layer is internal separation within one application; multi-tier means separate infrastructure per tier."], ["Your three-tier app's application tier has grown huge and deploys are slow. What is the known failure mode?", "The application tier becomes monolithic, hurting performance and slowing development."], ["Which tier must never expose business logic?", "The presentation tier — it only handles user interaction."]], "drill": "Build Bench · Cold start"}, {"id": "microservices", "t": "Microservices", "vault": "concepts/phase-1-architecture/microservices.md", "lede": "Small, independently deployable services, each owning one business capability and its own database.", "blocks": [{"h": "What monoliths suffer from", "items": ["Difficult troubleshooting", "Feature additions that ripple across the codebase", "Team coordination problems and merge conflicts", "One broken component takes everything down"]}, {"h": "What microservices buy", "items": ["**Loose coupling** — small teams own services independently", "**Easier development and troubleshooting** — smaller codebases", "**Performance and scalability** — each service scales horizontally on its own", "**Fault isolation** — a failure or compromise is contained in one service"]}, {"h": "Cautions", "items": ["**Do not rush it** — without discipline you get a distributed Big Ball of Mud", "Apply the **single responsibility principle** per service", "Each service owns a **separate database**, or you have coupled them again through the data"]}, {"call": "Start monolithic — a modular monolith — and split when the complexity actually warrants it. Team scalability is the driver, not fashion."}], "cards": [["Your team of 30 is stuck: merge conflicts, slow deploys, one failing service takes the whole app down. What shift, and which two problems does it fix?", "Microservices — independent teams and deployments, plus fault isolation."], ["An attacker compromises one microservice. Why does the whole app not fall?", "Fault isolation — the issue is contained within that single service."], ["Two microservices share one database and every schema change breaks the other. Which best practice was violated?", "Each service should own its separate database to avoid coupling."], ["A junior engineer proposes splitting a two-service app into twenty microservices on day one. What is the counter-argument?", "Microservices add complexity — start monolithic and split when complexity warrants it, or you build a Big Ball of Mud."]], "drill": "Year One · The first cut"}, {"id": "api-design", "t": "API Design", "vault": "concepts/phase-1-architecture/api-design.md", "lede": "APIs are the contract between you and everyone who calls you. Once published, the contract is harder to change than the code behind it.", "blocks": [{"h": "Types", "items": ["**Public** — open to any developer", "**Private** — internal use inside the organization", "**Partner** — specific partners, under an agreement"]}, {"h": "Best practices", "items": ["**Encapsulation** — clients must never need to understand your internals", "**User-friendliness** — intuitive naming, consistent structure", "**Idempotent operations** — repeated requests do not cause unintended outcomes", "**Pagination** — large datasets are returned in bounded segments", "**Asynchronous APIs** — long-running operations acknowledge immediately", "**Versioning** — so changes ship without breaking consumers"]}, {"h": "Remote procedure calls", "p": "RPC makes a remote call feel local, described by an Interface Description Language. A **server stub** listens, a **client stub** handles serialization, and DTOs are generated from the IDL."}, {"h": "gRPC", "items": ["Modern high-performance RPC from Google, 2015", "**Transport** — HTTP/2", "**IDL** — Protocol Buffers"]}, {"h": "REST", "items": ["Resource-oriented, resources identified by hierarchical URIs", "**Stateless** — which is what makes it scale", "**Cacheable** — clients store responses and reduce server load", "POST creates, PUT updates, DELETE removes, GET retrieves"]}, {"table": {"cols": ["Situation", "Choose", "Because"], "rows": [["Public API for third-party developers", "REST", "resource-oriented, cacheable, stateless, universally understood"], ["Internal service-to-service, typed, streaming", "gRPC", "HTTP/2 plus Protocol Buffers — fast and strongly typed"], ["A client that needs one flexible query shape", "GraphQL", "flexibility moves to the client, and so does the cost"]]}}], "cards": [["Your startup builds a payment API. Banks get special terms, internal microservices use it, and any dev can try it. Which API type for each?", "Partner (banks), private (internal), public (open developers)."], ["A user clicks place order twice and gets charged twice. Which design practice was violated?", "Idempotency — repeated requests should produce the same result."], ["Your API returns 10k records and times out. What pattern fixes this?", "Pagination — return data in smaller segments."], ["Your backend service needs fast, typed, bidirectional calls to another service. REST or RPC?", "RPC — specifically gRPC, with HTTP/2 and Protocol Buffers."], ["Third-party developers need a public API to access your platform. REST or gRPC?", "REST — resource-oriented, cacheable, stateless, widely adopted for public APIs."], ["What transport protocol and IDL does gRPC use?", "HTTP/2 as transport, Protocol Buffers as the interface description language."]], "drill": "Year One · The partner API, and Charged twice"}, {"id": "api-gateway", "t": "API Gateway", "vault": "concepts/phase-1-architecture/api-gateway.md", "lede": "A single entry point that manages the complexity of a system with many services.", "blocks": [{"h": "What it does", "items": ["**API composition** — consolidates many APIs into one endpoint, so internal change does not reach consumers", "**Centralized security** — authentication, authorization and rate limiting in one place", "**Performance** — one client call instead of many, plus response caching", "**Monitoring and alerting** — one place that sees all traffic", "**Protocol translation** — bridges systems that speak differently"]}, {"h": "Anti-patterns and risks", "items": ["Never put **business logic** in the gateway — that rebuilds the monolith", "It is a **single point of failure** — run multiple instances", "Avoid optimizations that bypass the gateway and defeat the decoupling"]}, {"h": "Solutions", "items": ["**Open source** — Netflix Zuul", "**Cloud** — AWS API Gateway, GCP API Gateway with Apigee, Azure API Management"]}], "cards": [["Your 15 microservices require every client to handle auth, rate limiting and service discovery. What solves this?", "An API gateway — one entry point centralising auth, routing, rate limiting and monitoring."], ["A junior dev adds discount calculation logic to the API gateway. What is the problem?", "Business logic in the gateway turns it into a monolith and a single point of failure."]], "drill": "Build Bench · Cold start, and the trap in Black Friday"}, {"id": "message-brokers", "t": "Message Brokers", "vault": "concepts/phase-1-architecture/message-brokers.md", "lede": "Asynchronous communication that decouples the sender from the receiver — the single most useful move in this phase.", "blocks": [{"h": "Why", "p": "Synchronous communication requires both parties to be active at the same moment. That produces blocking waits for users, crashes under high traffic, and tight coupling between services. A broker lets the sender finish without waiting for the receiver."}, {"h": "What the broker provides", "items": ["**Message routing** — messages reach the right consumers", "**Transformation** — convert between message formats", "**Validation** — enforce message integrity", "**Load balancing** — distribute work across consumers", "**Pub/Sub** — the basis of event-driven architecture"]}, {"h": "Quality attributes", "items": ["Fault tolerance", "High availability", "Scalability", "Trade-off: slightly added latency"]}, {"h": "Solutions", "items": ["**Open source** — Apache Kafka for high-throughput distributed event streaming, RabbitMQ for routed task messages", "**Cloud** — AWS SQS, GCP Pub/Sub and Cloud Tasks, Azure Service Bus, Event Hubs and Event Grid"]}], "cards": [["Your order service calls payment and notification synchronously. During a flash sale, payments slow down and orders queue up. What pattern, and how does it help?", "A message broker — it decouples sender from receiver so the order service does not block on slow dependencies."], ["A new analytics team wants to consume order events without modifying the order service. How?", "Pub/Sub via a message broker — add a subscriber without changing the producer."], ["You need a high-throughput event stream for real-time analytics across 50 microservices. Kafka or RabbitMQ?", "Apache Kafka — built for distributed event streaming at scale."]], "drill": "Build Bench · Black Friday"}, {"id": "event-driven-architecture", "t": "Event-Driven Architecture", "vault": "concepts/phase-1-architecture/event-driven-architecture.md", "lede": "Services communicate through events — immutable statements of change — instead of direct API calls.", "blocks": [{"h": "Components", "items": ["**Event emitters (producers)** — publish events", "**Event consumers** — react to them", "**Event channel (message broker)** — routes between the two"]}, {"h": "Benefits", "items": ["**Decoupling** — a banking front-end emits user-action events while the account service consumes them, with no direct connection between them", "**Easier integration** — mobile notifications or fraud detection subscribe without touching existing services", "**Real-time processing** — immediate reaction to patterns in the stream"]}, {"h": "Patterns built on it", "items": ["**Event sourcing** — store the events rather than the current state, and replay them to reconstruct any past state. Gives a solid audit trail and simpler error handling.", "**CQRS** — separate read and write paths so each can be optimized independently"]}, {"call": "Events are immutable statements of change: facts that already happened. They are never overwritten or mutated the way state is.", "blue": true}], "cards": [["What are the three components of event-driven architecture?", "Producers (emitters), consumers, and an event channel (message broker)."], ["A banking app needs fraud detection and push notifications without modifying the account service. Which architecture?", "Event-driven — new consumers subscribe to existing event streams."], ["Why are events called immutable statements of change?", "They represent facts that already happened — never overwritten or mutated like state."], ["You need a full audit trail and the ability to reconstruct past states. Which pattern stores events instead of current state?", "Event sourcing — replay stored events to rebuild state."]], "drill": "Build Bench · Black Friday"}, {"id": "event-stream-processing", "t": "Event Stream Processing", "vault": "concepts/phase-1-architecture/event-stream-processing.md", "lede": "Continuous processing of an infinite stream of events in real time — for anomaly detection, fraud detection and live metrics, where a delayed answer is a useless answer.", "blocks": [{"h": "Every event has three times", "items": ["**Event time** — when it actually occurred, recorded in the payload", "**Application / arrival time** — when it reached the consumer", "**Processing time** — when the system processed it"]}, {"p": "In distributed systems events arrive late and out of order, which is exactly why these three diverge and why the distinction matters."}, {"h": "Windowing", "p": "An infinite stream cannot be analysed whole, so it is cut into finite windows."}, {"table": {"cols": ["Strategy", "How it works", "Trade-off"], "rows": [["**Tumbling**", "Fixed, non-overlapping intervals; each event lands in exactly one window", "Simple and cheap, but results only arrive at the end of each interval"], ["**Hopping**", "A window duration plus an **advance interval**; windows overlap, so one event can appear in several", "Frequent near real-time results, at the cost of memory, CPU and network"]]}}, {"svg": "windows", "cap": "A one-hour window advancing every minute produces a fresh answer every minute"}, {"h": "Aggregation is the point", "p": "A series of events reveals what one event cannot. One card transaction is unremarkable; two transactions in different countries minutes apart is a pattern."}, {"call": "Set the advance interval larger than the window and the windows stop overlapping and start skipping — effectively sampling. Useful for high-volume, low-variability streams."}], "cards": [["A fraud event happened at 12:00:00, reached your consumer at 12:00:09 and was processed at 12:00:11. Name the three timestamps.", "Event time, application/arrival time, processing time."], ["Why can't you just use processing time for stream analytics?", "Events arrive late and out of order — processing time attributes an event to the wrong period."], ["You need the hourly error rate refreshed every minute. Which windowing strategy, with what parameters?", "A hopping window — one-hour duration with a one-minute advance interval."], ["You want each event counted exactly once in simple fixed buckets. Which strategy?", "Tumbling windows — fixed, non-overlapping intervals."], ["Your hopping windows are eating memory and CPU. Why?", "Overlapping windows must all be maintained at once, and each produces results."], ["One card transaction looks fine on its own, but the account is being defrauded. What does stream processing add?", "Aggregation across a window — patterns across several events that no single event reveals."]], "drill": "Build Bench · Black Friday, the analytics consumer"}, {"id": "lambda-kappa", "t": "Lambda & Kappa Architecture", "vault": "concepts/phase-1-architecture/lambda-and-kappa-architecture.md", "lede": "Two answers to one tension: complete and accurate over all history, versus an answer about three seconds ago. Lambda runs a batch and a speed pipeline and merges them at read time; Kappa argues a retained log makes the batch half unnecessary.", "drill": "Build Bench · Ten million rows", "blocks": [{"table": {"cols": ["", "Batch", "Stream"], "rows": [["**Input**", "A bounded dataset at rest (HDFS, S3)", "An unbounded stream off a broker"], ["**Strength**", "Accurate, complete, **replayable** — fix the logic and rerun", "Millisecond latency; you react while the event matters"], ["**Weakness**", "A terabyte scan takes hours; your view is always one window stale", "Approximation — sketches, out-of-order arrivals, no un-processing"]]}}, {"h": "Lambda", "p": "Fan the same raw stream down two independent pipelines. The **batch layer** is the source of truth; the **speed layer** is a stopgap covering only the gap since the last batch run. A **serving layer** answers each query by merging the two, then discards the real-time view once batch catches up."}, {"call": "The speed layer is allowed to be approximate because its errors are transient — every real-time view is eventually overwritten by a correct batch view.", "blue": true}, {"h": "What it costs", "num": ["**Duplicate business logic** — attribution, sessionization and fraud rules implemented twice, in two frameworks. Every change is a two-sided change.", "**Divergence bugs** — batch says 4.1% CTR, stream says 4.4%, and you debug across two stacks to find which is lying.", "**Operational weight** — two clusters, two pipelines, two monitoring setups, plus a serving layer that must merge correctly."]}, {"h": "Kappa", "p": "Kreps' reaction: drop the batch layer, keep **the log itself** as the immutable master dataset with long retention, and recompute by replaying it through a new version of the streaming job. One codebase. Event-time semantics, watermarks and exactly-once state made this viable in a way it was not in 2011."}, {"h": "Designing today", "p": "Start streaming-first and add a batch path only for a concrete reason: regulatory reconciliation, backfills older than your log retention, or genuinely different algorithms for historical versus live computation."}], "cards": [["Your nightly job produced a wrong number because the logic had a bug. Why is this recoverable in batch but painful in streaming?", "Batch keeps the immutable master dataset — fix the code and rerun. A stream processed each event once in flight, so there is nothing to recompute from unless the log itself is retained."], ["Lambda's speed layer uses approximations. Why is that acceptable?", "Its errors are transient — every real-time view is eventually overwritten by a correct batch view covering the same window."], ["Which Lambda layer is the source of truth, and which is the stopgap?", "The batch layer is the source of truth; the speed layer only covers the gap since the last batch run."], ["Your batch and speed layers report different conversion numbers for the same hour. What kind of bug is this?", "A divergence bug — the structural consequence of implementing the same business logic twice in two frameworks. It is Lambda's main cost, not a one-off mistake."], ["You need to recompute a metric after a logic fix and you have no batch layer. How does Kappa handle it?", "Replay the retained log from the beginning through the new version of the streaming job — the log *is* the master dataset."], ["You are designing a new analytics pipeline today. Lambda or Kappa, and what would change your mind?", "Start with Kappa — one codebase, one framework. Add a batch layer only for regulatory reconciliation, backfills older than log retention, or genuinely different historical-vs-live algorithms."]]}, {"id": "cqrs", "t": "CQRS", "vault": "concepts/phase-1-architecture/cqrs.md", "lede": "Command Query Responsibility Segregation: separate the operations that modify data from the operations that read it.", "blocks": [{"h": "Problem 1 — database contention", "p": "When one database serves heavy reads and heavy writes, contention slows every transaction. CQRS gives reads and writes their own services and stores, each tuned for its workload."}, {"h": "Problem 2 — consistency", "p": "The read side now lags the write side. Pairing CQRS with event sourcing handles this: changes publish events, consumers update the read model — **eventual consistency** at high performance."}, {"h": "Aggregating across services", "p": "A ranking service needs votes and comments. Rather than calling both services directly, it subscribes to their events — less load, better performance, no coupling."}, {"call": "CQRS is a real answer to a real problem, and it costs far more than it looks like it will. Reach for it when contention or aggregation actually hurts, not by default."}], "cards": [["Your single DB contends under mixed heavy reads and writes and transactions slow down. Which pattern, and how does it help?", "CQRS — separate read and write paths into dedicated services and databases, each optimized for its workload."], ["After splitting reads and writes, a user's new post is not visible yet on the read side. What is this, and how is it resolved?", "Eventual consistency — pair CQRS with event sourcing so consumers update the read state from events."], ["A ranking service needs votes and comments data without hammering those services. How?", "Subscribe to their events instead of making direct service calls."]], "drill": "Build Bench · Ten million rows"}], "resources": [{"k": "Book · required", "t": "Fundamentals of Software Architecture", "w": "Richards & Ford. The single best trade-off-thinking book in print, and the spine of this phase. ~20 hrs."}, {"k": "Pick one · breadth", "t": "Pogrebinsky's course *or* System Design Interview Vol. 1", "w": "Same ground, two formats — the Udemy course if you learn by watching, Alex Xu if you learn by reading. Doing both is waste. Skip Vol. 2 unless you are interviewing."}, {"k": "Pick one · DDD", "t": "Learning Domain-Driven Design *or* DDD Distilled", "w": "Khononov is more thorough; Vernon's *Distilled* is a third the length for 80% of the strategic value. Read the strategic half only — tactical patterns can wait."}, {"k": "Cut", "t": "Clean Architecture · Pogrebinsky's cloud-patterns course", "w": "Martin is largely subsumed by Richards & Ford and more dogmatic about dependency direction than the trade-off framing you want. The second Pogrebinsky course heavily overlaps the first."}, {"k": "Phase artifact", "t": "C4 diagrams + 5 ADRs", "w": "Context, container and one component diagram, plus five decision records — for your real system, not a hypothetical. Written *before* the code. This is capstone week 3–8."}]};

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>")}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const $=s=>document.querySelector(s);

function block(b){
  let h=b.h?'<h4>'+md(b.h)+'</h4>':"";
  if(b.items)h+='<ul>'+b.items.map(x=>'<li>'+md(x)+'</li>').join("")+'</ul>';
  if(b.num)h+='<ol>'+b.num.map(x=>'<li>'+md(x)+'</li>').join("")+'</ol>';
  if(b.p)h+='<p>'+md(b.p)+'</p>';
  if(b.table)return '<div class="blk">'+h+'</div><div class="tbl"><table><thead><tr>'+
    b.table.cols.map(c=>'<th>'+md(c)+'</th>').join("")+'</tr></thead><tbody>'+
    b.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+md(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
  if(b.call)return '<div class="call'+(b.blue?" blue":"")+'">'+md(b.call)+'</div>';
  if(b.svg)return '<figure class="fig">'+SVG[b.svg]+'<figcaption>'+md(b.cap||"")+'</figcaption></figure>';
  return '<div class="blk">'+h+'</div>';
}

      String(n+1).padStart(2,"0")+'</span><span>'+md(qa[0])+'</span></div><div class="a">'+md(qa[1])+'</div></div>').join("");
    return '<section class="cpt" id="c'+i+'"><div class="top"><h2>'+md(c.t)+'</h2><span class="idx">'+
      String(i+1).padStart(2,"0")+' / '+String(D.concepts.length).padStart(2,"0")+'</span></div>'+
      '<p class="lede">'+md(c.lede)+'</p>'+
      (c.blocks||[]).map(block).join("")+
      (cards?'<div class="cards"><div class="ch"><span class="lbl">Test yourself · '+c.cards.length+
        ' cards</span><button data-all="'+i+'">Reveal all</button></div>'+cards+'</div>':"")+
      '<div class="cfoot"><button class="mark'+(done[c.id]?" on":"")+'" data-m="'+c.id+'">'+
      (done[c.id]?"Reviewed":"Mark reviewed")+'</button><span class="src">'+esc(c.vault||"")+'</span></div></section>';
  }).join("");
  $("#res").innerHTML=(D.resources||[]).map(r=>'<div class="r"><span class="k">'+esc(r.k)+
    '</span><span class="t">'+md(r.t)+'</span><span class="w">'+md(r.w)+'</span></div>').join("");
  $("#nav").innerHTML=D.concepts.map((c,i)=>'<li><a href="#c'+i+'" class="'+(done[c.id]?"done":"")+
    '" data-i="'+i+'"><span class="i">'+String(i+1).padStart(2,"0")+'</span><span>'+esc(c.t)+
    '</span><span class="d"></span></a></li>').join("");
  document.querySelectorAll(".rc").forEach(el=>el.onclick=()=>el.classList.toggle("open"));
  document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{
    const sec=document.getElementById("c"+b.dataset.all);
    const any=[...sec.querySelectorAll(".rc")].some(r=>!r.classList.contains("open"));
    sec.querySelectorAll(".rc").forEach(r=>r.classList.toggle("open",any));
    b.textContent=any?"Hide all":"Reveal all";
  });
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.m; if(done[id])delete done[id]; else done[id]=1;
    save(); render(); document.getElementById("c"+D.concepts.findIndex(c=>c.id===id)).scrollIntoView({block:"nearest"});
  });
  const n=D.concepts.length, r=D.concepts.filter(c=>done[c.id]).length;
  $("#tbR").textContent=r+" / "+n; $("#pb").style.width=(r/n*100)+"%";
  observe();
}
let io;
function observe(){
  if(io)io.disconnect();
  const links=[...document.querySelectorAll("#nav a")];
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove("on"));
      const l=links[+e.target.id.slice(1)]; if(l)l.classList.add("on");}});
  },{rootMargin:"-10% 0px -75% 0px"});
  document.querySelectorAll(".cpt").forEach(s=>io.observe(s));
}
render();
</script>
